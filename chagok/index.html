  $('#dashSub').textContent = tm
    ? `${me}${L.fmtLong(tm.start)} ~ ${L.fmtLong(tm.end)}`
    : '설정에서 학기를 먼저 등록하세요.';

  /* D-Day 카드 — 종류별 가장 가까운 마감 */
  const open = DB.tasks.filter(t => t.status !== 'done' && t.due);
  const nextOf = kind => open.filter(t => t.kind === kind)
    .sort((a, b) => a.due.localeCompare(b.due))
    .find(t => L.dday(t.due) >= 0) || null;

  const ddayCards = [
    ['exam', '기말고사'], ['assignment', '과제물'], ['attend', '출석수업'], ['quiz', '퀴즈'],
  ].map(([k, lbl]) => {
    const t = nextOf(k);
    if (!t) return `<div class="stat"><div class="label">${lbl}</div>
      <div class="value dim" style="font-size:19px">예정 없음</div>
      <div class="foot">일정을 추가하세요</div></div>`;
    const n = L.dday(t.due);
    const tone = n <= 3 ? 'danger' : n <= 7 ? 'warn' : 'accent';
    return `<div class="stat ${tone}">
      <div class="label">${lbl}</div>
      <div class="value">${L.ddayLabel(t.due)}</div>
      <div class="foot">${L.esc(t.title)}<br>${L.fmtKo(t.due)} · ${L.esc(courseLabel(t.courseId))}</div></div>`;
  }).join('');
  $('#ddayRow').innerHTML = ddayCards;

  /* 스탯 */
  const cs = termCourses(tid);
  const totLec = cs.reduce((a, c) => a + (Number(c.lectures) || 0), 0);
  const totWat = cs.reduce((a, c) => a + Math.min(Number(c.watched) || 0, Number(c.lectures) || 0), 0);
  const prog = L.pct(totWat, totLec);

  const termTasks = DB.tasks.filter(t => t.termId === tid);
  const remain = termTasks.filter(t => t.status !== 'done').length;
  const overdue = termTasks.filter(t => t.status !== 'done' && t.due && L.dday(t.due) < 0).length;

  const allGraded = DB.courses.filter(c => c.grade);
  const cum = gpaOf(allGraded);
  const totalCredits = (Number(DB.meta.transferCredits) || 0) + earnedCredits(DB.courses);
  const gradPct = L.pct(totalCredits, Number(DB.meta.gradCredits) || 0);

  // 학기 경과율
  let termPct = null;
  if (tm) {
    const total = L.dday(tm.end) - L.dday(tm.start);
    const done = -L.dday(tm.start);
    termPct = total > 0 ? L.clamp(Math.round((done / total) * 100), 0, 100) : null;
  }
  const lag = (termPct !== null && prog < termPct - 10);

  $('#statRow').innerHTML = `
    <div class="stat ${lag ? 'danger' : 'ok'}">
      <div class="label">강의 진도율</div>
      <div class="value">${prog}<small>%</small></div>
      <div class="foot">${totWat} / ${totLec} 차시${termPct !== null ? ` · 학기 경과 ${termPct}%` : ''}</div>
      <div class="bar ${lag ? 'danger' : 'ok'}"><i style="width:${prog}%"></i></div>
    </div>
    <div class="stat ${overdue ? 'danger' : 'accent'}">
      <div class="label">남은 할 일</div>
      <div class="value">${remain}<small>건</small></div>
      <div class="foot">${overdue ? `<b style="color:var(--danger)">기한 지남 ${overdue}건</b>` : '지연된 일정 없음'}</div>
    </div>
    <div class="stat purple">
      <div class="label">누적 평점</div>
      <div class="value">${cum.gpa === null ? '—' : cum.gpa.toFixed(2)}<small>/ ${DB.meta.gpaScale}</small></div>
      <div class="foot">성적 입력 ${allGraded.length}과목 · ${cum.credits}학점</div>
    </div>
    <div class="stat">
      <div class="label">졸업 진행률</div>
      <div class="value">${gradPct}<small>%</small></div>
      <div class="foot">${totalCredits} / ${DB.meta.gradCredits}학점 · 잔여 ${Math.max(0, DB.meta.gradCredits - totalCredits)}학점</div>
      <div class="bar purple"><i style="width:${gradPct}%"></i></div>
    </div>`;

  /* 이번 주 */
  const wr = L.weekRange();
  $('#weekRangeBadge').textContent = `${L.fmtKo(wr.start)} ~ ${L.fmtKo(wr.end)}`;
  const week = DB.tasks.filter(t => t.due && t.due >= wr.start && t.due <= wr.end)
    .sort((a, b) => a.due.localeCompare(b.due));
  $('#weekList').innerHTML = week.length ? week.map(taskLi).join('')
    : `<li><div class="grow dim">이번 주 마감 일정이 없습니다.</div></li>`;

  /* 임박 · 지연 */
  const urgent = open.filter(t => L.dday(t.due) <= 7)
    .sort((a, b) => a.due.localeCompare(b.due));
  $('#urgentBadge').textContent = `${urgent.length}건`;
  $('#urgentList').innerHTML = urgent.length ? urgent.map(taskLi).join('')
    : `<li><div class="grow dim">7일 이내 마감이 없습니다. 여유 있습니다.</div></li>`;

  /* 과목별 진도 */
  $('#progressBody').innerHTML = cs.length ? cs.map(c => {
    const p = progressOf(c);
    const tone = termPct !== null && p < termPct - 10 ? 'danger' : p >= 100 ? 'ok' : 'accent';
    const sc = scoreOf(c);
    const items = courseLectures(c);
    const lst = items.length ? L.lectureStats(items) : null;
    return `<div style="margin-bottom:14px">
      <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
        <b>${L.esc(c.name)}</b>
        <span class="badge">${c.credits}학점</span>
        ${c.type === 'attend' ? '<span class="badge warn">출석수업</span>' : ''}
        <div style="flex:1"></div>
        <span class="mono dim" style="font-size:12px">${c.watched || 0}/${c.lectures || 0}차시</span>
        <span class="badge ${tone === 'danger' ? 'danger' : tone === 'ok' ? 'ok' : 'accent'}">${p}%</span>
        ${lst && lst.next ? `<span class="badge">다음 ${L.esc(lst.next.title)}</span>` : ''}
        ${lst && lst.overdue ? `<span class="badge danger">기한 지남 ${lst.overdue}건</span>` : ''}
        ${sc.projected !== null ? `<span class="badge purple">예상 ${sc.projected}점 · ${scoreToGrade(sc.projected)}</span>` : ''}
      </div>
      <div class="bar ${tone}"><i style="width:${p}%"></i></div>
    </div>`;
  }).join('') : `<div class="empty-state"><div class="big">📚</div>이번 학기 과목이 없습니다.
    <div style="margin-top:10px"><button class="btn primary sm" data-add-course>+ 과목 추가</button></div></div>`;
}

function taskLi(t) {
  const k = KINDS[t.kind] || KINDS.etc;
  const n = t.due ? L.dday(t.due) : null;
  const dtone = n === null ? '' : n < 0 ? 'danger' : n <= 3 ? 'warn' : '';
  return `<li class="${t.status === 'done' ? 'done' : ''}">
    <input type="checkbox" data-toggle="${t.id}" ${t.status === 'done' ? 'checked' : ''}>
    <div class="grow">
      <div class="ttl">${L.esc(t.title)}</div>
      <div class="meta">
        <span class="badge ${k.tone}">${k.label}</span>
        ${t.courseId ? ` ${L.esc(courseLabel(t.courseId))} ·` : ''}
        ${t.due ? ` ${L.fmtKo(t.due)}` : ''}
        ${t.weight ? ` · 비중 ${t.weight}%` : ''}
      </div>
    </div>
    ${t.due ? `<span class="badge ${dtone} mono">${L.ddayLabel(t.due)}</span>` : ''}
    <button class="btn sm ghost" data-edit-task="${t.id}">수정</button>
  </li>`;
}

/* ================= 렌더: 과목 ================= */
/* =========================================================
   엑셀 붙여넣기로 강의 가져오기
   ========================================================= */
let pasteTarget = '';   // 과목 id ('' = 붙여넣은 과목명으로 판단)

function openPaste(courseId) {
  pasteTarget = courseId || '';
  const cs = termCourses(viewTermId);
  $('#pTarget').innerHTML =
    `<option value="">붙여넣은 "과목" 열로 나누기 (없으면 새 과목)</option>` +
    cs.map(c => `<option value="${c.id}"${c.id === pasteTarget ? ' selected' : ''}>${L.esc(c.name)}</option>`).join('');
  $('#pTarget').value = pasteTarget;
  $('#pMode').value = 'append';
  $('#pText').value = '';
  $('#pStrip').checked = true;
  pSheets = [];
  $('#pSheetWrap').style.display = 'none';
  $('#pFileMsg').innerHTML = '';
  renderPastePreview();
  $('#pasteModal').classList.add('open');
  setTimeout(() => $('#pText').focus(), 30);
}

/** 붙여넣은 내용을 "과목별 묶음"으로 정리한다 */
function pastePlan() {
  const target = $('#pTarget').value;
  const res = L.parseLecturePaste($('#pText').value, {
    stripNo: $('#pStrip').checked,
    yearHint: Number((termById(viewTermId) || {}).start?.slice(0, 4)) || new Date().getFullYear(),
  });
  const buckets = new Map();   // key: 과목 id 또는 '신규:이름'
  for (const r of res.rows) {
    let key, label, courseId = '', newName = '';
    if (target) { key = target; courseId = target; label = (course(target) || {}).name || '과목'; }
    else {
      const name = (r.group || '').trim();
      if (!name) { key = '__none__'; label = '(과목 미지정)'; }
      else {
        const hit = termCourses(viewTermId).find(c => c.name.trim() === name)
          || DB.courses.find(c => c.name.trim() === name);
        if (hit) { key = hit.id; courseId = hit.id; label = hit.name; }
        else { key = 'new:' + name; newName = name; label = name; }
      }
    }
    if (!buckets.has(key)) buckets.set(key, { key, label, courseId, newName, rows: [] });
    buckets.get(key).rows.push(r);
  }
  return { res, buckets: Array.from(buckets.values()) };
}

function renderPastePreview() {
  const { res, buckets } = pastePlan();
  const total = res.rows.length;
  const bad = buckets.find(b => b.key === '__none__');
  const mode = $('#pMode').value;
  $('#pApply').disabled = !total || !!bad;
  $('#pApply').textContent = total ? `${total}강 가져오기` : '가져오기';

  if (!$('#pText').value.trim()) {
    $('#pPreview').innerHTML = `<p class="dim" style="font-size:12.5px">붙여넣으면 여기에서 미리 확인할 수 있습니다.</p>`;
    return;
  }
  const rowsHtml = buckets.map(b => {
    const head = `<tr class="grp"><td colspan="5">${L.esc(b.label)}
      <span class="dim" style="font-weight:400">· ${b.rows.length}강
      ${b.newName ? '· 새 과목으로 만듭니다' : b.courseId ? `· 기존 ${courseLectures(course(b.courseId)).length}강 ${mode === 'replace' ? '전체 교체' : '뒤에 추가'}` : ''}</span></td></tr>`;
    const body = b.rows.slice(0, 60).map((r, i) => `<tr>
      <td class="dim" style="width:38px">${i + 1}</td>
      <td><b>${L.esc(r.title)}</b></td>
      <td class="mid" style="width:58px">${r.week ?? '<span class="dim">-</span>'}</td>
      <td style="width:104px">${r.dueDate ? L.fmtKo(r.dueDate) : '<span class="dim">-</span>'}</td>
      <td class="dim">${L.esc(r.memo || '')}</td></tr>`).join('');
    const more = b.rows.length > 60 ? `<tr><td colspan="5" class="dim">외 ${b.rows.length - 60}강</td></tr>` : '';
    return head + body + more;
  }).join('');

  $('#pPreview').innerHTML = `
    <div class="inline" style="margin-bottom:7px;flex-wrap:wrap">
      <b style="font-size:13px">미리 보기</b>
      <span class="badge ${total ? 'ok' : 'danger'}">${total}강</span>
      ${res.headerUsed ? '<span class="badge accent">머리글 인식</span>' : '<span class="badge">머리글 없음</span>'}
      ${buckets.length > 1 ? `<span class="badge purple">과목 ${buckets.length}개</span>` : ''}
    </div>
    <div class="prevwrap"><table class="tbl leclist">
      <thead><tr><th style="width:38px">#</th><th>강의명</th><th class="mid">주차</th><th>마감일</th><th>메모</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div>
    ${bad ? `<div class="notice danger" style="margin-top:10px"><div>과목을 알 수 없는 줄이 ${bad.rows.length}개 있습니다.
      위에서 넣을 과목을 고르거나, 붙여넣는 표에 "과목" 열을 넣어주세요.</div></div>` : ''}
    ${res.warnings.length ? `<div class="notice warn" style="margin-top:10px"><div>
      ${res.warnings.slice(0, 4).map(w => L.esc(w)).join('<br>')}
      ${res.warnings.length > 4 ? `<br>외 ${res.warnings.length - 4}건` : ''}</div></div>` : ''}`;
}

function applyPaste() {
  const { buckets } = pastePlan();
  if (!buckets.length) { L.toast('가져올 강의가 없습니다.'); return; }
  if (buckets.some(b => b.key === '__none__')) { L.toast('넣을 과목을 정해주세요.'); return; }
  const mode = $('#pMode').value;
  const newCourses = buckets.filter(b => b.newName).length;
  const replacing = mode === 'replace'
    ? buckets.filter(b => b.courseId && courseLectures(course(b.courseId)).length)
    : [];
  let msg = `${buckets.reduce((a, b) => a + b.rows.length, 0)}강을 가져옵니다.`;
  if (newCourses) msg += `\n새 과목 ${newCourses}개를 만듭니다.`;
  if (replacing.length) {
    const lost = replacing.reduce((a, b) => a + courseLectures(course(b.courseId)).filter(i => i.watched).length, 0);
    msg += `\n기존 강의 목록을 전체 교체합니다.${lost ? ` 완료 표시된 ${lost}강도 함께 지워집니다.` : ''}`;
  }
  if (!confirm(msg + '\n계속할까요?')) return;

  let made = 0, added = 0;
  for (const b of buckets) {
    let c;
    if (b.newName) {
      c = newCourse(b.newName);
      DB.courses.push(c);
      made++;
    } else {
      c = course(b.courseId);
    }
    if (!c) continue;
    const cur = mode === 'replace' ? [] : courseLectures(c).slice();
    const items = cur.concat(b.rows.map((r, i) => L.lectureFromRow(r, cur.length + i)));
    setCourseLectures(c, items);
    added += b.rows.length;
    lecOpen.add(c.id);
  }
  save(); closeModals(); goto('courses'); renderAll();
  L.toast(`${added}강을 가져왔습니다.${made ? ` 새 과목 ${made}개를 만들었습니다.` : ''}`);
}

/** 붙여넣기로 새로 만드는 과목의 기본값 — 과목 추가 모달과 같은 기본값을 쓴다 */
function newCourse(name) {
  return {
    id: L.uid(), termId: viewTermId, name: name.slice(0, 60), credits: 3, prof: '',
    type: 'general', grade: '', lectures: 0, watched: 0, lectureItems: [],
    weights: { mid: 30, attend: 0, final: 70 },
    scores: { mid: null, attend: null, final: null },
    memo: '',
  };
}
const termById = id => DB.terms.find(t => t.id === id) || null;

const COURSE_ICON = c => c.type === 'attend' ? 'user' : 'book';

function renderCourses() {
  fillSelect($('#courseTermSel'), DB.terms.map(t => [t.id, `${t.label} · ${t.name}`]), viewTermId);
  const cs = termCourses(viewTermId);
  const today = L.todayStr();
  const wr = L.weekRange();

  /* ---- 요약 4칸 ---- */
  const all = cs.flatMap(courseLectures);
  const st = L.lectureStats(all);
  // 체크리스트가 없는 과목은 기존 숫자 필드로 진도를 계산해 합산한다 (옛 데이터 호환)
  let legacyTotal = 0, legacyWatched = 0;
  for (const c of cs) if (!courseLectures(c).length) {
    legacyTotal += Number(c.lectures) || 0; legacyWatched += Number(c.watched) || 0;
  }
  const total = st.total + legacyTotal, watched = st.watched + legacyWatched;
  const pct = L.pct(watched, total);
  const dueWeek = all.filter(i => !i.watched && i.dueDate && i.dueDate >= today && i.dueDate <= wr.end).length;
  const R = 15, C = 2 * Math.PI * R;
  const donut = `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="5"/>
    <circle cx="20" cy="20" r="${R}" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90 20 20)"/></svg>`;
  const cell = (tone, inner, k, v, unit) => `<div class="${tone}">
      <span class="ico${inner.startsWith('<svg') ? ' plain' : ''}">${inner}</span>
      <div><div class="k">${k}</div><div class="v">${v}<small>${unit}</small></div></div></div>`;
  $('#courseStrip').innerHTML =
    cell('', donut, '전체 진도', total ? pct : '—', total ? '%' : '') +
    cell('accent', L.icon('cal', 20), '이번 주 마감', dueWeek, '강') +
    cell(total - watched ? 'warn' : 'ok', L.icon('book', 20), '미수강', total - watched, '강') +
    cell(st.overdue ? 'danger' : 'ok', L.icon('clock', 20), '지연', st.overdue, '강');

  /* ---- 과목 아코디언 ---- */
  $('#courseAcc').innerHTML = cs.length ? cs.map(c => {
    const items = courseLectures(c);
    const cst = items.length ? L.lectureStats(items) : null;
    const p = progressOf(c);
    const wa = cst ? cst.watched : (Number(c.watched) || 0);
    const tt = cst ? cst.total : (Number(c.lectures) || 0);
    const lag = cst ? cst.overdue : 0;
    const open = lecOpen.has(c.id);
    const tbl = gradeTable();
    return `<section class="accitem ${open ? 'open' : ''}" id="${c.id}">
      <button type="button" class="acchead" data-lec-toggle="${c.id}" aria-expanded="${open}">
        <span class="caret">${L.icon('chev', 16)}</span>
        <span class="ico">${L.icon(COURSE_ICON(c), 18)}</span>
        <span class="nm"><b>${L.esc(c.name)}</b>
          <span>${c.prof ? L.esc(c.prof) + ' 교수' : `${c.credits || 0}학점`}${c.grade ? ` · ${c.grade} ${(tbl[c.grade] ?? 0).toFixed(1)}` : ''}</span></span>
        <span class="cnt">${wa} / ${tt}강</span>
        <span class="bar ${p >= 100 ? 'ok' : 'accent'}"><i style="width:${p}%"></i></span>
        <span class="pc">${p}%</span>
        <span class="nx">${cst && cst.next
          ? `<i>다음 강의</i><b>${L.esc(cst.next.title)}</b>`
          : `<i>${tt ? '' : '강의 목록 없음'}</i><b>${tt && wa >= tt ? '모두 수강했어요' : ''}</b>`}</span>
        <span class="lag ${lag ? 'on' : 'off'}">지연 ${lag}강</span>
      </button>
      ${open ? `<div class="accbody">
        <div class="inline" style="margin-bottom:10px;flex-wrap:wrap">
          <span class="badge">${c.credits || 0}학점</span>
          ${c.type === 'attend' ? '<span class="badge warn">출석수업</span>' : ''}
          ${scoreBadges(c)}
          <div style="flex:1;min-width:10px"></div>
          <button class="btn sm ghost" data-course-tasks="${c.id}">연결된 일정 →</button>
          <button class="btn sm ghost" data-edit-course="${c.id}">과목 정보 수정</button>
        </div>
        ${renderLecPanel(c)}
        ${c.memo ? `<p class="dim" style="font-size:12px;margin-top:10px;white-space:pre-wrap">${L.esc(c.memo)}</p>` : ''}
      </div>` : ''}
    </section>`;
  }).join('') : `<div class="card"><div class="empty-state"><div class="big">📖</div>
    이 학기에 등록된 과목이 없습니다.
    <div style="margin-top:12px"><button class="btn primary" data-add-course>+ 과목 추가</button></div></div></div>`;
}
/** 평가 현황 요약 뱃지 — 아코디언을 펼쳤을 때만 보여준다 (성적/졸업 화면과 중복되지 않게 요약만) */
function scoreBadges(c) {
  const sc = scoreOf(c);
  const tasks = DB.tasks.filter(t => t.courseId === c.id);
  const doneN = tasks.filter(t => t.status === 'done').length;
  return `<span class="badge ok">확보 ${sc.earned}점</span>
    ${sc.projected !== null ? `<span class="badge purple">현 추세 ${sc.projected}점 → ${scoreToGrade(sc.projected)}</span>` : ''}
    ${sc.planned !== 100 ? `<span class="badge warn">비중 합계 ${sc.planned}%</span>` : ''}
    ${tasks.length ? `<span class="badge">일정 ${doneN} / ${tasks.length}건 완료</span>` : ''}`;
}
/* =========================================================
   렌더: 과제 · 시험 — 왼쪽 일정 목록 + 오른쪽 상세
   task 에 새로 붙는 선택 필드 (없으면 normTask 가 만들어 준다)
     priority   중요/보통/낮음
     submitted  제출 여부 · submittedAt 제출일
     checklist  [{id, text, done, doneAt}]
     files      첨부 [{id,name,size,type,added}]  (IndexedDB 저장)
     scope      시험 범위 · examTime 시작시각 · examMin 소요(분) · examMode 방식
   ========================================================= */
let viewTermId = curTermId();
const filters = { term: '', course: '', tab: 'all', q: '', sort: 'due', showDone: false };
let taskSel = '';

function normTask(t) {
  if (!t || typeof t !== 'object') return t;
  if (!Array.isArray(t.checklist)) t.checklist = [];
  if (!Array.isArray(t.files)) t.files = [];
  t.priority = L.priorityOf(t.priority);
  if (typeof t.scope !== 'string') t.scope = '';
  if (typeof t.examTime !== 'string') t.examTime = '';
  if (typeof t.examMin !== 'string') t.examMin = (t.examMin === undefined || t.examMin === null) ? '' : String(t.examMin);
  if (!EXAM_MODES[t.examMode]) t.examMode = 'online';
  if (typeof t.submittedAt !== 'string') t.submittedAt = '';
  if (typeof t.submitted !== 'boolean') t.submitted = t.status === 'done';
  if (typeof t.memoAt !== 'string') t.memoAt = '';
  return t;
}
/** 진행률 — 체크리스트가 있으면 그 달성률, 없으면 상태에서 만든다 */
function taskProgress(t) {
  const cl = (t && t.checklist) || [];
  if (cl.length) return L.pct(cl.filter(i => i.done).length, cl.length);
  return t.status === 'done' ? 100 : t.status === 'doing' ? 50 : 0;
}
const PRI_ORDER = { high: 0, normal: 1, low: 2 };

function filteredTasks() {
  const q = filters.q.trim().toLowerCase();
  const list = DB.tasks.filter(t => {
    normTask(t);
    if (filters.term && t.termId !== filters.term) return false;
    if (filters.course && t.courseId !== filters.course) return false;
    if (filters.tab === 'exam' && !isExamTask(t)) return false;
    if (filters.tab === 'assign' && isExamTask(t)) return false;
    if (!filters.showDone && t.status === 'done' && t.id !== taskSel) return false;
    if (q && !((t.title || '') + ' ' + courseLabel(t.courseId)).toLowerCase().includes(q)) return false;
    return true;
  });
  const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999');
  if (filters.sort === 'priority') list.sort((a, b) => PRI_ORDER[a.priority] - PRI_ORDER[b.priority] || byDue(a, b));
  else if (filters.sort === 'course') list.sort((a, b) => courseLabel(a.courseId).localeCompare(courseLabel(b.courseId)) || byDue(a, b));
  else if (filters.sort === 'progress') list.sort((a, b) => taskProgress(a) - taskProgress(b) || byDue(a, b));
  else list.sort(byDue);
  return list;
}

function renderSched() {
  DB.tasks.forEach(normTask);
  fillSelect($('#fTerm'), [['', '전체 학기']].concat(DB.terms.map(t => [t.id, t.label])), filters.term);
  const cOpts = DB.courses.filter(c => !filters.term || c.termId === filters.term).map(c => [c.id, c.name]);
  fillSelect($('#fCourse'), [['', '전체 과목']].concat(cOpts), filters.course);
  $('#taskQ').value = filters.q;
  $('#taskSort').value = filters.sort;
  $('#taskShowDone').checked = filters.showDone;

  const base = DB.tasks.filter(t => (!filters.term || t.termId === filters.term) && (!filters.course || t.courseId === filters.course));
  const counts = {
    all: base.length,
    assign: base.filter(t => !isExamTask(t)).length,
    exam: base.filter(t => isExamTask(t)).length,
  };
  $('#taskTabs').innerHTML = [['all', '전체'], ['assign', '과제'], ['exam', '시험']].map(([k, label]) =>
    `<button type="button" role="tab" class="chip${filters.tab === k ? ' on' : ''}" data-task-tab="${k}"
       aria-selected="${filters.tab === k}">${label}<span style="margin-left:5px;opacity:.75">${counts[k]}</span></button>`).join('');

  const list = filteredTasks();
  if (!list.some(t => t.id === taskSel)) taskSel = list.length ? list[0].id : '';
  const doneN = list.filter(t => t.status === 'done').length;
  $('#filterCount').textContent = `${list.length}건${doneN ? ` · 완료 ${doneN}건` : ''}`;

  $('#taskList').innerHTML = list.length
    ? list.map(taskPickRow).join('')
    : `<li><div class="empty-state" style="padding:30px 16px">
         <div class="big">${L.icon('note', 26)}</div>
         <p>${DB.tasks.length ? '조건에 맞는 일정이 없습니다.' : '등록된 과제 · 시험이 없습니다.'}</p>
         <button class="btn sm primary" data-add-task style="margin-top:11px">+ 일정 추가</button></div></li>`;

  $('#taskDetail').innerHTML = taskDetailHtml(DB.tasks.find(t => t.id === taskSel) || null);
}

function taskPickRow(t) {
  const k = KINDS[t.kind] || KINDS.etc;
  const n = t.due ? L.dday(t.due) : null;
  const done = t.status === 'done';
  const tone = done ? '' : n === null ? '' : n < 0 ? 'danger' : n <= 3 ? 'warn' : n <= 7 ? 'accent' : '';
  const dd = done ? '완료' : t.due ? L.ddayLabel(t.due) : '기한 없음';
  return `<li><button type="button" class="pick${t.id === taskSel ? ' on' : ''}${done ? ' done' : ''}" data-task-pick="${t.id}" id="pick-${t.id}">
    <span class="ico">${L.icon(k.ico || 'cal', 15)}</span>
    <span class="txt">
      <b>${L.esc(t.courseId ? courseLabel(t.courseId) : (term(t.termId) || {}).label || '학사 일정')}</b>
      <span>${L.esc(t.title)}</span>
      <span style="margin-top:3px">
        <span class="badge ${k.tone}">${k.label}</span>
        ${t.due ? `<span class="dim" style="margin-left:5px">${L.fmtKo(t.due)}${t.examTime ? ' ' + L.esc(t.examTime) : ''}</span>` : ''}
      </span>
    </span>
    <span class="tail" style="color:var(--${tone === 'danger' ? 'danger' : tone === 'warn' ? 'warn' : tone === 'accent' ? 'accent' : 'text-3'})">${dd}</span>
  </button></li>`;
}

/* ---- 상세 ---- */
function infoCell(ico, k, v, cls) {
  return `<div>${L.icon(ico, 16)}<div><div class="k">${k}</div><div class="v ${cls || ''}">${v}</div></div></div>`;

        <div class="k" style="margin-top:5px">${cl.length ? `${clDone} / ${cl.length} 항목 완료` : '체크리스트를 만들면 자동으로 계산됩니다'}</div></div></div>`
    + `<div>${L.icon('flag', 16)}<div><div class="k">우선순위</div>

      <div style="min-width:0">
        <div class="inline" style="gap:6px">
          <span class="dim" style="font-size:12px">${L.esc(c ? c.name : (term(t.termId) || {}).label || '학사 일정')}</span>
          <span class="badge ${k.tone}">${k.label}</span>
          ${t.priority === 'high' ? '<span class="badge danger">중요</span>' : ''}
          ${done ? '<span class="badge ok">완료</span>' : ''}
        </div>
        <h3 style="font-size:17px;margin-top:4px">${L.esc(t.title)}</h3>
      </div>
      <div class="spacer"></div>
      <button class="btn sm ghost" data-task-step="-1" aria-label="이전 일정">${L.icon('chevleft', 15)}</button>
      <button class="btn sm ghost" data-task-step="1" aria-label="다음 일정">${L.icon('chev', 15)}</button>
      <button class="btn sm" data-edit-task="${t.id}">수정</button>
    </div>
    <div class="card-body">
      <div class="infogrid">${row1}</div>
      <div class="infogrid" style="margin-top:10px">${row2}</div>

      <div class="grid g2" style="margin-top:14px">
        <div class="fit">

              <span class="badge n">${clDone}/${cl.length}</span></h4>
            ${cl.length ? `<ul class="klist">${cl.map(i => `<li class="${i.done ? 'on' : ''}">

              <input type="text" data-ck-input placeholder="${exam ? '예: 기출 문제 2회분 풀기' : '예: 초안 작성'}" aria-label="체크리스트 항목">
              <button type="button" class="btn sm" data-task-ck-add="${t.id}">추가</button>
            </div>
            <div class="inline" style="margin-top:12px;gap:10px">
              <span class="dim" style="font-size:12px">상태</span>
              <select data-task-status="${t.id}" style="width:auto">
                ${Object.entries(STATUS).map(([k2, v]) => `<option value="${k2}" ${t.status === k2 ? 'selected' : ''}>${v}</option>`).join('')}
              </select>
              ${exam ? '' : `<label class="inline" style="gap:6px;font-size:12.5px">
                <input type="checkbox" data-task-submit="${t.id}" ${t.submitted ? 'checked' : ''}><span>제출 완료</span></label>`}

            ${(t.files || []).length ? `<div class="filelist">${t.files.map(f =>
              `<span class="filechip"><button type="button" data-open-file="${f.id}" style="border:0;background:transparent;display:flex;align-items:center;gap:6px;cursor:pointer;padding:0">
                 ${L.icon('down', 13)}<b>${L.esc(f.name)}</b><span class="sz">${L.fmtBytes(f.size)}</span></button>
               <button type="button" data-task-file-del="${t.id}|${f.id}" aria-label="첨부 삭제">${L.icon('x', 12)}</button></span>`).join('')}</div>`
              : '<p class="focus-empty">첨부한 파일이 없습니다.</p>'}
            ${rel.length ? `<div class="sec-title" style="margin:12px 0 7px">관련 자료 (자료실)</div>
              <ul class="klist">${rel.map(r => `<li><span class="kt">${L.esc(r.title)}</span>
                <button type="button" class="btn sm ghost" data-goto-res="${r.id}">열기</button></li>`).join('')}</ul>` : ''}
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

/* 과제·시험 첨부 추가 */
let taskFileTarget = '';
async function addTaskFiles(fileList) {
  const t = DB.tasks.find(x => x.id === taskFileTarget);
  const files = Array.from(fileList || []);
  if (!t || !files.length) return;
  if (!(await L.Files.available())) { L.toast('이 환경에서는 첨부를 쓸 수 없습니다. (로컬 서버로 열면 가능)'); return; }
  const MAX = 30 * 1024 * 1024;
  for (const f of files) {
    if (f.size > MAX) { L.toast(`${f.name} 은 30MB를 넘어 건너뛰었습니다.`); continue; }
    try { t.files.push(await L.Files.put(f)); }
    catch (e) { L.toast('첨부 저장에 실패했습니다.'); break; }
  }
  save(); renderSched(); L.toast('첨부했습니다.');
}

/* =========================================================
   렌더: 성적 · 졸업
   성적·학점을 이 화면의 표에서 바로 고칠 수 있다 (과목 관리 화면과 같은 데이터).
   ========================================================= */
let degTerm = '';
let degOnlyEmpty = false;

function renderDegree() {
  const tbl = gradeTable();
  const graded = DB.courses.filter(c => c.grade && c.grade in tbl);
  const cum = gpaOf(graded);
  const got = earnedCredits(DB.courses);
  const total = (Number(DB.meta.transferCredits) || 0) + got;
  const need = Number(DB.meta.gradCredits) || 0;
  const left = Math.max(0, need - total);
  const gradPct = L.pct(total, need);

  // 남은 학기 수 (종강일이 오늘 이후인 학기)
  const remainTerms = DB.terms.filter(t => !t.end || L.dday(t.end) >= 0).length;
  const perTerm = remainTerms > 0 ? Math.ceil(left / remainTerms) : left;

  const target = Number(DB.meta.targetGpa) || 0;
  const gap = cum.gpa === null ? null : Math.round((cum.gpa - target) * 100) / 100;

  $('#degreeStats').innerHTML = `
    <div class="stat purple">
      <div class="label">누적 평점평균</div>
      <div class="value">${cum.gpa === null ? '—' : cum.gpa.toFixed(2)}<small>/ ${DB.meta.gpaScale}</small></div>
      <div class="foot">${target ? `목표 ${target.toFixed(1)} · ${gap === null ? '—' : (gap >= 0 ? `+${gap.toFixed(2)} 달성` : `${gap.toFixed(2)} 부족`)}` : '목표 미설정'}</div>
    </div>
    <div class="stat accent">
      <div class="label">총 이수학점</div>
      <div class="value">${total}<small>학점</small></div>
      <div class="foot">편입인정 ${DB.meta.transferCredits} + 취득 ${got}</div>
    </div>
    <div class="stat ${left === 0 ? 'ok' : 'warn'}">
      <div class="label">졸업까지 남은 학점</div>
      <div class="value">${left}<small>학점</small></div>
      <div class="foot">남은 ${remainTerms}학기 · 학기당 약 ${perTerm}학점</div>
    </div>
    <div class="stat ${gradPct >= 100 ? 'ok' : ''}">
      <div class="label">졸업 진행률</div>
      <div class="value">${gradPct}<small>%</small></div>
      <div class="foot">${total} / ${need}학점</div>
      <div class="bar ${gradPct >= 100 ? 'ok' : 'purple'}"><i style="width:${gradPct}%"></i></div>
    </div>`;

  /* 졸업 요건 입력칸 */
  $('#dTransfer').value = DB.meta.transferCredits;
  $('#dGrad').value = DB.meta.gradCredits;
  $('#dScale').value = String(DB.meta.gpaScale);
  $('#dTarget').value = DB.meta.targetGpa;

  const tCredits = Number(DB.meta.transferCredits) || 0;
  const tPct = need ? Math.round((tCredits / need) * 100) : 0;
  const gPct = need ? Math.round((got / need) * 100) : 0;
  $('#gradBody').innerHTML = `
    <div class="sec-title">졸업 요건 진행률</div>
    <div style="display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--border);margin-bottom:10px">
      <div style="width:${tPct}%;background:var(--accent);opacity:.55"></div>
      <div style="width:${gPct}%;background:var(--purple)"></div>
    </div>
    <div class="inline" style="font-size:12.5px">
      <span class="badge accent">편입 인정 ${tCredits}학점</span>
      <span class="badge purple">방통대 취득 ${got}학점</span>
      <span class="badge">잔여 ${left}학점</span>
      <div style="flex:1"></div>
      <span class="dim">졸업 필요 ${need}학점</span>
    </div>
    ${left > 0 && remainTerms > 0 ? `<p class="dim" style="font-size:12.5px;margin-top:12px">
      남은 <b>${remainTerms}개 학기</b>에 학기당 평균 <b>${perTerm}학점</b>을 취득하면 졸업 요건을 채웁니다.
      ${perTerm > 24
        ? `<b style="color:var(--danger)">학기당 신청 한도(24학점)를 초과합니다 —
           학기를 더 추가하거나 계절학기·학점인정을 검토하세요.</b>`
        : '방통대는 학기당 최대 24학점까지 신청할 수 있습니다.'}</p>` : ''}`;

  /* 학기 카드 — 학기 요약 + 그 학기에 들은 과목 목록(성적 바로 입력) */
  if (degTerm && !DB.terms.some(t => t.id === degTerm)) degTerm = '';
  fillSelect($('#degTermSel'), [['', '전체 학기']].concat(sortedTerms().map(t => [t.id, t.label])), degTerm);
  $('#degOnlyEmpty').checked = degOnlyEmpty;

  const gradeOpts = [['', '미입력']].concat(Object.keys(tbl).map(g => [g, g])).concat([['P', 'P (평점 제외)']]);
  const terms = sortedTerms().filter(t => !degTerm || t.id === degTerm);

  $('#termCards').innerHTML = terms.length ? terms.map(t => {
    const all = termCourses(t.id);
    const cs = all.filter(c => !degOnlyEmpty || !c.grade);
    const g = gpaOf(all);
    const applied = all.reduce((a, c) => a + (Number(c.credits) || 0), 0);
    const gotC = earnedCredits(all);
    const gradedN = all.filter(c => c.grade).length;
    const isCur = t.id === curTermId();
    const donePct = L.pct(gradedN, all.length);
    const period = [t.start ? L.fmtKo(t.start) : '', t.end ? L.fmtKo(t.end) : ''].filter(Boolean).join(' ~ ');
    const season = seasonOf(t);

    return `<article class="termcard ${isCur ? 'cur' : ''}">
      <header>
        <div class="tt">
          <b>${L.esc(t.label)}</b> ${isCur ? '<span class="badge accent">현재</span>' : ''}
          ${season ? `<span class="badge warn">${season}</span>` : ''}
          <div class="sub">${L.esc(t.name)}${period ? ' · ' + period : ''}</div>
        </div>
        <div class="gpa"><b>${g.gpa === null ? '—' : g.gpa.toFixed(2)}</b><span>평점평균</span></div>
        <button type="button" class="cardx edit" data-edit-term="${t.id}"
          title="학기 수정" aria-label="${L.esc(t.label)} 학기 수정">${L.icon('edit', 14)}</button>
      </header>
      <div class="tbody">
        <div class="tstats">
          <div><span class="k">수강 과목</span><b>${all.length}<small style="font-size:11px;font-weight:600">과목</small></b></div>
          <div><span class="k">신청학점</span><b>${applied}</b></div>
          <div><span class="k">취득학점</span><b>${gotC}</b></div>
        </div>
        <div class="prog">
          <span>성적 입력 ${gradedN}/${all.length}</span>
          <div class="bar ${donePct >= 100 ? 'ok' : ''}"><i style="width:${donePct}%"></i></div>
          <span>${donePct}%</span>
        </div>
        <ul class="courselist">
          ${cs.length ? cs.map(c => {
            const pt = c.grade && c.grade in tbl ? tbl[c.grade] : null;
            return `<li id="grade-${c.id}">
              <span class="nm">${L.esc(c.name)}${c.prof ? `<small>${L.esc(c.prof)}</small>` : ''}</span>
              <input type="number" min="0" max="9" step="1" value="${Number(c.credits) || 0}"
                data-deg-credit="${c.id}" aria-label="${L.esc(c.name)} 학점" title="학점">
              <select data-deg-grade="${c.id}" aria-label="${L.esc(c.name)} 성적" title="취득 성적">
                ${gradeOpts.map(([v, t2]) => `<option value="${v}" ${c.grade === v ? 'selected' : ''}>${t2}</option>`).join('')}
              </select>
              <span class="pt">${pt === null ? '—' : pt.toFixed(1)}</span>
              <button class="btn sm ghost" data-edit-course="${c.id}" aria-label="${L.esc(c.name)} 과목 수정" title="과목 수정">${L.icon('edit', 13)}</button>
            </li>`;
          }).join('') : `<li class="none">${all.length ? '성적을 모두 입력했습니다.' : '이 학기에 등록한 과목이 없습니다.'}</li>`}
        </ul>
      </div>
      <footer>
        <button class="btn sm ghost" data-term-view="${t.id}">과목 관리 →</button>
        <button class="btn sm ghost" data-course-add-term="${t.id}">+ 과목 추가</button>
      </footer>
    </article>`;
  }).join('') : `<div class="empty-state" style="grid-column:1/-1">
      학기가 없습니다. 설정에서 학기를 먼저 추가해 주세요.</div>`;
}

/* =========================================================
   자료실 — 강의(과목) 목록 + 주차별 파일 목록 + 미리보기
   resource = { id, title, termId, courseId, kind, week, tags[], fav,
                url, memo, added, updated, files:[{id,name,size,type,added}] }
   week: '' | '1'~'15' | 'assign' | 'exam' | 'etc'
   ========================================================= */
const RES_KINDS = { lecture: '강의자료', summary: '요약·필기', past: '기출·문제', link: '링크', etc: '기타' };
const RES_TONE = { lecture: 'accent', summary: 'purple', past: 'warn', link: 'ok', etc: '' };
const RES_SPECIAL = { assign: '과제', exam: '시험', etc: '기타' };
let resTerm = '', resCourse = '', resWeek = 'all', resSel = '', resQ = '', resSort = 'recent', resCourseQ = '';
let previewUrl = '';

function resList() { return Array.isArray(DB.resources) ? DB.resources : (DB.resources = []); }
function normRes(r) {
  if (!r || typeof r !== 'object') return r;
  if (!Array.isArray(r.files)) r.files = [];
  if (!Array.isArray(r.tags)) r.tags = [];
  if (typeof r.week !== 'string') r.week = r.week ? String(r.week) : '';
  if (typeof r.fav !== 'boolean') r.fav = false;
  if (typeof r.updated !== 'string') r.updated = r.added || '';
  return r;
}
/** 파일 확장자 → 표시용 유형 */
function resType(r) {
  const f = (r.files || [])[0];
  // 첨부가 있으면 그 파일 이름, 없으면 제목에서 확장자를 읽는다
  const name = (f && f.name) || (/\.[a-z0-9]{1,5}$/i.test(r.title || '') ? r.title : '');
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (name) {
    if (ext === 'pdf') return { t: 'PDF', c: 'pdf' };
    if (['ppt', 'pptx'].includes(ext)) return { t: 'PPTX', c: 'ppt' };
    if (['doc', 'docx', 'hwp', 'hwpx'].includes(ext)) return { t: ext.toUpperCase(), c: 'doc' };
    if (['xls', 'xlsx', 'csv'].includes(ext)) return { t: ext.toUpperCase(), c: 'xls' };
    if (['mp4', 'mov', 'avi', 'mkv', 'webm'].includes(ext)) return { t: 'MP4', c: 'vid' };
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) return { t: ext.toUpperCase(), c: 'img' };
    if (['md', 'txt', 'json'].includes(ext)) return { t: ext.toUpperCase(), c: '' };
    return { t: ext ? ext.toUpperCase() : '파일', c: '' };
  }
  if (r.url) return { t: 'LINK', c: 'doc' };
  return { t: '노트', c: '' };
}
function resSize(r) { return (r.files || []).reduce((a, f) => a + (Number(f.size) || 0), 0); }
function weekLabel(w) {
  if (!w) return '분류 없음';
  return RES_SPECIAL[w] || `${w}주차`;
}
/** 지금 학기·과목 조건에 맞는 자료 (주차 탭 적용 전) */
function resScoped() {
  return resList().map(normRes).filter(r =>
    (!resTerm || r.termId === resTerm) && (!resCourse || r.courseId === resCourse));
}
function resFiltered() {
  const q = resQ.trim().toLowerCase();
  let list = resScoped().filter(r => {
    if (resWeek === 'fav') return r.fav;
    if (resWeek !== 'all' && (r.week || 'etc') !== resWeek) return false;
    return true;
  });
  if (q) {
    list = list.filter(r => (`${r.title} ${(r.tags || []).join(' ')} ${(r.files || []).map(f => f.name).join(' ')} ${r.memo || ''}`)
      .toLowerCase().includes(q));
  }
  const byName = (a, b) => (a.title || '').localeCompare(b.title || '');
  if (resSort === 'name') list.sort(byName);
  else if (resSort === 'size') list.sort((a, b) => resSize(b) - resSize(a));
  else if (resSort === 'fav') list.sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || (b.updated || '').localeCompare(a.updated || ''));
  else list.sort((a, b) => (b.updated || b.added || '').localeCompare(a.updated || a.added || '') || byName(a, b));
  return list;
}

function renderFiles() {
  resList().forEach(normRes);
  if (!resTerm && !resList().some(r => !r.termId)) resTerm = curTermId();
  fillSelect($('#resTermSel'), [['', '전체 학기']].concat(DB.terms.map(t => [t.id, `${t.label} · ${t.name}`])), resTerm);
  $('#resQ').value = resQ;
  $('#resSort').value = resSort;
  $('#resCourseQ').value = resCourseQ;

  /* --- 왼쪽: 강의(과목) 목록 --- */
  const cq = resCourseQ.trim().toLowerCase();
  const courses = DB.courses.filter(c => (!resTerm || c.termId === resTerm) && (!cq || c.name.toLowerCase().includes(cq)));
  const countOf = cid => resList().filter(r => (!resTerm || r.termId === resTerm) && r.courseId === cid).length;
  const noCourse = resList().filter(r => (!resTerm || r.termId === resTerm) && !r.courseId).length;
  const rows = [
    `<li><button type="button" class="pick${resCourse === '' ? ' on' : ''}" data-res-course="">
       <span class="ico">${L.icon('folder', 15)}</span>
       <span class="txt"><b>전체 자료</b><span>${resScoped().length}개</span></span></button></li>`
  ].concat(courses.map(c => `<li><button type="button" class="pick${resCourse === c.id ? ' on' : ''}" data-res-course="${c.id}">
      <span class="ico">${L.icon('book', 15)}</span>
      <span class="txt"><b>${L.esc(c.name)}</b><span>${countOf(c.id)}개</span></span></button></li>`));
  if (noCourse) {
    rows.push(`<li><button type="button" class="pick${resCourse === '__none' ? ' on' : ''}" data-res-course="__none">
      <span class="ico">${L.icon('note', 15)}</span>
      <span class="txt"><b>과목 없음</b><span>${noCourse}개</span></span></button></li>`);
  }
  $('#resCourseList').innerHTML = rows.join('') ||
    '<li><div class="dim" style="padding:16px;text-align:center;font-size:12.5px">등록된 과목이 없습니다.</div></li>';

  /* --- 가운데: 주차 탭 + 파일 목록 --- */
  const cur = course(resCourse);
  const tm = DB.terms.find(t => t.id === resTerm);
  $('#resCrumb').innerHTML = `${L.icon('folder', 14)}
    <span>${L.esc(tm ? tm.label : '전체 학기')}</span>${L.icon('chev', 12)}
    <b>${L.esc(cur ? cur.name : resCourse === '__none' ? '과목 없음' : '전체 자료')}</b>
    ${resWeek !== 'all' ? `${L.icon('chev', 12)}<b>${L.esc(resWeek === 'fav' ? '즐겨찾기' : weekLabel(resWeek === 'etc' ? 'etc' : resWeek))}</b>` : ''}`;

  const scoped = resScoped();
  const weeks = Array.from(new Set(scoped.map(r => r.week || 'etc')))
    .filter(w => !RES_SPECIAL[w]).map(Number).filter(n => n > 0).sort((a, b) => a - b).map(String);
  const tabs = [['all', '전체']]
    .concat(weeks.map(w => [w, `${w}주차`]))
    .concat(['assign', 'exam', 'etc'].filter(k => scoped.some(r => (r.week || 'etc') === k)).map(k => [k, RES_SPECIAL[k]]))
    .concat(scoped.some(r => r.fav) ? [['fav', '즐겨찾기']] : []);
  $('#resWeekTabs').innerHTML = tabs.map(([k, label]) =>
    `<button type="button" role="tab" class="chip${resWeek === k ? ' on' : ''}" data-res-week="${k}" aria-selected="${resWeek === k}">${label}</button>`).join('');

  const list = resFiltered();
  if (!list.some(r => r.id === resSel)) resSel = list.length ? list[0].id : '';
  $('#resTbody').innerHTML = list.length ? list.map(r => {
    const ty = resType(r);
    const sz = resSize(r);
    return `<tr class="${r.id === resSel ? 'on' : ''}" data-res-pick="${r.id}" id="res-${r.id}">
      <td><div class="nm"><span class="ftype ${ty.c}">${ty.t.slice(0, 4)}</span>
        <div style="min-width:0"><b>${L.esc(r.title)}</b>
        ${(r.tags || []).length ? `<div class="dim" style="font-size:11px">${r.tags.map(t => '#' + L.esc(t)).join(' ')}</div>` : ''}</div></div></td>
      <td class="dim">${ty.t}</td>
      <td class="nowrap dim">${sz ? L.fmtBytes(sz) : (r.url ? '링크' : '—')}</td>
      <td class="nowrap dim">${r.updated || r.added ? L.fmtKo(r.updated || r.added) : '—'}</td>
      <td><button type="button" class="starbtn${r.fav ? ' on' : ''}" data-res-fav="${r.id}"
        aria-label="즐겨찾기" aria-pressed="${r.fav}">${L.icon('star', 15)}</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="5"><div class="empty-state" style="padding:34px 16px">
      <div class="big">${L.icon('folder', 26)}</div>
      <p>${resList().length ? '조건에 맞는 자료가 없습니다.' : '등록된 자료가 없습니다.'}</p>
      <button class="btn sm primary" data-add-res style="margin-top:11px">+ 자료 추가</button></div></td></tr>`;
  $('#resCount').textContent = `${list.length}개 항목`;

  renderResPreview(list.find(r => r.id === resSel) || null);
  renderResNotice();
}

      </div>

      <div class="sec-title" style="margin-top:14px">파일 정보</div>

        ${L.icon('book', 14)}<span>${L.esc(c ? c.name : '연결된 과목 없음')}${r.week ? ' · ' + weekLabel(r.week) : ''}</span>
        ${c ? `<button type="button" class="btn sm ghost" style="margin-left:auto" data-course-tasks="${c.id}">과제 · 시험 보기</button>` : ''}
      </div>

      <div class="inline" style="margin-top:13px;gap:8px">

        <button class="btn" data-res-download="${r.id}" ${!f ? 'disabled' : ''}>${L.icon('down', 15)} 다운로드</button>
        <div class="spacer"></div>
        <button class="btn danger sm" data-res-del="${r.id}">삭제</button>

  if (f) fillPreview(r, f);
}

/** 첨부 blob 을 실제로 읽어 미리보기를 채운다 (IndexedDB 접근이라 비동기) */
async function fillPreview(r, meta) {
  const box = document.getElementById('resPrevBox');
  if (!box) return;
  let rec = null;
  try { rec = await L.Files.get(meta.id); } catch (e) { rec = null; }
  if (!document.getElementById('resPrevBox') || resSel !== r.id) return;
  if (!rec || !rec.blob) {
    box.innerHTML = `<div class="ph">${L.icon('folder', 24)}
      <div style="margin-top:7px">첨부 파일을 찾을 수 없습니다.<br>백업을 복원한 경우 파일은 함께 오지 않습니다.</div></div>`;
    return;
  }
  const ext = (meta.name.split('.').pop() || '').toLowerCase();
  const url = URL.createObjectURL(rec.blob);
  previewUrl = url;
  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) {
    box.innerHTML = `<img src="${url}" alt="${L.esc(meta.name)} 미리보기">`;
  } else if (['mp4', 'webm', 'mov'].includes(ext)) {
    box.innerHTML = `<video src="${url}" controls preload="metadata"></video>`;
  } else if (ext === 'pdf') {
    box.innerHTML = `<object data="${url}" type="application/pdf"><div class="ph">이 브라우저는 PDF 미리보기를 지원하지 않습니다. "열기"를 눌러 확인하세요.</div></object>`;
  } else if (['txt', 'md', 'csv', 'json'].includes(ext)) {
    let text = '';
    try { text = (await rec.blob.text()).slice(0, 4000); } catch (e) { text = ''; }
    box.innerHTML = `<pre>${L.esc(text || '(내용 없음)')}</pre>`;
    URL.revokeObjectURL(url); previewUrl = '';
  } else {
    box.innerHTML = `<div class="ph">${L.icon('note', 24)}
      <div style="margin-top:7px"><b>${L.esc(meta.name)}</b><br>${L.fmtBytes(meta.size)} · 미리보기를 지원하지 않는 형식입니다.</div></div>`;
    URL.revokeObjectURL(url); previewUrl = '';
  }
}

/** 첨부 사용 가능 여부 · 사용 용량 안내 */
async function renderResNotice() {
  const box = $('#resNotice');
  if (!box) return;
  const ok = await L.Files.available();
  if (!ok) {
    box.innerHTML = `<div class="notice">${L.icon('bulb', 16)}
      <div><b>첨부 파일을 쓸 수 없는 환경입니다.</b><br>
      파일을 <b>file://</b> 로 직접 열면 브라우저가 저장소를 막습니다.
      로컬 서버로 열면 첨부와 미리보기가 동작하고, 지금은 링크·메모로 대신 기록할 수 있습니다.</div></div>`;
    return;
  }
  const used = await L.Files.totalSize();
  const n = resList().reduce((a, r) => a + ((r.files || []).length), 0);
  box.innerHTML = `<div class="notice plain">${L.icon('folder', 16)}
    <div>첨부 ${n}개 · ${L.fmtBytes(used)} 사용 중. 파일은 이 브라우저에만 저장되며 <b>JSON 백업에는 포함되지 않습니다</b>

}

let editResId = null;
let resFiles = [];        // 모달에서 편집 중인 첨부 목록
let resFilesRemoved = []; // 저장 시 실제로 지울 첨부 id

function renderResFiles() {

function weekOptions() {

function refreshResCourseSel(selected) {
  const tid = $('#rTerm').value;
  const opts = [['', '(과목 없음)']].concat(DB.courses.filter(c => c.termId === tid).map(c => [c.id, c.name]));

}
function saveRes() {
  const title = $('#rTitle').value.trim();
  if (!title) { L.toast('자료 제목을 입력하세요.'); $('#rTitle').focus(); return; }
  const url = $('#rUrl').value.trim();
  if (url && !/^(https?:\/\/|file:\/\/|\/|[a-zA-Z]:\\)/.test(url)) {
    L.toast('링크는 http:// 또는 https:// 로 시작해야 합니다.'); $('#rUrl').focus(); return;
  }
  const data = {
    title, termId: $('#rTerm').value, courseId: $('#rCourse').value,
    kind: $('#rKind').value, week: $('#rWeek').value,
    tags: $('#rTags').value.split(',').map(v => v.trim()).filter(Boolean).slice(0, 12),
    url, memo: $('#rMemo').value.trim(),
    files: resFiles.slice(), updated: L.todayStr(),
  };
  if (editResId) {
    Object.assign(resList().find(x => x.id === editResId), data);
    resSel = editResId;
  } else {
    const r = normRes(Object.assign({ id: L.uid(), added: L.todayStr(), fav: false }, data));
    resList().push(r);
    resSel = r.id;
    resTerm = r.termId; resCourse = r.courseId || (r.courseId === '' ? '' : resCourse); resWeek = 'all';
  }
  const dead = resFilesRemoved.slice();
  resFilesRemoved = [];
  Promise.all(dead.map(fid => L.Files.del(fid).catch(() => {}))).then(() => renderResNotice());
  save(); closeModals(); renderAll(); L.toast('저장했습니다.');
}

/* 첨부 추가 (여러 개 지원) */
async function addResFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (!(await L.Files.available())) { L.toast('이 환경에서는 첨부를 쓸 수 없습니다.'); return; }
  const MAX = 30 * 1024 * 1024;
  for (const f of files) {
    if (f.size > MAX) { L.toast(`${f.name} 은 30MB를 넘어 건너뛰었습니다.`); continue; }
    try { resFiles.push(await L.Files.put(f)); }
    catch (e) { L.toast('첨부 저장에 실패했습니다.'); break; }
  }
  renderResFiles();
  if (!$('#rTitle').value.trim() && files[0]) $('#rTitle').value = files[0].name;
}

/** 첨부를 내려받는다 (blob → 임시 링크) */
async function downloadRes(r) {
  const meta = (r.files || [])[0];
  if (!meta) return;
  let rec = null;
  try { rec = await L.Files.get(meta.id); } catch (e) { rec = null; }
  if (!rec || !rec.blob) { L.toast('첨부 파일을 찾을 수 없습니다.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(rec.blob);
  a.download = meta.name || '자료';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* =========================================================
   모달: 학기 — 정규 학기와 계절학기를 여기서 추가 · 수정한다
   ========================================================= */
/** 학기 코드/이름으로 계절학기인지 알아본다 */
function seasonOf(t) {
  const txt = `${(t && t.label) || ''} ${(t && t.name) || ''}`;
  if (/-S\b|여름|하계/.test(txt)) return '여름 계절';
  if (/-W\b|겨울|동계/.test(txt)) return '겨울 계절';
  return '';
}
/** 시작일(없으면 코드) 기준으로 정렬한 학기 목록 */
function sortedTerms() {
  return DB.terms.slice().sort((a, b) =>
    (a.start || '9999').localeCompare(b.start || '9999') || (a.label || '').localeCompare(b.label || ''));
}

let editTermId = null;
const TERM_KIND_NAME = { '1': '1학기', '2': '2학기', S: '여름 계절학기', W: '겨울 계절학기' };

function termKindOf(t) {
  const m = /-([12SW])$/.exec((t && t.label) || '');
  if (m) return m[1];
  const se = seasonOf(t);
  if (se === '여름 계절') return 'S';
  if (se === '겨울 계절') return 'W';
  return 'etc';
}
/** 연도·구분을 고르면 코드와 이름을 자동으로 채워 준다 */
function syncTermFields() {
  const kind = $('#tmKind').value;
  const year = String(L.clamp(Math.round(Number($('#tmYear').value) || new Date().getFullYear()), 2000, 2100));
  const manual = kind === 'etc';
  $('#tmLabel').readOnly = !manual;
  if (!manual) {
    $('#tmLabel').value = `${year}-${kind}`;
    if (!$('#tmName').dataset.touched) $('#tmName').value = `${year} ${TERM_KIND_NAME[kind]}`;
  }
  $('#tmHint').textContent = ['S', 'W'].includes(kind)
    ? '계절학기는 보통 6학점까지 신청할 수 있습니다. 졸업 학점 계산에는 정규 학기와 똑같이 반영됩니다.'
    : '학기 코드는 과목·일정을 묶는 이름표입니다. 이미 쓰고 있는 코드와 겹치지 않게 지어 주세요.';
}

function openTerm(id) {
  editTermId = id || null;
  const t = id ? term(id) : null;
  $('#termModalTitle').textContent = t ? '학기 수정' : '학기 추가';
  $('#tmDelete').style.display = t ? '' : 'none';
  $('#tmName').dataset.touched = t ? '1' : '';

  if (t) {
    const y = /^(\d{4})/.exec(t.label || t.start || '');
    $('#tmYear').value = y ? y[1] : new Date().getFullYear();
    $('#tmKind').value = termKindOf(t);
    $('#tmLabel').value = t.label || '';
    $('#tmName').value = t.name || '';
    $('#tmStart').value = t.start || '';
    $('#tmEnd').value = t.end || '';
    $('#tmCurrent').checked = t.id === curTermId();
    $('#tmLabel').readOnly = false;
    $('#tmHint').textContent = '학기 코드를 바꿔도 이미 연결된 과목 · 일정은 그대로 따라옵니다.';
  } else {
    // 마지막 학기 다음으로 적당한 기본값을 넣어 준다
    const last = sortedTerms()[DB.terms.length - 1];
    const ly = last ? Number((/^(\d{4})/.exec(last.label || '') || [])[1]) || new Date().getFullYear() : new Date().getFullYear();
    const lk = last ? termKindOf(last) : '2';
    const next = { '1': ['S', ly], S: ['2', ly], '2': ['W', ly], W: ['1', ly + 1] }[lk] || ['1', ly];
    $('#tmYear').value = next[1];
    $('#tmKind').value = next[0];
    $('#tmName').value = '';
    $('#tmStart').value = '';
    $('#tmEnd').value = '';
    $('#tmCurrent').checked = false;
    syncTermFields();
  }
  $('#termModal').classList.add('open');
  setTimeout(() => $('#tmName').focus(), 30);
}

function saveTerm() {
  const label = $('#tmLabel').value.trim();
  const name = $('#tmName').value.trim();
  if (!label) { L.toast('학기 코드를 입력하세요.'); $('#tmLabel').focus(); return; }
  if (!name) { L.toast('학기 이름을 입력하세요.'); $('#tmName').focus(); return; }
  const start = $('#tmStart').value, end = $('#tmEnd').value;
  if (start && end && start > end) { L.toast('개강일이 종강일보다 늦습니다.'); $('#tmEnd').focus(); return; }
  if (DB.terms.some(t => t.id !== editTermId && (t.label || '') === label)) {
    L.toast('이미 같은 코드의 학기가 있습니다.'); $('#tmLabel').focus(); return;
  }

  let target;
  if (editTermId) {
    target = term(editTermId);
    Object.assign(target, { label, name, start, end });
  } else {
    let id = label, n = 2;
    while (DB.terms.some(t => t.id === id)) id = `${label}-${n++}`;
    target = { id, label, name, start, end };
    DB.terms.push(target);
  }
  if ($('#tmCurrent').checked) DB.meta.currentTerm = target.id;
  else if (DB.meta.currentTerm === target.id) DB.meta.currentTerm = '';
  degTerm = '';
  save(); closeModals(); renderAll();
  L.toast(editTermId ? '학기를 수정했습니다.' : '학기를 추가했습니다.');
}

function saveTask() {

    examMode: exam ? $('#tMode').value : 'online',

function goto(page) {
  L.navActive(page);
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  window.scrollTo({ top: 0 });
}

/* ================= 이벤트 바인딩 ================= */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (b) goto(b.dataset.page);
});

// 위임 클릭 핸들러
document.addEventListener('click', e => {
  const el = e.target;
  const closest = sel => el.closest(sel);

  if (closest('[data-add-task]')) return openTask(null);
  if (closest('[data-add-course]')) return openCourse(null);
  if (closest('[data-add-term]')) return openTerm(null);
  const et2 = closest('[data-edit-term]');
  if (et2) return openTerm(et2.dataset.editTerm);
  if (closest('[data-add-res]')) return openRes(null);
  if (closest('#rDrop')) { $('#rFileInput').click(); return; }
  if (closest('#pruneFiles')) {
    const used = resList().flatMap(r => (r.files || []).map(f => f.id))
      .concat(DB.tasks.flatMap(t => (t.files || []).map(f => f.id)));
    L.Files.prune(used).then(n => { L.toast(n ? `${n}개 파일을 정리했습니다.` : '정리할 파일이 없습니다.'); renderResNotice(); });
    return;
  }
  const df = closest('[data-del-file]');
  if (df) {
    const i = Number(df.dataset.delFile);
    const gone = resFiles.splice(i, 1)[0];
    if (gone) resFilesRemoved.push(gone.id);
    renderResFiles();
    return;
  }
  const of = closest('[data-open-file]');
  if (of) {
    L.Files.open(of.dataset.openFile).then(ok => { if (!ok) L.toast('파일을 찾을 수 없습니다. 백업 복원 후에는 첨부가 없을 수 있습니다.'); });
    return;
  }
  // ---- 자료실 ----
  const rc = closest('[data-res-course]');
  if (rc) { resCourse = rc.dataset.resCourse; resWeek = 'all'; resSel = ''; renderFiles(); return; }
  const rw = closest('[data-res-week]');
  if (rw) { resWeek = rw.dataset.resWeek; resSel = ''; renderFiles(); return; }
  const rf = closest('[data-res-fav]');
  if (rf) {
    const r = resList().find(x => x.id === rf.dataset.resFav);
    if (r) { r.fav = !r.fav; save(); renderFiles(); }
    return;
  }
  const rp = closest('[data-res-pick]');
  if (rp) { resSel = rp.dataset.resPick; renderFiles(); return; }
  const rta = closest('[data-res-tag-add]');
  if (rta) {
    const r = resList().find(x => x.id === rta.dataset.resTagAdd);
    const v = prompt('추가할 태그를 입력하세요. (쉼표로 여러 개)');
    if (!r || v === null) return;
    const add2 = v.split(',').map(t => t.trim()).filter(Boolean);
    if (!add2.length) return;
    r.tags = Array.from(new Set((r.tags || []).concat(add2))).slice(0, 12);
    r.updated = L.todayStr();
    save(); renderFiles(); return;
  }
  const rtd = closest('[data-res-tag-del]');
  if (rtd) {
    const i = rtd.dataset.resTagDel.indexOf('|');
    const rid = rtd.dataset.resTagDel.slice(0, i), tag = rtd.dataset.resTagDel.slice(i + 1);
    const r = resList().find(x => x.id === rid);
    if (r) { r.tags = (r.tags || []).filter(t => t !== tag); save(); renderFiles(); }
    return;
  }
  const ro = closest('[data-res-open]');
  if (ro) {
    const r = resList().find(x => x.id === ro.dataset.resOpen);
    if (!r) return;
    const f = (r.files || [])[0];
    if (f) {
      L.Files.open(f.id).then(ok => { if (!ok) L.toast('첨부 파일을 찾을 수 없습니다.'); });
    } else if (r.url) {
      window.open(r.url, '_blank', 'noopener');
    } else {
      L.toast('열 수 있는 첨부나 링크가 없습니다.');
    }
    return;
  }
  const rd = closest('[data-res-download]');
  if (rd) { downloadRes(resList().find(x => x.id === rd.dataset.resDownload)); return; }
  const rdel = closest('[data-res-del]');
  if (rdel) {
    const r = resList().find(x => x.id === rdel.dataset.resDel);
    if (!r) return;
    const nf = (r.files || []).length;
    if (!confirm(`"${r.title}" 자료를 삭제할까요?${nf ? `\n첨부 파일 ${nf}개도 함께 삭제됩니다.` : ''}`)) return;
    (r.files || []).forEach(f => L.Files.del(f.id).catch(() => {}));
    DB.resources = resList().filter(x => x.id !== r.id);
    if (resSel === r.id) resSel = '';
    save(); renderAll(); L.toast('자료를 삭제했습니다.');
    return;
  }

  const er = closest('[data-edit-res]');
  if (er) return openRes(er.dataset.editRes);
  if (closest('[data-close]')) return closeModals();

  // ---- 과제 · 시험 목록 + 상세 ----
  const tp = closest('[data-task-pick]');
  if (tp) { taskSel = tp.dataset.taskPick; renderSched(); return; }
  const tt = closest('[data-task-tab]');
  if (tt) { filters.tab = tt.dataset.taskTab; taskSel = ''; renderSched(); return; }
  const ts = closest('[data-task-step]');
  if (ts) {
    const list = filteredTasks();
    const i = list.findIndex(t => t.id === taskSel);
    const next = list[L.clamp(i + Number(ts.dataset.taskStep), 0, list.length - 1)];
    if (next) { taskSel = next.id; renderSched(); }
    return;
  }
  const tca = closest('[data-task-ck-add]');
  if (tca) {
    const t = DB.tasks.find(x => x.id === tca.dataset.taskCkAdd);
    const grp = tca.closest('.focus-group');
    const inp = grp && grp.querySelector('[data-ck-input]');
    const text = (inp && inp.value || '').trim();
    if (!t) return;
    if (!text) { L.toast('추가할 내용을 입력하세요.'); if (inp) inp.focus(); return; }
    normTask(t).checklist.push({ id: L.uid(), text, done: false, doneAt: '' });
    save(); renderSched();
    const box = document.querySelector('[data-ck-input]');
    if (box) box.focus();
    return;
  }
  const tcd = closest('[data-task-ck-del]');
  if (tcd) {
    const [tid, cid] = tcd.dataset.taskCkDel.split('|');
    const t = DB.tasks.find(x => x.id === tid);
    if (t) { t.checklist = (t.checklist || []).filter(i => i.id !== cid); save(); renderSched(); }
    return;
  }
  const tfa = closest('[data-task-file-add]');
  if (tfa) { taskFileTarget = tfa.dataset.taskFileAdd; $('#tFileInput').click(); return; }
  const tfd = closest('[data-task-file-del]');
  if (tfd) {
    const [tid, fid] = tfd.dataset.taskFileDel.split('|');
    const t = DB.tasks.find(x => x.id === tid);
    if (!t || !confirm('이 첨부 파일을 삭제할까요?')) return;
    t.files = (t.files || []).filter(f => f.id !== fid);
    L.Files.del(fid).catch(() => {});
    save(); renderSched(); L.toast('첨부를 삭제했습니다.');
    return;
  }
  const gr = closest('[data-goto-res]');
  if (gr) {
    const r = (DB.resources || []).find(x => x.id === gr.dataset.gotoRes);
    if (r) { resTerm = r.termId || ''; resCourse = r.courseId || ''; resSel = r.id; resWeek = 'all'; }
    goto('files'); renderFiles(); return;
  }

  const et = closest('[data-edit-task]');
  if (et) return openTask(et.dataset.editTask);

  const ec = closest('[data-edit-course]');
  if (ec) return openCourse(ec.dataset.editCourse);

  const g = closest('[data-goto]');
  if (g) return goto(g.dataset.goto);

  const lp = closest('[data-lec-paste]');
  if (lp) return openPaste(lp.dataset.lecPaste);

  const lt = closest('[data-lec-toggle]');
  if (lt) {
    const id = lt.dataset.lecToggle;
    if (lecOpen.has(id)) lecOpen.delete(id); else lecOpen.add(id);
    renderCourses(); return;
  }
  const lm = closest('[data-lec-memo]');
  if (lm) {
    const k = lm.dataset.lecMemo;
    if (lecMemoOpen.has(k)) lecMemoOpen.delete(k); else lecMemoOpen.add(k);
    renderCourses(); return;
  }
  const lr = closest('[data-lec-resize]');
  if (lr) {
    const id = lr.dataset.lecResize, c = course(id);
    // 같은 과목 패널 안의 입력칸을 찾는다 (여러 과목이 동시에 펼쳐져 있어도 서로 간섭하지 않도록)
    const input = lr.closest('.accitem, .empty-state').querySelector(`[data-lec-count="${id}"]`);
    const n = L.clamp(Math.round(Number(input.value) || 0), 0, 200);
    const cur = courseLectures(c);
    if (n < cur.length) {
      const dropped = cur.slice(n);
      const willLoseWatched = dropped.some(i => i.watched);
      if (!confirm(`강의 수를 ${cur.length}개에서 ${n}개로 줄입니다. 뒤쪽 ${dropped.length}개가 삭제됩니다.${willLoseWatched ? '\n완료 표시된 강의도 포함되어 있습니다.' : ''}\n계속할까요?`)) return;
    }
    setCourseLectures(c, L.resizeLectures(cur, n));
    save(); renderAll(); return;
  }
  const lf = closest('[data-lec-fromlegacy]');
  if (lf) {
    const id = lf.dataset.lecFromlegacy, c = course(id);
    if (!confirm(`현재 진도(${c.watched || 0} / ${c.lectures || 0}강)를 기준으로 강의 목록을 만듭니다.\n앞에서부터 ${c.watched || 0}개가 완료 처리됩니다. 계속할까요?`)) return;
    setCourseLectures(c, L.lecturesFromLegacy(c.lectures, c.watched));
    save(); renderAll(); return;
  }
  const la = closest('[data-lec-add]');
  if (la) {
    const id = la.dataset.lecAdd, c = course(id);
    const items = courseLectures(c);
    items.push({ id: L.uid(), title: `${items.length + 1}강`, week: null, dueDate: '', watched: false, watchedAt: '', memo: '' });
    setCourseLectures(c, items);
    save(); renderAll(); return;
  }
  const ld = closest('[data-lec-del]');
  if (ld) {
    const [cid, lid] = ld.dataset.lecDel.split('|');
    const c = course(cid);
    if (!confirm('이 강의를 목록에서 삭제할까요?')) return;
    setCourseLectures(c, courseLectures(c).filter(i => i.id !== lid));
    lecMemoOpen.delete(`${cid}|${lid}`);
    save(); renderAll(); return;
  }
  const lall = closest('[data-lec-all]');
  if (lall) {
    const [id, flag] = lall.dataset.lecAll.split('|');
    if (!setAllWatched(id, flag === '1')) return;
    save(); renderAll(); return;
  }

  const ct = closest('[data-course-tasks]');
  if (ct) {
    const c = course(ct.dataset.courseTasks);
    filters.term = c.termId; filters.course = c.id; filters.tab = 'all'; filters.q = ''; taskSel = '';
    goto('sched'); renderSched(); return;
  }

  // 학기 카드에서 "+ 과목 추가" — 그 학기로 미리 맞춰 연다
  const cat = closest('[data-course-add-term]');
  if (cat) { viewTermId = cat.dataset.courseAddTerm; openCourse(null); return; }

  const tv = closest('[data-term-view]');
  if (tv) { viewTermId = tv.dataset.termView; goto('courses'); renderCourses(); return; }

  const dt = closest('[data-del-term]');
  if (dt) {
    const id = dt.dataset.delTerm;
    const n = termCourses(id).length + DB.tasks.filter(t => t.termId === id).length;
    if (!confirm(`이 학기를 삭제할까요?${n ? `\n연결된 과목·일정 ${n}건도 함께 삭제됩니다.` : ''}`)) return;
    DB.terms = DB.terms.filter(t => t.id !== id);
    DB.courses = DB.courses.filter(c => c.termId !== id);
    DB.tasks = DB.tasks.filter(t => t.termId !== id);
    if (DB.meta.currentTerm === id) DB.meta.currentTerm = (DB.terms[0] || {}).id || '';
    if (viewTermId === id) viewTermId = DB.meta.currentTerm;
    save(); renderAll(); return;
  }

  if (el.classList.contains('modal-bg')) closeModals();
});

// 체크박스 / 셀렉트 변경
document.addEventListener('change', e => {
  const el = e.target;

  if (el.dataset.toggle) {
    const t = DB.tasks.find(x => x.id === el.dataset.toggle);
    t.status = el.checked ? 'done' : 'todo';
    L.applyDone(t, el.checked);
    save(); renderAll(); return;
  }
  if (el.dataset.status) {
    const t = DB.tasks.find(x => x.id === el.dataset.status);
    t.status = el.value; L.applyDone(t, t.status === 'done');
    save(); renderAll(); return;
  }
  if (el.dataset.lecWatch) {
    const [cid, lid] = el.dataset.lecWatch.split('|');
    const c = course(cid);
    const items = courseLectures(c);
    const it = items.find(i => i.id === lid);
    if (it) { it.watched = el.checked; it.watchedAt = el.checked ? L.todayStr() : ''; setCourseLectures(c, items); }
    save(); renderAll(); return;
  }
  if (el.dataset.lecAllcheck) {
    if (!setAllWatched(el.dataset.lecAllcheck, el.checked)) { renderCourses(); return; }
    save(); renderAll(); return;
  }
  if (el.dataset.lecField) {
    const [cid, lid, field] = el.dataset.lecField.split('|');
    const c = course(cid);
    const items = courseLectures(c);
    const it = items.find(i => i.id === lid);
    if (it) {
      it[field] = field === 'week' ? (el.value === '' ? null : L.clamp(Number(el.value) || 0, 0, 60)) : el.value;
      c.lectureItems = items; // 개수·완료수는 변하지 않으므로 legacy 캐시는 그대로 둔다
    }
    save(); renderCourses(); return;
  }
  if (['pTarget', 'pMode', 'pStrip'].includes(el.id)) { renderPastePreview(); return; }
  if (el.id === 'courseTermSel') { viewTermId = el.value; renderCourses(); return; }
  if (el.id === 'resTermSel') { resTerm = el.value; resCourse = ''; resWeek = 'all'; resSel = ''; renderFiles(); return; }
  if (el.id === 'resSort') { resSort = el.value; renderFiles(); return; }
  if (el.dataset.resMemo) {
    const r = resList().find(x => x.id === el.dataset.resMemo);
    if (r && (r.memo || '') !== el.value) { r.memo = el.value; r.updated = L.todayStr(); save(); renderFiles(); }
    return;
  }
  if (el.id === 'rTerm') { refreshResCourseSel(''); return; }
  if (el.id === 'tTerm') { refreshTaskCourseSel(''); return; }

  if (el.id === 'fTerm') { filters.term = el.value; filters.course = ''; taskSel = ''; renderSched(); return; }
  if (el.id === 'fCourse') { filters.course = el.value; taskSel = ''; renderSched(); return; }
  if (el.id === 'taskSort') { filters.sort = el.value; renderSched(); return; }
  if (el.id === 'taskShowDone') { filters.showDone = el.checked; renderSched(); return; }
  if (el.dataset.taskCk) {
    const [tid, cid] = el.dataset.taskCk.split('|');
    const t = DB.tasks.find(x => x.id === tid);
    const it = t && (t.checklist || []).find(i => i.id === cid);
    if (it) { it.done = el.checked; it.doneAt = el.checked ? L.todayStr() : ''; save(); renderSched(); }
    return;
  }
  if (el.dataset.taskStatus) {
    const t = DB.tasks.find(x => x.id === el.dataset.taskStatus);
    if (t) {
      t.status = el.value; L.applyDone(t, t.status === 'done');
      if (t.status === 'done' && !isExamTask(t) && !t.submitted) { t.submitted = true; t.submittedAt = t.submittedAt || L.todayStr(); }
      save(); renderAll();
    }
    return;
  }
  if (el.dataset.taskSubmit) {
    const t = DB.tasks.find(x => x.id === el.dataset.taskSubmit);
    if (t) {
      t.submitted = el.checked;
      t.submittedAt = el.checked ? (t.submittedAt || L.todayStr()) : '';
      if (el.checked && t.status !== 'done') { t.status = 'done'; L.applyDone(t, true); }
      save(); renderAll();
    }
    return;
  }
  if (el.dataset.taskMemo) {
    const t = DB.tasks.find(x => x.id === el.dataset.taskMemo);
    if (t && (t.memo || '') !== el.value) { t.memo = el.value; t.memoAt = L.todayStr(); save(); renderSched(); }
    return;
  }
  if (el.id === 'tKind') { syncTaskModalKind(); return; }

  // 성적 · 졸업: 과목 성적 · 학점 직접 입력
  if (el.dataset.degGrade) {
    const c = course(el.dataset.degGrade);
    if (c) { c.grade = el.value; save(); renderAll(); L.toast(el.value ? `성적을 ${el.value} 로 저장했습니다.` : '성적을 지웠습니다.'); }
    return;
  }
  if (el.dataset.degCredit) {
    const c = course(el.dataset.degCredit);
    if (c) { c.credits = L.clamp(Math.round(Number(el.value) || 0), 0, 9); save(); renderAll(); }
    return;
  }
  if (el.id === 'degTermSel') { degTerm = el.value; renderDegree(); return; }
  if (el.id === 'tmKind' || el.id === 'tmYear') { syncTermFields(); return; }
  if (el.id === 'tmName') { el.dataset.touched = el.value.trim() ? '1' : ''; return; }
  if (el.id === 'degOnlyEmpty') { degOnlyEmpty = el.checked; renderDegree(); return; }

  // 설정: 학적 정보 (설정 화면과 성적·졸업 화면에서 함께 쓴다)
  const metaMap = {
    mName: 'name', mMajor: 'major', mTransfer: 'transferCredits',
    mGrad: 'gradCredits', mScale: 'gpaScale', mTarget: 'targetGpa',
    dTransfer: 'transferCredits', dGrad: 'gradCredits', dScale: 'gpaScale', dTarget: 'targetGpa',
  };
  if (metaMap[el.id]) {
    const k = metaMap[el.id];
    DB.meta[k] = ['transferCredits', 'gradCredits', 'targetGpa'].includes(k) ? Number(el.value) || 0 : el.value;
    save(); renderAll(); return;
  }

  // 설정: 학기 필드
  if (el.dataset.tf) {
    const t = term(el.dataset.tid);
    t[el.dataset.tf] = el.value;
    save(); renderDash(); renderDegree(); renderSched(); return;
  }
  if (el.dataset.cur && el.checked) {
    DB.meta.currentTerm = el.dataset.cur;
    viewTermId = el.dataset.cur;
    save(); renderAll(); return;
  }
});

/* ---- 엑셀 파일 올리기 ---- */
let pSheets = [];
function pMsg(kind, html) {
  const box = document.getElementById('pFileMsg');
  box.innerHTML = html ? `<div class="notice ${kind}" style="margin-bottom:10px"><div>${html}</div></div>` : '';
}
function applySheet(i) {
  const sh = pSheets[i];
  if (!sh) return;
  const t = document.getElementById('pText');
  t.value = L.rowsToText(sh.rows);
  renderPastePreview();
}
async function loadSpreadsheet(file) {
  if (!file) return;
  pMsg('', '');
  document.getElementById('pFileMsg').innerHTML =
    `<p class="dim" style="font-size:12.5px;margin-bottom:10px">${L.esc(file.name)} 읽는 중…</p>`;
  try {
    const res = await L.readSpreadsheet(file);
    pSheets = res.sheets;
    const wrap = document.getElementById('pSheetWrap');
    const sel = document.getElementById('pSheet');
    // 내용이 있는 시트를 먼저 고른다
    let pick = pSheets.findIndex(s => s.rows.length);
    if (pick < 0) pick = 0;
    sel.innerHTML = pSheets.map((s, i) =>
      `<option value="${i}"${i === pick ? ' selected' : ''}>${L.esc(s.name)} (${s.rows.length}줄)</option>`).join('');
    wrap.style.display = pSheets.length > 1 ? '' : 'none';
    applySheet(pick);
    const rows = pSheets[pick].rows.length;
    if (!rows) pMsg('warn', `"${L.esc(pSheets[pick].name)}" 시트가 비어 있습니다.${pSheets.length > 1 ? ' 다른 시트를 골라 보세요.' : ''}`);
    else pMsg('info', `${L.esc(file.name)} — ${L.esc(pSheets[pick].name)} 시트에서 ${rows}줄을 읽었습니다.`
      + (res.truncated ? ' 너무 길어 앞부분만 읽었습니다.' : '')
      + (pSheets.length > 1 ? ' 시트를 바꿀 수 있습니다.' : ''));
  } catch (e) {
    pSheets = [];
    document.getElementById('pSheetWrap').style.display = 'none';
    pMsg('danger', L.esc(e && e.message ? e.message : '파일을 읽을 수 없습니다.'));
  }
}
document.getElementById('pFileBtn').addEventListener('click', () => document.getElementById('pFile').click());
document.getElementById('pFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  loadSpreadsheet(f);
  e.target.value = '';                      // 같은 파일을 다시 골라도 동작하도록

document.getElementById('pSheet').addEventListener('change', e => {

  const sh = pSheets[Number(e.target.value)];
  if (sh) pMsg(sh.rows.length ? 'info' : 'warn',

});

(function () {
  const box = document.querySelector('#pasteModal .upbox');
  if (!box) return;

  box.addEventListener('dragover', e => { stop(e); box.classList.add('drag'); });
  box.addEventListener('dragleave', e => { stop(e); box.classList.remove('drag'); });

})();

/* ================================================================
   life — 인생관리 — 차곡차곡
   ================================================================ */
function bootLife() {
'use strict';
const L = window.LM, T = window.TAX;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const KEY = 'lm.life.v1';

const CERT_STATUS = { plan: '계획 중', studying: '공부 중', applied: '접수 완료', passed: '취득', failed: '불합격' };
const CERT_TONE = { plan: '', studying: 'accent', applied: 'warn', passed: 'ok', failed: 'danger' };
const WISH_STATUS = { someday: '언젠가', now: '지금 하는 중', done: '완료' };

function seed() { return L.seedLife(); }

let DB = L.Store.load(KEY, seed());
const save = () => L.Store.save(KEY, DB);

/* ================= 셸 (사이드바 + 헤더) ================= */
L.mountShell({
  app: 'life',
  page: (function () {
    const p = L.param('p');
    return ['dash', 'cert', 'certlec', 'wish', 'worklearn', 'fit', 'work', 'recur',
      'goals', 'memo', 'habit', 'stats', 'settings'].includes(p) ? p : 'dash';
  })(),
  index: searchIndex,
});

/** 검색 · 알림 색인 */
function searchIndex() {
  const out = [];
  for (const c of DB.certs) {
    const d = c.examDate || c.applyEnd || c.applyStart || '';
    out.push({ t: c.name, s: `자격증 · ${CERT_STATUS[c.status] || ''}`, cat: '자격증', tone: CERT_TONE[c.status] || '',
      date: d, done: c.status === 'passed',
      go: () => { certFilter = 'all'; certSel = c.id; goto('cert'); renderCert(); L.flashById('cert-' + c.id); } });
    if (c.status !== 'passed') {
      if (c.applyStart) out.push({ t: `${c.name} 원서접수 시작`, s: '자격증', cat: '접수', tone: 'warn', date: c.applyStart, go: () => goto('cert') });
      if (c.applyEnd) out.push({ t: `${c.name} 원서접수 마감`, s: '자격증', cat: '접수', tone: 'danger', date: c.applyEnd, go: () => goto('cert') });
      if (c.examDate) out.push({ t: `${c.name} 시험`, s: '자격증', cat: '시험', tone: 'purple', date: c.examDate, go: () => goto('cert') });
    }
    for (const it of certLectures(c)) {
      if (it.watched) continue;
      out.push({
        t: `${c.name} · ${it.title}`, s: it.dueDate ? `강의 · 권장일 ${L.fmtKo(it.dueDate)}` : '강의',
        cat: '강의', tone: 'accent', date: it.dueDate || '', done: false,
        go: () => {
          clSel = c.id; clTab = 'list'; goto('certlec'); renderCertLec();

          if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); L.flash(row); }
        },
      });
    }
  }
  for (const w of DB.wishes) {
    const work = wishScopeOf(w) === 'work';
    out.push({ t: w.title, s: `${work ? '실무 공부' : '배우고 싶은 것'} · ${WISH_STATUS[w.status] || ''}`,
      cat: work ? '실무 공부' : '배움', tone: 'purple',
      date: w.target, done: w.status === 'done',
      go: () => { wishSel[work ? 'work' : 'personal'] = w.id; goto(work ? 'worklearn' : 'wish'); renderWish(); renderWorkLearn(); L.flashById('wish-' + w.id); } });
  }
  for (const r of recurRules()) {
    out.push({ t: r.title, s: `반복 업무 · ${L.recurLabel(r)}`, cat: '반복 업무', tone: 'warn',
      go: () => { goto('recur'); if (!L.flashById(r.id)) openRecur(r.id); } });
  }
  for (const i of workItems(DB.work.year)) {
    out.push({ t: i.title, s: `${i.recur ? '반복 업무' : '세무'} · ${(T.CATS[i.cat] || {}).label || ''}`, cat: (T.CATS[i.cat] || {}).label || '세무',
      tone: (T.CATS[i.cat] || {}).tone || '', date: i.date, done: isWorkDone(i.id),
      go: () => { DB.work.year = Number(i.date.slice(0, 4)); workView = 'list'; DB.work.hidePast = false; save();
        goto('work'); renderWork(); L.flashById(i.id); } });
  }
  for (const g of (DB.goals || [])) {
    out.push({ t: g.title, s: `${g.month} 월간 목표`, cat: '목표', tone: 'accent', done: !!g.done,
      go: () => { goalMonth = g.month; goto('goals'); renderGoals(); if (!L.flashById(g.id)) openGoal(g.id); } });
  }
  for (const m of (DB.memos || [])) {
    out.push({ t: m.title || '(제목 없음)', s: `메모${m.tag ? ' · ' + m.tag : ''}`, cat: '메모', tone: '',
      go: () => { memoQ = ''; goto('memo'); renderMemo(); if (!L.flashById(m.id)) openMemo(m.id); } });
  }
  for (const hb of (DB.habits || [])) {
    out.push({ t: hb.name, s: `습관 · ${L.habitTargetLabel(hb)}`, cat: '습관', tone: 'ok',
      go: () => { goto('habit'); L.flashById(hb.id); } });
  }
  return out;
}

/* ================= 세무 기한 (연도별 캐시) ================= */
const taxCache = {};
function taxList(year) {
  if (!taxCache[year]) taxCache[year] = T.taxDeadlines(year);
  return taxCache[year];
}
/** 기본 기한 + 직접 추가한 업무 + 반복 업무 규칙에서 펼친 일정을 합친 목록 */
function workItems(year) {
  const custom = (DB.work.custom || [])
    .filter(c => c.date && c.date.startsWith(String(year)))
    .map(c => ({ id: c.id, date: c.date, legal: c.date, title: c.title, cat: c.cat || 'etc', note: c.memo || '', custom: true }));
  const recur = L.recurOccurrences(DB.recurring || [], year)
    .map(o => ({ id: o.id, date: o.date, legal: o.date, title: o.title, cat: o.cat, note: o.memo, recur: true, ruleId: o.ruleId }));
  return taxList(year).concat(custom, recur).sort((a, b) => a.date.localeCompare(b.date));
}
const isWorkDone = id => !!DB.work.done[id];

/* ================= 대시보드 ================= */
function renderDash() {
  const nm = DB.meta.name;
  const h = new Date().getHours();
  const part = h < 6 ? '늦은 밤이네요' : h < 12 ? '좋은 아침입니다' : h < 18 ? '좋은 오후입니다' : '좋은 저녁입니다';
  $('#greet').textContent = nm ? `${part}, ${nm}님` : part;
  $('#todayLine').textContent = `${L.fmtLong(L.todayStr())}${L.holidayName(L.todayStr()) ? ' · ' + L.holidayName(L.todayStr()) : ''}`;

  /* 스탯 */
  const nextExam = DB.certs.filter(c => c.examDate && !['passed', 'failed'].includes(c.status) && L.dday(c.examDate) >= 0)
    .sort((a, b) => a.examDate.localeCompare(b.examDate))[0];
  const y = new Date().getFullYear();
  const items = workItems(y);
  const nextWork = items.filter(i => !isWorkDone(i.id) && L.dday(i.date) >= 0)[0];
  const wk = weekStats();
  const passed = DB.certs.filter(c => c.status === 'passed').length;
