    add(d(year, 10, 25), '부가세 제2기 예정신고 (7~9월)', 'vat',
      '법인 예정신고 / 개인 일반과세자는 예정고지세액 납부');

    /* ── 법인세 (12월 결산 기준) ── */
    add(d(year, 3, 31), `법인세 정기신고 (${year - 1}사업연도)`, 'corp',
      '12월말 결산법인 — 재무제표·세무조정계산서·주식등변동상황명세서 함께 제출');
    add(d(year, 4, 30), `법인세 성실신고확인대상 신고 (${year - 1}사업연도)`, 'corp',
      '성실신고확인서 제출 대상 법인 — 1개월 연장');
    add(d(year, 4, 30), `법인지방소득세 신고 (${year - 1}사업연도)`, 'corp',
      '법인세 신고기한 종료일부터 1개월 이내 — 관할 지방자치단체');
    add(d(year, 8, 31), `법인세 중간예납 (${year}년 상반기)`, 'corp',
      '직전 사업연도 산출세액 1/2 또는 상반기 가결산 중 선택');

    /* ── 종합소득세 ── */
    add(d(year, 5, 31), `종합소득세 확정신고 (${year - 1}년 귀속)`, 'income',
      '개인사업자·프리랜서·금융소득 2천만원 초과자 등');
    add(d(year, 5, 31), `개인지방소득세 신고 (${year - 1}년 귀속)`, 'income',
      '종합소득세와 동일 기한 — 위택스 또는 홈택스 원클릭');
    add(d(year, 6, 30), `종합소득세 성실신고확인대상 신고 (${year - 1}년 귀속)`, 'income',
      '성실신고확인서 제출 대상 개인사업자 — 1개월 연장');
    add(d(year, 11, 30), `종합소득세 중간예납 (${year}년)`, 'income',
      '고지 납부 원칙 / 상반기 실적 급감 시 추계액 신고 가능');

    /* ── 지급명세서 ── */
    add(eom(year, 2),
      `이자·배당·연금·기타소득 지급명세서 (${year - 1}년 귀속)`, 'report',
      '지급일이 속하는 연도의 다음 연도 2월 말일');
    add(d(year, 3, 10), `근로·사업·퇴직소득 지급명세서 (${year - 1}년 귀속)`, 'report',
      '연말정산 결과 반영 — 3월 10일까지 제출');
    add(d(year, 3, 10), `연말정산 환급·추가납부 정산 (${year - 1}년 귀속)`, 'report',
      '2월분 급여 지급 시 정산 → 3월 10일 원천세 신고에 반영');
    for (let m = 1; m <= 12; m++) {
      const prev = m === 1 ? `${year - 1}년 12월` : `${m - 1}월`;
      add(eom(year, m), `간이지급명세서·일용근로 지급명세서 (${prev} 지급분)`, 'report',
        '근로소득 간이지급명세서 매월 제출(2026년 지급분부터) + 거주자 사업소득 · 일용근로소득');
    }

    /* ── 4대보험 ── */
    add(d(year, 3, 10), `건강보험 보수총액신고 (${year - 1}년 귀속)`, 'insurance',
      '전년도 확정 보수총액 신고 → 4월 정산보험료 부과');
    add(d(year, 3, 15), `고용·산재보험 보수총액신고 (${year - 1}년 귀속)`, 'insurance',
      '근로복지공단 — 확정정산 및 당해연도 개산보험료');

    /* ── 기타 ── */
    add(d(year, 2, 10), `사업장현황신고 (${year - 1}년 귀속)`, 'etc',
      '면세사업자(병의원·학원·주택임대 등) — 수입금액 및 시설현황 신고');
    add(d(year, 6, 1), `근로·자녀장려금 정기신청 (${year - 1}년 귀속)`, 'etc',
      '5월 1일 ~ 5월 31일 신청 (기한 후 신청은 11월 30일까지, 10% 감액)');
    add(d(year, 12, 31), `${year}년 귀속 연말정산 자료 준비`, 'etc',
      '간소화 자료 일괄제공 신청 · 부양가족 동의 · 공제요건 사전점검');

    out.sort((a, b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title));
    return out;
  }

  /**
   * 사건일 기준 기한 계산기 — "그 달의 말일부터 n개월"
   *  gift    증여세: 증여일이 속하는 달의 말일부터 3개월
   *  inherit 상속세: 상속개시일이 속하는 달의 말일부터 6개월
   *  vatClose 폐업 부가세: 폐업일이 속하는 달의 말일부터 25일
   */
  function eventBasedDue(kind, eventDate) {
    const dt = L.parse(eventDate);
    if (!dt) return null;
    const y = dt.getFullYear(), m = dt.getMonth();      // m: 0-based
    const monthsAfter = n => L.ymd(new Date(y, m + 1 + n, 0));  // 말일 + n개월의 말일
    if (kind === 'gift') return L.nextBusinessDay(monthsAfter(3));
    if (kind === 'inherit') return L.nextBusinessDay(monthsAfter(6));
    if (kind === 'vatClose') return L.nextBusinessDay(L.addDays(monthsAfter(0), 25));
    return null;
  }

  global.TAX = { CATS, taxDeadlines, eventBasedDue };
})(window);

<script>
/* ================================================================
   hub — 차곡차곡 — 통합 관리 허브
   ================================================================ */
function bootHub() {
'use strict';
const L = window.LM, T = window.TAX;
const $ = s => document.querySelector(s);

/* ================= 데이터 ================= */
let univ = L.Store.load(L.UNIV_KEY, L.seedUniv());
let life = L.Store.load(L.LIFE_KEY, L.seedLife());
const saveLife = () => L.Store.save(L.LIFE_KEY, life);

const today = L.todayStr();

function courseLecturesOf(c) { return Array.isArray(c.lectureItems) ? c.lectureItems : []; }
function certLecturesOf(c) { return (c.course && Array.isArray(c.course.lectures)) ? c.course.lectures : []; }
function univAllLectureItems() { return (univ.courses || []).flatMap(courseLecturesOf); }
function certAllLectureItems() { return (life.certs || []).filter(c => !['passed', 'failed'].includes(c.status)).flatMap(certLecturesOf); }

/* ================= 일정 수집 (통합 일정 · 통계 화면과 같은 기준을 store.js에서 공유) ================= */
let EV = [], notDone = [], overdueList = [], todayList = [], upcomingList = [], busyDays = [];

function rebuild() {
  EV = L.buildEvents(univ, life, T);
  ({ notDone, overdueList, todayList, upcomingList, busyDays } = L.splitEvents(EV, today));
}
function nextOf(src) { return L.nextOfSrc(src, notDone, overdueList); }
function todayHabits() {
  if (!life.habitLog) life.habitLog = {};
  if (!Array.isArray(life.habitLog[today])) life.habitLog[today] = [];
  return life.habitLog[today];
}

/* ================= 인사 — 오늘 상황을 문장으로 ================= */
function todayCounts() {
  const tomorrow = L.addDays(today, 1);
  const habitsDue = (life.habits || []).filter(h => L.habitDue(h, today));
  const habitDone = habitsDue.filter(h => todayHabits().includes(h.id)).length;
  const evDoneToday = EV.filter(e => e.date === today && e.done).length;
  return {
    left: todayList.length + (habitsDue.length - habitDone),
    done: evDoneToday + habitDone,
    get total() { return this.left + this.done; },
    tomorrow: EV.filter(e => e.date === tomorrow && !e.done).length,
  };
}
function greetingLine(c) {
  const h = new Date().getHours();
  if (h < 6) return c.tomorrow ? `내일 마감 ${c.tomorrow}건이 있어요` : '내일은 여유가 있어요';
  if (h < 12) return c.total ? `오늘 할 일 ${c.total}가지가 있어요` : '오늘은 예정된 일이 없어요';
  if (h < 18) {
    if (!c.total) return '오늘은 예정된 일이 없어요';
    if (!c.left) return '오늘 할 일을 모두 마쳤어요';
    if (!c.done) return `오늘 할 일 ${c.left}가지가 남았어요`;
    if (c.done * 2 >= c.total) return '오늘 할 일 절반을 마쳤어요';
    return `오늘 ${c.left}가지가 남았어요`;
  }
  if (c.done && !c.left) return `오늘 ${c.done}가지를 끝냈어요`;
  if (c.done) return `오늘 ${c.done}가지를 끝냈어요`;
  if (c.left) return `아직 ${c.left}가지가 남았어요`;
  return '오늘 하루 수고했어요';
}
function renderGreeting() {
  $('#hi').innerHTML = `${L.esc(greetingLine(todayCounts()))} ${L.icon('heart', 22)}`;
  const hol = L.holidayName(today);
  const nextTax = nextOf('세무'), nextUniv = nextOf('방통대');
  let tail;
  if (nextTax) { const d = L.dday(nextTax.date); tail = d < 0 ? `신고기한이 ${-d}일 지났어요` : d === 0 ? '오늘이 신고기한이에요' : `다음 신고기한까지 ${d}일`; }
  else if (nextUniv) { const d = L.dday(nextUniv.date); tail = d < 0 ? `학사 일정이 ${-d}일 지났어요` : d === 0 ? '오늘이 마감이에요' : `다음 학사 일정까지 ${d}일`; }
  else tail = '예정된 일정이 없어요';
  $('#dateLine').textContent = `${L.fmtLong(today)}${hol ? ' · ' + hol : L.isOffDay(today) ? ' · 휴일' : ''} · ${tail}`;
}

/* ================= 계산 ================= */
const GTBL = { 'A+': 4.5, 'A': 4, 'A-': 3.7, 'B+': 3.5, 'B': 3, 'B-': 2.7, 'C+': 2.5, 'C': 2, 'C-': 1.7, 'D+': 1.5, 'D': 1, 'F': 0 };
function gradeInfo() {
  if (!univ || !univ.meta) return null;
  const scale = String(univ.meta.gpaScale || '4.5');
  const tbl = scale === '4' ? { 'A': 4, 'B': 3, 'C': 2, 'D': 1, 'F': 0 } : GTBL;
  const got = (univ.courses || []).reduce((a, c) => a + (c.grade && c.grade !== 'F' ? (Number(c.credits) || 0) : 0), 0);
  const total = (Number(univ.meta.transferCredits) || 0) + got;
  const need = Number(univ.meta.gradCredits) || 0;
  let pts = 0, cr = 0;
  for (const c of (univ.courses || [])) if (c.grade in tbl) { pts += tbl[c.grade] * (Number(c.credits) || 0); cr += Number(c.credits) || 0; }
  const gpa = cr ? Math.round((pts / cr) * 100) / 100 : null;
  return { total, need, pct: L.pct(total, need), gpa };
}
function fitInfo() {
  const wr = L.weekRange();
  const logs = ((life.fitness && life.fitness.logs) || []).filter(l => l.date >= wr.start && l.date <= wr.end);
  const goal = Number(life.meta && life.meta.weeklyGoal) || 3;
  const min = logs.reduce((a, l) => a + (Number(l.minutes) || 0), 0);
  return { n: logs.length, goal, min, pct: L.pct(logs.length, goal) };
}
function curTerm() {
  if (!univ) return null;
  const id = (univ.meta && univ.meta.currentTerm) || ((univ.terms || [])[0] || {}).id;
  return (univ.terms || []).find(t => t.id === id) || null;
}

/* ================= 핵심 현황 (4개) ================= */
function statCard(o) {
  const tone = o.tone || '';
  return `<a class="stat ${tone}" href="${o.href}">
    <div class="txt">
      <div class="label">${o.label}</div>
      <div class="value">${o.value}</div>
      <div class="foot">${o.foot || '&nbsp;'}</div>

/* ================================================================
   sched — 통합 일정 — 차곡차곡
   ================================================================ */
function bootSched() {
'use strict';
const L = window.LM, T = window.TAX;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ================= 데이터 ================= */
let univ = L.Store.load(L.UNIV_KEY, L.seedUniv());
let life = L.Store.load(L.LIFE_KEY, L.seedLife());
const saveUniv = () => L.Store.save(L.UNIV_KEY, univ);
const saveLife = () => L.Store.save(L.LIFE_KEY, life);
const today = L.todayStr();

if (!Array.isArray(life.events)) life.events = [];
if (!life.eventMeta || typeof life.eventMeta !== 'object') life.eventMeta = {};

/* ================= 보기 상태 ================= */
const GROUPS = [
  { key: 'lecture', label: '대학 강의', ico: 'book' },
  { key: 'task', label: '과제 · 시험', ico: 'note' },
  { key: 'cert', label: '자격증', ico: 'cert' },
  { key: 'life', label: '개인 일정', ico: 'heart' },
  { key: 'habit', label: '습관 · 건강', ico: 'check' },
  { key: 'work', label: '업무', ico: 'tax' },
];
const GROUP_LABEL = Object.fromEntries(GROUPS.map(g => [g.key, g.label]));

let view = 'month';
let cursor = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
let sel = today;
let evSel = '';
const filters = { group: 'all', owner: 'all', status: 'all', pri: 'all' };
const STATUS_LABEL = { open: '미완료', done: '완료', overdue: '지연' };
const collapsed = {};
let showEmptyGroups = false;     // 0건 분류는 기본으로 감춘다

/* ================= 일정 모으기 ================= */
function courseLecturesOf(c) { return Array.isArray(c.lectureItems) ? c.lectureItems : []; }
function certLecturesOf(c) { return (c.course && Array.isArray(c.course.lectures)) ? c.course.lectures : []; }
const courseOf = id => (univ.courses || []).find(c => c.id === id) || null;

function metaOf(key) { return (life.eventMeta && life.eventMeta[key]) || {}; }
function setMeta(key, patch) {
  if (!life.eventMeta) life.eventMeta = {};
  life.eventMeta[key] = Object.assign({}, life.eventMeta[key], patch);
  saveLife();
}

/** L.buildEvents 의 src → 이 화면의 그룹 */
function groupOfBase(e) {
  if (e.kind === 'univtask') return 'task';
  if (e.src === '방통대') return 'task';
  if (e.src === '자격증') return 'cert';
  if (e.src === '세무' || e.src === '업무') return 'work';
  return 'life';                       // 개인 일정 · 배움 목표
}
function ownerOfBase(e) {
  if (e.kind === 'univtask') return e.s || '방통대';
  if (e.kind === 'lifeevent') return e.cat || '개인 일정';
  if (e.src === '자격증') {
    const hit = (life.certs || []).find(c => c.name && (e.t || '').startsWith(c.name));
    return hit ? hit.name : '자격증';
  }
  return e.s || e.src || '기타';
}

/* 완료 표시를 실제로 저장할 수 있는 일정 종류 (그 밖은 안내용이라 체크박스를 두지 않는다) */
const TOGGLEABLE = ['univtask', 'workitem', 'lifeevent', 'univlec', 'certlec', 'habit'];

/** 화면에서 쓰는 통일된 일정 객체 */
function mkEvent(o) {
  const key = o.key;
  const m = metaOf(key);
  return Object.assign({
    time: '', done: false, toggle: '', href: '', memo: '', priority: 'normal', remind: '', sub: '',
    baseId: '', repeat: 'none',
  }, o, {
    priority: o.priority || m.priority || 'normal',
    memo: o.memo !== undefined && o.memo !== '' ? o.memo : (m.memo || ''),
    remind: (o.remind !== undefined && o.remind !== '') ? o.remind : (m.remind || ''),
  });
}

/** 기간 [from, to] 에 보이는 모든 일정 (opt.noHabit 이면 매일 반복되는 습관은 뺀다) */
function collect(from, to, opt) {
  const out = [];
  const inRange = d => d && d >= from && d <= to;

  const years = [];
  for (let y = Number(from.slice(0, 4)); y <= Number(to.slice(0, 4)); y++) years.push(y);
  for (const e of L.buildEvents(univ, life, T, { years })) {
    if (!inRange(e.date)) continue;
    const g = groupOfBase(e);
    const key = L.eventKey(e);
    let pri = '', memo = '', time = '';
    if (e.kind === 'univtask') {
      const t = (univ.tasks || []).find(x => x.id === e.id);
      if (t) { pri = L.priorityOf(t.priority); memo = t.memo || ''; time = t.examTime || ''; }
    } else if (e.kind === 'lifeevent') {
      const ev = (life.events || []).find(x => x.id === (e.baseId || e.id));
      if (ev) { pri = L.priorityOf(ev.priority); memo = ev.memo || ''; time = ev.time || ''; }
    }
    out.push(mkEvent({
      key, date: e.date, title: e.t, group: g, owner: ownerOfBase(e), ico: e.ico || 'cal',
      cat: e.cat, done: !!e.done, toggle: TOGGLEABLE.includes(e.kind) ? e.kind : '',
      refId: e.id, baseId: e.baseId || e.id,
      repeat: e.repeat || 'none', href: e.href,
      priority: pri, memo, time, remind: e.remind || '',
    }));
  }

  /* 대학 강의 (수강 체크리스트) */
  for (const c of (univ.courses || [])) {
    for (const it of courseLecturesOf(c)) {
      if (!inRange(it.dueDate)) continue;
      out.push(mkEvent({
        key: `univlec:${c.id}:${it.id}`, date: it.dueDate, title: `${c.name} 강의 · ${it.title}`,
        group: 'lecture', owner: c.name, ico: 'book', cat: '강의',
        done: !!it.watched, toggle: 'univlec', refId: `${c.id}|${it.id}`,
        href: 'index.html?app=univ&p=courses', memo: it.memo || '',
      }));
    }
  }
  /* 자격증 강의 */
  for (const c of (life.certs || [])) {
    if (['passed', 'failed'].includes(c.status)) continue;
    for (const it of certLecturesOf(c)) {
      if (!inRange(it.dueDate)) continue;
      out.push(mkEvent({
        key: `certlec:${c.id}:${it.id}`, date: it.dueDate, title: `${c.name} 강의 · ${it.title}`,
        group: 'cert', owner: c.name, ico: 'book', cat: '자격증 강의',
        done: !!it.watched, toggle: 'certlec', refId: `${c.id}|${it.id}`,
        href: `index.html?app=life&p=certlec&focus=${c.id}`, memo: it.memo || '',
      }));
    }
  }
  /* 습관 — 해야 하는 날에만 (지난 날짜는 기록이 있는 날만) */
  for (const h of ((opt && opt.noHabit) ? [] : (life.habits || []))) {
    for (let d = from; d <= to; d = L.addDays(d, 1)) {
      if (!L.habitDue(h, d)) continue;
      const doneToday = Array.isArray(life.habitLog[d]) && life.habitLog[d].includes(h.id);
      // 오래 지난 날의 미완료 습관은 쌓아 두지 않는다 (최근 2주는 체크를 되돌릴 수 있게 남긴다)
      if (d < L.addDays(today, -14) && !doneToday) continue;
      out.push(mkEvent({
        key: `habit:${h.id}:${d}`, date: d, title: h.name, group: 'habit', owner: '습관',
        sub: L.habitTargetLabel(h), ico: h.icon || 'check', cat: '', done: doneToday,
        toggle: 'habit', refId: `${h.id}|${d}`, href: 'index.html?app=life&p=habit',
      }));
    }
  }
  /* 운동 기록 */
  for (const w of (((life.fitness || {}).logs) || [])) {
    if (!inRange(w.date)) continue;
    out.push(mkEvent({
      key: `workout:${w.id}`, date: w.date, title: `${w.type || '운동'}${w.min ? ` ${w.min}분` : ''}`,
      group: 'habit', owner: '운동', ico: 'dumb', cat: '운동 기록',
      done: true, toggle: '', refId: w.id, href: 'index.html?app=life&p=fit', memo: w.memo || '',
    }));
  }

  out.sort((a, b) => a.date.localeCompare(b.date)
    || (a.time || '99:99').localeCompare(b.time || '99:99')
    || GROUPS.findIndex(g => g.key === a.group) - GROUPS.findIndex(g => g.key === b.group)
    || a.title.localeCompare(b.title));
  return out;
}

/* ================= 필터 ================= */
function passFilter(e) {
  if (filters.group !== 'all' && e.group !== filters.group) return false;
  if (filters.owner !== 'all' && e.owner !== filters.owner) return false;
  if (filters.pri !== 'all' && (e.priority || 'normal') !== filters.pri) return false;
  if (filters.status === 'open' && e.done) return false;
  if (filters.status === 'done' && !e.done) return false;
  if (filters.status === 'overdue' && !(e.toggle && !e.done && e.date < today)) return false;
  return true;
}

/* ================= 기간 계산 ================= */
function rangeOf() {
  if (view === 'day') return { from: sel, to: sel };
  if (view === 'week') {
    const r = L.weekRange(sel);
    return { from: r.start, to: r.end };
  }
  const first = new Date(cursor.y, cursor.m, 1);
  const offset = (first.getDay() + 6) % 7;                 // 월요일 시작
  const start = new Date(cursor.y, cursor.m, 1 - offset);
  const end = new Date(start); end.setDate(start.getDate() + 41);
  return { from: L.ymd(start), to: L.ymd(end) };
}

/* ================= 렌더 ================= */
let EV = [], EVall = [];

function render() {
  const { from, to } = rangeOf();
  EVall = collect(from, to);
  EV = EVall.filter(passFilter);

  // 월 보기에서만 달력을 남은 높이에 맞춘다 (주 · 일 보기는 길어질 수 있어 스크롤을 남긴다)
  document.body.classList.toggle('cal-month', view === 'month');
  // 휴대폰에서는 고른 일정의 상세가 아래에서 올라오는 시트로 열린다
  document.body.classList.toggle('ev-open', !!evSel);
  const scrim = $('#evScrim');
  if (scrim) scrim.hidden = !evSel;

  renderFilters();
  renderTitle();
  renderBanner();
  if (view === 'month') renderMonth();
  else if (view === 'week') renderWeek();
  else renderDay();
  renderLegend();
  renderDayPanel();
  renderDetail();
  $$('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  $('#jumpDate').value = sel;
}

function renderFilters() {
  const g = $('#fGroup');
  const gOpts = [['all', '모든 일정']].concat(GROUPS.map(x => [x.key, x.label]));
  if (g.dataset.built !== '1') {
    g.innerHTML = gOpts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
    g.dataset.built = '1';
  }
  g.value = filters.group;

  const owners = Array.from(new Set(EVall.map(e => e.owner))).sort((a, b) => a.localeCompare(b));
  const o = $('#fOwner');
  o.innerHTML = [`<option value="all">모든 출처</option>`]
    .concat(owners.map(v => `<option value="${L.esc(v)}">${L.esc(v)}</option>`)).join('');
  if (!owners.includes(filters.owner)) filters.owner = 'all';
  o.value = filters.owner;
  $('#fStatus').value = filters.status;
  $('#fPri').value = filters.pri;

  // 걸린 조건만 칩으로 보여준다 — 셀렉트를 펼치지 않아도 알 수 있게
  const chips = [];
  if (filters.group !== 'all') chips.push(['group', GROUP_LABEL[filters.group]]);
  if (filters.owner !== 'all') chips.push(['owner', filters.owner]);
  if (filters.status !== 'all') chips.push(['status', STATUS_LABEL[filters.status] || filters.status]);
  if (filters.pri !== 'all') chips.push(['pri', (L.PRIORITY[filters.pri] || {}).label || filters.pri]);
  $('#filterChips').innerHTML = chips.map(([k, t]) =>
    `<button type="button" class="chip on" data-filter-clear="${k}" title="이 조건 지우기">${L.esc(t)}<span class="x"> ✕</span></button>`).join('')
    + (chips.length > 1 ? '<button type="button" class="chip" data-filter-reset>모두 지우기</button>' : '');
  const ft = $('#filterToggle');
  if (ft) ft.textContent = chips.length ? `필터 ${chips.length}` : '필터';
}

function renderTitle() {
  if (view === 'month') $('#calTitle').textContent = `${cursor.y}년 ${cursor.m + 1}월`;
  else if (view === 'week') {
    const r = L.weekRange(sel);
    $('#calTitle').textContent = `${L.fmtKo(r.start)} ~ ${L.fmtKo(r.end)}`;
  } else $('#calTitle').textContent = L.fmtLong(sel);

  const open = EV.filter(e => e.toggle && !e.done);
  // 지연 건수는 바로 아래 배너가 말해 주므로 여기서는 겹쳐 쓰지 않는다
  $('#pageSub').textContent =
    `${view === 'month' ? '이번 달' : view === 'week' ? '이번 주' : '오늘'} 일정 ${EV.length}건 · 남은 일 ${open.length}건`;
}

/** 지연 알림 — 넓은 띠 대신 달력 바의 작은 칩. 누르면 가장 오래된 것으로 이동한다 */
function renderBanner() {
  const box = $('#overdueChip');
  const od = EV.filter(e => e.toggle && !e.done && e.date < today)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!od.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<button type="button" class="chip danger" data-ev-jump="${L.esc(od[0].key)}"
    title="가장 오래된 지연: ${L.esc(od[0].title)} (${L.ddayLabel(od[0].date)}) — 누르면 그 날짜로 이동합니다">
    ${L.icon('bell', 13)}지연 ${od.length}</button>`;
}

/** 달력 한 칸에 들어가는 일정 줄 */
function evLine(e) {
  const od = e.toggle && !e.done && e.date < today;
  const movable = canMove(e);
  return `<button type="button" class="evline ${e.done ? 'done' : ''} ${od ? 'od' : ''} ${movable ? 'movable' : ''}"
    data-ev="${L.esc(e.key)}" ${movable ? 'draggable="true"' : ''}
    title="${L.esc(e.title)}${e.time ? ' · ' + e.time : ''}${movable ? ' — 끌어서 날짜 변경' : ''}">
    ${L.icon(e.ico, 12)}<span>${L.esc(e.title)}</span></button>`;
}
/** 날짜를 옮길 수 있는 일정인가 (스스로 만들어지는 일정은 못 옮긴다) */
function canMove(e) {
  if (!e) return false;
  if (e.toggle === 'univtask' || e.toggle === 'univlec' || e.toggle === 'certlec') return true;
  if (e.toggle === 'lifeevent') return !e.repeat || e.repeat === 'none';
  if (e.toggle === 'workitem') return (life.work.custom || []).some(w => w.id === e.refId);
  return false;
}
/** 일정의 날짜를 바꾼다 */
function moveEvent(key, date) {
  const e = EVall.find(x => x.key === key);
  if (!e || !date || e.date === date) return;
  if (!canMove(e)) {
    L.toast(e.repeat && e.repeat !== 'none'
      ? '반복 일정은 원본을 수정해 날짜를 바꿔 주세요.'
      : '이 일정은 만들어진 규칙을 따르므로 날짜를 옮길 수 없습니다.');
    return;
  }
  if (e.toggle === 'univtask') {
    const t = (univ.tasks || []).find(x => x.id === e.refId);
    if (t) { t.due = date; saveUniv(); }
  } else if (e.toggle === 'lifeevent') {
    const ev = (life.events || []).find(x => x.id === e.baseId);
    if (ev) { ev.date = date; saveLife(); }
  } else if (e.toggle === 'workitem') {
    const w = (life.work.custom || []).find(x => x.id === e.refId);
    if (w) { w.date = date; saveLife(); }
  } else if (e.toggle === 'univlec') {
    const [cid, lid] = e.refId.split('|');
    const c = courseOf(cid);
    const it = c && courseLecturesOf(c).find(x => x.id === lid);
    if (it) { it.dueDate = date; saveUniv(); }
  } else if (e.toggle === 'certlec') {
    const [cid, lid] = e.refId.split('|');
    const c = (life.certs || []).find(x => x.id === cid);
    const it = c && certLecturesOf(c).find(x => x.id === lid);
    if (it) { it.dueDate = date; saveLife(); }
  }
  sel = date;
  evSel = '';
  render();
  L.refreshAlerts();
  L.toast(`${L.fmtKo(date)} 로 옮겼습니다.`);
}
/** 달력 한 칸에 몇 건까지 보여 줄지 (휴대폰은 아이콘만 나와 더 담긴다) */
/** 달력 한 칸에 넣을 줄 수 — 데스크톱은 칸 높이를 재서 정한다 (한 달이 한 화면에 들어오게) */
function calMax() {
  if (window.matchMedia('(max-width: 700px)').matches) return 5;   // 휴대폰은 제목 없이 아이콘만
  const fit = document.body.classList.contains('fitview') && window.matchMedia('(min-width: 1181px)').matches;
  if (!fit) return 3;
  const body = document.querySelector('.schedwrap > .card > .card-body');
  const h = body ? body.clientHeight : 0;
  if (!h) return 3;
  const legend = document.getElementById('calLegend');
  const rowH = (h - (legend ? legend.offsetHeight : 0) - 34) / 6;   // 34 = 요일 머리글
  return Math.max(1, Math.min(6, Math.floor((rowH - 24) / 18)));
}

/** 계산이 한 줄 어긋나도 잘리지 않게 — 칸을 넘어가는 줄은 감추고 "+N" 에 더한다 */
function trimCells() {
  if (window.matchMedia('(max-width: 700px)').matches) return;     // 휴대폰은 칸이 늘어난다
  for (const cell of $$('#calBody .cal .cell')) {
    const more = cell.querySelector('.more');
    if (!more) continue;
    let rest = Number(more.dataset.rest) || 0;
    const setMore = () => {
      more.hidden = !rest;
      more.textContent = rest ? `+${rest}` : '';
    };
    setMore();
    const limit = cell.getBoundingClientRect().bottom - 4;         // 4 = 칸 아래 여백
    const lines = Array.from(cell.querySelectorAll('.evline'));
    for (let i = lines.length - 1; i >= 0; i--) {
      const last = more.hidden ? lines[i] : more;
      if (last.getBoundingClientRect().bottom <= limit) break;
      lines[i].hidden = true;
      rest++;
      setMore();
    }
  }
}
/** 달력에서는 습관을 숨긴다 (매일 반복이라 화면을 덮는다 — 습관만 골라 보면 표시) */
function calEvents(date) {
  return EV.filter(e => e.date === date && (filters.group === 'habit' || e.group !== 'habit' || e.cat === '운동 기록'));
}

function renderMonth() {
  const cap = calMax();
  let html = ['일', '월', '화', '수', '목', '금', '토']
    .map((d, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('');
  // 일요일 시작으로 맞춘다
  const first = new Date(cursor.y, cursor.m, 1);
  const start = new Date(cursor.y, cursor.m, 1 - first.getDay());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const s = L.ymd(d);
    const out = d.getMonth() !== cursor.m;
    const list = calEvents(s);
    const hol = L.holidayName(s);
    html += `<div class="cell ${out ? 'out' : ''} ${s === today ? 'today' : ''} ${s === sel ? 'sel' : ''}" data-day="${s}">
      <div class="d ${d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : ''}">
        <b>${d.getDate()}</b>${hol ? `<span class="hol">${L.esc(hol)}</span>` : ''}</div>
      ${list.slice(0, cap).map(evLine).join('')}
      <div class="more" data-rest="${Math.max(0, list.length - cap)}" hidden></div>
    </div>`;
  }
  $('#calBody').innerHTML = `<div class="cal soft" id="calGrid" style="border-radius:0;border:0;border-bottom:1px solid var(--border)">${html}</div>`;
  trimCells();
}

function renderWeek() {
  const r = L.weekRange(sel);
  let html = '';
  for (let i = 0; i < 7; i++) {
    const s = L.addDays(r.start, i);
    const d = L.parse(s);
    const list = calEvents(s);
    const hol = L.holidayName(s);
    const wd = d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : '';
    html += `<div class="wrow ${s === sel ? 'sel' : ''} ${s === today ? 'today' : ''}" data-day="${s}">
      <div class="wd ${wd}"><b>${d.getDate()}</b><i>(${L.WD[d.getDay()]})</i></div>
      <div class="wev">
        ${hol ? `<span class="badge danger">${L.esc(hol)}</span>` : ''}
        ${list.length ? list.map(evLine).join('') : (hol ? '' : '<span class="dim">일정 없음</span>')}</div>
    </div>`;
  }
  $('#calBody').innerHTML = `<div class="weeklist">${html}</div>`;
}

function renderDay() {
  const list = EV.filter(e => e.date === sel);
  $('#calBody').innerHTML = `<div style="padding:16px">
    <div class="inline" style="margin-bottom:12px">
      <b style="font-size:15px">${L.fmtLong(sel)}</b>
      ${L.holidayName(sel) ? `<span class="badge danger">${L.esc(L.holidayName(sel))}</span>` : ''}
      <div class="spacer"></div><span class="badge">${list.length}건</span>
    </div>
    ${list.length ? `<div class="dayview">${GROUPS.filter(g => list.some(e => e.group === g.key)).map(g => `
      <div class="focus-group">
        <h4>${L.icon(g.ico, 15)}<span>${g.label}</span><span class="badge n">${list.filter(e => e.group === g.key).length}</span></h4>
        ${list.filter(e => e.group === g.key).map(e => `<div class="focus-row">
          ${e.toggle ? `<input type="checkbox" data-ev-toggle="${L.esc(e.key)}" ${e.done ? 'checked' : ''} aria-label="${L.esc(e.title)} 완료">`
            : '<span style="width:20px;flex:none"></span>'}
          <div class="grow"><div class="ttl">${L.esc(e.title)}</div>
            <div class="meta">${[e.sub || e.owner, e.time, e.cat].filter(Boolean).map(L.esc).join(' · ')}</div></div>
          <div class="act"><button class="btn sm ghost" data-ev="${L.esc(e.key)}">상세</button></div>
        </div>`).join('')}
      </div>`).join('')}</div>`
      : `<div class="empty-state" style="padding:36px 12px">
           <div class="big">${L.icon('cal', 26)}</div><p>이 날짜에 표시할 일정이 없습니다.</p></div>`}
  </div>`;
}

function renderLegend() {
  $('#calLegend').innerHTML = GROUPS.map(g =>
    `<span>${L.icon(g.ico, 14)}${g.label}</span>`).join('')
    + `<span class="dim">습관은 날짜별 목록에서 확인합니다</span>`;
}

/* ---- 선택한 날짜 패널 ---- */
function renderDayPanel() {
  const d = L.parse(sel);
  $('#dayTitle').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${L.WD[d.getDay()]})`;
  $('#dayTodayBadge').hidden = sel !== today;

  const list = EV.filter(e => e.date === sel);
  const box = $('#dayGroups');
  const groups = GROUPS.filter(g => filters.group === 'all' || filters.group === g.key)
    .map(g => ({ g, items: list.filter(e => e.group === g.key) }));
  const shown = showEmptyGroups ? groups : groups.filter(x => x.items.length);
  const hidden = groups.length - shown.length;
  const rows = shown.map(({ g, items }) => {
    const open = collapsed[g.key] === undefined ? items.length > 0 : collapsed[g.key] !== true;
    return `<div class="daygroup">
      <button type="button" class="gh" data-group-toggle="${g.key}" aria-expanded="${open}">
        ${L.icon('chevdown', 14).replace('class="ic"', 'class="ic cv"')}
        ${L.icon(g.ico, 14)}<span>${g.label}</span>
        <span class="n">${items.length || '-'}</span>
      </button>
      ${open ? (items.length ? items.map(dayRow).join('')
        : `<div class="dayempty">${L.icon('cal', 14)}<span>등록된 일정이 없습니다.</span></div>`) : ''}
    </div>`;
  }).join('');
  box.innerHTML = (rows || `<div class="dayempty" style="padding:20px 15px">
      ${L.icon('cal', 15)}<span>이 날짜에 표시할 일정이 없습니다.</span></div>`)
    + (hidden || showEmptyGroups ? `<div class="dayempty" style="padding:6px 15px 10px">
        <button type="button" class="btn ghost sm" data-show-empty>${showEmptyGroups
          ? '비어 있는 분류 접기' : `비어 있는 분류 ${hidden}개 보기`}</button></div>` : '');
}
function dayRow(e) {
  const pri = L.PRIORITY[e.priority] || L.PRIORITY.normal;
  const od = e.toggle && !e.done && e.date < today;
  return `<div class="dayrow ${e.done ? 'done' : ''} ${e.key === evSel ? 'on' : ''}">
    ${e.toggle ? `<input type="checkbox" data-ev-toggle="${L.esc(e.key)}" ${e.done ? 'checked' : ''} aria-label="${L.esc(e.title)} 완료 처리">`
      : `<span class="ic src">${L.icon(e.ico, 15)}</span>`}
    <div class="bd" data-ev="${L.esc(e.key)}" role="button" tabindex="0" ${canMove(e) ? 'draggable="true"' : ''}>
      <div class="t">${L.esc(e.title)}
        ${e.cat && e.cat !== (e.sub || e.owner) ? `<span class="badge">${L.esc(e.cat)}</span>` : ''}
        ${e.priority === 'high' ? `<span class="badge danger">중요</span>` : ''}
        ${e.remind ? L.icon('bell', 12) : ''}</div>
      <div class="s">${L.esc(e.sub || e.owner)}${od ? ` · <span style="color:var(--danger)">${L.ddayLabel(e.date)}</span>` : ''}</div>
    </div>
    <div class="tm">${e.time ? L.esc(e.time) : (e.toggle === 'univtask' || e.toggle === 'workitem' ? '마감' : '')}</div>
    ${e.toggle === 'lifeevent'
      ? `<button type="button" class="mn" data-ev-edit="${L.esc(e.baseId)}" title="일정 수정" aria-label="일정 수정">${L.icon('dots', 15)}</button>`
      : e.href ? `<a class="mn" href="${e.href}" title="원래 화면에서 열기" aria-label="원래 화면에서 열기">${L.icon('dots', 15)}</a>` : ''}
  </div>`;
}

/* ---- 선택 일정 상세 ---- */
function renderDetail() {
  const box = $('#evDetail');
  const e = EVall.find(x => x.key === evSel) || null;
  if (!e) { box.hidden = true; box.innerHTML = ''; return; }   // 고른 것이 없으면 자리를 비워 둔다
  box.hidden = false;
  const pri = L.PRIORITY[e.priority] || L.PRIORITY.normal;
  const od = e.toggle && !e.done && e.date < today;
  const editable = e.toggle !== 'habit' && e.cat !== '운동 기록';
  box.innerHTML = `
    <div class="card-head"><h3>선택 일정 상세</h3><div class="spacer"></div>
      ${e.toggle === 'lifeevent' ? `<button class="btn sm" data-ev-edit="${L.esc(e.baseId)}">${L.icon('edit', 14)} 수정</button>`
        : e.href ? `<a class="btn sm" href="${e.href}">${L.icon('edit', 14)} 수정</a>` : ''}
      <button class="iconbtn m-only" data-ev-close aria-label="상세 닫기">${L.icon('x', 18)}</button></div>
    <div class="card-body">
      <div class="inline" style="gap:7px;margin-bottom:10px">
        ${L.icon(e.ico, 16)}<b style="font-size:14.5px">${L.esc(e.title)}</b>
        ${e.cat ? `<span class="badge">${L.esc(e.cat)}</span>` : ''}
        ${e.priority === 'high' ? '<span class="badge danger">중요</span>' : ''}
      </div>
      <div class="dim" style="font-size:12px;margin-bottom:12px">${L.esc(e.owner)} · ${GROUP_LABEL[e.group]}</div>

      <dl class="kvlist">
        <dt>${e.toggle === 'univtask' || e.toggle === 'workitem' ? '마감일' : '날짜'}</dt>
        <dd>${L.fmtLong(e.date)}${e.time ? ` ${L.esc(e.time)}` : ''}
          <span class="badge mono ${od ? 'danger' : ''}" style="margin-left:5px">${e.done ? '완료' : L.ddayLabel(e.date)}</span></dd>
        <dt>상태</dt>
        <dd>${e.toggle
          ? `<label class="inline" style="gap:6px"><input type="checkbox" data-ev-toggle="${L.esc(e.key)}" ${e.done ? 'checked' : ''}>
             <span>${e.done ? '완료' : '진행 중'}</span></label>`
          : '<span class="dim">완료 표시가 없는 안내 일정입니다</span>'}</dd>
        <dt>우선순위</dt>
        <dd>${editable ? `<select data-ev-pri="${L.esc(e.key)}" style="width:auto">
            ${Object.entries(L.PRIORITY).map(([k, v]) => `<option value="${k}" ${e.priority === k ? 'selected' : ''}>${v.label}</option>`).join('')}
          </select>` : `<span class="badge ${pri.tone}">${pri.label}</span>`}</dd>
        <dt>알림</dt>
        <dd><select data-ev-remind="${L.esc(e.key)}" style="width:auto">
            <option value="" ${!e.remind ? 'selected' : ''}>알림 없음</option>
            ${['0', '1', '3', '7'].map(v => `<option value="${v}" ${e.remind === v ? 'selected' : ''}>${v === '0' ? '당일' : v + '일 전'}</option>`).join('')}
          </select></dd>
      </dl>

/* ================= 완료 처리 ================= */
function toggleEvent(key, checked) {
  const e = EVall.find(x => x.key === key);
  if (!e || !e.toggle) return;
  const id = e.refId;
  if (e.toggle === 'univtask') {
    const t = (univ.tasks || []).find(x => x.id === id);
    if (t) {
      t.status = checked ? 'done' : 'todo';
      L.applyDone(t, checked);
      if (checked && !['midterm', 'exam'].includes(t.kind)) { t.submitted = true; t.submittedAt = t.submittedAt || today; }
      saveUniv();
    }
  } else if (e.toggle === 'workitem') {
    if (!life.work.done) life.work.done = {};
    if (checked) life.work.done[id] = today; else delete life.work.done[id];
    saveLife();
  } else if (e.toggle === 'lifeevent') {
    const ev = (life.events || []).find(x => x.id === e.baseId);
    if (ev) { L.setLifeEventDone(ev, e.date, checked); saveLife(); }
  } else if (e.toggle === 'univlec') {
    const [cid, lid] = id.split('|');
    const c = courseOf(cid);
    const it = c && courseLecturesOf(c).find(x => x.id === lid);
    if (it) {
      it.watched = checked; it.watchedAt = checked ? today : '';
      const items = courseLecturesOf(c);
      c.lectures = items.length; c.watched = items.filter(x => x.watched).length;
      saveUniv();
    }
  } else if (e.toggle === 'certlec') {
    const [cid, lid] = id.split('|');
    const c = (life.certs || []).find(x => x.id === cid);
    const it = c && certLecturesOf(c).find(x => x.id === lid);
    if (it) {
      it.watched = checked; it.watchedAt = checked ? today : '';
      if (checked && !Number(it.progress)) it.progress = 100;
      saveLife();
    }
  } else if (e.toggle === 'habit') {
    const [hid, d] = id.split('|');
    if (!life.habitLog) life.habitLog = {};
    const arr = Array.isArray(life.habitLog[d]) ? life.habitLog[d] : (life.habitLog[d] = []);
    const i = arr.indexOf(hid);
    if (checked) { if (i < 0) arr.push(hid); } else if (i >= 0) arr.splice(i, 1);
    if (!arr.length) delete life.habitLog[d];
    saveLife();
  }
  render();
  L.refreshAlerts();
}

/** 알림 설정 저장 — 개인 일정은 원본에 두어 반복 일정 전체에 적용된다 */
function saveRemind(key, value) {
  const e = EVall.find(x => x.key === key);
  if (!e) return;
  if (e.toggle === 'lifeevent') {
    const ev = (life.events || []).find(x => x.id === e.baseId);
    if (ev) { ev.remind = value; saveLife(); return; }
  }
  setMeta(key, { remind: value });
}

/** 우선순위 · 메모 저장 (원본이 있는 일정은 원본에, 나머지는 일정 메모장에) */
function saveEventField(key, field, value) {
  const e = EVall.find(x => x.key === key);
  if (!e) return;
  if (e.toggle === 'univtask') {
    const t = (univ.tasks || []).find(x => x.id === e.refId);
    if (t) { t[field === 'priority' ? 'priority' : 'memo'] = value; saveUniv(); return; }
  }
  if (e.toggle === 'lifeevent') {
    const ev = (life.events || []).find(x => x.id === e.baseId);
    if (ev) { ev[field === 'priority' ? 'priority' : 'memo'] = value; saveLife(); return; }
  }
  setMeta(key, { [field]: value });
}

  const repeat = L.LIFE_EVENT_REPEAT[$('#eRepeat').value] ? $('#eRepeat').value : 'none';

    else if (!Array.isArray(target.doneDates)) target.doneDates = [];
  } else {

(function swipe() {
  const area = $('#calBody');
  if (!area) return;
  let x0 = 0, y0 = 0, t0 = 0;
  area.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { t0 = 0; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  area.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    t0 = 0;
    if (dt > 600 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    $(dx < 0 ? '#btnNext' : '#btnPrev').click();
  }, { passive: true });
})();

/* ================================================================
   progress — 통계 — 차곡차곡
   ================================================================ */
function bootProgress() {
'use strict';
const L = window.LM, T = window.TAX;
const $ = s => document.querySelector(s);

const univ = L.Store.load(L.UNIV_KEY, L.seedUniv());
const life = L.Store.load(L.LIFE_KEY, L.seedLife());
const today = L.todayStr();
const pad = n => String(n).padStart(2, '0');

/* ================= 상태 ================= */
const RANGES = [['week', '이번 주'], ['month', '이번 달'], ['term', '이번 학기'], ['year', '올해']];
const AREAS = [['all', '전체'], ['study', '학습'], ['life', '생활'], ['work', '업무']];
let rangeKey = 'week';
let area = 'study';
let custom = { start: '', end: '' };

(function fromUrl() {
  const a = L.param('tab'), r = L.param('range');
  if (AREAS.some(x => x[0] === a)) area = a;
  if (RANGES.some(x => x[0] === r)) rangeKey = r;
})();

/* ================= 기간 계산 ================= */
function curTerm() {
  const id = (univ.meta && univ.meta.currentTerm) || ((univ.terms || [])[0] || {}).id;
  return (univ.terms || []).find(t => t.id === id) || null;
}
function periodOf(key) {
  const y = Number(today.slice(0, 4)), m = Number(today.slice(5, 7));
  if (key === 'custom' && custom.start && custom.end) {
    return { start: custom.start, end: custom.end, label: '직접 지정한 기간' };
  }
  if (key === 'month') return { start: `${y}-${pad(m)}-01`, end: L.ymd(new Date(y, m, 0)), label: `${m}월` };
  if (key === 'year') return { start: `${y}-01-01`, end: `${y}-12-31`, label: `${y}년` };
  if (key === 'term') {
    const t = curTerm();
    if (t && t.start && t.end) return { start: t.start, end: t.end, label: t.name || t.label };
    return { start: `${y}-01-01`, end: `${y}-12-31`, label: '학기 정보 없음 · 올해' };
  }
  const wr = L.weekRange();
  return { start: wr.start, end: wr.end, label: '이번 주' };
}
/** 바로 앞의 같은 길이 기간 (지난 기간 대비 비교용) */
function prevPeriod(p) {
  const days = Math.round((L.parse(p.end) - L.parse(p.start)) / L.DAY) + 1;
  return { start: L.addDays(p.start, -days), end: L.addDays(p.start, -1), days };
}
const inRange = (d, p) => !!d && d >= p.start && d <= p.end;

/* ================= 원자료 ================= */
function courseLectures(c) { return Array.isArray(c.lectureItems) ? c.lectureItems : []; }
function certLectures(c) { return (c.course && Array.isArray(c.course.lectures)) ? c.course.lectures : []; }
const activeCerts = () => (life.certs || []).filter(c => !['passed', 'failed'].includes(c.status));
const enabledCerts = () => activeCerts().filter(c => c.course && c.course.enabled);

/* 완료 이벤트 — 되도록 "실제로 끝낸 날"을 쓴다.
   doneAt 이 없는 옛 과제·목표는 기한 날짜로 대신 집계하며, 그 개수를 따로 알려준다. */
function studyDone() {
  const out = [];
  for (const c of (univ.courses || [])) {
    for (const it of courseLectures(c)) {
      if (it.watched && it.watchedAt) out.push({ date: it.watchedAt, t: `${c.name} · ${it.title}`, kind: '대학 강의', exact: true });
    }
  }
  for (const c of activeCerts()) {
    for (const it of certLectures(c)) {
      if (it.watched && it.watchedAt) out.push({ date: it.watchedAt, t: `${c.name} · ${it.title}`, kind: '자격증 강의', exact: true });
    }
  }
  for (const t of (univ.tasks || [])) {
    if (t.status !== 'done') continue;
    out.push({ date: t.doneAt || t.due, t: t.title, kind: '과제 · 시험', exact: !!t.doneAt });
  }
  return out.filter(x => x.date);
}
function lifeDone() {
  const out = [];
  const log = life.habitLog || {};
  const byId = {};
  for (const h of (life.habits || [])) byId[h.id] = h.name;
  for (const d of Object.keys(log)) {
    for (const id of (log[d] || [])) out.push({ date: d, t: byId[id] || '습관', kind: '습관', exact: true });
  }
  for (const l of ((life.fitness && life.fitness.logs) || [])) {
    if (l.date) out.push({ date: l.date, t: l.type || '운동', kind: '운동', exact: true });
  }
  return out;
}
function workDone() {
  const out = [];
  const done = (life.work && life.work.done) || {};
  const titleOf = {};
  const y = Number(today.slice(0, 4));
  for (const yy of [y - 1, y, y + 1]) {
    for (const i of T.taxDeadlines(yy)) titleOf[i.id] = { t: i.title, cat: i.cat };
    for (const o of L.recurOccurrences(life.recurring || [], yy)) titleOf[o.id] = { t: o.title, cat: o.cat, recur: true };
  }
  for (const c of ((life.work && life.work.custom) || [])) titleOf[c.id] = { t: c.title, cat: c.cat || 'etc', custom: true };
  for (const id of Object.keys(done)) {
    const meta = titleOf[id] || { t: '업무', cat: 'etc' };
    out.push({ date: done[id], t: meta.t, kind: meta.recur ? '반복 업무' : '세금 · 신고', cat: meta.cat, exact: true });
  }
  return out.filter(x => x.date);
}

/* 기간 내 "대상" (마감이 그 기간에 있는 것) → 완료율의 분모 */
function studyTargets(p) {
  let total = 0, done = 0;
  for (const c of (univ.courses || [])) for (const it of courseLectures(c)) {
    if (!inRange(it.dueDate, p)) continue; total++; if (it.watched) done++;
  }
  for (const c of activeCerts()) for (const it of certLectures(c)) {
    if (!inRange(it.dueDate, p)) continue; total++; if (it.watched) done++;
  }
  for (const t of (univ.tasks || [])) {
    if (!inRange(t.due, p)) continue; total++; if (t.status === 'done') done++;
  }
  return { total, done };
}
function lifeTargets(p) {
  let total = 0, done = 0;
  const log = life.habitLog || {};
  for (let d = p.start; d <= p.end && d <= today; d = L.addDays(d, 1)) {
    for (const h of (life.habits || [])) {
      if (!L.habitDue(h, d)) continue;
      total++; if ((log[d] || []).includes(h.id)) done++;
    }
  }
  return { total, done };
}
function workTargets(p) {
  let total = 0, done = 0;
  const doneMap = (life.work && life.work.done) || {};
  const y0 = Number(p.start.slice(0, 4)), y1 = Number(p.end.slice(0, 4));
  for (let yy = y0; yy <= y1; yy++) {
    for (const i of T.taxDeadlines(yy)) { if (inRange(i.date, p)) { total++; if (doneMap[i.id]) done++; } }
    for (const o of L.recurOccurrences(life.recurring || [], yy)) { if (inRange(o.date, p)) { total++; if (doneMap[o.id]) done++; } }
  }
  for (const c of ((life.work && life.work.custom) || [])) {
    if (inRange(c.date, p)) { total++; if (doneMap[c.id]) done++; }
  }
  return { total, done };
}

/* 지연 (지금 기준) */
function studyLag() {
  const out = [];
  for (const c of (univ.courses || [])) {
    const items = courseLectures(c);
    const late = items.filter(i => !i.watched && i.dueDate && i.dueDate < today);
    if (late.length) out.push({ t: c.name, s: `${late[0].title}${late.length > 1 ? ` 외 ${late.length - 1}강` : ''}`, n: late.length, unit: '강', href: 'index.html?app=univ&p=courses' });
  }
  for (const c of activeCerts()) {
    const late = certLectures(c).filter(i => !i.watched && i.dueDate && i.dueDate < today);
    if (late.length) out.push({ t: c.name, s: `${late[0].title}${late.length > 1 ? ` 외 ${late.length - 1}강` : ''}`, n: late.length, unit: '강', href: 'index.html?app=life&p=certlec' });
  }
  for (const t of (univ.tasks || [])) {
    if (t.status === 'done' || !t.due || L.dday(t.due) >= 0) continue;
    out.push({ t: t.title, s: `기한 ${L.fmtKo(t.due)}`, n: -L.dday(t.due), unit: '일', href: 'index.html?app=univ&p=sched' });
  }
  return out.sort((a, b) => b.n - a.n);
}
function lifeLag() {
  const out = [];
  const log = life.habitLog || {};
  for (const h of (life.habits || [])) {
    const st = L.habitStats(h, log, 14, today);
    if (st.expected && st.pct < 60) out.push({ t: h.name, s: `최근 14일 ${st.hit} / ${st.expected}회`, n: 100 - st.pct, unit: '%p 부족', href: 'index.html?app=life&p=habit' });
  }
  const wr = L.weekRange();
  const logs = ((life.fitness && life.fitness.logs) || []).filter(l => l.date >= wr.start && l.date <= wr.end);
  const goal = Number(life.meta && life.meta.weeklyGoal) || 3;
  if (logs.length < goal) out.push({ t: '이번 주 운동', s: `${logs.length} / ${goal}회`, n: goal - logs.length, unit: '회', href: 'index.html?app=life&p=fit' });
  return out.sort((a, b) => b.n - a.n);
}
function workLag() {
  const doneMap = (life.work && life.work.done) || {};
  const out = [];
  const y = Number(today.slice(0, 4));
  const add = (id, title, date, cat, recur) => {
    if (doneMap[id] || !date) return;
    const n = L.dday(date);
    if (n === null || n >= 0 || n < -45) return;  // 스스로 계속 생기는 항목이라 최근 45일만 본다
    out.push({ t: title, s: `${recur ? '반복 업무' : (T.CATS[cat] || {}).label || '기타'} · 기한 ${L.fmtKo(date)}`, n: -n, unit: '일', href: recur ? 'index.html?app=life&p=recur' : 'index.html?app=life&p=work' });
  };
  for (const yy of [y - 1, y]) {
    for (const i of T.taxDeadlines(yy)) add(i.id, i.title, i.date, i.cat);
    for (const o of L.recurOccurrences(life.recurring || [], yy)) add(o.id, o.title, o.date, o.cat, true);
  }
  for (const c of ((life.work && life.work.custom) || [])) add(c.id, c.title, c.date, c.cat);
  return out.sort((a, b) => b.n - a.n);
}

/* ================= 요약 4칸 ================= */
function stripCell(tone, inner, k, v, unit, extra) {
  return `<div class="${tone || ''}">
    <span class="ico${inner ? ' plain' : ''}">${inner || ''}</span>
    <div><div class="k">${k}</div><div class="v">${v}<small>${unit || ''}</small>
      ${extra ? `<span class="delta ${extra.dir}">${extra.text}</span>` : ''}</div></div>
  </div>`;
}
function donut(pct, tone) {
  const R = 15, C = 2 * Math.PI * R;
  return `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="5"/>
    <circle cx="20" cy="20" r="${R}" fill="none" stroke="var(--${tone})" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90 20 20)"/>
  </svg>`;
}
function renderStrip(p) {
  const pv = prevPeriod(p);
  const pick = { study: studyDone, life: lifeDone, work: workDone };
  const events = area === 'all'
    ? [...studyDone(), ...lifeDone(), ...workDone()]
    : pick[area]();
  const nowN = events.filter(e => inRange(e.date, p)).length;
  const prevN = events.filter(e => inRange(e.date, pv)).length;

  const tg = area === 'all'
    ? [studyTargets(p), lifeTargets(p), workTargets(p)].reduce((a, b) => ({ total: a.total + b.total, done: a.done + b.done }), { total: 0, done: 0 })
    : ({ study: studyTargets, life: lifeTargets, work: workTargets })[area](p);
  const rate = L.pct(tg.done, tg.total);

  const lag = area === 'all' ? [...studyLag(), ...lifeLag(), ...workLag()]
    : ({ study: studyLag, life: lifeLag, work: workLag })[area]();

  const diff = nowN - prevN;
  const dpct = prevN ? Math.round((diff / prevN) * 100) : null;
  const extra = prevN || nowN
    ? { dir: diff > 0 ? 'up' : diff < 0 ? 'down' : '', text: dpct === null ? '(이전 기록 없음)' : `(${diff >= 0 ? '▲' : '▼'} ${Math.abs(dpct)}%)` }
    : null;

  $('#strip').innerHTML =
    stripCell('ok', L.icon('tick', 20), '완료', nowN, '건') +
    stripCell('', donut(rate, rate >= 80 ? 'ok' : rate >= 50 ? 'accent' : 'warn'), '완료율',
      tg.total ? rate : '—', tg.total ? '%' : '') +
    stripCell(lag.length ? 'danger' : 'ok', L.icon('clock', 20), '지연', lag.length, '건') +
    stripCell(diff >= 0 ? 'ok' : 'warn', L.icon('chart', 20), '지난 기간 대비',
      `${diff >= 0 ? '+' : ''}${diff}`, '건', extra);

  const inexact = events.filter(e => inRange(e.date, p) && !e.exact).length;
  $('#rangeNote').innerHTML = `${L.esc(p.label)} · ${L.fmtKo(p.start)} ~ ${L.fmtKo(p.end)}
    &nbsp;|&nbsp; 비교 기간 ${L.fmtKo(pv.start)} ~ ${L.fmtKo(pv.end)}
    ${tg.total ? '' : ' · 이 기간에 기한이 있는 항목이 없어 완료율은 계산하지 않았습니다'}
    ${inexact ? ` · 완료한 날이 기록되지 않은 ${inexact}건은 기한 날짜로 집계했습니다` : ''}`;
}

/* ================= 공통 조각 ================= */
function card(title, inner, link, badge) {
  return `<section class="card">
    <div class="card-head"><h3>${title}</h3><div class="spacer"></div>
      ${badge || ''}${link ? `<a class="btn ghost sm" href="${link}">전체 보기 ${L.icon('chev', 13)}</a>` : ''}</div>
    <div class="card-body">${inner}</div>
  </section>`;
}
function emptyMsg(msg, href, label) {

/** 날짜별 완료 건수 막대 그래프 (기간이 길면 주 단위로 묶는다) */
function trendChart(events, p, unit, valOf) {
  const val = valOf || (() => 1);
  const days = Math.round((L.parse(p.end) - L.parse(p.start)) / L.DAY) + 1;
  const buckets = [];
  if (days <= 31) {
    for (let d = p.start; d <= p.end; d = L.addDays(d, 1)) {
      const dt = L.parse(d);
      buckets.push({ key: d, label: `${dt.getMonth() + 1}/${dt.getDate()}`, sub: L.weekday(d), n: 0 });
    }
    const idx = {}; buckets.forEach((b, i) => { idx[b.key] = i; });
    for (const e of events) if (idx[e.date] !== undefined) buckets[idx[e.date]].n += val(e);
  } else {
    for (let d = p.start; d <= p.end; d = L.addDays(d, 7)) {
      const dt = L.parse(d);
      buckets.push({ key: d, end: L.addDays(d, 6), label: `${dt.getMonth() + 1}/${dt.getDate()}`, sub: '', n: 0 });
    }
    for (const e of events) {
      for (const b of buckets) if (e.date >= b.key && e.date <= b.end) { b.n += val(e); break; }
    }
  }
  const peak = buckets.reduce((a, b) => Math.max(a, b.n), 0);
  const max = peak || 1;                       // 막대 높이 계산용 (0으로 나누지 않도록)
  const every = Math.ceil(buckets.length / 12);
  const total = buckets.reduce((a, b) => a + b.n, 0);
  const elapsed = buckets.filter(b => b.key <= today).length || 1;
  return `<div class="barchart">
      ${buckets.map(b => `<div title="${b.label}${b.sub ? '(' + b.sub + ')' : ''}: ${b.n}${unit}">
        <div class="n">${b.n || ''}</div>
        <div class="b ${b.n ? '' : 'zero'}" style="height:${(b.n / max) * 100}%;min-height:${b.n ? 3 : 2}px"></div>
      </div>`).join('')}
    </div>
    <div class="barlabels">
      ${buckets.map((b, i) => `<div>${i % every === 0 ? b.label : ''}</div>`).join('')}
    </div>
    <div class="sumrow">
      <div><div class="k">기간 합계</div><div class="v">${total}${unit}</div></div>
      <div><div class="k">${days <= 31 ? '일평균' : '주평균'}</div><div class="v">${Math.round((total / elapsed) * 10) / 10}${unit}</div></div>
      <div><div class="k">가장 많은 ${days <= 31 ? '날' : '주'}</div><div class="v">${peak}${unit}</div></div>
    </div>`;
}

function courseProgressTable() {
  const cs = univ.courses || [];
  if (!cs.length) return emptyMsg('등록된 과목이 없습니다.', 'index.html?app=univ&p=courses', '과목 추가');
  const rows = cs.map(c => {
    const items = courseLectures(c);
    const st = items.length ? L.lectureStats(items) : null;
    const p = st ? st.pct : L.pct(Number(c.watched) || 0, Number(c.lectures) || 0);
    const wa = st ? st.watched : (Number(c.watched) || 0);
    const tt = st ? st.total : (Number(c.lectures) || 0);
    // 계획 대비 = 지금까지 권장일이 지난 강의 수와 실제 수강 수의 차이 (권장일이 없으면 계산 불가)
    const dated = items.filter(i => i.dueDate);
    let plan = null;
    if (dated.length) plan = wa - dated.filter(i => i.dueDate <= today).length;
    const tone = st && st.overdue ? 'danger' : p >= 100 ? 'ok' : 'accent';
    return `<tr>
      <td><b>${L.esc(c.name)}</b></td>
      <td style="width:44%"><div class="trow">
        <span class="n">${wa} / ${tt}강</span>
        <div class="bar ${tone}"><i style="width:${p}%"></i></div>
        <span class="n">${p}%</span></div></td>
      <td class="num">${plan === null
        ? '<span class="plan even" title="권장일이 없어 계산할 수 없습니다">—</span>'
        : `<span class="plan ${plan < 0 ? 'behind' : plan > 0 ? 'ahead' : 'even'}">${plan > 0 ? '+' : plan === 0 ? '±' : ''}${plan}강</span>`}</td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="tbl">
      <thead><tr><th>과목명</th><th>진행률</th><th class="num">계획 대비</th></tr></thead>

}
function certPaceCard() {
  const list = enabledCerts();
  if (!list.length) return emptyMsg('온라인 강의를 사용 중인 자격증이 없습니다.', 'index.html?app=life&p=certlec', '자격증 강의');
  return list.slice(0, 2).map(c => {
    const items = certLectures(c);
    const st = L.lectureStats(items);
    const cc = c.course;
    const pace = L.lecturePace(items, cc.targetEndDate);
    /* 누적 완료 vs 목표 선 그래프 — 수강 시작일부터 목표 완강일까지 */
    const s0 = cc.startDate || (items.filter(i => i.watchedAt).map(i => i.watchedAt).sort()[0]) || today;
    const e0 = cc.targetEndDate || today;
    let chart = '';
    if (st.total && e0 > s0) {
      const weeks = Math.max(1, Math.ceil((L.parse(e0) - L.parse(s0)) / L.DAY / 7));
      const pts = [];
      for (let w = 0; w <= weeks; w++) {
        const upto = L.addDays(s0, w * 7);
        pts.push({ w, n: items.filter(i => i.watched && i.watchedAt && i.watchedAt <= upto).length, future: upto > today });
      }
      const W = 100, H = 100, max = Math.max(st.total, 1);
      const x = i => (i / weeks) * W;
      const y = v => H - (v / max) * H;
      const real = pts.filter(p2 => !p2.future);
      const path = real.map((p2, i) => `${i ? 'L' : 'M'}${x(p2.w).toFixed(2)},${y(p2.n).toFixed(2)}`).join(' ');
      chart = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:132px;overflow:visible" role="img"
          aria-label="누적 완료 강의 ${st.watched}강, 목표 ${st.total}강">
        <line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="var(--border)" stroke-width=".5" vector-effect="non-scaling-stroke"/>
        <line x1="0" y1="${y(0)}" x2="${W}" y2="${y(max)}" stroke="var(--text-3)" stroke-width="1"
          stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity=".7"/>
        ${real.length > 1 ? `<path d="${path}" fill="none" stroke="var(--ok)" stroke-width="2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"/>` : ''}
        ${real.map(p2 => `<circle cx="${x(p2.w).toFixed(2)}" cy="${y(p2.n).toFixed(2)}" r="1.7" fill="var(--ok)"
          vector-effect="non-scaling-stroke"><title>${p2.w}주차: ${p2.n}강</title></circle>`).join('')}
      </svg>
      <div class="inline" style="font-size:11px;margin-top:6px">
        <span style="color:var(--ok);font-weight:650">— 누적 완료 강의</span>
        <span class="dim">--- 목표 (${st.total}강 균등 배분)</span>
        <div style="flex:1"></div><span class="dim">${L.fmtKo(s0)} ~ ${L.fmtKo(e0)}</span>
      </div>`;
    }
    return `<div style="margin-bottom:16px">
      <div class="inline" style="align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="background:var(--surface-2);border-radius:var(--r);padding:12px 15px;min-width:132px">
          <div style="font-size:12.5px;font-weight:650">${L.esc(c.name)}</div>
          <div class="dim" style="font-size:11px;margin-top:6px">진행률</div>
          <div style="font-size:26px;font-weight:700;letter-spacing:-.02em">${st.pct}<small style="font-size:13px">%</small></div>
          <div class="dim" style="font-size:11.5px">${st.watched} / ${st.total}강</div>
          <div class="bar ok" style="margin-top:8px"><i style="width:${st.pct}%"></i></div>
        </div>
        <div style="flex:1;min-width:200px">
          ${cc.targetEndDate && st.watched < st.total
            ? `<div style="font-size:13.5px;font-weight:650;margin-bottom:3px">완강까지
                <span style="color:var(--danger)">주 ${pace.perWeekNeeded}강</span>이 필요해요</div>
              <div class="dim" style="font-size:12px">현재 주당 ${pace.doneThisWeek}강 / 목표 주당 ${pace.perWeekNeeded}강
                ${pace.behind ? ` · 계획보다 ${pace.gap}강 늦어요` : pace.daysLeft < 0 ? ' · 목표 완강일이 지났어요' : ' · 계획대로 가고 있어요'}</div>`
            : st.watched >= st.total && st.total
              ? `<div style="font-size:13.5px;font-weight:650;color:var(--ok)">${st.total}강을 모두 들었어요.</div>`
              : `<div class="dim" style="font-size:12.5px">목표 완강일을 넣으면 주당 필요한 강의 수를 계산해 드려요.
                  <a href="index.html?app=life&p=certlec">설정하기 →</a></div>`}
          ${chart}
        </div>
      </div>
    </div>`;
  }).join('') + (list.length > 2 ? `<p class="dim" style="font-size:11.5px">외 ${list.length - 2}개 자격증은 <a href="index.html?app=life&p=certlec">자격증 강의</a>에서 볼 수 있습니다.</p>` : '');
}
/* ---- 과제 · 시험 준비 현황 (체크리스트 진행률) ---- */
function taskPrep(t) {
  const cl = Array.isArray(t.checklist) ? t.checklist : [];
  const done = cl.filter(i => i && i.done).length;
  if (cl.length) return { pct: L.pct(done, cl.length), done, total: cl.length, hasList: true };
  return { pct: t.status === 'done' ? 100 : t.status === 'doing' ? 50 : 0, done: 0, total: 0, hasList: false };
}
const isExamKind = t => ['midterm', 'exam'].includes(t && t.kind);

/* ---- 자격증 진행 단계 ---- */
function certStageCard() {
  const list = (life.certs || []).map(L.normCert);
  if (!list.length) return emptyMsg('등록된 자격증이 없습니다.', 'index.html?app=life&p=cert', '자격증 추가');
  const dist = L.CERT_STAGES.map(st => ({ st, n: list.filter(c => c.stage === st.key).length }));
  const ordered = list.slice().sort((a, b) => {
    const done = x => (x.stage === 'acquire' ? 1 : 0);
    if (done(a) !== done(b)) return done(a) - done(b);
    return (a.examDate || '9999').localeCompare(b.examDate || '9999');
  });
  const prepPct = c => {
    const parts = [];
    const ck = c.checklist || [], dc = c.docs || [];
    if (ck.length) parts.push(L.pct(ck.filter(i => i.done).length, ck.length));
    if (dc.length) parts.push(L.pct(dc.filter(i => i.done).length, dc.length));
    if (!parts.length) return null;
    return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length);
  };
  return `<div class="stagebars">
      ${dist.map(d => `<div><span class="k">${d.st.label}</span><b>${d.n}</b></div>`).join('')}
    </div>
    ${ordered.slice(0, 5).map(c => {
      const idx = L.certStageIndex(c);
      const pp = prepPct(c);
      const nearest = [c.applyEnd, c.examDate, c.resultDate].filter(d => d && L.dday(d) >= 0).sort()[0];
      return `<div class="certrow">
        <div class="inline" style="gap:7px">
          <b style="font-size:12.5px">${L.esc(c.name)}</b>
          <span class="badge ${c.stage === 'acquire' ? 'ok' : c.result === 'fail' ? 'danger' : ''}">${L.CERT_STAGES[idx].label}</span>
          <div style="flex:1"></div>
          ${nearest ? `<span class="badge mono ${L.dday(nearest) <= 7 ? 'warn' : ''}">${L.ddayLabel(nearest)}</span>` : ''}
        </div>
        <div class="stagedots" role="img" aria-label="${L.CERT_STAGES[idx].label} 단계">
          ${L.CERT_STAGES.map((st, i) => `<i class="${i < idx || c.stage === 'acquire' ? 'on' : i === idx ? 'cur' : ''}" title="${st.label}"></i>`).join('')}
        </div>
        <div class="dim" style="font-size:11.5px;margin-top:4px">
          ${L.icon('target', 12)} ${L.esc(L.certNextAction(c))}
          ${pp === null ? '' : ` · 준비 ${pp}%`}
        </div>
      </div>`;
    }).join('')}
    ${ordered.length > 5 ? `<p class="dim" style="font-size:11.5px">외 ${ordered.length - 5}개는 <a href="index.html?app=life&p=cert">자격증</a>에서 볼 수 있습니다.</p>` : ''}`;
}

    .filter(w => (w.scope === 'work' ? 'work' : 'personal') === scope);

function wishLogsIn(scope, p) {
  const out = [];
  for (const w of wishesOf(scope)) {
    for (const g of (w.logs || [])) {
      if (!g || !g.date || !inRange(g.date, p)) continue;
      out.push({ date: g.date, min: Number(g.min) || 0, what: g.what || '', title: w.title });
    }
  }
  return out.sort((a, b) => b.date.localeCompare(a.date));
}

    </div>
    ${(active.length ? active : list).slice(0, 4).map(w => {

function studyReco() {
  const out = [];
  for (const c of (univ.courses || [])) {

    if (late.length) { out.push({ icon: 'book', tt: `${c.name} ${late[0].title}을 시청하세요`, ss: `권장일 ${L.fmtKo(late[0].dueDate)} · ${late.length}강 밀려 있어요`, href: 'index.html?app=univ&p=courses' }); break; }
  }
  for (const c of enabledCerts()) {
    const st = L.lectureStats(certLectures(c));
    if (st.next) { out.push({ icon: 'cert', tt: `${c.name} ${st.next.title}을 들으세요`, ss: st.next.dueDate ? `권장일 ${L.fmtKo(st.next.dueDate)}` : '다음 들을 강의', href: 'index.html?app=life&p=certlec' }); break; }
  }
  const nextTask = (univ.tasks || []).filter(t => t.status !== 'done' && t.due && L.dday(t.due) >= 0)
    .sort((a, b) => a.due.localeCompare(b.due))[0];
  if (nextTask) out.push({ icon: 'note', tt: `${nextTask.title} 준비하기`, ss: `${L.fmtKo(nextTask.due)} · ${L.ddayLabel(nextTask.due)}`, href: 'index.html?app=univ&p=sched' });
  for (const c of (univ.courses || [])) {
    const st = L.lectureStats(courseLectures(c));
    if (st.next && !st.overdue) { out.push({ icon: 'book', tt: `${c.name} ${st.next.title} 이어 듣기`, ss: `현재 ${st.watched} / ${st.total}강 (${st.pct}%)`, href: 'index.html?app=univ&p=courses' }); break; }
  }
  // 자격증 — 가장 가까운 단계 행동
  const certSoon = (life.certs || []).map(L.normCert)
    .filter(c => c.stage !== 'acquire')
    .map(c => ({ c, d: [c.applyEnd, c.examDate, c.resultDate].filter(x => x && L.dday(x) >= 0).sort()[0] }))
    .filter(x => x.d).sort((a, b) => a.d.localeCompare(b.d))[0];
  if (certSoon) {
    out.push({ icon: 'cert', tt: `${certSoon.c.name} — ${L.certNextAction(certSoon.c)}`,
      ss: `${L.fmtKo(certSoon.d)} · ${L.ddayLabel(certSoon.d)}`, href: 'index.html?app=life&p=cert' });
  }
  // 배우고 싶은 것 — 다음 액션이 정해진 것
  const wishNext = wishesOf('personal').filter(w => w.stage !== 'done' && (w.next || (w.milestones || []).some(m => !m.done)))[0];
  if (wishNext) {
    const m = (wishNext.milestones || []).find(x => !x.done);
    out.push({ icon: 'bulb', tt: `${wishNext.title} — ${wishNext.next || m.title}`,
      ss: `${L.WISH_STAGES[L.wishStageIndex(wishNext)].label} · 진행률 ${L.wishProgress(wishNext)}%`, href: 'index.html?app=life&p=wish' });
  }
  return out;
}

function habitTable() {

  if (!habits.length) return emptyMsg('등록된 습관이 없습니다.', 'index.html?app=life&p=habit', '습관 추가');
  const log = life.habitLog || {};
  const rows = habits.map(h => {
    const st = L.habitStats(h, log, 30, today);
    const streak = L.habitStreak(h, log, today);
    const tone = st.pct >= 80 ? 'ok' : st.pct >= 50 ? 'accent' : 'danger';
    return `<tr>
      <td><b>${L.esc(h.name)}</b><div class="dim" style="font-size:11px">${L.esc(L.habitTargetLabel(h))}</div></td>
      <td style="width:42%"><div class="trow">
        <span class="n">${st.hit} / ${st.expected}회</span>
        <div class="bar ${tone}"><i style="width:${st.pct}%"></i></div>
        <span class="n">${st.pct}%</span></div></td>
      <td class="num"><span class="badge ${streak ? 'ok' : ''}">${streak}일 연속</span></td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>습관</th><th>최근 30일 달성률</th><th class="num">연속</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function fitCard(p) {
  const logs = ((life.fitness && life.fitness.logs) || []).filter(l => inRange(l.date, p));
  const goal = Number(life.meta && life.meta.weeklyGoal) || 3;
  const min = logs.reduce((a, l) => a + (Number(l.minutes) || 0), 0);
  const byType = {};
  for (const l of logs) byType[l.type || '기타'] = (byType[l.type || '기타'] || 0) + 1;
  const types = Object.entries(byType).sort((a, b) => b[1] - a[1]);
  return `<div class="sumrow" style="margin-top:0;padding-top:0;border-top:0">
      <div><div class="k">운동 횟수</div><div class="v">${logs.length}회</div></div>
      <div><div class="k">총 시간</div><div class="v">${min}분</div></div>
      <div><div class="k">주간 목표</div><div class="v">${goal}회</div></div>
    </div>
    ${types.length ? `<div style="margin-top:12px">${types.map(([t, n]) => {
      const pc = L.pct(n, logs.length);
      return `<div style="margin-bottom:9px"><div class="inline" style="font-size:12.5px">
          <b>${L.esc(t)}</b><div style="flex:1"></div><span class="dim">${n}회 · ${pc}%</span></div>
        <div class="bar accent" style="margin-top:4px"><i style="width:${pc}%"></i></div></div>`;
    }).join('')}</div>` : emptyMsg('이 기간에 운동 기록이 없습니다.', 'index.html?app=life&p=fit', '운동 기록')}`;
}
function goalCard(p) {
  const months = new Set();
  for (let d = p.start; d <= p.end; d = L.addDays(d, 1)) months.add(d.slice(0, 7));
  const goals = (life.goals || []).filter(g => months.has(g.month));
  if (!goals.length) return emptyMsg('이 기간에 등록된 월간 목표가 없습니다.', 'index.html?app=life&p=goals', '목표 추가');

  const pc = L.pct(done, goals.length);
  return `<div class="inline" style="align-items:baseline;gap:8px">
      <span style="font-size:26px;font-weight:700;letter-spacing:-.02em">${pc}<small style="font-size:13px">%</small></span>
      <span class="dim" style="font-size:12.5px">${done} / ${goals.length} 달성</span></div>
    <div class="bar ${pc >= 80 ? 'ok' : 'accent'}" style="margin-top:9px"><i style="width:${pc}%"></i></div>
    <div style="margin-top:12px">
      ${goals.slice(0, 6).map(g => `<div class="mrow"><span class="lb">${g.done ? L.icon('tick', 13) : ''} ${L.esc(g.title)}</span>

    </div>
    ${goals.length > 6 ? `<p class="dim" style="font-size:11.5px;margin-top:6px">외 ${goals.length - 6}건</p>` : ''}`;
}
function lifeReco() {

function workCatTable(p) {
  const doneMap = (life.work && life.work.done) || {};
  const agg = {};
  const bump = (cat, done) => {
    const k = cat || 'etc';
    (agg[k] = agg[k] || { total: 0, done: 0 });
    agg[k].total++; if (done) agg[k].done++;
  };
  const y0 = Number(p.start.slice(0, 4)), y1 = Number(p.end.slice(0, 4));
  for (let yy = y0; yy <= y1; yy++) {
    for (const i of T.taxDeadlines(yy)) if (inRange(i.date, p)) bump(i.cat, doneMap[i.id]);
    for (const o of L.recurOccurrences(life.recurring || [], yy)) if (inRange(o.date, p)) bump(o.cat, doneMap[o.id]);
  }
  for (const c of ((life.work && life.work.custom) || [])) if (inRange(c.date, p)) bump(c.cat, doneMap[c.id]);
  const keys = Object.keys(agg).sort((a, b) => agg[b].total - agg[a].total);
  if (!keys.length) return emptyMsg('이 기간에 기한이 있는 업무가 없습니다.', 'index.html?app=life&p=work', '세금 · 신고');
  return `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>분류</th><th>처리율</th><th class="num">남은 건</th></tr></thead>
    <tbody>${keys.map(k => {
      const a = agg[k], pc = L.pct(a.done, a.total), left = a.total - a.done;
      const cat = T.CATS[k] || { label: '기타', tone: '' };
      return `<tr>
        <td><span class="badge ${cat.tone}">${cat.label}</span></td>
        <td style="width:46%"><div class="trow">
          <span class="n">${a.done} / ${a.total}건</span>
          <div class="bar ${pc >= 100 ? 'ok' : pc >= 50 ? 'accent' : 'warn'}"><i style="width:${pc}%"></i></div>
          <span class="n">${pc}%</span></div></td>
        <td class="num"><span class="plan ${left ? 'behind' : 'even'}">${left}건</span></td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}
function recurCard(p) {
  const rules = (life.recurring || []).filter(r => r && r.active !== false);
  if (!rules.length) return emptyMsg('등록한 반복 업무가 없습니다.', 'index.html?app=life&p=recur', '반복 업무 추가');
  const doneMap = (life.work && life.work.done) || {};
  const y0 = Number(p.start.slice(0, 4)), y1 = Number(p.end.slice(0, 4));
  return rules.slice(0, 6).map(r => {
    let total = 0, done = 0;
    for (let yy = y0; yy <= y1; yy++) {
      for (const o of L.recurOccurrences([r], yy)) {
        if (!inRange(o.date, p) || o.date > today) continue;
        total++; if (doneMap[o.id]) done++;
      }
    }
    const pc = L.pct(done, total);
    return `<div style="margin-bottom:11px">
      <div class="inline" style="font-size:12.5px"><b>${L.esc(r.title)}</b>
        <div style="flex:1"></div>
        <span class="dim">${total ? `${done} / ${total}회 · ${pc}%` : '이 기간에 해당 없음'}</span></div>
      <div class="bar ${pc >= 100 ? 'ok' : pc >= 50 ? 'accent' : 'warn'}" style="margin-top:4px"><i style="width:${pc}%"></i></div>
      <div class="dim" style="font-size:11px;margin-top:3px">${L.esc(L.recurLabel(r))}</div>
    </div>`;
  }).join('') + `<p class="dim" style="font-size:11.5px">기한이 아직 오지 않은 회차는 세지 않습니다.</p>`;
}
function workReco() {
  const out = [];
  const lag = workLag();
  if (lag.length) out.push({ icon: 'tax', tt: `${lag[0].t}을 먼저 처리하세요`, ss: `${lag[0].s} · ${lag[0].n}일 지났어요`, href: lag[0].href });
  const doneMap = (life.work && life.work.done) || {};
  const y = Number(today.slice(0, 4));
  const soon = [];
  for (const yy of [y, y + 1]) {
    for (const i of T.taxDeadlines(yy)) if (!doneMap[i.id] && L.dday(i.date) >= 0 && L.dday(i.date) <= 14) soon.push({ t: i.title, d: i.date, recur: false });
    for (const o of L.recurOccurrences(life.recurring || [], yy)) if (!doneMap[o.id] && L.dday(o.date) >= 0 && L.dday(o.date) <= 14) soon.push({ t: o.title, d: o.date, recur: true });
  }
  soon.sort((a, b) => a.d.localeCompare(b.d));
  if (soon[0]) out.push({ icon: 'cal', tt: `${soon[0].t} 준비하기`, ss: `${L.fmtKo(soon[0].d)} · ${L.ddayLabel(soon[0].d)}`, href: soon[0].recur ? 'index.html?app=life&p=recur' : 'index.html?app=life&p=work' });
  if (soon.length > 1) out.push({ icon: 'clock', tt: `14일 안에 기한이 ${soon.length}건 있어요`, ss: soon.slice(1, 3).map(s => s.t).join(' · '), href: 'index.html?app=life&p=work' });
  const learn = (life.wishes || []).filter(w => w.scope === 'work' && w.status === 'now');
  if (learn.length) out.push({ icon: 'bulb', tt: `실무 공부 ${learn.length}건이 진행 중이에요`, ss: learn.slice(0, 2).map(w => w.title).join(' · '), href: 'index.html?app=life&p=worklearn' });
  if (!(life.recurring || []).length) out.push({ icon: 'clock', tt: '반복되는 업무를 규칙으로 등록해보세요', ss: '매월·분기 업무를 한 번만 등록하면 자동으로 일정에 올라갑니다', href: 'index.html?app=life&p=recur&add=recur' });
  return out;
}

// 방통대 등급 → 평점 (4.5 만점 기준). P/NP·F 처리 포함
const GRADES_45 = { 'A+': 4.5, 'A': 4.0, 'B+': 3.5, 'B': 3.0, 'C+': 2.5, 'C': 2.0, 'D+': 1.5, 'D': 1.0, 'F': 0 };
const GRADES_43 = { 'A+': 4.3, 'A': 4.0, 'A-': 3.7, 'B+': 3.3, 'B': 3.0, 'B-': 2.7, 'C+': 2.3, 'C': 2.0, 'C-': 1.7, 'D+': 1.3, 'D': 1.0, 'F': 0 };
const GRADES_40 = { 'A': 4.0, 'B': 3.0, 'C': 2.0, 'D': 1.0, 'F': 0 };
function gradeTable() {
  const s = String(DB.meta.gpaScale);
  return s === '4.3' ? GRADES_43 : s === '4' ? GRADES_40 : GRADES_45;
}
// 100점 → 등급 추정 (방통대 절대평가 기준선)
function scoreToGrade(s) {
  if (s >= 95) return 'A+'; if (s >= 90) return 'A';
  if (s >= 85) return 'B+'; if (s >= 80) return 'B';
  if (s >= 75) return 'C+'; if (s >= 70) return 'C';
  if (s >= 65) return 'D+'; if (s >= 60) return 'D';
  return 'F';
}

/* ================= 강의 체크리스트 (온라인 강의 수강 관리) ================= */

function courseLectures(c) { return Array.isArray(c.lectureItems) ? c.lectureItems : []; }

/** 한 과목의 강의를 모두 시청 완료 / 해제 처리. 되돌리기 어려우므로 확인을 받는다. */
function setAllWatched(courseId, done) {
  const c = course(courseId);
  const items = courseLectures(c);
  if (!items.length) { L.toast('등록된 강의가 없습니다.'); return false; }
  const n = items.filter(i => !!i.watched !== done).length;
  if (!n) { L.toast(done ? '이미 모두 완료했습니다.' : '완료 표시된 강의가 없습니다.'); return false; }
  if (!confirm(done ? `미시청 ${n}강을 모두 시청 완료로 표시할까요?`
    : `완료 표시된 ${n}강을 모두 해제할까요?\n시청일 기록도 함께 지워집니다.`)) return false;
  const today = L.todayStr();
  items.forEach(i => { i.watched = done; i.watchedAt = done ? (i.watchedAt || today) : ''; });
  setCourseLectures(c, items);
  L.toast(done ? '전체 완료로 표시했습니다.' : '완료 표시를 해제했습니다.');
  return true;
}

function progressOf(c) {
  const items = courseLectures(c);

}

function lecGroups(items) {
  const out = [], idx = {};
  for (const it of items) {
    const key = (it.week === null || it.week === undefined || it.week === '') ? '' : String(it.week);
    if (idx[key] === undefined) { idx[key] = out.length; out.push({ key, label: key ? `${key}주차` : '주차 미지정', items: [] }); }
    out[idx[key]].items.push(it);
  }
  // 주차 번호 순으로 정렬 (미지정은 맨 뒤)
  return out.sort((a, b) => (a.key === '' ? 1 : b.key === '' ? -1 : Number(a.key) - Number(b.key)));
}

/** 입력된 점수·비중으로 현재 확보 점수와 예상 총점 계산 */
function scoreOf(c) {
  const w = c.weights || {}, s = c.scores || {};
  let earned = 0, counted = 0, planned = 0;
  for (const k of ['mid', 'attend', 'final']) {
    const wk = Number(w[k]) || 0;
    planned += wk;
    if (s[k] !== null && s[k] !== '' && s[k] !== undefined) {
      earned += (Number(s[k]) / 100) * wk;
      counted += wk;
    }
  }
  return {
    earned: Math.round(earned * 10) / 10,      // 확보 점수 (100점 만점 중)
    counted,                                    // 채점 완료 비중
    planned,                                    // 설정된 총 비중
    projected: counted > 0 ? Math.round((earned / counted) * 100 * 10) / 10 : null, // 현 추세 예상 총점
  };
}
function gpaOf(list) {
  const tbl = gradeTable();
  let pts = 0, cr = 0;
  for (const c of list) {
    const g = c.grade;
    if (!g || !(g in tbl)) continue;
    const credits = Number(c.credits) || 0;
    pts += tbl[g] * credits; cr += credits;
  }
  return { gpa: cr > 0 ? Math.round((pts / cr) * 100) / 100 : null, credits: cr, points: pts };
}
/** 취득학점 = F 제외한 성적 있는 과목의 학점 합 */
function earnedCredits(list) {
  return list.reduce((a, c) => a + (c.grade && c.grade !== 'F' ? (Number(c.credits) || 0) : 0), 0);
}
