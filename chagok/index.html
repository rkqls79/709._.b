.tstats .k { display: block; font-size: 10.5px; color: var(--text-3); }
.tstats b { font-size: 14.5px; font-variant-numeric: tabular-nums; }
.termcard .prog { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 11.5px; color: var(--text-3); }
.termcard .prog .bar { flex: 1; }
.courselist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
.courselist > li { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.courselist > li:first-child { border-top: 0; }
.courselist > li:hover { background: var(--surface-2); }
.courselist .nm { flex: 1; min-width: 96px; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.courselist .nm small { display: block; font-weight: 500; font-size: 10.5px; color: var(--text-3); }
.courselist input[type="number"] { width: 58px; min-height: 30px; padding: 3px 6px; font-size: 12px; text-align: right; }
.courselist select { width: 104px; min-height: 30px; padding: 3px 6px; font-size: 12px; }
.courselist .pt { width: 30px; text-align: right; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.courselist .none { padding: 14px 10px; text-align: center; font-size: 12px; color: var(--text-3); }
.termcard > footer { display: flex; gap: 7px; padding: 0 15px 14px; flex-wrap: wrap; }
@media (max-width: 520px) {
  .courselist .nm { flex: 1 1 100%; }
  .courselist select { flex: 1; width: auto; }
}
/* =========================================================
   24b. 한 화면에 담기 (fitview)
   · 창 전체가 스크롤되지 않는다 — 제목 · 요약 · 탭은 늘 같은 자리
   · 내용이 넘치면 그 영역 안에서만 스크롤된다
   · 좁은 화면(≤1024px)에서는 평소처럼 페이지가 스크롤된다
   ========================================================= */
@media (min-width: 1000px) {
  body.fitview { height: 100vh; height: 100dvh; overflow: hidden; }
  body.fitview .shell {
    height: 100vh; height: 100dvh; min-height: 0; overflow: hidden;
  }
  body.fitview .wrap {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; padding-bottom: 18px;
  }
  /* 화면(page) 하나가 남은 높이를 채운다. 따로 지정한 본문이 없으면 화면 자체가 스크롤된다 */
  body.fitview .page.active {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    overflow-y: auto; overscroll-behavior: contain;
  }
  body.fitview .page.active:has(.fitmain) { overflow: hidden; }

  /* 홈처럼 .page 없이 .wrap > .fit 로 짜인 화면도 같은 규칙을 따른다 */
  body.fitview .wrap > .fit {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    overflow-y: auto; overscroll-behavior: contain;
  }
  body.fitview .wrap > .fit:has(.fitmain) { overflow: hidden; }

  /* 남은 높이를 채우는 본문 */
  body.fitview .fitmain { flex: 1; min-height: 0; }
  body.fitview .fitscroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* 좌우로 나뉜 화면 — 칸마다 따로 스크롤 */
  body.fitview .fitcols { align-items: stretch; }
  body.fitview .fitcols > * { min-height: 0; }
  body.fitview .fitcols > .card,
  body.fitview .fitcols > .fitcard { display: flex; flex-direction: column; }
  body.fitview .fitcols > .card > .card-body,
  body.fitview .fitcols > .fitcard > .card-body { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  body.fitview .fitcols > .fitscroll { display: block; }

  /* 세로로 쌓인 칸(.fit) 안에서도 각 카드가 알아서 줄어든다 */
  body.fitview .fitcols > .fit { display: flex; flex-direction: column; min-height: 0; }
  body.fitview .fitcols > .fit > .card { min-height: 0; }

  /* 목록 자체에 걸어 둔 높이 제한은 fitview 에서는 필요 없다 */
  body.fitview .picklist { max-height: none; }

  /* 고정 영역(제목·탭·요약)은 조금 더 아담하게 — 본문에 자리를 준다 */
  body.fitview .wrap { padding-top: 18px; }
  body.fitview .page-head { margin-bottom: 12px; }
  body.fitview .subtabs { margin-bottom: 11px; }

  /* 통계 본문 — 카드 하나가 화면을 다 차지하지 않도록, 긴 카드는 카드 안에서 스크롤 */
  body.fitview #body .card > .card-body { max-height: 46vh; overflow-y: auto; overscroll-behavior: contain; }

  /* 스크롤 막대를 얇고 조용하게 (색은 기존 토큰 그대로) */
  body.fitview .fitscroll::-webkit-scrollbar,
  body.fitview .page.active::-webkit-scrollbar,
  body.fitview .card-body::-webkit-scrollbar { width: 10px; height: 10px; }
  body.fitview .fitscroll::-webkit-scrollbar-thumb,
  body.fitview .page.active::-webkit-scrollbar-thumb,
  body.fitview .card-body::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 8px;
    border: 3px solid transparent; background-clip: content-box;
  }
  body.fitview .fitscroll::-webkit-scrollbar-track,
  body.fitview .page.active::-webkit-scrollbar-track,
  body.fitview .card-body::-webkit-scrollbar-track { background: transparent; }
}

/* ---------- 24c. 사이드바 촘촘 모드 (자리가 모자랄 때만) ---------- */
@media (min-width: 1025px) {
  body.side-compact .side { padding: 13px 11px 10px; gap: 1px; }
  body.side-compact .brand { padding: 2px 8px 11px; }
  body.side-compact .brand .nm { font-size: 16.5px; }
  body.side-compact .tab,
  body.side-compact .nav-link { min-height: 32px; padding: 5px 11px; font-size: 13.5px; gap: 9px; }
  body.side-compact .nav-sub > .tab,
  body.side-compact .nav-sub > .nav-link { min-height: 29px; font-size: 11.5px; padding-left: 13px; }
  body.side-compact .nav-group { margin-top: 5px; }
  body.side-compact .nav-head { min-height: 24px; padding: 2px 10px; font-size: 10.5px; }
  body.side-compact .nav-sep { margin: 6px 10px; }
  body.side-compact .side-note { display: none; }   /* 한마디는 홈 화면에도 있다 */
}

/* =========================================================
   25. 모바일 최적화
   · 색·글꼴·카드 모양은 그대로 두고, 좁은 화면의 배치와 터치만 손본다
   · 데스크톱(≥1025px)에는 아무 영향이 없다
   ========================================================= */

/* ---------- 25a. 공통 안전장치 ---------- */
html { -webkit-tap-highlight-color: transparent; }
body { overflow-x: hidden; overflow-wrap: break-word; }
img, video, svg, canvas { max-width: 100%; }
.card, .focus-group, .termcard, .rm-item { min-width: 0; }
.table-wrap { -webkit-overflow-scrolling: touch; }

/* 손가락에는 hover 가 없다 — 눌렀을 때 색이 남는 현상을 막는다 */
@media (hover: none) {
  .btn:hover, .chip:hover, .tab:hover, .nav-link:hover, .iconbtn:hover, .tile:hover,
  .list > li:hover, .sched li:hover, .pick:hover, .dayrow:hover, .evline:hover,
  .filetable tbody tr:hover, .klist > li:hover, .mrow:hover, .habit:hover, .hcell:hover,
  .starbtn:hover, .rm-item:hover, .pop-row:hover, .theme-option:hover, .nav-head:hover { background: inherit; }
  .btn:hover { background: var(--surface); }
  .btn.primary:hover { background: var(--accent); }
  .chip.on:hover { background: var(--accent); }
  .pick.on:hover { background: var(--accent-soft); }
  .tile:hover { background: var(--surface); border-color: var(--border); transform: none; }
  .btn:active, .chip:active, .tile:active, .pick:active, .dayrow:active { filter: brightness(.96); }
}

/* iPhone 노치·홈 인디케이터 */
@supports (padding: max(0px)) {
  .side { padding-left: max(13px, env(safe-area-inset-left)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .topbar { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
}

/* ---------- 25b. 태블릿 (≤1024px) ---------- */
@media (max-width: 1024px) {
  .wrap { padding: 20px 18px 64px; }
  .side { width: min(300px, 86vw); }
}

/* ---------- 25c. 휴대폰 (≤700px) ---------- */
@media (max-width: 700px) {
  /* 여백 — 좌우 16px, 섹션 사이 24px */
  .wrap { padding: 14px 16px calc(78px + env(safe-area-inset-bottom, 0px)); }
  .grid { gap: 12px; }
  .card > .card-head { padding: 15px 16px 11px; gap: 7px; }
  .card > .card-body { padding: 0 16px 16px; }
  .card > .card-body.tight { padding: 0 0 4px; }

  /* 글자 — 읽기 편한 크기로 */
  body { font-size: 15px; line-height: 1.6; }
  .page-head h2 { font-size: clamp(22px, 6.4vw, 28px); }
  .page-head .sub { font-size: 13.5px; line-height: 1.6; }
  .card > .card-head h3 { font-size: 16px; }
  .list .ttl, .sched .t b, .pick .txt b, .dayrow .bd .t { font-size: 14.5px; }
  .list .meta, .sched .t span, .pick .txt span, .dayrow .bd .s { font-size: 12.5px; }
  .dim, .foot, .stat .foot { font-size: 12.5px; }
  table.tbl th, table.tbl td { font-size: 13.5px; }

  /* 터치 영역 — 최소 44px */
  .btn { min-height: 44px; padding: 10px 15px; }
  .btn.sm { min-height: 42px; padding: 9px 14px; font-size: 13.5px; }
  .btn.icon { width: 44px; height: 44px; min-height: 44px; }
  .chip { min-height: 42px; padding: 9px 15px; font-size: 13px; }
  .iconbtn { width: 42px; height: 42px; }
  .avatar { width: 38px; height: 38px; }
  .seg button { min-height: 42px; padding: 9px 16px; }
  .btn.qa { min-height: 42px; padding: 9px 13px; }

  /* 사이드바 서랍 — 손가락으로 고르기 편하게 */
  .side { padding-top: 22px; }
  .tab, .nav-link { min-height: 46px; padding: 11px 13px; font-size: 14.5px; }
  .nav-sub > .tab, .nav-sub > .nav-link { min-height: 44px; font-size: 13.5px; padding-left: 16px; }
  .nav-head { min-height: 42px; font-size: 12px; }
  .brand { padding-bottom: 18px; }
  .side-note { display: none; }

  /* 달력 아이콘도 손가락으로 누를 수 있게 */
  .cal.soft .evline { min-width: 22px; min-height: 22px; justify-content: center; padding: 2px; }
  .starbtn, .klist .kx, .dayrow .mn, .tagchip button, .cardx { min-width: 40px; min-height: 40px; display: inline-grid; place-items: center; }
  .cardx { width: 40px; height: 40px; }
  input[type="checkbox"] { width: 22px; height: 22px; }
  .focus-row input[type="checkbox"], .dayrow > input[type="checkbox"] { width: 22px; height: 22px; }
  .klist > li, .list > li, .sched li, .dayrow, .pick { min-height: 48px; }
  .card > .card-head .btn.sm + .btn.sm { margin-left: 2px; }

  /* 입력칸 — iOS 는 16px 미만이면 화면을 확대해 버린다 */
  input[type="text"], input[type="number"], input[type="date"], input[type="url"],
  input[type="time"], input[type="month"], input[type="email"], input[type="password"],
  select, textarea { font-size: 16px; min-height: 46px; padding: 10px 12px; }
  .courselist input[type="number"], .courselist select,
  table.tbl td input, table.tbl td select { font-size: 16px; min-height: 42px; }
  label.field > span { font-size: 12.5px; }

  /* 화면 제목줄 — 버튼은 줄바꿈해서 꽉 차게 */
  .page-head { margin-bottom: 14px; gap: 10px; }
  .page-head .actions { margin-left: 0; width: 100%; gap: 8px; }
  .page-head .actions > .btn { flex: 1 1 auto; justify-content: center; }
  .page-head .actions > select { flex: 1 1 44%; min-width: 0; }
  .page-head .actions > input[type="text"],
  .page-head .actions > input[type="search"] { flex: 1 1 100%; width: 100%; min-width: 0; }
  .page-head .inline > select { flex: 1 1 auto; min-width: 0; }
  /* 안내 박스 안의 버튼은 문장 사이에 끼지 않게 */
  .notice .btn.sm { display: flex; width: 100%; justify-content: center; margin: 9px 0 0 !important; }
  .page-head .chips { width: 100%; }
  .page-head .chips .chip { flex: 1; justify-content: center; }

  /* 표 — 가로 스크롤 유지 + 손가락으로 밀기 편하게 */
  table.tbl th, table.tbl td { padding: 11px 12px; }
  .table-wrap { position: relative; }

  /* 핵심 숫자 카드 — 2열로 묶어 한눈에 */
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .g4 .stat { padding: 13px 14px; }
  .g4 .stat .value, .g4 .stat .vl { font-size: 21px; }
  .g4 .stat .label, .g4 .stat .lb { font-size: 11.5px; }
  .g4 .stat .foot, .g4 .stat .ft { font-size: 11px; line-height: 1.45; }
  .g4 .stat .chev { display: none; }          /* 카드 전체가 눌리므로 화살표는 뺀다 */
  .g4 .stat .ico { width: 30px; height: 30px; }

  /* 요약 카드 — 2열 */
  .mstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mstrip > div { padding: 13px 14px; gap: 10px; }
  .mstrip .v { font-size: 19px; }
  .mstrip .ico { width: 34px; height: 34px; }
  .stat { padding: 14px 15px; }
  .sumrow { gap: 8px; }

  /* 모달 — 화면 아래에서 올라오는 시트 */
  .modal-bg { padding: 0; align-items: flex-end; }
  .modal {
    max-width: none; border-radius: var(--r-lg) var(--r-lg) 0 0;
    max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column;
    animation: sheetup 220ms ease;
  }
  .modal > header { position: sticky; top: 0; z-index: 2; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .modal > .body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }
  .modal > footer {
    position: sticky; bottom: 0; background: var(--surface);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .modal > footer .btn { flex: 1; justify-content: center; }
  .modal > footer .btn.danger { flex: 0 0 auto; }
  @keyframes sheetup { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }

  /* 팝오버 — 화면 폭에 맞춰 */
  .pop { right: 0; left: auto; min-width: 200px; }
  .pop-wide { width: min(300px, 88vw); }
}

/* ---------- 25g. 휴대폰 홈 — 무엇을 먼저 보여줄지 ---------- */
/* 타일 두 장은 사실 '메뉴'다. 휴대폰에는 하단 탭바와 서랍이 이미 있으니
   오늘 봐야 하는 것(일정 · 습관 · 목표)을 위로 올리고 타일은 아래로 내린다.
   .hub 와 .grid 는 배경도 테두리도 없는 순수 격자라, display:contents 로
   껍데기만 걷어내면 안쪽 카드가 .fit 의 형제가 되어 순서만 바꿀 수 있다. */
@media (max-width: 700px) {
  .wrap > .fit > .hub, .wrap > .fit > .grid.g2 { display: contents; }

  /* 인사 — 큰 세리프 제목(29px, 두 줄로 접혀 75px)을 본문 크기 한 줄로 낮춘다.
     문장은 그대로 남긴다: 오늘 남은 개수를 말해주는 곳이 여기뿐이다. */
  .hero { padding: 4px 2px 12px; }
  .hero h1 { font-family: var(--sans); font-size: 15px; font-weight: 650; gap: 7px; }
  .hero h1 .ic { width: 16px; height: 16px; }
  #cardSched { order: 1; }
  #cardHabit { order: 2; }
  #cardGoal { order: 3; }
  #cardUniv { order: 4; }
  #cardLife { order: 5; }

  /* 타일 — 아래로 내려간 만큼 설명문을 빼고 높이도 줄인다 */
  .tile { min-height: 64px; padding: 10px 11px; }
  .tile .d { display: none; }
}

/* 서랍 · 모달이 열려 있는 동안에는 뒤 화면을 붙잡아 둔다 */
@media (max-width: 1024px) {
  body.nav-open { overflow: hidden; }
}
body:has(.modal-bg.open) { overflow: hidden; }

/* ---------- 25e. 하단 메뉴 · 모바일 검색 ---------- */
.botnav { display: none; }
.m-only { display: none !important; }

@media (max-width: 700px) {
  /* 요소마다 원래 성질에 맞게 되살린다 */
  .iconbtn.m-only { display: grid !important; }
  .btn.m-only { display: inline-flex !important; }
  .mobstage.m-only { display: block !important; }

  /* 상단은 꼭 필요한 것만 남긴다 (메뉴는 아래 하단바로) */
  .burger, .avatar { display: none; }
  .topbar { min-height: 52px; padding: 0 12px; gap: 3px; }
  .crumb { flex: 1; min-width: 0; }
  .topbar .spacer { display: none; }   /* 제목이 쓸 자리를 빼앗기지 않게 */
  .crumb .up, .crumb > .ic { display: none; }
  .crumb b { font-size: 15px; }

  /* 검색 — 아이콘을 누르면 상단에 한 줄로 펼쳐진다 */
  .search-wrap {
    position: fixed; left: 0; right: 0; top: 52px; z-index: 60;
    display: none; padding: 9px 12px calc(9px + env(safe-area-inset-bottom, 0px) * 0);
    background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-1);
  }
  body.search-open .search-wrap { display: block; }
  body.search-open .search { display: flex; width: 100%; max-width: none; min-height: 44px; }
  .search-wrap .pop { position: absolute; left: 12px; right: 12px; top: calc(100% - 2px); width: auto; max-width: none; }

  /* 하단 메뉴 — 엄지로 닿는 자리 */
  .botnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -1px 0 rgba(0, 0, 0, .02);
  }
  .botnav a, .botnav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    min-height: 54px; padding: 7px 2px 8px; border: 0; background: transparent;
    color: var(--text-3); font-size: 10.5px; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .botnav a:hover { text-decoration: none; }
  .botnav .on { color: var(--accent); }
  .botnav .on .ic { transform: translateY(-1px); }
  .botnav a:active, .botnav button:active { background: var(--surface-2); }

  /* 사이드바 서랍이 하단바 위로 오도록 */
  .side { z-index: 90; }
  .scrim { z-index: 85; }
  body.nav-open .botnav { z-index: 70; }
}

/* ---------- 25f. 통합 일정 · 표의 휴대폰 대응 ---------- */
.calfilters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.calfilters select, .calfilters input[type="date"] { width: auto; }
.mobstage { display: none; }

@media (max-width: 700px) {
  /* 줄1: ‹ 2026년 8월 › · 오늘 · 필터  /  줄2: 월 주 일 */
  .calbar { gap: 7px; margin-bottom: 10px; }
  .calbar .nav { flex: 1 1 auto; justify-content: flex-start; gap: 0; }
  .calbar .month { min-width: 0; flex: 1; text-align: center; font-size: 14.5px; white-space: nowrap; }
  .calbar .spacer { display: none; }
  .calbar .nav { order: 0; }
  .calbar #btnToday { flex: 0 0 auto; order: 1; }
  .calbar #filterToggle { flex: 0 0 auto; order: 2; }
  .calbar .seg { flex: 1 1 100%; order: 3; }
  .calbar .calfilters { order: 4; }
  .calbar .seg button { flex: 1; padding: 8px 6px; }

  /* 안내 배너 — 좁은 화면에서는 아래로 흐르게 */
  .notice { padding: 12px 14px; font-size: 13px; line-height: 1.55; }
  .notice.link { flex-wrap: wrap; }
  .notice.link b { flex: 0 0 auto; }
  .notice.link > span:not(.spacer) { flex: 1 1 100%; font-size: 12.5px; }
  .notice.link .spacer { display: none; }
  .notice.link > .ic:last-child { position: absolute; right: 12px; top: 14px; }
  .notice.link { position: relative; padding-right: 34px; }
  .calfilters { width: 100%; }

  /* 달력 — 제목 대신 아이콘만, 자세한 내용은 아래 목록에서 */
  .cal.soft { grid-auto-rows: minmax(58px, 1fr); }
  .cal.soft .cell { padding: 4px 3px; gap: 2px; flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
  .cal.soft .cell .d { flex: 0 0 100%; gap: 2px; }
  .cal.soft .cell .d b { font-size: 11.5px; }
  .cal.soft .cell.today .d b { width: 19px; height: 19px; font-size: 11px; }
  .cal .cell .hol { display: none; }
  .cal .dow { padding: 6px 0; font-size: 11px; }
  .cal.soft .evline { width: auto; flex: 0 0 auto; padding: 0 1px; min-width: 0; }
  .cal.soft .evline span { display: none; }
  .cal.soft .evline .ic { width: 13px; height: 13px; }
  .cal.soft .cell .more { flex: 0 0 100%; font-size: 9.5px; }
  .callegend { gap: 9px 12px; padding: 10px 14px; font-size: 11px; }

  /* 선택한 날 목록이 주인공 */
  .daygroup > .gh { padding: 11px 15px; min-height: 46px; }
  .dayrow { padding: 9px 15px 11px; }

  /* 자격증 상태표 — 단계 6칸 대신 막대 하나로 */
  #certTable th:nth-child(n+2):nth-child(-n+7),
  #certTable td:nth-child(n+2):nth-child(-n+7) { display: none; }
  .mobstage { display: block; margin-top: 6px; }
  .mobstage .stagedots { max-width: 160px; }
  .mobstage span { display: block; font-size: 11px; color: var(--text-3); margin-top: 4px; }

  /* 자료실 — 유형·크기는 미리보기에 있으니 목록에서는 줄인다 */
  .filetable th:nth-child(2), .filetable td:nth-child(2),
  .filetable th:nth-child(3), .filetable td:nth-child(3) { display: none; }
  .filetable .nm b { white-space: normal; word-break: break-all; }

  /* 목록+상세 — 목록 높이 제한 해제 */
  .picklist { max-height: none; }
  .crumbline { padding: 12px 14px 0; font-size: 12px; }
  .wktabs { padding: 9px 14px 11px; }
}

@media (max-width: 400px) {
  .cal.soft { grid-auto-rows: minmax(52px, 1fr); }
  .cal.soft .evline .ic { width: 12px; height: 12px; }
  body.cal-filters-open .calfilters { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- 25g-a. 화면 제목 중복 ---------- */
/* 상단바(스티키)가 현재 위치를 늘 들고 있으므로, 본문에 같은 글자가 또 나오면 감춘다.
   글자가 다른 화면(예: 상단 '학사 대시보드' ↔ 본문 '3학년 2학기')은 그대로 남는다.
   지우지 않고 눈에서만 감추는 이유: 화면 낭독기에는 제목이 하나 있어야 한다. */
.page-head h2.dup-title {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
.page-head:has(h2.dup-title) { margin-bottom: 10px; }

/* ---------- 25g. 통합 일정 — 달력 바 · 필터 · 상세 시트 ---------- */
/* 달력 바 오른쪽의 요약 문구 (화면 제목줄에서 옮겨 왔다) */
.calmeta { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* 필터는 접어 둔다 — 무엇이 걸렸는지는 아래 칩으로 보여준다 */
.calfilters { display: none; }
body.cal-filters-open .calfilters { display: flex; flex: 1 1 100%; align-items: flex-end; }
.calfilters .cf { display: flex; flex-direction: column; gap: 4px; }
.calfilters .cf > span { font-size: 11px; color: var(--text-3); font-weight: 600; }
.calfilters .cf > select, .calfilters .cf > input[type="date"] { width: auto; }
.calchips { display: flex; flex-wrap: wrap; gap: 6px; }
.calchips:empty { display: none; }
.calchips .chip .x { color: var(--text-3); font-weight: 700; }
.calchips .chip.on .x { color: inherit; opacity: .75; }

/* 지연 알림 칩 — 조용하게, 그러나 누를 수 있게 */
.calchip:empty { display: none; }
.calchip .chip.danger {
  display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 4px 11px;
  border-color: var(--danger); background: var(--danger-soft); color: var(--danger);
}
.calchip .chip.danger:hover { background: var(--danger); color: var(--on-accent); }
.calchip .chip.danger .ic { color: currentColor; }

/* 범례 — 한 줄로 눕히고 넘치면 옆으로 밀어 본다 */
.callegend { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.callegend::-webkit-scrollbar { height: 0; }
.callegend > span { flex: 0 0 auto; }

/* 칸 전체가 스크롤되는 오른쪽 칸 — 카드를 창 높이에 맞춰 누르면 상자만 줄고
   내용은 제 높이를 그대로 지켜서 카드 밖으로 삐져나온다(목록 마지막 줄이 잘리고
   "+ 다른 일정 추가" 가 카드 아래로 떨어지던 증상). 카드는 줄이지 않는다. */
@media (min-width: 1000px) {
  body.fitview .fitcols > .fitscroll > .card { flex: none; }
}

/* 월 보기 — 남은 높이에 6주가 딱 맞게 들어간다 (카드 안쪽 스크롤이 없어진다).
   달력과 목록이 좌우로 나뉘는 폭에서만 — 세로로 쌓이면 달력에 줄 높이가 모자란다. */
@media (min-width: 1181px) {
  /* 카드는 칸 높이만큼 늘어나는데 본문이 따라 늘지 않아 아래에 빈 자리가 남고
     달력이 그만큼 쪼그라들었다. 본문이 카드를 채우게 한다. */
  body.fitview .schedwrap > .card > .card-body { flex: 1; }
  /* 주 · 일 보기는 내용이 짧다 — 카드를 늘리지 않고 내용에 맞춘다.
     내용이 길면 창을 넘지 않게 상한을 두고 카드 안에서 스크롤한다. */
  body.fitview:not(.cal-month) .schedwrap > .card { align-self: start; max-height: 100%; }
  body.fitview.cal-month .schedwrap > .card > .card-body {
    display: flex; flex-direction: column; overflow: hidden; max-height: none;
  }
  body.fitview.cal-month .schedwrap > .card > .card-body > #calBody { flex: 1; min-height: 0; }
  body.fitview.cal-month #calBody > .cal.soft { height: 100%; grid-auto-rows: minmax(0, 1fr); }
  body.fitview.cal-month #calBody .evline { padding: 0 3px; line-height: 1.35; }
}

/* 달력과 목록이 세로로 쌓이는 폭 — 창 높이에 억지로 밀어 넣으면 달력이 눌린다.
   이 구간만 페이지를 그대로 스크롤하게 풀어 준다. */
@media (min-width: 1000px) and (max-width: 1180px) {
  body.fitview .wrap > .page.active:has(.schedwrap) { overflow-y: auto; }
  body.fitview .schedwrap.fitmain { flex: none; }
  body.fitview .schedwrap > .card > .card-body { overflow: visible; max-height: none; }
  body.fitview .schedwrap .fitscroll { overflow: visible; }
}

/* 휴대폰 — 고른 일정의 상세를 아래에서 올라오는 시트로 */
@media (max-width: 700px) {
  .calbar .calmeta { flex: 1 1 auto; order: 5; }
  .calbar .calchip { order: 5; flex: 0 0 auto; }
  .calbar .calchips { order: 6; flex: 1 1 100%; }
  .calbar .calchips .chip { flex: 0 0 auto; }
  body.cal-filters-open .calfilters {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
  }
  .calfilters .cf > select, .calfilters .cf > input[type="date"] { width: 100%; }

  .sheet-scrim {
    position: fixed; inset: 0; z-index: 94; background: rgba(15, 18, 14, .34);
    animation: fadein 160ms ease;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  body.ev-open #evDetail {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 95;
    max-height: 84vh; max-height: 84dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border-radius: var(--r-lg) var(--r-lg) 0 0; border-bottom: 0;
    box-shadow: var(--shadow-2); animation: sheetup 220ms ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.ev-open #evDetail > .card-head {
    position: sticky; top: 0; z-index: 2; background: var(--surface);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
  body.ev-open { overflow: hidden; }
}
@media (min-width: 701px) { .sheet-scrim { display: none; } }

@media (max-width: 440px) {
  .g4 .stat .ico { display: none; }
  .g4 .stat .label, .g4 .stat .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

/* ---------- 25d. 작은 휴대폰 (≤400px) ---------- */
@media (max-width: 400px) {
  .wrap { padding: 12px 13px calc(76px + env(safe-area-inset-bottom, 0px)); }
  .g4 .stat .value, .g4 .stat .vl { font-size: 19px; }
  .g4 .stat .ico { display: none; }           /* 아주 좁은 화면에서는 글씨에 자리를 준다 */
  .card > .card-head { padding: 14px 14px 10px; }
  .card > .card-body { padding: 0 14px 14px; }
  .mstrip { grid-template-columns: minmax(0, 1fr); }
  .mstrip > div { border-left: 0; border-top: 1px solid var(--border); }
  .mstrip > div:first-child { border-top: 0; }
  .page-head .actions > select { flex: 1 1 100%; }
}

</style>
</head>
<body>

<!-- =========================================================
     차곡차곡 — 디자인(CSS) · 공통 기능(JS) · 모든 화면이 이 파일 하나에 들어 있다.
     바깥 파일은 하나도 필요 없다 (웹폰트만 인터넷에서 받아오고, 없으면 시스템 글꼴로 대체된다).

     이 파일 안의 순서
       1) <style>            디자인 전체 (테마 5종 · 공통 부품 · 반응형)
       2) <template id=...>  화면 6개의 마크업
       3) <script> 1번째     store.js — 저장소 · 공휴일 · 사이드바 · 일정수집 · 알림 · 엑셀읽기
       4) <script> 2번째     tax-data.js — 세무 신고기한 생성기
       5) <script> 3번째     화면별 코드(boot*) + 화면 고르기

     화면이 한 번에 하나만 살아 있다.
     화면은 아래 <template> 에 담아 두고, 주소의 ?app= 값에 맞는
     하나만 꺼내 붙인다. 한 번에 한 화면만 살아 있으므로
     화면끼리 같은 id 를 써도 서로 부딪히지 않는다.

       index.html                → 홈
       index.html?app=sched      → 통합 일정
       index.html?app=manage     → 관리
       index.html?app=progress   → 통계
       index.html?app=univ&p=... → 대학 (학사관리)
       index.html?app=life&p=... → 개인 · 업무 (인생관리)
     ========================================================= -->

<template id="tpl-hub">
<main class="wrap" id="main">
  <div class="fit">

    <!-- 1) 인사 -->
    <section class="hero">
      <div class="txt">
        <h1 id="hi">안녕하세요</h1>
        <p class="sub" id="dateLine"></p>
        <p class="qline" id="heroQuote"></p>
      </div>
      <svg class="art" width="200" height="96" viewBox="0 0 200 96" fill="none" aria-hidden="true">
        <rect x="6" y="78" width="188" height="2" rx="1" fill="var(--border)"/>
        <rect x="18" y="44" width="9" height="34" rx="1.5" fill="var(--accent)" opacity=".55"/>
        <rect x="29" y="52" width="9" height="26" rx="1.5" fill="var(--accent-2)" opacity=".6"/>
        <rect x="40" y="36" width="9" height="42" rx="1.5" fill="var(--purple)" opacity=".4"/>
        <rect x="62" y="30" width="52" height="48" rx="3" fill="var(--surface-2)" stroke="var(--border)"/>
        <path d="M70 44h36M70 52h28M70 60h32" stroke="var(--border-strong)" stroke-width="1.4" stroke-linecap="round"/>
        <ellipse cx="150" cy="79" rx="22" ry="3" fill="var(--surface-3)"/>
        <path d="M150 78c0-14-6-22-15-25 2 13 7 21 15 25Z" fill="var(--accent-2)" opacity=".5"/>
        <path d="M150 78c0-18 7-27 18-30-2 17-8 26-18 30Z" fill="var(--accent)" opacity=".45"/>
        <path d="M150 78V44" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </section>

    <!-- 2) 핵심 현황 -->
    <section class="grid g4" id="stats" aria-label="핵심 현황"></section>

    <!-- 3~5) 본문 -->
    <div class="hub">

      <!-- 방통대 학사관리 -->
      <section class="card" id="cardUniv">
        <div class="card-head">
          <h3>방통대 학사관리</h3><div class="spacer"></div>
          <a class="btn ghost sm" href="index.html?app=univ">전체 보기</a>
        </div>
        <div class="card-body">
          <div class="tiles" id="univTiles" style="--cols:4"></div>
          <div class="mini" id="univMini"></div>
        </div>
      </section>

      <!-- 개인 인생관리 -->
      <section class="card" id="cardLife">
        <div class="card-head">
          <h3>개인 인생관리</h3><div class="spacer"></div>
          <a class="btn ghost sm" href="index.html?app=life">전체 보기</a>
        </div>
        <div class="card-body">
          <div class="tiles" id="lifeTiles" style="--cols:3"></div>
          <a class="banner" href="index.html?app=life&p=memo" id="lifeBanner"></a>
        </div>
      </section>

      <!-- 다가오는 일정 -->
      <section class="card" id="cardSched">
        <div class="card-head">
          <h3>다가오는 일정</h3><div class="spacer"></div>
          <span class="badge" id="schedBadge"></span>
        </div>
        <div class="card-body tight">
          <ul class="sched" id="schedList"></ul>
          <a class="pop-row" href="index.html?app=sched" style="text-decoration:none">전체 일정 보기 →</a>
        </div>
      </section>

    </div>

    <!-- 6) 하단: 습관 / 월간 목표 (한마디는 맨 위 인사 아래 한 줄로 옮겼다) -->
    <div class="grid g2">

      <section class="card" id="cardHabit">
        <div class="card-head">
          <h3>습관 체크</h3><div class="spacer"></div>
          <span class="badge ok" id="habitBadge"></span>
        </div>
        <div class="card-body"><div class="habits" id="habits"></div></div>
      </section>

      <section class="card" id="cardGoal">
        <div class="card-head">
          <h3>월간 목표</h3><div class="spacer"></div>
          <select id="goalMonth" style="width:auto" aria-label="월 선택"></select>
        </div>
        <div class="card-body" id="goalBody"></div>
      </section>

    </div>
  </div>
</main>
</template>

<template id="tpl-sched">
<main class="wrap" id="main">
  <section class="page active" id="page-main">

    <div class="page-head">
      <div><h2>통합 일정</h2></div>
    </div>

    <div class="calbar">
      <div class="nav">
        <button class="btn icon" id="btnPrev" aria-label="이전 기간">‹</button>
        <div class="month" id="calTitle"></div>
        <button class="btn icon" id="btnNext" aria-label="다음 기간">›</button>
      </div>
      <button class="btn sm" id="btnToday">오늘</button>
      <div class="seg" role="group" aria-label="보기 전환">
        <button type="button" data-view="month" aria-pressed="true">월</button>
        <button type="button" data-view="week" aria-pressed="false">주</button>
        <button type="button" data-view="day" aria-pressed="false">일</button>
      </div>
      <div class="spacer"></div>
      <span class="calmeta" id="pageSub"></span>
      <span class="calchip" id="overdueChip"></span>
      <button class="btn sm" id="filterToggle" aria-expanded="false" aria-controls="calFilters">필터</button>
      <div class="calfilters" id="calFilters">
        <label class="cf"><span>일정 종류</span><select id="fGroup" aria-label="일정 종류"></select></label>
        <label class="cf"><span>출처</span><select id="fOwner" aria-label="출처"></select></label>
        <label class="cf"><span>상태</span><select id="fStatus" aria-label="상태">
          <option value="all">전체 상태</option>
          <option value="open">미완료</option>
          <option value="done">완료</option>
          <option value="overdue">지연</option>
        </select></label>
        <label class="cf"><span>우선순위</span><select id="fPri" aria-label="우선순위">
          <option value="all">전체 우선순위</option>
          <option value="high">중요</option>
          <option value="normal">보통</option>
          <option value="low">낮음</option>
        </select></label>
        <label class="cf"><span>날짜로 이동</span><input type="date" id="jumpDate" aria-label="날짜로 이동"></label>
      </div>
      <div class="calchips" id="filterChips"></div>
    </div>

    <div class="schedwrap fitmain fitcols">
      <section class="card">
        <div class="card-body tight">
          <div id="calBody"></div>
          <div class="callegend" id="calLegend"></div>
        </div>
      </section>

      <div class="fit fitscroll">
        <section class="card">
          <div class="card-head">
            <h3 id="dayTitle">—</h3>
            <div class="spacer"></div>
            <span class="badge ok" id="dayTodayBadge" hidden>오늘</span>
          </div>
          <div class="card-body tight" id="dayGroups"></div>
          <div style="padding:12px 15px 15px">
            <button class="btn dashed wide" id="btnAddEvent">+ 다른 일정 추가</button>
          </div>
        </section>

        <section class="card" id="evDetail" hidden></section>
      </div>
    </div>
    <div class="sheet-scrim" id="evScrim" hidden></div>

  </section>
</main>

<!-- ================= 모달: 개인 일정 ================= -->
<div class="modal-bg" id="evModal"><div class="modal">
  <header><h3 id="evModalTitle">개인 일정 추가</h3><button class="iconbtn" data-close aria-label="닫기">X</button></header>
  <div class="body">

<div class="modal-bg" id="pasteModal"><div class="modal" style="max-width:820px">
  <header><h3>엑셀 붙여넣기로 강의 추가</h3><button class="iconbtn" data-close aria-label="닫기">X</button></header>
  <div class="body">

      <label class="field"><span>어느 자격증에 넣을까요</span><select id="pTarget"></select></label>
      <label class="field"><span>기존 목록 처리</span><select id="pMode">
        <option value="append">뒤에 이어 붙이기</option>
        <option value="replace">전체 교체</option>
      </select></label>
    </div>
    <div class="upbox">
      <input type="file" id="pFile" accept=".xlsx,.xlsm,.csv,.tsv,.txt" style="display:none">
      <button type="button" class="btn primary" id="pFileBtn">엑셀 파일 선택</button>
      <span class="dim" style="font-size:12px">.xlsx · .xlsm · .csv — 또는 아래 칸에 바로 붙여넣기</span>
      <div style="flex:1;min-width:8px"></div>
      <label class="field" id="pSheetWrap" style="max-width:220px;display:none">
        <span>시트</span><select id="pSheet"></select></label>
    </div>
    <div id="pFileMsg"></div>
    <label class="field"><span>붙여넣거나, 위에서 고른 파일 내용이 여기에 채워집니다</span>
      <textarea id="pText" class="pastebox" rows="7" spellcheck="false"
        placeholder="1강	소득세&#10;2강	법인세&#10;3강	부가가치세"></textarea></label>
    <label class="inline" style="gap:7px;margin:2px 0 8px">
      <input type="checkbox" id="pStrip" checked>
      <span style="font-size:13px">강의명 앞의 번호("1강", "1.") 떼기</span></label>
    <details style="margin-bottom:12px">
      <summary style="cursor:pointer;font-size:12.5px;color:var(--text-2)">붙여넣는 형식 안내</summary>
      <div class="pastehint" style="margin-top:8px">
        엑셀에서 칸을 드래그해 복사하면 그대로 붙여넣을 수 있습니다.
        한 열만 있으면 강의명으로 봅니다. 첫 줄에 <code>강의명</code> <code>구분</code> <code>마감일</code> <code>메모</code>
        <code>자격증</code> 같은 머리글이 있으면 그 순서를 따릅니다.
        <div class="pastesample"><pre>자격증	구분	강의명	마감일
컴활 2급	엑셀 기본	화면 구성과 기본 조작	2026-09-01
컴활 2급	엑셀 기본	데이터 입력과 셀 서식	2026-09-02
컴활 2급	엑셀 계산 작업	표 작성 및 데이터 관리	2026-09-05</pre></div>
        <div style="margin-top:7px">자격증 열을 넣으면 이름이 같은 자격증을 찾아 넣고, 없으면 새로 만들어 강의를 켭니다.
        강의명만 줄바꿈으로 나열해도 됩니다.</div>
      </div>
    </details>
    <div id="pPreview"></div>
  </div>
  <footer>
    <button class="btn" data-close>취소</button>
    <button class="btn primary" id="pApply">가져오기</button>
  </footer>
</div></div>

<script>
/* =========================================================
   store.js — 공통 기반 (저장소 / 날짜 / 공휴일 / 셸 / 테마 / UI 유틸)
   file:// 에서 바로 동작하도록 ES module 아닌 전역 스크립트로 작성
   ========================================================= */
(function (global) {
  'use strict';

  /* ---------- 저장소 ---------- */
  const Store = {
    load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return structuredClone(fallback);
        const parsed = JSON.parse(raw);
        return merge(structuredClone(fallback), parsed);
      } catch (e) {
        console.warn('load 실패, 기본값 사용:', key, e);
        return structuredClone(fallback);
      }
    },
    save(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        alert('저장 실패: 브라우저 저장 공간이 꽉 찼거나 차단되었습니다.');
        return false;
      }
    },
    raw(key) {
      try { return JSON.parse(localStorage.getItem(key) || 'null'); }
      catch (e) { return null; }
    },
  };

  // 기본값 스키마를 유지하면서 저장된 값을 덮어씀 (버전 올릴 때 필드 유실 방지)
  function merge(base, patch) {
    if (patch === null || patch === undefined) return base;
    if (Array.isArray(base) || Array.isArray(patch)) return patch;
    if (typeof base !== 'object' || typeof patch !== 'object') return patch;
    const out = base;
    for (const k of Object.keys(patch)) {
      out[k] = k in base ? merge(base[k], patch[k]) : patch[k];
    }
    return out;
  }

  /* ---------- 날짜 ---------- */
  const DAY = 86400000;

  function todayStr() {
    const d = new Date();
    return ymd(d);
  }
  function ymd(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function parse(s) {
    if (!s) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function addDays(s, n) {
    const d = parse(s);
    if (!d) return s;
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  // 남은 일수 (오늘=0, 미래=양수, 지남=음수)
  function dday(s) {
    const d = parse(s);
    if (!d) return null;
    const t = parse(todayStr());
    return Math.round((d - t) / DAY);
  }
  function ddayLabel(s) {
    const n = dday(s);
    if (n === null) return '—';
    if (n === 0) return 'D-DAY';
    return n > 0 ? `D-${n}` : `D+${-n}`;
  }
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  function weekday(s) {
    const d = parse(s);
    return d ? WD[d.getDay()] : '';
  }
  function fmtKo(s) {
    const d = parse(s);
    if (!d) return '—';
    return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`;
  }
  function fmtLong(s) {
    const d = parse(s);
    if (!d) return '—';
    return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}. (${WD[d.getDay()]})`;
  }
  // 이번 주(월~일) 범위
  function weekRange(base) {
    const d = parse(base || todayStr());
    const dow = (d.getDay() + 6) % 7; // 월=0
    const start = new Date(d); start.setDate(d.getDate() - dow);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return { start: ymd(start), end: ymd(end) };
  }
  function monthKey(s) { return (s || todayStr()).slice(0, 7); }

  /* =========================================================
     공휴일 — 연도 제한 없이 계산한다.
       · 양력 고정 공휴일 + 대체공휴일 규칙은 규칙으로 생성
       · 설날 / 부처님오신날 / 추석은 음력을 천문 계산(삭·절기)으로 환산
       · 계산이 어긋나면 LUNAR_FALLBACK 표를, 마지막으로 사용자 지정 공휴일을 적용
     ========================================================= */
  const HOLIDAY_KEY = 'lm.holidays.v1';   // { add: {'YYYY-MM-DD': '이름'}, remove: ['YYYY-MM-DD'] }

  /* ---- 천문 계산 (Meeus, Astronomical Algorithms) ---- */
  const RAD = Math.PI / 180;
  const sin = d => Math.sin(d * RAD);

  /** k번째 삭(새 달)의 율리우스일 (TD 기준) */
  function newMoonJd(k) {
    const T = k / 1236.85, T2 = T * T, T3 = T2 * T, T4 = T3 * T;
    let jd = 2451550.09766 + 29.530588861 * k + 0.00015437 * T2 - 0.000000150 * T3 + 0.00000000073 * T4;
    const E = 1 - 0.002516 * T - 0.0000074 * T2;
    const M = 2.5534 + 29.10535670 * k - 0.0000014 * T2 - 0.00000011 * T3;
    const Mp = 201.5643 + 385.81693528 * k + 0.0107582 * T2 + 0.00001238 * T3 - 0.000000058 * T4;
    const F = 160.7108 + 390.67050284 * k - 0.0016118 * T2 - 0.00000227 * T3 + 0.000000011 * T4;
    const Om = 124.7746 - 1.56375588 * k + 0.0020672 * T2 + 0.00000215 * T3;
    jd += -0.40720 * sin(Mp) + 0.17241 * E * sin(M) + 0.01608 * sin(2 * Mp)
      + 0.01039 * sin(2 * F) + 0.00739 * E * sin(Mp - M) - 0.00514 * E * sin(Mp + M)
      + 0.00208 * E * E * sin(2 * M) - 0.00111 * sin(Mp - 2 * F) - 0.00057 * sin(Mp + 2 * F)
      + 0.00056 * E * sin(2 * Mp + M) - 0.00042 * sin(3 * Mp) + 0.00042 * E * sin(M + 2 * F)
      + 0.00038 * E * sin(M - 2 * F) - 0.00024 * E * sin(2 * Mp - M) - 0.00017 * sin(Om)
      - 0.00007 * sin(Mp + 2 * M) + 0.00004 * sin(2 * Mp - 2 * F) + 0.00004 * sin(3 * M)
      + 0.00003 * sin(Mp + M - 2 * F) + 0.00003 * sin(2 * Mp + 2 * F) - 0.00003 * sin(Mp + M + 2 * F)
      + 0.00003 * sin(Mp - M + 2 * F) - 0.00002 * sin(Mp - M - 2 * F) - 0.00002 * sin(3 * Mp + M)
      + 0.00002 * sin(4 * Mp);
    return jd - deltaT(jd) / 86400;   // TD → UT
  }
  /** ΔT 근사 (1990~2060 구간) */
  function deltaT(jd) {
    const y = 2000 + (jd - 2451545) / 365.25;
    if (y < 2005) return 63.86 + 0.3345 * (y - 2000);
    if (y < 2050) return 62.92 + 0.32217 * (y - 2000) + 0.005589 * (y - 2000) * (y - 2000);
    return 93;
  }
  /** 태양 황경(도) */
  function sunLongitude(jd) {
    const T = (jd - 2451545) / 36525;
    const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * sin(M)
      + (0.019993 - 0.000101 * T) * sin(2 * M) + 0.000289 * sin(3 * M);
    const Om = 125.04 - 1934.136 * T;
    let lon = L0 + C - 0.00569 - 0.00478 * sin(Om);
    return ((lon % 360) + 360) % 360;
  }
  /** 태양 황경이 target(도)이 되는 시각을 이분법으로 찾음 */
  function solarTermJd(year, target) {
    // 해당 연도 안에서 target 각을 지나는 시점을 찾는다 (동지는 12월)
    let lo = jdFromYmd(year, 1, 1), hi = lo + 400;
    const f = jd => {
      let d = sunLongitude(jd) - target;
      while (d > 180) d -= 360;
      while (d < -180) d += 360;
      return d;
    };
    // target 각을 지나는 구간 탐색
    let a = lo;
    for (let i = 0; i < 400; i++) {
      const b = a + 1;
      if (f(a) <= 0 && f(b) > 0) { lo = a; hi = b; break; }
      a = b;
      if (a > hi) break;
    }
    for (let i = 0; i < 60; i++) {
      const mid = (lo + hi) / 2;
      if (f(mid) <= 0) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  function jdFromYmd(y, m, d) {
    let yy = y, mm = m;
    if (mm <= 2) { yy -= 1; mm += 12; }
    const A = Math.floor(yy / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (yy + 4716)) + Math.floor(30.6001 * (mm + 1)) + d + B - 1524.5;
  }
  /** UT 기준 율리우스일 → 한국시(UTC+9) 날짜 문자열 */
  function kstYmd(jd) {
    const z = Math.floor(jd + 0.5 + 9 / 24);
    let a = z;
    if (z >= 2299161) {
      const alpha = Math.floor((z - 1867216.25) / 36524.25);
      a = z + 1 + alpha - Math.floor(alpha / 4);
    }
    const b = a + 1524, c = Math.floor((b - 122.1) / 365.25);
    const d = Math.floor(365.25 * c), e = Math.floor((b - d) / 30.6001);
    const day = b - d - Math.floor(30.6001 * e);
    const month = e < 14 ? e - 1 : e - 13;
    const year = month > 2 ? c - 4716 : c - 4715;
    const p2 = n => String(n).padStart(2, '0');
    return `${year}-${p2(month)}-${p2(day)}`;
  }
  /** 삭이 속한 한국 날짜의 0시 JD (월의 첫날) */
  function monthStartJd(jd) {
    return Math.floor(jd + 0.5 + 9 / 24) - 0.5 - 9 / 24;
  }

  /**
   * 해당 연도의 음력 1월 1일 / 4월 8일 / 8월 15일 (양력 환산)
   * 동지가 포함된 달을 11월로 삼고, 윤달(절기 없는 달) 규칙으로 월 번호를 정한다.
   */
  function lunarKeyDates(year) {
    const ws0 = solarTermJd(year - 1, 270);            // 전년 동지
    const ws1 = solarTermJd(year, 270);                // 당년 동지
    let k = Math.round((ws0 - 2451550.09766) / 29.530588861) - 2;
    const moons = [];
    for (let i = 0; i < 18; i++) moons.push(monthStartJd(newMoonJd(k + i)));
    // 동지를 포함하는 달 = 11월
    let i11 = 0;
    for (let i = 0; i < moons.length - 1; i++) {
      if (moons[i] <= ws0 && ws0 < moons[i + 1]) { i11 = i; break; }
    }
    let j11 = i11;
    for (let i = i11 + 1; i < moons.length - 1; i++) {
      if (moons[i] <= ws1 && ws1 < moons[i + 1]) { j11 = i; break; }
    }
    const span = j11 - i11;                             // 12 또는 13
    // 각 달에 중기(황경 30도 배수)가 있는지 검사
    const hasMajor = idx => {
      const a = moons[idx], b = moons[idx + 1];
      for (let t = 0; t < 12; t++) {
        const target = (t * 30) % 360;
        const jd = solarTermJdNear(a, b, target);
        if (jd !== null) return true;
      }
      return false;
    };
    let leapIdx = -1;
    if (span === 13) {
      for (let i = i11 + 1; i < j11; i++) {
        if (!hasMajor(i)) { leapIdx = i; break; }
      }
    }
    // 월 번호 부여: i11 = 11월
    const num = {};
    let m = 11, leapUsed = false;
    for (let i = i11; i <= j11; i++) {
      if (i === leapIdx && !leapUsed) { num[i] = { m: m, leap: true }; leapUsed = true; continue; }
      num[i] = { m: m, leap: false };
      m = m % 12 + 1;
    }
    const find = want => {
      for (const key of Object.keys(num)) {
        const v = num[key];
        if (!v.leap && v.m === want) return moons[Number(key)];
      }
      return null;
    };
    const m1 = find(1), m4 = find(4), m8 = find(8);
    return {
      seollal: m1 !== null ? kstYmd(m1 + 0.5) : null,
      buddha: m4 !== null ? kstYmd(m4 + 7 + 0.5) : null,
      chuseok: m8 !== null ? kstYmd(m8 + 14 + 0.5) : null,
    };
  }
  /** [a,b) 구간에서 태양 황경이 target이 되는 순간 (없으면 null) */
  function solarTermJdNear(a, b, target) {
    const f = jd => {
      let d = sunLongitude(jd) - target;
      while (d > 180) d -= 360;
      while (d < -180) d += 360;
      return d;
    };
    let lo = null, hi = null;
    for (let t = a; t < b; t += 1) {
      const u = Math.min(t + 1, b);
      if (f(t) <= 0 && f(u) > 0) { lo = t; hi = u; break; }
    }
    if (lo === null) return null;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      if (f(mid) <= 0) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  /* 계산이 실패할 때 쓰는 확인된 값 */
  const LUNAR_FALLBACK = {
    2026: { seollal: '2026-02-17', buddha: '2026-05-24', chuseok: '2026-09-25' },
    2027: { seollal: '2027-02-07', buddha: '2027-05-13', chuseok: '2027-09-15' },
  };

  /* 양력 고정 공휴일 — 세 번째 값은 대체공휴일 규칙
     'satsun' : 토·일 또는 다른 공휴일과 겹치면 대체 (3·1절, 어린이날, 광복절, 개천절, 한글날, 성탄절, 부처님오신날)
     'sun'    : 일요일과 겹칠 때만 대체 (설날·추석 연휴)
     false    : 대체 없음 (신정, 현충일)                                   */
  const SOLAR_FIXED = [
    [1, 1, '신정', false],
    [3, 1, '삼일절', 'satsun'],
    [5, 5, '어린이날', 'satsun'],
    [6, 6, '현충일', false],
    [8, 15, '광복절', 'satsun'],
    [10, 3, '개천절', 'satsun'],
    [10, 9, '한글날', 'satsun'],
    [12, 25, '성탄절', 'satsun'],
  ];

  /* 선거일 등 법정 임시공휴일 — 확정된 일정만 (그 외는 설정에서 직접 추가) */
  const SPECIAL_HOLIDAYS = {
    '2026-06-03': '제9회 전국동시지방선거',
    '2027-03-03': '제21대 대통령선거',
    '2028-04-12': '제23대 국회의원선거',
    '2030-06-05': '제10회 전국동시지방선거',
    '2032-04-14': '제24대 국회의원선거',
    '2032-03-03': '제22대 대통령선거',
  };

  const holidayCache = {};

  function customHolidays() {
    try {
      const raw = JSON.parse(localStorage.getItem(HOLIDAY_KEY) || 'null');
      return { add: (raw && raw.add) || {}, remove: (raw && raw.remove) || [] };
    } catch (e) { return { add: {}, remove: [] }; }
  }
  function saveCustomHolidays(obj) {
    try {
      localStorage.setItem(HOLIDAY_KEY, JSON.stringify({ add: obj.add || {}, remove: obj.remove || [] }));
      Object.keys(holidayCache).forEach(k => delete holidayCache[k]);
      return true;
    } catch (e) { return false; }
  }

  /** 해당 연도 공휴일 지도 { 'YYYY-MM-DD': '이름' } */
  function holidayMap(year) {
    const y = Number(year);
    if (holidayCache[y]) return holidayCache[y];
    const p2 = n => String(n).padStart(2, '0');
    const d = (m, dd) => `${y}-${p2(m)}-${p2(dd)}`;
    const map = {};
    const subst = [];      // 대체공휴일 대상 [날짜, 이름, 규칙]

    for (const [m, dd, name, rule] of SOLAR_FIXED) {
      const date = d(m, dd);
      map[date] = name;
      if (rule) subst.push([date, name, rule]);
    }

    /* 같은 날 두 공휴일이 겹치면 이름을 함께 표기 */
    const mark = (date, name) => {
      map[date] = map[date] && map[date] !== name ? map[date] + ' · ' + name : name;
    };

    let lun = null;
    try { lun = lunarKeyDates(y); } catch (e) { lun = null; }
    if (!lun || !lun.seollal || !lun.chuseok || !lun.buddha) lun = LUNAR_FALLBACK[y] || lun;
    if (lun && lun.seollal) {
      mark(addDaysRaw(lun.seollal, -1), '설날 연휴');
      mark(lun.seollal, '설날');
      mark(addDaysRaw(lun.seollal, 1), '설날 연휴');
      subst.push([lun.seollal, '설날', 'sun'], [addDaysRaw(lun.seollal, -1), '설날', 'sun'], [addDaysRaw(lun.seollal, 1), '설날', 'sun']);
    }
    if (lun && lun.chuseok) {
      mark(addDaysRaw(lun.chuseok, -1), '추석 연휴');
      mark(lun.chuseok, '추석');
      mark(addDaysRaw(lun.chuseok, 1), '추석 연휴');
      subst.push([lun.chuseok, '추석', 'sun'], [addDaysRaw(lun.chuseok, -1), '추석', 'sun'], [addDaysRaw(lun.chuseok, 1), '추석', 'sun']);
    }
    if (lun && lun.buddha) {
      mark(lun.buddha, '부처님오신날');
      subst.push([lun.buddha, '부처님오신날', 'satsun']);
    }

    /* 대체공휴일: 일요일(어린이날은 토·일)이거나 다른 공휴일과 겹치면 다음 비공휴일로 */
    const dow = str => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
      return new Date(+m[1], +m[2] - 1, +m[3]).getDay();
    };
    const seen = {};
    for (const [date, name, rule] of subst) {
      const w = dow(date);
      const dup = seen[date];
      seen[date] = true;
      const needs = rule === 'satsun' ? (w === 0 || w === 6 || dup) : (w === 0 || dup);
      if (!needs) continue;
      let cur = addDaysRaw(date, 1), guard = 0;
      while (guard++ < 10 && (map[cur] || dow(cur) === 0 || dow(cur) === 6)) cur = addDaysRaw(cur, 1);
      if (!map[cur]) map[cur] = `${name} 대체공휴일`;
    }

    /* 선거일 등 확정된 임시공휴일 */
    for (const date of Object.keys(SPECIAL_HOLIDAYS)) {
      if (date.startsWith(String(y))) map[date] = SPECIAL_HOLIDAYS[date];
    }

    /* 사용자 지정 */
    const cu = customHolidays();
    for (const date of cu.remove) if (date.startsWith(String(y))) delete map[date];
    for (const date of Object.keys(cu.add)) if (date.startsWith(String(y))) map[date] = cu.add[date];

    holidayCache[y] = map;
    return map;
  }

  /* addDays 를 쓰기 전에 필요한 경량 버전 (holidayMap 내부용) */
  function addDaysRaw(str, n) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
    if (!m) return str;
    const dt = new Date(+m[1], +m[2] - 1, +m[3]);
    dt.setDate(dt.getDate() + n);
    const p2 = x => String(x).padStart(2, '0');
    return `${dt.getFullYear()}-${p2(dt.getMonth() + 1)}-${p2(dt.getDate())}`;
  }

  /** 하위호환: 올해 기준 앞뒤 몇 해의 공휴일을 합친 객체 */
  const HOLIDAYS = (() => {
    const out = {};
    const now = new Date().getFullYear();
    for (let y = now - 1; y <= now + 3; y++) Object.assign(out, holidayMap(y));
    return out;
  })();

  function isOffDay(s) {
    const dt = parse(s);
    if (!dt) return false;
    const dow = dt.getDay();
    if (dow === 0 || dow === 6) return true;
    return !!holidayMap(s.slice(0, 4))[s];
  }
  /** 주말·공휴일이면 다음 영업일로 밀어냄 (국세 신고기한 규칙) */
  function nextBusinessDay(s) {
    let cur = s, guard = 0;
    while (isOffDay(cur) && guard++ < 30) cur = addDays(cur, 1);
    return cur;
  }

  function holidayList(year) {
    const map = holidayMap(year);
    return Object.keys(map).sort().map(date => ({ date, name: map[date] }));
  }

  function uid() {
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
  function pct(a, b) { return b > 0 ? clamp(Math.round((a / b) * 100), 0, 100) : 0; }
  function param(name) {
    try { return new URLSearchParams(location.search).get(name) || ''; }
    catch (e) { return ''; }
  }
