<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>차곡차곡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22 width=%2264%22 height=%2264%22> <rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22#617047%22/> <path d=%22M32 47s-14-8.6-14-18a7.8 7.8 0 0 1 14-4.6A7.8 7.8 0 0 1 46 29c0 9.4-14 18-14 18Z%22 fill=%22none%22 stroke=%22#fffdf7%22 stroke-width=%223.4%22 stroke-linejoin=%22round%22/> </svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* =========================================================
   app.css — 공통 디자인 시스템
   구조: 좌측 사이드바(.side) + 상단 헤더(.topbar) + 본문(.wrap)
   테마: cream / white / dark / blue / pastel  (data-theme)
   ========================================================= */

/* ---------- 1. 토큰 ---------- */
:root {
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
  /* 제목용 — 고운바탕(웹폰트). 인터넷이 없으면 시스템 명조로 자연스럽게 대체된다 */
  --serif: "Gowun Batang", "Nanum Myeongjo", "함초롬바탕", Batang, "바탕", Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;

  --r-lg: 18px;
  --radius: 13px;       /* 기존 이름 유지 */
  --r: 13px;
  --radius-sm: 9px;
  --r-sm: 9px;
  --r-pill: 999px;
  --side-w: 246px;
  --head-h: 58px;
  --dur: 190ms;
  --ui-zoom: 1;   /* 화면 배율 — store.js 가 갱신한다 */
}

/* 1) 크림 · 올리브 (기본) */
:root, :root[data-theme="cream"] {
  --bg: #f4f1e8; --surface: #fffdf7; --surface-2: #f6f2e7; --surface-3: #eee9da;
  --border: #e6dfcd; --border-strong: #cfc6b0;
  --text: #2e2d25; --text-2: #6d6a5c; --text-3: #95907f;
  --accent: #617047; --accent-2: #8d9c72; --accent-soft: #edefe0; --on-accent: #fffdf7;
  --ok: #1b7b4d; --ok-soft: #e9f4ed;
  --warn: #956516; --warn-soft: #fbf4e5;
  --danger: #b23a2c; --danger-soft: #fbe9e6;
  --purple: #776686; --purple-soft: #f3eef5;   /* 기존 이름 유지 */
  --info: #776686; --info-soft: #f3eef5;
  --shadow: 0 1px 2px rgba(72, 64, 44, .05);
  --shadow-1: 0 1px 2px rgba(72, 64, 44, .05);
  --shadow-2: 0 6px 22px rgba(72, 64, 44, .08);
  --overlay: rgba(38, 34, 24, .44);
}

/* 2) 화이트 · 세이지 — 포그 화이트
      색을 거의 지운 밝은 회백색 바탕에 깊은 소나무색 포인트 하나. */
:root[data-theme="white"] {
  --bg: #f2f4f3; --surface: #fcfdfc; --surface-2: #edf0ef; --surface-3: #e3e7e6;
  --border: #e1e5e4; --border-strong: #c6cbca;
  --text: #1f2523; --text-2: #5a6360; --text-3: #868e8b;
  --accent: #577368; --accent-2: #668175; --accent-soft: #f0f4f1; --on-accent: #fcfdfc;
  --ok: #207d59; --ok-soft: #eff6f4;
  --warn: #916712; --warn-soft: #f9f6ee;
  --danger: #bf463b; --danger-soft: #fbf3f3;
  --purple: #666f8d; --purple-soft: #f5f5f8;
  --info: #666f8d; --info-soft: #f5f5f8;
  --shadow: 0 1px 2px rgba(26, 38, 34, .05);
  --shadow-1: 0 1px 2px rgba(26, 38, 34, .05);
  --shadow-2: 0 6px 22px rgba(26, 38, 34, .08);
  --overlay: rgba(20, 30, 26, .44);
}

/* 3) 다크 — 네이비 하이콘트라스트
      깊은 남색 바탕 위에 카드를 한 단계 띄워, 어둡지만 표·목록이 또렷하게 읽힌다. */
:root[data-theme="dark"] {
  --bg: #090d16; --surface: #161e2d; --surface-2: #1e2839; --surface-3: #27334a;
  --border: #2c3a52; --border-strong: #46567a;
  --text: #eef3fa; --text-2: #aab8cd; --text-3: #7f8da2;
  --accent: #a7cbe8; --accent-2: #82aed3; --accent-soft: #1c2d40; --on-accent: #0a141e;
  --ok: #6fd7b6; --ok-soft: #102c25;
  --warn: #ecc384; --warn-soft: #2b2317;
  --danger: #f59b98; --danger-soft: #2f1b20;
  --purple: #bcb4ec; --purple-soft: #262444;
  --info: #bcb4ec; --info-soft: #262444;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .55);
  --overlay: rgba(3, 6, 12, .68);
}

/* 4) 파스텔 블루 — 스틸 슬레이트
      푸른 기를 회색 쪽으로 당겨 배경이 물들지 않게 한 안. */
:root[data-theme="blue"] {
  --bg: #eff1f4; --surface: #fafbfc; --surface-2: #e9ecf0; --surface-3: #dfe4e9;
  --border: #dde2e7; --border-strong: #c2c9d1;
  --text: #232b33; --text-2: #5c6873; --text-3: #87919b;
  --accent: #4e708e; --accent-2: #7891a8; --accent-soft: #eff2f5; --on-accent: #fafbfc;
  --ok: #227a6b; --ok-soft: #f0f6f5;
  --warn: #8f671d; --warn-soft: #f8f3ea;
  --danger: #b54b3e; --danger-soft: #faf0ef;
  --purple: #676c91; --purple-soft: #f2f2f6;
  --info: #676c91; --info-soft: #f2f2f6;
  --shadow: 0 1px 2px rgba(28, 44, 60, .06);
  --shadow-1: 0 1px 2px rgba(28, 44, 60, .06);
  --shadow-2: 0 6px 22px rgba(28, 44, 60, .09);
  --overlay: rgba(20, 34, 48, .44);
}

/* 5) 파스텔 핑크 — 안개 로즈
      분홍을 안개처럼 옅게만 남기고 바탕·카드 차이를 좁혀 가장 고요한 화면. */
:root[data-theme="pastel"] {
  --bg: #f1eff0; --surface: #f8f6f7; --surface-2: #e9e6e8; --surface-3: #dfdbde;
  --border: #e3dfe1; --border-strong: #c7c2c5;
  --text: #383437; --text-2: #6a6467; --text-3: #928c90;
  --accent: #82636e; --accent-2: #a88f97; --accent-soft: #f3eef0; --on-accent: #f8f6f7;
  --ok: #3a7659; --ok-soft: #ebf1ed;
  --warn: #8a6520; --warn-soft: #f3efe4;
  --danger: #b24942; --danger-soft: #f6edec;
  --purple: #6f6786; --purple-soft: #f0f0f4;
  --info: #6f6786; --info-soft: #f0f0f4;
  --shadow: 0 1px 2px rgba(64, 54, 58, .05);
  --shadow-1: 0 1px 2px rgba(64, 54, 58, .05);
  --shadow-2: 0 6px 22px rgba(64, 54, 58, .08);
  --overlay: rgba(48, 42, 45, .44);
}

/* ---------- 2. 기본 ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { flex: none; vertical-align: -.14em; }
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 3. 사이드바 ---------- */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side-w); z-index: 70;
  display: flex; flex-direction: column; gap: 2px; padding: 18px 13px 14px;
  background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto;
  transition: transform var(--dur) ease;
}
.brand { display: flex; align-items: center; gap: 9px; padding: 3px 10px 16px; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand .mark {
  width: 26px; height: 26px; border-radius: 8px; flex: none;
  background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
}
.brand .nm { font-family: var(--serif); font-size: 18px; letter-spacing: .01em; }

.tabs { display: flex; flex-direction: column; flex: 1 0 auto; }
.tabs .grow { flex: 1; min-height: 10px; }
.tab, .nav-link {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px;
  padding: 8px 12px; border: 0; border-radius: var(--r-sm); background: transparent;
  color: var(--text-2); font-weight: 550; text-align: left; cursor: pointer;
  transition: background var(--dur) ease, color var(--dur) ease;
}
.tab .ic, .nav-link .ic { opacity: .85; }
.tab .lb, .nav-link .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab:hover, .nav-link:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.tab .tail { font-size: 11px; font-weight: 700; color: var(--text-3); }
.tab.active .tail { color: var(--accent); }
.nav-link.as-btn { }

.nav-group { margin-top: 8px; }
.nav-head {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 7px 12px; border: 0; background: transparent; cursor: pointer;
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em; color: var(--text-3);
  border-radius: var(--r-sm);
}
.nav-head:hover { background: var(--surface-2); color: var(--text-2); }
.nav-head span { flex: 1; text-align: left; }
.nav-head .ic { transition: transform var(--dur) ease; }
.nav-head[aria-expanded="false"] .ic { transform: rotate(-90deg); }
.nav-sub { display: grid; gap: 1px; }
.nav-sub[hidden] { display: none; }
.nav-sub > .tab, .nav-sub > .nav-link { padding-left: 14px; font-size: 12px; min-height: 34px; gap: 9px; }
.nav-sub > .tab .tail { font-size: 10px; }
.nav-sep { height: 1px; background: var(--border); margin: 10px 10px; }
.side .grow { flex: 1; min-height: 10px; }
.side-note {
  flex: none; margin: 8px 4px 0; padding: 13px; border-radius: var(--r);
  background: var(--surface-2); border: 1px solid var(--border);
}
/* 항목이 많거나 화면이 낮으면 사이드바를 촘촘하게 */
@media (max-height: 940px) {
  .side { padding: 14px 12px 12px; }
  .brand { padding: 2px 10px 12px; }
  .tab, .nav-link { min-height: 34px; padding: 7px 12px; }
  .nav-head { padding: 6px 12px; }
  .nav-group { margin-top: 6px; }
  .nav-sep { margin: 8px 10px; }
}
@media (max-height: 880px) { .side-note { display: none; } }
.side-note:empty { display: none; }
.side-note .q { font-family: var(--serif); font-size: 13px; line-height: 1.6; color: var(--text-2); }
.side-note .c { margin-top: 7px; font-size: 11px; color: var(--text-3); }

/* ---------- 4. 상단 헤더 ---------- */
.shell {
  margin-left: var(--side-w);
  min-height: calc(100vh / var(--ui-zoom, 1));
  min-height: calc(100dvh / var(--ui-zoom, 1));   /* 주소창이 접혔다 펴져도 흔들리지 않게 */
  display: flex; flex-direction: column; transition: margin var(--dur) ease;
}
.topbar {
  position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 8px;
  min-height: var(--head-h); padding: 0 18px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar .spacer { flex: 1; }

/* 현재 위치 표시 (상위 그룹 › 현재 화면) */
.crumb { display: flex; align-items: center; gap: 5px; min-width: 0; padding: 0 4px; }
.crumb .up { font-size: 13px; color: var(--text-3); white-space: nowrap; }
.crumb .ic { color: var(--text-3); flex: none; }
.crumb b { font-size: 14.5px; font-weight: 650; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 상단 빠른 추가 */
.btn.qa { flex: none; gap: 5px; min-height: 32px; padding: 5px 11px; font-size: 12.5px; }
@media (max-width: 900px) { .btn.qa .lb { display: none; } .btn.qa { padding: 8px 10px; } }

.search {
  display: flex; align-items: center; gap: 7px; width: 208px; max-width: 30vw;
  padding: 4px 11px; min-height: 32px; font-size: 12.5px;
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--text-3);
}
/* 전역 input 규칙(min-height 38px)보다 뒤에 오도록 속성 선택자로 우선순위를 높인다 */
.search input[type="text"] {
  flex: 1; min-width: 0; min-height: 0; height: 22px; padding: 0;
  border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--text);
}
.search input[type="text"]:focus { outline: none; border: 0; }
.iconbtn {
  width: 36px; height: 36px; flex: none; display: grid; place-items: center;
  border: 1px solid transparent; border-radius: var(--r-sm); background: transparent;
  color: var(--text-2); cursor: pointer; position: relative;
  transition: background var(--dur) ease, color var(--dur) ease;
}
.iconbtn:hover { background: var(--surface-2); color: var(--text); }
.iconbtn.dot::after {
  content: ""; position: absolute; top: 7px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--danger);
  border: 1.5px solid var(--surface);
}
.avatar {
  width: 33px; height: 33px; flex: none; border-radius: 50%; cursor: pointer;
  background: var(--surface-3); color: var(--text-2);
  display: grid; place-items: center; border: 1px solid var(--border);
}
.avatar:hover { color: var(--text); }
.burger { display: none; }
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 65; display: none; }

/* ---------- 5. 본문 ---------- */
.wrap { width: 100%; max-width: 1400px; margin: 0 auto; padding: 24px 22px 64px; }
.page { display: none; }
.page.active { display: block; animation: fade var(--dur) ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.page-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h2 { font-family: var(--serif); font-size: 23px; font-weight: 400; }
.page-head .sub { color: var(--text-2); font-size: 13px; margin-top: 5px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- 6. 카드 / 그리드 ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card > .card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 15px 17px 11px;
}
.card > .card-head h3 { font-size: 14.5px; }
.card > .card-head .spacer { flex: 1; }
.card > .card-body { padding: 0 17px 17px; }
.card > .card-body.tight { padding: 0 0 4px; }
.card > .card-body.tight.table-wrap { padding: 0; }
.card.accent-fill { background: var(--accent-soft); border-color: transparent; }
.card.accent-fill h3 { color: var(--accent); }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(212px, 100%), 1fr)); }

/* ---------- 7. 스탯 타일 ---------- */
.stat {
  display: flex; align-items: flex-start; flex-wrap: wrap; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 15px 17px; box-shadow: var(--shadow-1);
}
button.stat, a.stat { cursor: pointer; transition: transform var(--dur) ease, box-shadow var(--dur) ease, border-color var(--dur) ease; }
button.stat:hover, a.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--border-strong); text-decoration: none; }
.stat .txt { flex: 1; min-width: 0; }
/* 래퍼 없이 label/value/foot 만 넣는 기존 마크업도 세로로 쌓이게 */
.stat > .label, .stat > .lb, .stat > .value, .stat > .vl,
.stat > .foot, .stat > .ft, .stat > .bar { flex: 0 0 100%; margin-top: 0; }
.stat > .value, .stat > .vl { margin-top: -8px; }
.stat > .foot, .stat > .ft { margin-top: -8px; }
.stat > .bar { margin-top: 0; }
.stat .label, .stat .lb { font-size: 12px; font-weight: 650; color: var(--text-2); }
.stat .value, .stat .vl {
  font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.stat .value small, .stat .vl small { font-size: 13px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
.stat .foot, .stat .ft { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.stat .ico {
  width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.stat .chev { align-self: center; flex: none; color: var(--text-3); }
.stat .bar { margin-top: 8px; }
.stat.accent .value, .stat.accent .vl { color: var(--accent); }
.stat.ok .value, .stat.ok .vl { color: var(--ok); }
.stat.warn .value, .stat.warn .vl { color: var(--warn); }
.stat.danger .value, .stat.danger .vl { color: var(--danger); }
.stat.purple .value, .stat.purple .vl, .stat.info .value, .stat.info .vl { color: var(--purple); }
.stat.accent .ico { background: var(--accent-soft); color: var(--accent); }
.stat.ok .ico { background: var(--ok-soft); color: var(--ok); }
.stat.warn .ico { background: var(--warn-soft); color: var(--warn); }
.stat.danger .ico { background: var(--danger-soft); color: var(--danger); }
.stat.purple .ico, .stat.info .ico { background: var(--purple-soft); color: var(--purple); }

/* ---------- 8. 진행바 / 링 ---------- */
.bar { height: 6px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--accent); transition: width 320ms ease; }
.bar.ok > i { background: var(--ok); }
.bar.warn > i { background: var(--warn); }
.bar.danger > i { background: var(--danger); }
.bar.purple > i, .bar.info > i { background: var(--purple); }
.bar.sm { height: 5px; }
.ring { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.ring > svg { flex: none; }
.ring .kv b { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ring .kv span { font-size: 12.5px; color: var(--text-2); }
.ring .kv p { margin-top: 5px; font-size: 12px; color: var(--text-3); }

/* ---------- 9. 버튼 ---------- */
.btn {
  appearance: none; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  min-height: 38px; padding: 8px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  transition: background var(--dur) ease, border-color var(--dur) ease, transform var(--dur) ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(.5px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger); border-color: var(--border); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { min-height: 32px; padding: 5px 11px; font-size: 12.5px; }
.btn.icon { padding: 0; width: 34px; height: 34px; min-height: 34px; justify-content: center; }
.btn.wide { width: 100%; justify-content: center; }
.btn.dashed { border-style: dashed; background: transparent; color: var(--text-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- 10. 폼 ---------- */
label.field { display: block; }
label.field > span { display: block; font-size: 12px; font-weight: 650; color: var(--text-2); margin-bottom: 5px; }
input[type="text"], input[type="number"], input[type="date"], input[type="url"],
input[type="time"], input[type="month"], select, textarea {
  width: 100%; font: inherit; color: var(--text); min-height: 38px;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--r-sm); padding: 7px 10px;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
}
textarea { resize: vertical; min-height: 68px; }
input[type="checkbox"] { width: 17px; height: 17px; min-height: 0; accent-color: var(--accent); cursor: pointer; margin: 0; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); }
.form-grid .span2 { grid-column: span 2; }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- 11. 표 ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th, table.tbl td { padding: 10px 13px; text-align: left; vertical-align: middle; }
table.tbl th {
  font-size: 11px; font-weight: 700; color: var(--text-3);
  letter-spacing: .05em; background: var(--surface-2);
  position: sticky; top: 0; white-space: nowrap; z-index: 1;
}
table.tbl td { border-top: 1px solid var(--border); }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
table.tbl td.act { text-align: right; white-space: nowrap; }
table.tbl tr.done td:not(.act) { color: var(--text-3); }
table.tbl tr.done td .ttl { text-decoration: line-through; }
table.tbl td select, table.tbl td input[type="text"], table.tbl td input[type="date"], table.tbl td input[type="number"] {
  min-height: 34px; padding: 4px 8px;
}

/* ---------- 12. 배지 / 칩 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.badge.purple, .badge.info { background: var(--purple-soft); color: var(--purple); border-color: transparent; }
.badge.mono { font-family: var(--mono); font-size: 11px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  appearance: none; cursor: pointer; font-weight: 600; font-size: 12.5px;
  min-height: 34px; padding: 6px 13px; border-radius: var(--r-pill);
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2);
}
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ---------- 13. 리스트 ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list > li {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 17px; border-top: 1px solid var(--border);
}
.list > li:first-child { border-top: 0; }
.list > li:hover { background: var(--surface-2); }
.list .grow { flex: 1; min-width: 0; }
.list .ttl { font-weight: 550; }
.list .meta { font-size: 12px; color: var(--text-2); margin-top: 1px; }
.list li.done .ttl { text-decoration: line-through; color: var(--text-3); }

/* ---------- 14. 캘린더 ---------- */
.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-head .month { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 128px; }
.cal {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
  /* 첫 줄(요일 머리글)만 내용 높이, 나머지 주는 모두 같은 높이로 늘어난다 */
  grid-template-rows: auto; grid-auto-rows: minmax(92px, 1fr);
  background: var(--border); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
}
.cal .dow { background: var(--surface-2); padding: 7px 0; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--text-3); }
.cal .dow.sun { color: var(--danger); }
.cal .dow.sat { color: var(--accent); }
.cal .cell { background: var(--surface); min-height: 0; padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.cal .cell.out { background: var(--surface-2); }
.cal .cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal .cell .d { font-size: 12px; font-weight: 650; color: var(--text-2); font-variant-numeric: tabular-nums; }
.cal .cell.out .d { color: var(--text-3); opacity: .6; }
.cal .cell .d.sun { color: var(--danger); }
.cal .cell .d.sat { color: var(--accent); }
.cal .cell .hol { font-size: 10.5px; color: var(--danger); font-weight: 600; }
.cal .ev {
  font-size: 11px; line-height: 1.35; padding: 2px 5px; border-radius: 5px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.cal .ev.ok { background: var(--ok-soft); color: var(--ok); }
.cal .ev.warn { background: var(--warn-soft); color: var(--warn); }
.cal .ev.danger { background: var(--danger-soft); color: var(--danger); }
.cal .ev.purple, .cal .ev.info { background: var(--purple-soft); color: var(--purple); }
.cal .ev.dim { opacity: .5; text-decoration: line-through; }

/* ---------- 15. 보드 (칸반) ---------- */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; align-items: start; }
.board .col { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 10px; }
.board .col > h4 { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
.board .col > h4 .n { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-pill); padding: 0 7px; font-size: 11px; }
.board .col.dragover { outline: 2px dashed var(--accent); outline-offset: 2px; }
.board .item {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 10px; margin-bottom: 7px; cursor: grab; box-shadow: var(--shadow-1);
}
.board .item:last-child { margin-bottom: 0; }
.board .item.dragging { opacity: .4; }
.board .item .ttl { font-weight: 600; font-size: 13px; }
.board .item .meta { font-size: 11.5px; color: var(--text-2); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.board .empty { color: var(--text-3); font-size: 12px; text-align: center; padding: 14px 0; }

/* ---------- 16. 모달 ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 200; background: var(--overlay);
  display: none; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  width: 100%; max-width: 560px; box-shadow: var(--shadow-2); animation: pop var(--dur) ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.modal > header { display: flex; align-items: center; gap: 8px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
.modal > header h3 { font-size: 15px; flex: 1; }
.modal > .body { padding: 18px; display: grid; gap: 13px; }
.modal > footer { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }

/* ---------- 17. 팝오버 ---------- */
.pop-wrap { position: relative; }
.pop {
  position: absolute; right: 0; top: calc(100% + 6px); width: 196px; padding: 7px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  box-shadow: var(--shadow-2); display: none; z-index: 90;
}
.pop.open { display: block; }
.pop-wide { width: 320px; max-width: min(86vw, 360px); }
.pop .theme-option, .pop .pop-row {
  display: flex; align-items: center; gap: 9px; width: 100%; min-height: 38px;
  padding: 8px 9px; border: 0; border-radius: var(--r-sm); background: transparent;
  color: var(--text); font-weight: 550; text-align: left; cursor: pointer; font-size: 13px;
}
.pop .theme-option:hover, .pop .pop-row:hover { background: var(--surface-2); }
.pop .theme-option[aria-checked="true"] { background: var(--surface-2); font-weight: 700; }
.theme-swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .14); flex: none; }
.theme-swatch.on { box-shadow: 0 0 0 2px var(--accent); }
.pop-row { flex-wrap: wrap; text-decoration: none; }
.pop-row:hover { text-decoration: none; }
.pop-row .pop-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pop-row .pop-s { width: 100%; font-size: 11.5px; color: var(--text-3); font-weight: 500; }
.pop-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); padding: 6px 9px; }
.pop-empty { padding: 14px 10px; text-align: center; font-size: 12.5px; color: var(--text-3); }
.pop-sep { height: 1px; background: var(--border); margin: 6px 0; }
.scalerow { display: flex; align-items: center; gap: 6px; padding: 2px 9px 7px; }
.scalerow b { flex: 1; text-align: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.scalerow .btn.sm { min-height: 28px; padding: 3px 9px; }
/* 사이드바 하단 테마 버튼은 위로 열린다 */
.side .pop { left: 0; right: auto; top: auto; bottom: calc(100% + 6px); width: 100%; }

/* ---------- 18. 토스트 ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: var(--r-pill);
  font-size: 13px; font-weight: 600; z-index: 300; opacity: 0; pointer-events: none;
  transition: opacity var(--dur), transform var(--dur); box-shadow: var(--shadow-2);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 19. 허브 전용 ---------- */
.hero { display: flex; align-items: flex-end; gap: 20px; padding: 10px 4px 22px; }
.hero .txt { flex: 1; min-width: 0; }
.hero h1 { font-family: var(--serif); font-size: 29px; font-weight: 400; display: flex; align-items: center; gap: 10px; }
.hero h1 .ic { color: var(--accent-2); }
.hero .sub { color: var(--text-2); margin-top: 7px; font-size: 13.5px; }
/* 오늘의 한마디 — 카드 하나를 쓰지 않고 인사 밑에 한 줄로 둔다 */
.hero .qline { color: var(--accent); margin-top: 7px; font-family: var(--serif); font-size: 13.5px; }
.hero .art { flex: none; }
@media (max-width: 900px) { .hero .art { display: none; } }

.fit { display: flex; flex-direction: column; gap: 14px; }
.hub { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(0, 1fr) minmax(0, .9fr); gap: 14px; align-items: start; }
@media (max-width: 1220px) { .hub { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 820px) { .hub { grid-template-columns: minmax(0, 1fr); } }

.tiles { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 9px; }
@media (max-width: 540px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile {
  display: flex; flex-direction: column; gap: 5px; min-height: 92px; padding: 12px 11px;
  border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2);
  color: var(--text); text-align: left; cursor: pointer;
  transition: background var(--dur) ease, border-color var(--dur) ease, transform var(--dur) ease;
}
.tile:hover { background: var(--accent-soft); border-color: var(--accent-2); transform: translateY(-1px); text-decoration: none; }
.tile .ic { color: var(--accent); }
.tile b { font-size: 13px; font-weight: 650; word-break: keep-all; }
.tile .d { font-size: 11.5px; color: var(--text-3); line-height: 1.45; }

.mini { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); }
.mini h4 { font-size: 13px; margin-bottom: 10px; }
.mini .row { display: flex; gap: 10px; flex-wrap: wrap; }
.mini .cell { flex: 1; min-width: 88px; display: flex; gap: 8px; align-items: flex-start; }
.mini .cell .ico { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.mini .cell .k { font-size: 11.5px; color: var(--text-3); }
.mini .cell .v { font-weight: 650; font-variant-numeric: tabular-nums; }
.mini .bar { margin-top: 11px; }

.banner {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px;
  margin-top: 11px; padding: 11px 13px; border: 1px solid transparent; border-radius: var(--r);
  background: var(--accent-soft); color: var(--accent);
  font-size: 12.5px; font-weight: 600; text-align: left; cursor: pointer;
}
.banner .spacer { flex: 1; }
.banner:hover { text-decoration: none; filter: brightness(.98); }

.sched { list-style: none; margin: 0; padding: 0; }
.sched li { display: flex; align-items: center; gap: 11px; padding: 10px 17px; border-top: 1px solid var(--border); }
.sched li:first-child { border-top: 0; }
.sched li:hover { background: var(--surface-2); }
.sched .d { width: 42px; flex: none; text-align: center; }
.sched .d b { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
.sched .d span { font-size: 10.5px; color: var(--text-3); }
.sched .t { flex: 1; min-width: 0; }
.sched .t b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sched .t span { font-size: 11.5px; color: var(--text-3); }
.sched .dot { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.sched .dot.accent { background: var(--accent-soft); color: var(--accent); }
.sched .dot.ok { background: var(--ok-soft); color: var(--ok); }
.sched .dot.warn { background: var(--warn-soft); color: var(--warn); }
.sched .dot.danger { background: var(--danger-soft); color: var(--danger); }
.sched .dot.purple, .sched .dot.info { background: var(--purple-soft); color: var(--purple); }
.sched li.done .t b { text-decoration: line-through; color: var(--text-3); }

/* 습관 */
.habits { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(70px, 100%), 1fr)); gap: 6px; }
.habit {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 5px; border: 1px solid transparent; border-radius: var(--r);
  background: transparent; cursor: pointer; transition: background var(--dur) ease;
}
.habit:hover { background: var(--surface-2); }
.habit .ico {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--text-2);
  transition: background var(--dur) ease, color var(--dur) ease;
}
.habit .nm { font-size: 11.5px; color: var(--text-2); text-align: center; word-break: keep-all; }
.habit .chk {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong);
  display: grid; place-items: center; color: transparent;
  transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease;
}
.habit[aria-pressed="true"] .ico { background: var(--accent-soft); color: var(--accent); }
.habit[aria-pressed="true"] .chk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* 습관 카드의 '이번 주 2/3' 표시 */
.habit .wkbadge {
  font-size: 10px; font-weight: 700; color: var(--text-3);
  background: var(--surface-2); border-radius: var(--r-pill); padding: 1px 7px; margin-top: 3px;
}
.habit .wkbadge.ok { background: var(--ok-soft); color: var(--ok); }

/* 습관 14일 그리드 셀 */
.hcell {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-3);
  cursor: pointer; transition: background var(--dur) ease, border-color var(--dur) ease;
}
.hcell:hover { background: var(--surface-2); }
.hcell.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.hcell.off { opacity: .4; border-style: dashed; }
.habit:disabled, .habit[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
.habit:disabled:hover { background: transparent; }
.hcell:disabled { opacity: .32; cursor: not-allowed; border-style: dashed; }
.hcell:disabled:hover { background: var(--surface); }

/* ---------- 20. 허브: 페이지 전체 스크롤(카드 내부 스크롤 금지) ---------- */
.hub { align-items: stretch; }
.hub > .card { display: flex; flex-direction: column; }

/* ---------- 20b. 강조(알림·검색에서 이동) ---------- */
@keyframes flashBg {
  0%   { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
  75%  { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
  100% { background: transparent; outline: 2px solid transparent; outline-offset: -2px; }
}
.flash { animation: flashBg 3.4s ease; border-radius: var(--r-sm); }
tr.flash { animation: none; }
tr.flash > td { animation: flashBg 3.4s ease; }

/* ---------- 20c. 첨부 파일 ---------- */
.filelist { display: flex; flex-wrap: wrap; gap: 6px; }
.filechip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  padding: 5px 6px 5px 10px; border-radius: var(--r-pill);
  border: 1px solid var(--border); background: var(--surface-2);
  font-size: 12px; color: var(--text-2);
}
.filechip b { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.filechip .sz { font-variant-numeric: tabular-nums; color: var(--text-3); }
.filechip button {
  width: 22px; height: 22px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--text-3); cursor: pointer;
}
.filechip button:hover { background: var(--danger-soft); color: var(--danger); }
.dropzone {
  display: flex; align-items: center; gap: 9px; justify-content: center;
  padding: 14px; border: 1px dashed var(--border-strong); border-radius: var(--r);
  color: var(--text-2); font-size: 12.5px; cursor: pointer; background: transparent;
  transition: background var(--dur) ease, border-color var(--dur) ease;
}
.dropzone:hover, .dropzone.over { background: var(--accent-soft); border-color: var(--accent-2); color: var(--accent); }

/* ---------- 20d. 안내 박스 ---------- */
.notice {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 11px 13px; border-radius: var(--r); font-size: 12.5px; line-height: 1.55;
  background: var(--warn-soft); color: var(--warn); border: 1px solid transparent;
}
.notice.info { background: var(--accent-soft); color: var(--accent); }
.notice.plain { background: var(--surface-2); color: var(--text-2); }
.notice .ic { margin-top: 1px; }
.notice b { font-weight: 700; }

/* ---------- 20e. 요일 선택 ---------- */
.daypick { display: flex; gap: 5px; flex-wrap: wrap; }
.daypick .chip { min-width: 38px; justify-content: center; padding: 6px 0; }

/* ---------- 21. 기타 ---------- */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-3); }
.empty-state .big { font-size: 28px; margin-bottom: 8px; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.hr { height: 1px; background: var(--border); margin: 16px 0; border: 0; }
.sec-title { font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: .02em; margin-bottom: 9px; }
.spacer { flex: 1; }

/* 세로 막대 차트 (운동/통계) */
.vbars { display: flex; align-items: flex-end; gap: 5px; height: 108px; }
.vbars .vb { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; height: 100%; }
.vbars .vb i { display: block; width: 100%; max-width: 26px; border-radius: 5px 5px 2px 2px; background: var(--accent-soft); border: 1px solid var(--accent-2); min-height: 3px; }
.vbars .vb i.on { background: var(--accent); border-color: var(--accent); }
.vbars .vb span { font-size: 10px; color: var(--text-3); white-space: nowrap; }

/* ---------- 21b. 안내 배너: 지연 / 집중일 ---------- */
.notice.danger { background: var(--danger-soft); color: var(--danger); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.link { cursor: pointer; text-align: left; width: 100%; border: 0; font: inherit; }
.notice .spacer { flex: 1; }

/* ---------- 21c. 오늘의 집중 ---------- */
.focus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 10px; }
.focus-group { border: 1px solid var(--border); border-radius: var(--r); padding: 11px 13px; background: var(--surface); }
.focus-group h4 { font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: .02em; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.focus-group h4 .n { margin-left: auto; }
.focus-empty { font-size: 12.5px; color: var(--text-3); padding: 4px 0; }
.focus-row { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; border-top: 1px solid var(--border); }
.focus-row:first-child { border-top: 0; }
.focus-row .grow { flex: 1; min-width: 0; }
.focus-row .ttl { font-size: 13px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-row .meta { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.focus-row input[type="checkbox"] { margin-top: 3px; flex: none; width: 20px; height: 20px; }
.focus-row { min-height: 40px; }
.focus-row .act { flex: none; display: flex; gap: 4px; }

/* ---------- 21d. 강의 체크리스트 (대학 · 자격증 공용) ---------- */
.lecpanel { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.lecpanel .lechead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); }
.lecpanel .lechead input[type="number"] { width: 76px; min-height: 32px; padding: 4px 8px; }
.lecbody { max-height: none; }
table.tbl.leclist th, table.tbl.leclist td { padding: 6px 8px; }
table.tbl.leclist input[type="text"] { min-height: 32px; padding: 4px 7px; font-size: 12.5px; }
table.tbl.leclist input[type="date"], table.tbl.leclist input[type="number"] { min-height: 32px; padding: 4px 6px; font-size: 12px; }
table.tbl.leclist tr.lec-overdue { background: var(--danger-soft); }
table.tbl.leclist tr.lec-next td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.lec-check { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
.lecpace { padding: 10px 12px; font-size: 12.5px; color: var(--text-2); border-top: 1px solid var(--border); background: var(--surface); }
.lecpace b { color: var(--text); }
.lecpace.behind { color: var(--warn); background: var(--warn-soft); }

/* ---------- 21e. 주간 학습 요약 ---------- */
.weeksum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.weeksum .wcell { padding: 9px 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.weeksum .wcell .k { font-size: 11px; color: var(--text-3); }
.weeksum .wcell .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.weeksum .wcell.warn .v { color: var(--warn); }
.weeksum .wcell.danger .v { color: var(--danger); }
.weeksum .wcell.ok .v { color: var(--ok); }

/* ---------- 22. 반응형 ---------- */
@media (max-width: 1024px) {
  .side { transform: translateX(-100%); box-shadow: var(--shadow-2); }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; }
  .shell { margin-left: 0; }
  .burger { display: grid; }
  .topnav { display: none; }
  .search { width: auto; flex: 1; max-width: none; }
  .search-wrap { flex: 1; }
}
@media (min-width: 1025px) {
  body.nav-hide .side { transform: translateX(-100%); }
  body.nav-hide .shell { margin-left: 0; }
  .burger { display: grid; }
}
@media (max-width: 700px) {
  .wrap { padding: 16px 13px 56px; }
  .topbar { padding: 0 10px; gap: 4px; }
  .search { display: none; }
  .search-wrap { flex: 0; }
  .page-head { margin-bottom: 14px; }
  .page-head h2 { font-size: 20px; }
  .page-head .actions { margin-left: 0; width: 100%; }
  .page-head .actions .btn { flex: 1; justify-content: center; }
  .grid { gap: 12px; }
  .card > .card-head { padding: 14px 14px 10px; }
  .card > .card-body { padding: 0 14px 14px; }
  .list > li, .sched li { padding: 12px 14px; }
  .stat .value, .stat .vl { font-size: 22px; }
  .cal .cell { min-height: 68px; padding: 4px; }
  .cal .ev { font-size: 10px; }
  .modal-bg { padding: 20px 12px; }
  .form-grid .span2 { grid-column: auto; }
  table.tbl th, table.tbl td { padding: 9px 10px; }
  table.tbl td select, table.tbl td input { min-height: 36px; }
  .btn.sm { min-height: 34px; }
  .nav-head { min-height: 34px; }
  .hcell { width: 34px; height: 34px; }
  .iconbtn { width: 38px; height: 38px; }
}
/* ---------- 관리 허브 (manage.html) ---------- */
.mstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.mstrip > div { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-left: 1px solid var(--border); }
.mstrip > div:first-child { border-left: 0; }
.mstrip .ico { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.mstrip .ok .ico, .mstrip > div.ok .ico { background: var(--ok-soft); color: var(--ok); }
.mstrip > div.accent .ico { background: var(--accent-soft); color: var(--accent); }
.mstrip > div.warn .ico { background: var(--warn-soft); color: var(--warn); }
.mstrip > div.danger .ico { background: var(--danger-soft); color: var(--danger); }
.mstrip .k { font-size: 11.5px; font-weight: 650; color: var(--text-2); }
.mstrip .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mstrip .v small { font-size: 12px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
@media (max-width: 860px) {
  .mstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mstrip > div:nth-child(odd) { border-left: 0; }
  .mstrip > div:nth-child(n+3) { border-top: 1px solid var(--border); }
}

.mquick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.mquick a {
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 8px;
  border-left: 1px solid var(--border); color: var(--text-2); font-weight: 600; font-size: 12.5px;
  word-break: keep-all; text-align: center;
}
.mquick a:first-child { border-left: 0; }
.mquick a:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
@media (max-width: 900px) {
  .mquick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mquick a:nth-child(3n+1) { border-left: 0; }
  .mquick a:nth-child(n+4) { border-top: 1px solid var(--border); }
}
@media (max-width: 520px) {
  .mquick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mquick a:nth-child(3n+1) { border-left: 1px solid var(--border); }
  .mquick a:nth-child(odd) { border-left: 0; }
  .mquick a:nth-child(n+3) { border-top: 1px solid var(--border); }
}

.mcard .card-head .ico { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.mcard .desc { font-size: 12.5px; color: var(--text-2); line-height: 1.65; margin-bottom: 4px; }
.mrow { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 2px; border-top: 1px solid var(--border); color: var(--text-2); }
.mrow .lb { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tail { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrow > .ic:last-child { color: var(--text-3); }
.mrow:hover { color: var(--accent); text-decoration: none; }
.mrow:hover .ic:last-child { color: var(--accent); }

/* ---------- 통계 (progress.html) ---------- */
/* 기간 선택 (이번 주 / 이번 달 / …) */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--border); }
.seg button {
  min-height: 32px; padding: 6px 14px; border: 0; border-radius: var(--r-pill);
  background: transparent; color: var(--text-2); font-weight: 600; font-size: 12.5px; cursor: pointer;
  white-space: nowrap; transition: background var(--dur) ease, color var(--dur) ease;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }

/* 영역 탭 (전체 / 학습 / 생활 / 업무) */
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.subtabs button {
  position: relative; min-height: 42px; padding: 10px 16px; border: 0; background: transparent;
  color: var(--text-2); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.subtabs button:hover { color: var(--text); }
.subtabs button[aria-selected="true"] { color: var(--accent); }
.subtabs button[aria-selected="true"]::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
  border-radius: 2px 2px 0 0; background: var(--accent);
}

/* 요약 4칸 — 관리 화면의 .mstrip 과 같은 뼈대를 쓴다 */
.mstrip .ico.plain { background: transparent; }
.mstrip .delta { font-size: 12px; font-weight: 650; }
.mstrip .delta.up { color: var(--ok); }
.mstrip .delta.down { color: var(--danger); }

/* 카드 오른쪽 위 삭제(X) 버튼 */
.cardx {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-3);
  cursor: pointer; transition: background var(--dur) ease, color var(--dur) ease;
}
.cardx:hover, .cardx:active { background: var(--danger-soft); color: var(--danger); }
.cardx.edit:hover, .cardx.edit:active { background: var(--accent-soft); color: var(--accent); }

/* 통계 — 단계 분포 막대 / 단계 점 표시 */
.stagebars { display: flex; gap: 6px; flex-wrap: wrap; }
.stagebars > div {
  flex: 1 1 62px; min-width: min(62px, 30%); text-align: center; padding: 7px 6px;
  background: var(--surface-2); border-radius: var(--r-sm);
}
.stagebars .k { display: block; font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.stagebars b { font-size: 15px; font-variant-numeric: tabular-nums; }
.certrow { padding: 9px 0; border-top: 1px solid var(--border); }
.certrow:first-of-type { border-top: 0; }
.stagedots { display: flex; gap: 4px; margin-top: 6px; }
.stagedots i {
  flex: 1; height: 5px; border-radius: 3px; background: var(--surface-3);
}
.stagedots i.on { background: var(--ok); }
.stagedots i.cur { background: var(--accent); }

/* 표 안의 진행률 칸 */
.trow { display: flex; align-items: center; gap: 9px; }
.trow .bar { flex: 1; min-width: 54px; }
.trow .n { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.plan { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 12.5px; }
.plan.behind { color: var(--danger); }
.plan.ahead { color: var(--ok); }
.plan.even { color: var(--text-3); }

/* 막대 그래프 */
.barchart { display: flex; align-items: flex-end; gap: 5px; height: 132px; }
.barchart > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; }
.barchart .n { font-size: 10.5px; text-align: center; color: var(--text-3); font-weight: 650; }
.barchart .b { border-radius: 4px 4px 0 0; background: var(--ok); min-height: 0; }
.barchart .b.zero { background: var(--surface-3); }
.barlabels { display: flex; gap: 5px; margin-top: 6px; }
.barlabels > div { flex: 1; min-width: 0; text-align: center; font-size: 9.5px; color: var(--text-3); overflow: hidden; }

/* 요약 수치 줄 */
.sumrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.sumrow > div { flex: 1; min-width: 92px; text-align: center; padding: 8px 6px; border-radius: var(--r-sm); background: var(--surface-2); }
.sumrow .k { font-size: 11px; color: var(--text-3); }
.sumrow .v { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* 다음 행동 추천 */
.reco { display: flex; align-items: center; gap: 11px; padding: 11px 2px; border-top: 1px solid var(--border); color: var(--text); }
.reco:first-of-type { border-top: 0; }
.reco:hover { text-decoration: none; background: var(--surface-2); }
.reco .ico { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.reco .tx { flex: 1; min-width: 0; }
.reco .tt { font-weight: 650; font-size: 13px; }
.reco .ss { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.reco > .ic:last-child { color: var(--text-3); }

/* 지연 목록 */
.laglist { display: grid; gap: 2px; }
.lagrow { display: flex; align-items: flex-start; gap: 10px; padding: 9px 2px 9px 11px; border-left: 3px solid var(--danger); }
.lagrow .tx { flex: 1; min-width: 0; }
.lagrow .tt { font-weight: 650; font-size: 13px; }
.lagrow .ss { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.lagrow .rt { text-align: right; white-space: nowrap; }
.lagrow .rt b { color: var(--danger); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.lagrow .rt span { display: block; font-size: 11px; color: var(--text-3); }

/* =========================================================
   강의 관리 (대학 강의 · 자격증 강의)
   ========================================================= */
/* 제목 옆 학기 선택 */
.titlerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.titlerow select { width: auto; min-width: 132px; }

/* ---- 과목 아코디언 ---- */
.acc { display: grid; gap: 10px; }
.accitem { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1); overflow: hidden; }
.accitem.open { border-color: var(--accent-2); }
.acchead {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px;
  border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer;
}
.acchead:hover { background: var(--surface-2); }
.acchead > .caret { flex: none; color: var(--text-3); transition: transform var(--dur) ease; }
.accitem.open .acchead > .caret { transform: rotate(90deg); }
.acchead .ico { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.acchead .nm { flex: 1 1 150px; min-width: 0; }
.acchead .nm b { display: block; font-size: 14.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acchead .nm span { font-size: 11.5px; color: var(--text-3); }
.acchead .cnt { flex: none; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.acchead .bar { flex: 0 1 150px; min-width: 60px; }
.acchead .pc { flex: none; width: 40px; text-align: right; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.acchead .nx { flex: 1 1 150px; min-width: 0; font-size: 12px; }
.acchead .nx i { display: block; font-style: normal; color: var(--text-3); font-size: 11px; }
.acchead .nx b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.acchead .lag { flex: none; font-size: 12px; font-weight: 650; white-space: nowrap; }
.acchead .lag.on { color: var(--danger); }
.acchead .lag.off { color: var(--ok); }
.accbody { border-top: 1px solid var(--border); background: var(--surface-2); padding: 12px; }
@media (max-width: 900px) {
  .acchead { flex-wrap: wrap; row-gap: 8px; }
  .acchead .nm { flex: 1 1 100%; order: 1; }
  .acchead > .caret, .acchead .ico { order: 0; }
  .acchead .cnt, .acchead .bar, .acchead .pc { order: 2; }
  .acchead .nx, .acchead .lag { order: 3; }
}

/* ---- 강의 목록 표 (조용한 입력칸) ---- */
table.leclist { font-size: 13px; background: var(--surface); border-radius: var(--r); overflow: hidden; }
table.leclist th { font-size: 11px; }
table.leclist td { padding: 7px 10px; }
table.leclist tr.grp td {
  background: var(--surface-2); font-size: 11.5px; font-weight: 700; color: var(--text-2);
  padding: 7px 10px; letter-spacing: .02em;
}
table.leclist tr.grp:hover td { background: var(--surface-2); }
table.leclist td.mid { text-align: center; }
table.leclist input[type="text"], table.leclist input[type="date"], table.leclist input[type="number"] {
  min-height: 30px; padding: 3px 6px; border-color: transparent; background: transparent;
  font-size: 13px; width: 100%;
}
table.leclist input[type="text"]:hover, table.leclist input[type="date"]:hover, table.leclist input[type="number"]:hover,
table.leclist input:focus { border-color: var(--border-strong); background: var(--surface); }
table.leclist .lec-check { width: 17px; height: 17px; cursor: pointer; }
table.leclist tr.lag td .num, table.leclist tr.lag .due { color: var(--danger); }
table.leclist tr.nextrow { box-shadow: inset 3px 0 0 var(--accent); }
.memorow td { background: var(--surface-2); padding: 4px 10px 10px !important; }
.iconmini {
  width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r-sm);
  border: 1px solid transparent; background: transparent; color: var(--text-3); cursor: pointer;
}
.iconmini:hover { background: var(--surface-2); color: var(--text); }
.iconmini.on { color: var(--accent); background: var(--accent-soft); }
.revbtn {
  border: 0; background: transparent; cursor: pointer; font-size: 11.5px; font-weight: 650;
  color: var(--text-3); padding: 4px 6px; border-radius: var(--r-sm);
}
.revbtn:hover { background: var(--surface-2); }
.revbtn.on { color: var(--danger); }

/* ---- 자격증 강의: 2단 레이아웃 ---- */
.lecwrap { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1080px) { .lecwrap { grid-template-columns: minmax(0, 1fr); } }
.crslist { display: grid; gap: 9px; }
.crshead { display: flex; align-items: center; gap: 8px; padding: 2px 2px 4px; }
.crshead b { font-size: 13px; }
.crshead .n { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.crshead select { width: auto; min-height: 30px; font-size: 12px; padding: 4px 8px; margin-left: auto; }
.crscard {
  display: block; width: 100%; text-align: left; padding: 13px 14px; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); color: inherit;
  transition: border-color var(--dur) ease, background var(--dur) ease;
}
.crscard:hover { background: var(--surface-2); }
.crscard.on { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); background: var(--surface); }
.crscard .t1 { display: flex; align-items: flex-start; gap: 8px; }
.crscard .t1 b { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 650; word-break: keep-all; }
.crscard .t2 { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.crscard .t3 { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; font-size: 11.5px; }
.crscard .t3 .p { font-weight: 650; color: var(--text-2); }
.crscard .t3 .c { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ---- 자격증 강의: 상세 정보 격자 ---- */
.infogrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.infogrid > div { padding: 11px 13px; border-left: 1px solid var(--border); }
.infogrid > div:first-child { border-left: 0; }
.infogrid .k { font-size: 11px; color: var(--text-3); }
.infogrid .v { font-size: 16px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 3px; }
.infogrid .v small { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.infogrid .v.sm { font-size: 13px; font-weight: 650; }
.infogrid .dd { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-top: 2px; }
@media (max-width: 1000px) {
  .infogrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .infogrid > div:nth-child(3n+1) { border-left: 0; }
  .infogrid > div:nth-child(n+4) { border-top: 1px solid var(--border); }
}
@media (max-width: 560px) {
  .infogrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .infogrid > div:nth-child(3n+1) { border-left: 1px solid var(--border); }
  .infogrid > div:nth-child(odd) { border-left: 0; }
  .infogrid > div:nth-child(n+3) { border-top: 1px solid var(--border); }
}

.pacebox { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2); overflow: hidden; flex-wrap: wrap; }
.pacebox > div { flex: 1 1 118px; padding: 11px 13px; border-left: 1px solid var(--border); text-align: center; }
.pacebox > div:first-child { border-left: 0; }
.pacebox .k { font-size: 11px; color: var(--text-3); }
.pacebox .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 3px; }
.pacebox .warn { font-size: 10.5px; font-weight: 650; color: var(--danger); background: var(--danger-soft); border-radius: var(--r-pill); padding: 1px 7px; display: inline-block; margin-top: 4px; }
.pacebox .act { flex: 0 0 auto; display: grid; place-items: center; }

/* ---- 엑셀 붙여넣기 가져오기 ---- */
.pastebox {
  width: 100%; min-height: 132px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
  white-space: pre; overflow-x: auto;
}
.pastehint { font-size: 12px; color: var(--text-3); line-height: 1.75; }
.pastehint code {
  font-family: var(--mono); font-size: 11.5px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; white-space: nowrap;
}
.pastesample { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 9px 11px; margin-top: 7px; overflow-x: auto; }
.pastesample pre { margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.75; color: var(--text-2); }
.prevwrap { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: var(--r-sm); }
.prevwrap table.tbl { font-size: 12.5px; }
.prevwrap table.tbl th { position: sticky; top: 0; z-index: 1; }
.prevwrap table.tbl td { padding: 6px 9px; }

@media print {
  .side, .topbar, .scrim, .btn, .iconbtn, .page-head .actions { display: none !important; }
  body { background: #fff; }
  .shell { margin-left: 0; }
  .wrap, .wrap.hubpage { height: auto; overflow: visible; }
  .page { display: block !important; }
  .card { break-inside: avoid; }
}

/* ---- 엑셀 파일 올리기 ---- */
.upbox {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 13px; margin-bottom: 10px;
  border: 1px dashed var(--border-strong); border-radius: var(--r); background: var(--surface-2);
}
.upbox.drag { border-color: var(--accent); background: var(--accent-soft); }
.upbox .field { margin: 0; }

/* =========================================================
   23. 공용 컴포넌트 — 목록+상세 / 단계 / 로드맵 / 자료실 / 통합 일정
   기존 토큰(--surface, --border, --accent …)만 사용한다.
   ========================================================= */

/* ---------- 23a. 목록 + 상세 (자격증 · 과제/시험) ---------- */
.mdwrap { display: grid; grid-template-columns: 336px minmax(0, 1fr); gap: 14px; align-items: start; }
.mdwrap.narrow { grid-template-columns: 288px minmax(0, 1fr); }
@media (max-width: 1080px) { .mdwrap, .mdwrap.narrow { grid-template-columns: minmax(0, 1fr); } }

.picklist { list-style: none; margin: 0; padding: 0; max-height: calc(62vh / var(--ui-zoom, 1)); overflow: auto; }
.picklist > li { border-top: 1px solid var(--border); }
.picklist > li:first-child { border-top: 0; }
.pick {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 15px;
  border: 0; background: transparent; text-align: left; cursor: pointer; color: inherit;
  border-left: 3px solid transparent; transition: background var(--dur) ease;
}
.pick:hover { background: var(--surface-2); }
.pick.on { background: var(--accent-soft); border-left-color: var(--accent); }
.pick .ico { width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.pick.on .ico { background: var(--surface); color: var(--accent); }
.pick .txt { flex: 1; min-width: 0; }
.pick .txt b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .txt > span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .txt > span > span { display: inline-flex; margin-top: 0; }
.pick .tail { flex: none; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-3); }
.pick.done .txt b { color: var(--text-3); text-decoration: line-through; }

/* 상세 위쪽 요약 칸 (아이콘 + 라벨 + 값) */
.infogrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.infogrid > div { background: var(--surface); padding: 11px 13px; display: flex; gap: 9px; align-items: flex-start; }
.infogrid .ic { color: var(--text-3); margin-top: 2px; }
.infogrid .k { font-size: 11.5px; color: var(--text-3); }
.infogrid .v { font-size: 13px; font-weight: 650; margin-top: 2px; word-break: keep-all; }
.infogrid .v.big { font-size: 17px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.infogrid .v.accent { color: var(--accent); }
.infogrid .v.danger { color: var(--danger); }
.infogrid .v.warn { color: var(--warn); }
.infogrid .v.ok { color: var(--ok); }

/* ---------- 23b. 단계 진행 (자격증) ---------- */
.stepper { display: flex; flex-wrap: wrap; gap: 6px; }
.stepper .stp {
  flex: 1 1 96px; min-width: 96px; display: flex; flex-direction: column; gap: 4px;
  padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); cursor: pointer; text-align: left; position: relative;
}
.stepper .stp:hover { background: var(--surface-2); }
.stepper .stp .k { font-size: 11.5px; font-weight: 700; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.stepper .stp .d { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.stepper .stp.done { background: var(--ok-soft); border-color: transparent; }
.stepper .stp.done .k { color: var(--ok); }
.stepper .stp.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stepper .stp.cur .k { color: var(--accent); }

.stagecell { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.stagecell .ic { color: var(--text-3); }
.stagecell.done { color: var(--ok); }
.stagecell.done .ic { color: var(--ok); }
.stagecell.cur { color: var(--accent); font-weight: 650; }
.stagecell.cur .ic { color: var(--accent); }

/* ---------- 23c. 체크리스트 (공용) ---------- */
.klist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
.klist > li { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-top: 1px solid var(--border); background: var(--surface); }
.klist > li:first-child { border-top: 0; }
.klist > li:hover { background: var(--surface-2); }
.klist .kt { flex: 1; min-width: 0; font-size: 13px; }
.klist > li.on .kt { color: var(--text-3); text-decoration: line-through; }
.klist .kd { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.klist .kx { border: 0; background: transparent; color: var(--text-3); cursor: pointer; padding: 2px; border-radius: 6px; line-height: 0; }
.klist .kx:hover { background: var(--danger-soft); color: var(--danger); }
.klist .empty { padding: 13px; text-align: center; font-size: 12.5px; color: var(--text-3); }
.addrow { display: flex; gap: 7px; margin-top: 8px; }
.addrow input { flex: 1; min-width: 0; }

/* ---------- 23d. 로드맵 (배우고 싶은 것) ---------- */
.roadmap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-items: start; }
@media (max-width: 1180px) { .roadmap { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .roadmap { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 400px) { .roadmap { grid-template-columns: minmax(0, 1fr); } }
.roadmap .col { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 9px; }
.roadmap .col.dragover { outline: 2px dashed var(--accent); outline-offset: 2px; }
.roadmap .col > h4 {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text-2); padding: 7px 8px; margin-bottom: 9px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
}
.roadmap .col > h4 .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.roadmap .col.s0 > h4 { background: var(--surface-3); }
.roadmap .col.s1 > h4 { background: var(--warn-soft); color: var(--warn); }
.roadmap .col.s2 > h4 { background: var(--ok-soft); color: var(--ok); }
.roadmap .col.s3 > h4 { background: var(--accent-soft); color: var(--accent); }
.roadmap .col.s4 > h4 { background: var(--purple-soft); color: var(--purple); }
.rm-item {
  width: 100%; text-align: left; display: block; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-sm); padding: 9px 10px; margin-bottom: 7px; cursor: pointer;
}
.rm-item:hover { border-color: var(--border-strong); }
.rm-item.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.rm-item.dragging { opacity: .4; }
.rm-item .ttl { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
.rm-item .ttl i { width: 11px; height: 11px; flex: none; border-radius: 50%; border: 1.5px solid var(--border-strong); }
.rm-item .ttl i.on { background: var(--accent); border-color: var(--accent); }
.rm-item .meta { font-size: 11px; color: var(--text-3); margin-top: 3px; padding-left: 18px; }
.roadmap .empty { color: var(--text-3); font-size: 11.5px; text-align: center; padding: 12px 0; }
.roadmap .addbtn { width: 100%; margin-top: 7px; border-style: dashed; }

/* ---------- 23e. 자료실 3단 ---------- */
.filedeck { display: grid; grid-template-columns: 232px minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
@media (max-width: 1280px) { .filedeck { grid-template-columns: 210px minmax(0, 1fr); } .filedeck > .fd-prev { grid-column: 1 / -1; } }
@media (max-width: 820px) { .filedeck { grid-template-columns: minmax(0, 1fr); } .filedeck > .fd-prev { grid-column: auto; } }
.crumbline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); padding: 13px 15px 0; }
.crumbline b { color: var(--text); }
.wktabs { display: flex; gap: 5px; flex-wrap: wrap; padding: 10px 15px 12px; border-bottom: 1px solid var(--border); }
.filetable { width: 100%; border-collapse: collapse; }
.filetable th { font-size: 11.5px; color: var(--text-3); font-weight: 650; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.filetable td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; vertical-align: middle; }
.filetable tr:last-child td { border-bottom: 0; }
.filetable tbody tr { cursor: pointer; }
.filetable tbody tr:hover { background: var(--surface-2); }
.filetable tbody tr.on { background: var(--accent-soft); }
.filetable .nm { display: flex; align-items: center; gap: 9px; min-width: 0; }
.filetable .nm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ftype {
  width: 26px; height: 26px; flex: none; border-radius: 7px; display: grid; place-items: center;
  font-size: 9px; font-weight: 800; letter-spacing: -.02em; background: var(--surface-3); color: var(--text-2);
}
.ftype.pdf { background: var(--danger-soft); color: var(--danger); }
.ftype.doc { background: var(--accent-soft); color: var(--accent); }
.ftype.ppt { background: var(--warn-soft); color: var(--warn); }
.ftype.xls, .ftype.vid { background: var(--purple-soft); color: var(--purple); }
.ftype.img { background: var(--ok-soft); color: var(--ok); }
.starbtn { border: 0; background: transparent; cursor: pointer; color: var(--text-3); padding: 3px; border-radius: 6px; line-height: 0; }
.starbtn:hover { background: var(--surface-3); }
.starbtn.on { color: var(--warn); }
.starbtn.on .ic { fill: var(--warn); }
.previewbox {
  border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2);
  min-height: 150px; display: grid; place-items: center; overflow: hidden; padding: 10px;
}
.previewbox img, .previewbox video { max-width: 100%; max-height: 240px; border-radius: 6px; }
.previewbox object, .previewbox iframe { width: 100%; height: 240px; border: 0; background: var(--surface); }
.previewbox pre { margin: 0; width: 100%; max-height: 240px; overflow: auto; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; color: var(--text-2); }
.previewbox .ph { text-align: center; color: var(--text-3); font-size: 12.5px; padding: 24px 8px; }
.tagbox { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tagchip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--r-pill);
  background: var(--surface-2); border: 1px solid var(--border); font-size: 11.5px; color: var(--text-2);
}
.tagchip button { border: 0; background: transparent; color: var(--text-3); cursor: pointer; padding: 0; line-height: 0; }
.tagchip button:hover { color: var(--danger); }
.kvlist { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; align-items: baseline; }
.kvlist dt { color: var(--text-3); white-space: nowrap; }
.kvlist dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

/* ---------- 23f. 통합 일정 (달력 + 선택일) ---------- */
.schedwrap { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 14px; align-items: start; }
@media (max-width: 1180px) { .schedwrap { grid-template-columns: minmax(0, 1fr); } }
.calbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.calbar .nav { display: flex; align-items: center; gap: 2px; }
.calbar .month { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 118px; text-align: center; }
.cal.soft { grid-auto-rows: minmax(112px, 1fr); }
.cal.soft .cell { min-height: 0; }
.cal.soft .cell.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent-2); }
.cal.soft .cell.today.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cal.soft .cell .d { display: flex; align-items: center; gap: 4px; }
.cal.soft .cell.today .d b { background: var(--accent); color: var(--on-accent); border-radius: 50%; display: inline-grid; place-items: center; width: 21px; height: 21px; font-size: 11.5px; }
.cal.soft .cell .more { font-size: 10px; color: var(--text-3); padding-left: 2px; }
.cal.soft .cell .hol { font-size: 10px; }
.evline {
  display: flex; align-items: center; gap: 4px; font-size: 10.5px; line-height: 1.4;
  color: var(--text-2); padding: 1px 3px; border-radius: 4px; cursor: pointer;
  overflow: hidden; white-space: nowrap; border: 0; background: transparent; width: 100%; text-align: left;
}
.evline:hover { background: var(--surface-2); }
.evline .ic { flex: none; color: var(--text-3); }
.evline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evline.done { color: var(--text-3); text-decoration: line-through; opacity: .7; }
.evline.od, .evline.od .ic { color: var(--danger); }
.callegend { display: flex; flex-wrap: wrap; gap: 12px; padding: 11px 15px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-2); }
.callegend span { display: inline-flex; align-items: center; gap: 5px; }
.callegend .ic { color: var(--text-3); }

.daygroup { border-top: 1px solid var(--border); }
.daygroup:first-child { border-top: 0; }
.daygroup > .gh {
  width: 100%; display: flex; align-items: center; gap: 7px; padding: 9px 15px;
  border: 0; background: transparent; cursor: pointer; color: var(--text-2); font-size: 12.5px; font-weight: 650;
}
.daygroup > .gh:hover { background: var(--surface-2); }
.daygroup > .gh .ic.cv { transition: transform var(--dur) ease; }
.daygroup > .gh[aria-expanded="false"] .ic.cv { transform: rotate(-90deg); }
.daygroup > .gh .n { margin-left: auto; font-size: 11px; color: var(--text-3); background: var(--surface-2); border-radius: var(--r-pill); padding: 1px 8px; }
.dayrow { display: flex; align-items: flex-start; gap: 9px; padding: 7px 15px 9px; }
.dayrow:hover { background: var(--surface-2); }
.dayrow.on { background: var(--accent-soft); }
.dayrow > input[type="checkbox"] { margin-top: 3px; flex: none; width: 17px; height: 17px; }
.dayrow .ic.src { margin-top: 3px; color: var(--text-3); flex: none; }
.dayrow .bd { flex: 1; min-width: 0; cursor: pointer; }
.dayrow .bd .t { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dayrow .bd .s { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.dayrow.done .bd .t { color: var(--text-3); text-decoration: line-through; }
.dayrow .tm { font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 3px; }
.dayrow .mn { border: 0; background: transparent; color: var(--text-3); cursor: pointer; border-radius: 6px; padding: 2px 4px; line-height: 0; }
.dayrow .mn:hover { background: var(--surface-3); color: var(--text); }
.dayempty { padding: 9px 15px 13px; font-size: 12.5px; color: var(--text-3); display: flex; align-items: center; gap: 7px; }

.weeklist { display: flex; flex-direction: column; }
.weeklist .wrow {
  display: flex; align-items: flex-start; gap: 12px; padding: 10px 15px;
  border-top: 1px solid var(--border); cursor: pointer;
}
.weeklist .wrow:first-child { border-top: 0; }
.weeklist .wrow:hover { background: var(--surface-2); }
.weeklist .wrow.sel { background: var(--accent-soft); }
.weeklist .wd { flex: 0 0 62px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.weeklist .wd b { font-size: 16px; font-variant-numeric: tabular-nums; }
.weeklist .wd i { font-style: normal; font-size: 11.5px; color: var(--text-3); }
.weeklist .wd.sun b, .weeklist .wd.sun i { color: var(--danger); }
.weeklist .wd.sat b, .weeklist .wd.sat i { color: var(--accent); }
.weeklist .wrow.today .wd b {
  background: var(--accent); color: var(--on-accent); border-radius: 50%;
  display: inline-grid; place-items: center; width: 24px; height: 24px; font-size: 13px;
}
.weeklist .wev { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.weeklist .wev .evline { font-size: 12px; padding: 2px 4px; }
.weeklist .wev .dim { font-size: 11.5px; }

@media (max-width: 1080px) { .picklist { max-height: none; } }
@media (max-width: 700px) {
  .infogrid { grid-template-columns: minmax(0, 1fr); }
  .cal.soft .cell { min-height: 74px; }
  .filedeck { gap: 12px; }
}

/* 통합 일정 — 드래그로 날짜 옮기기 */
.evline.movable { cursor: grab; }
.evline.dragging, .dayrow .bd.dragging { opacity: .45; }
.cal .cell.dropok, .weeklist .wrow.dropok { outline: 2px dashed var(--accent); outline-offset: -3px; background: var(--accent-soft); }
.dayrow .bd[draggable="true"] { cursor: grab; }

/* ---------- 24. 학기별 성적 카드 (성적 · 졸업) ---------- */
.termgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 14px; align-items: start; }
.termcard { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.termcard.cur { border-color: var(--accent-2); box-shadow: inset 0 0 0 1px var(--accent-2); }
.termcard > header {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 13px 15px; background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.termcard > header .tt { flex: 1; min-width: 0; }
.termcard > header .tt b { font-size: 14.5px; }
.termcard > header .tt .sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.termcard > header .gpa { flex: none; text-align: right; }
.termcard > header .gpa b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--purple); }
.termcard > header .gpa span { font-size: 10.5px; color: var(--text-3); }
.termcard .tbody { padding: 12px 15px 14px; }
.tstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 11px; }
.tstats > div { background: var(--surface-2); border-radius: var(--r-sm); padding: 7px 9px; }
