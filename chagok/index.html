document.addEventListener('change', e => {
  const el = e.target;

  if (el.dataset.certCk) {
    const [id, kind, cid] = el.dataset.certCk.split('|');
    const c = certById(id);
    const it = c && (kind === 'docs' ? c.docs : c.checklist).find(i => i.id === cid);
    if (it) { it.done = el.checked; it.doneAt = el.checked ? L.todayStr() : ''; save(); renderCert(); }
    return;
  }
  if (el.dataset.certMemo) {
    const c = certById(el.dataset.certMemo);
    if (c && (c.memo || '') !== el.value) { c.memo = el.value; save(); renderCert(); }
    return;
  }
  if (el.dataset.wishMs) {
    const [id, mid] = el.dataset.wishMs.split('|');
    const w = wishById(id);
    const m = w && w.milestones.find(v => v.id === mid);
    if (m) {
      m.done = el.checked; m.doneAt = el.checked ? L.todayStr() : '';
      save(); renderWish(); renderWorkLearn(); renderDash();
    }
    return;
  }
  if (el.dataset.sub !== undefined && el.dataset.sub) {
    const c = DB.certs.find(v => v.id === el.dataset.sub);
    c.subjects[Number(el.dataset.i)].done = el.checked;
    save(); renderCert(); return;
  }
  if (el.dataset.clecAllcheck) {
    if (!setAllCertWatched(el.dataset.clecAllcheck, el.checked)) { renderCertLec(); return; }
    save(); renderAll(); return;
  }
  if (el.dataset.clecWatch) {
    const [cid, lid] = el.dataset.clecWatch.split('|');
    const c = DB.certs.find(v => v.id === cid);
    const items = certLectures(c);
    const it = items.find(i => i.id === lid);
    if (it) {
      it.watched = el.checked;
      it.watchedAt = el.checked ? (it.watchedAt || L.todayStr()) : '';
      // 완료로 체크했는데 진도율이 0이면 100%로 맞춘다 (부분 시청은 진도율을 직접 조절)
      if (el.checked && lecPct(it) === 0) it.progress = 100;
      setCertLectures(c, items);
    }
    save(); renderAll(); return;
  }
  if (el.dataset.clecProg) {
    const [cid, lid] = el.dataset.clecProg.split('|');
    const c = DB.certs.find(v => v.id === cid);
    const items = certLectures(c);
    const it = items.find(i => i.id === lid);
    if (it) {
      it.progress = L.clamp(Math.round(Number(el.value) || 0), 0, 100);
      if (it.progress >= 100 && !it.watched) { it.watched = true; it.watchedAt = it.watchedAt || L.todayStr(); }
      setCertLectures(c, items);
    }
    save(); renderAll(); return;
  }
  if (el.dataset.clecField) {
    const [cid, lid, field] = el.dataset.clecField.split('|');
    const c = DB.certs.find(v => v.id === cid);
    const items = certLectures(c);
    const it = items.find(i => i.id === lid);
    if (it) it[field] = el.value;
    setCertLectures(c, items);
    save(); renderCertLec(); return;
  }
  if (['pTarget', 'pMode', 'pStrip'].includes(el.id)) { renderClPastePreview(); return; }
  if (el.id === 'clSort') { clSort = el.value; renderCertLec(); return; }
  if (el.dataset.work) {
    const id = el.dataset.work;
    if (el.checked) DB.work.done[id] = L.todayStr(); else delete DB.work.done[id];
    save(); renderWork(); renderRecur(); renderDash(); return;
  }
  if (el.dataset.goalDone) {
    const g = DB.goals.find(x => x.id === el.dataset.goalDone);
    if (g) { g.done = el.checked; save(); renderGoals(); renderStats(); renderDash(); }
    return;
  }
  if (el.id === 'goalMonthSel') { goalMonth = el.value; renderGoals(); return; }
  if (el.id === 'holYear') { holYear = Number(el.value); renderHolidays(); return; }
  if (el.id === 'uiScale') { L.setScale(Number(el.value)); renderScaleSettings(); return; }
  if (el.id === 'nfHour') { L.saveNotifySettings({ hour: Number(el.value) }); renderNotifySettings(); L.toast('알림 시각을 바꿨습니다.'); return; }
  if (el.id === 'nfDays') { L.saveNotifySettings({ days: Number(el.value) }); renderNotifySettings(); return; }
  if (el.id === 'nfOn') {
    if (!el.value) { L.saveNotifySettings({ on: false }); renderNotifySettings(); L.toast('알림을 껐습니다.'); return; }
    L.Notify.request().then(async perm => {
      if (perm === 'granted') {
        L.saveNotifySettings({ on: true, lastDate: '' });
        L.toast('크롬 알림을 켰습니다. 설정한 시각이 지나면 알려드립니다.');
      } else {
        L.saveNotifySettings({ on: false });
        L.toast(perm === 'denied' ? '브라우저에서 알림이 차단되어 있습니다.' : '알림 권한이 필요합니다.');
      }
      renderNotifySettings();
    });
    return;
  }
  if (el.id === 'sQuotes') {
    DB.meta.quotes = el.value.split('\n').map(v => v.trim()).filter(Boolean);
    save(); renderSettings(); return;
  }
  if (el.id === 'workYear') { DB.work.year = Number(el.value); wcal.y = DB.work.year; save(); renderWork(); return; }
  if (el.id === 'hidePast') { DB.work.hidePast = el.checked; save(); renderWork(); return; }
  if (el.id === 'hideDone') { DB.work.hideDone = el.checked; save(); renderWork(); return; }

  const map = { sName: 'name', sWeekly: 'weeklyGoal', sWeight: 'weightTarget', sWeeklyMin: 'weeklyMinGoal' };
  if (map[el.id]) {
    DB.meta[map[el.id]] = el.id === 'sName' ? el.value : (Number(el.value) || 0);
    save(); renderAll(); return;
  }
  if (el.id === 'calcKind' || el.id === 'calcDate') {
    const out = T.eventBasedDue($('#calcKind').value, $('#calcDate').value);
    $('#calcOut').innerHTML = out
      ? `${L.fmtLong(out)} <span class="badge accent mono">${L.ddayLabel(out)}</span>`
      : '<span class="dim" style="font-size:14px;font-weight:400">사건일을 입력하세요</span>';
    return;
  }
});

/* ---- 엑셀 파일 올리기 ---- */
let pSheets = [];
function pMsg(kind, html) {
  const box = document.getElementById('pFileMsg');
  box.innerHTML = html ? `<div class="notice ${kind}" style="margin-bottom:10px"><div>${html}</div></div>` : '';
}
function applySheet(i) {
  const sh = pSheets[i];
  if (!sh) return;
  const t = document.getElementById('pText');
  t.value = L.rowsToText(sh.rows);
  renderClPastePreview();
}
async function loadSpreadsheet(file) {
  if (!file) return;
  pMsg('', '');
  document.getElementById('pFileMsg').innerHTML =
    `<p class="dim" style="font-size:12.5px;margin-bottom:10px">${L.esc(file.name)} 읽는 중…</p>`;
  try {
    const res = await L.readSpreadsheet(file);
    pSheets = res.sheets;
    const wrap = document.getElementById('pSheetWrap');
    const sel = document.getElementById('pSheet');
    // 내용이 있는 시트를 먼저 고른다
    let pick = pSheets.findIndex(s => s.rows.length);
    if (pick < 0) pick = 0;
    sel.innerHTML = pSheets.map((s, i) =>
      `<option value="${i}"${i === pick ? ' selected' : ''}>${L.esc(s.name)} (${s.rows.length}줄)</option>`).join('');
    wrap.style.display = pSheets.length > 1 ? '' : 'none';
    applySheet(pick);
    const rows = pSheets[pick].rows.length;
    if (!rows) pMsg('warn', `"${L.esc(pSheets[pick].name)}" 시트가 비어 있습니다.${pSheets.length > 1 ? ' 다른 시트를 골라 보세요.' : ''}`);
    else pMsg('info', `${L.esc(file.name)} — ${L.esc(pSheets[pick].name)} 시트에서 ${rows}줄을 읽었습니다.`
      + (res.truncated ? ' 너무 길어 앞부분만 읽었습니다.' : '')
      + (pSheets.length > 1 ? ' 시트를 바꿀 수 있습니다.' : ''));
  } catch (e) {
    pSheets = [];
    document.getElementById('pSheetWrap').style.display = 'none';
    pMsg('danger', L.esc(e && e.message ? e.message : '파일을 읽을 수 없습니다.'));
  }
}
document.getElementById('pFileBtn').addEventListener('click', () => document.getElementById('pFile').click());
document.getElementById('pFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  loadSpreadsheet(f);
  e.target.value = '';                      // 같은 파일을 다시 골라도 동작하도록
});
document.getElementById('pSheet').addEventListener('change', e => {
  applySheet(Number(e.target.value));
  const sh = pSheets[Number(e.target.value)];
  if (sh) pMsg(sh.rows.length ? 'info' : 'warn',
    sh.rows.length ? `"${L.esc(sh.name)}" 시트에서 ${sh.rows.length}줄을 읽었습니다.` : `"${L.esc(sh.name)}" 시트가 비어 있습니다.`);
});
/* 파일을 끌어다 놓아도 되게 */
(function () {
  const box = document.querySelector('#pasteModal .upbox');
  if (!box) return;
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  box.addEventListener('dragover', e => { stop(e); box.classList.add('drag'); });
  box.addEventListener('dragleave', e => { stop(e); box.classList.remove('drag'); });
  box.addEventListener('drop', e => {
    stop(e); box.classList.remove('drag');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    loadSpreadsheet(f);
  });
})();

const KEYS = [

const META_KEY = 'lm.sync.v1';          // { rev: {univ,life}, hash: {univ,life}, lastAt }
const L = window.LM;

/* ---------- 상태 ---------- */
const state = {
  available: false,        // SDK 를 불러올 수 있는 환경인가
  ready: false,
  user: null,              // { uid, email, name }
  status: 'off',           // off | idle | syncing | error | offline
  message: '',
  lastAt: '',
  pending: false,          // 올릴 것이 남아 있는가
};
const listeners = new Set();
function emit() { listeners.forEach(fn => { try { fn(publicState()); } catch (e) { /* 무시 */ } }); }
function publicState() { return Object.assign({}, state); }

/* ---------- 잡동사니 ---------- */
function meta() {
  let m;
  try { m = Object.assign({ uid: '', rev: {}, hash: {}, lastAt: '' }, JSON.parse(localStorage.getItem(META_KEY) || '{}')); }
  catch (e) { m = { uid: '', rev: {}, hash: {}, lastAt: '' }; }
  // 다른 계정으로 로그인했다면 이전 계정의 판단 기준을 그대로 쓰면 안 된다
  if (state.user && m.uid && m.uid !== state.user.uid) m = { uid: state.user.uid, rev: {}, hash: {}, lastAt: '' };
  if (state.user) m.uid = state.user.uid;
  return m;
}
function saveMeta(m) { try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) { /* 무시 */ } }
/** 짧은 지문 — 내용이 바뀌었는지만 알면 되므로 가벼운 해시로 충분하다 */
function fingerprint(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return `${str.length}:${h}`;
}
function localJson(key) { return localStorage.getItem(key) || ''; }
function stamp(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  const p2 = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
function deviceName() {
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) return '안드로이드';
  if (/iPhone|iPad/i.test(ua)) return '아이폰 · 아이패드';
  if (/Mac/i.test(ua)) return '맥';
  if (/Windows/i.test(ua)) return '윈도우 PC';
  return '기기';
}

/* ---------- 본체 ---------- */
let fb = null;             // { auth, db, api }
let unsub = [];
let timers = {};
let applying = false;      // 원격 내용을 반영하는 중 (되올리기 방지)

/**
 * 새 기기에서 처음 열면 빈 화면만 보인다 — 로그인하면 이어서 볼 수 있다고 알려 준다.
 * 기록이 하나도 없고 · 로그인도 안 한 · 홈 화면일 때만 한 번 보여 준다.

function maybeInviteSignIn() {

  const put = () => {

      + '이 기기에는 아직 저장된 내용이 없습니다. '

  if (put()) return;

}

/** 파일을 직접 열었을 때(file://) 화면 위에 경고를 붙인다 */
function showFileWarning() {

    wrap.insertBefore(box, wrap.firstChild);

  if (put()) return;

async function load() {
  if (!/^https?:$/.test(location.protocol)) {
    state.message = '파일을 직접 열어서(file://) 구글 로그인이 막혀 있습니다. '
      + '이 폴더의 "차곡차곡 실행.bat" 을 더블클릭해 http://localhost:8123 으로 여시면 로그인할 수 있습니다.';
    emit();
    showFileWarning();
    return false;
  }
  try {
    const [appMod, authMod, fsMod] = await Promise.all([
      import(SDK + 'firebase-app.js'),
      import(SDK + 'firebase-auth.js'),
      import(SDK + 'firebase-firestore.js'),
    ]);
    const app = appMod.initializeApp(CONFIG);
    let db;
    try {
      db = fsMod.initializeFirestore(app, {
        localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }),
      });
    } catch (e) {
      db = fsMod.getFirestore(app);      // 저장소를 못 쓰는 브라우저면 메모리로
    }
    fb = { app, db, auth: authMod.getAuth(app), A: authMod, F: fsMod };
    state.available = true;
    state.ready = true;
    fb.A.onAuthStateChanged(fb.auth, u => {
      stopWatch();
      state.user = u ? { uid: u.uid, email: u.email || '', name: u.displayName || '' } : null;
      state.lastAt = u ? (meta().lastAt || '') : '';
      state.status = u ? 'syncing' : 'off';
      state.message = u ? '' : '';
      emit();
      maybeInviteSignIn();
      if (u) startWatch();
    });
    return true;
  } catch (e) {
    console.warn('동기화 준비 실패:', e);
    state.message = '동기화 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
    emit();
    return false;
  }
}

function docRef(name) {
  return fb.F.doc(fb.db, 'users', state.user.uid, 'data', name);
}

/** 원격 내용을 이 브라우저에 적용 */
function applyRemote(entry, data) {
  applying = true;
  try {
    localStorage.setItem(entry.key, data.json);
    const m = meta();
    m.rev[entry.doc] = data.rev || 0;
    m.hash[entry.doc] = fingerprint(data.json);
    m.lastAt = Date.now();
    saveMeta(m);
    state.lastAt = m.lastAt;
  } finally { applying = false; }
}

/** 이 브라우저 내용을 올린다 */
async function push(entry, reason) {
  if (!state.user) return;
  const json = localJson(entry.key);
  if (!json) return;
  if (json.length > 900000) {
    state.status = 'error';
    state.message = `${entry.label} 데이터가 너무 커서(${Math.round(json.length / 1024)}KB) 올릴 수 없습니다. 오래된 기록을 정리해 주세요.`;
    emit();
    return;
  }
  const m = meta();
  const rev = (m.rev[entry.doc] || 0) + 1;
  state.status = 'syncing'; emit();
  try {
    await fb.F.setDoc(docRef(entry.doc), {
      json, rev, updatedAt: Date.now(), device: deviceName(),
    });
    m.rev[entry.doc] = rev;
    m.hash[entry.doc] = fingerprint(json);
    m.lastAt = Date.now();
    saveMeta(m);
    state.lastAt = m.lastAt;
    state.pending = false;
    state.status = 'idle';
    state.message = '';
  } catch (e) {
    console.warn('올리기 실패:', e);
    state.status = navigator.onLine ? 'error' : 'offline';
    state.message = navigator.onLine
      ? '클라우드에 저장하지 못했습니다. 보안 규칙을 확인해 주세요.'
      : '인터넷이 끊겨 있습니다. 연결되면 자동으로 올립니다.';
  }
  emit();
}

/** 원격 · 로컬이 서로 다를 때 어느 쪽을 살릴지 정한다 */
function decide(entry, remote) {
  const m = meta();
  const localStr = localJson(entry.key);
  const localHash = fingerprint(localStr);
  const seenHash = m.hash[entry.doc];
  const seenRev = m.rev[entry.doc] || 0;

  if (!remote) return localStr ? 'push' : 'none';           // 클라우드에 아직 없음
  const remoteNew = (remote.rev || 0) !== seenRev;
  const localNew = seenHash === undefined ? !!localStr : localHash !== seenHash;

  if (!remoteNew && !localNew) return 'none';
  if (remoteNew && !localNew) return 'pull';
  if (!remoteNew && localNew) return 'push';
  if (remote.json === localStr) return 'mark';              // 내용이 같으면 표시만 맞춘다
  return 'ask';
}

let reloadTimer = null;
function scheduleReload(msg) {
  if (L && L.toast) L.toast(msg);
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(function again() {
    const busy = document.querySelector('.modal-bg.open')
      || ['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName);
    if (busy) { reloadTimer = setTimeout(again, 3000); return; }
    location.reload();
  }, 1200);
}

function startWatch() {
  for (const entry of KEYS) {
    const un = fb.F.onSnapshot(docRef(entry.doc), snap => {
      const remote = snap.exists() ? snap.data() : null;
      // 아직 서버 응답을 못 받은 캐시 결과로 "클라우드가 비었다"고 단정하면
      // 이 기기 내용으로 남의 최신 기록을 덮어쓸 수 있다 — 서버 응답을 기다린다
      if (!remote && snap.metadata && snap.metadata.fromCache) {
        state.status = navigator.onLine ? 'syncing' : 'offline';
        emit();
        return;
      }
      const act = decide(entry, remote);
      if (act === 'none') { state.status = 'idle'; state.lastAt = meta().lastAt; emit(); return; }
      if (act === 'push') { push(entry, 'first'); return; }
      if (act === 'mark') {
        const m = meta();
        m.rev[entry.doc] = remote.rev || 0;
        m.hash[entry.doc] = fingerprint(remote.json);
        m.lastAt = Date.now(); saveMeta(m);
        state.status = 'idle'; state.lastAt = m.lastAt; emit();
        return;
      }
      if (act === 'pull') {
        applyRemote(entry, remote);
        state.status = 'idle'; emit();
        scheduleReload(`다른 기기에서 바꾼 ${entry.label} 기록을 받았습니다. 화면을 새로 고칩니다.`);
        return;
      }
      // 양쪽 다 바뀐 경우 — 사용자에게 묻는다
      const ok = confirm(
        `${entry.label} 기록이 이 기기와 클라우드에서 서로 다릅니다.\n\n` +
        `클라우드: ${stamp(remote.updatedAt)} · ${remote.device || '다른 기기'}에서 수정\n` +
        `이 기기: 마지막 동기화 이후 변경됨\n\n` +
        `[확인] 클라우드 기록을 가져옵니다 (이 기기 변경은 사라집니다)\n` +
        `[취소] 이 기기 기록으로 클라우드를 덮어씁니다`);
      if (ok) {
        applyRemote(entry, remote);
        scheduleReload(`클라우드의 ${entry.label} 기록을 가져왔습니다.`);
      } else {
        const m = meta();
        m.rev[entry.doc] = remote.rev || 0;      // 최신 rev 위에 덮어쓰도록
        saveMeta(m);
        push(entry, 'overwrite');
      }
    }, err => {
      console.warn('동기화 감시 실패:', err);
      state.status = 'error';
      state.message = err && /permission/i.test(err.message || '')
        ? '접근이 거부되었습니다. Firestore 보안 규칙에 users 규칙을 추가해 주세요.'
        : '클라우드와 연결하지 못했습니다.';
      emit();
    });
    unsub.push(un);
  }
}
function stopWatch() { unsub.forEach(fn => { try { fn(); } catch (e) { /* 무시 */ } }); unsub = []; }

/* ---------- 저장이 일어나면 자동으로 올린다 ---------- */
function hookStore() {
  if (!L || !L.Store || L.Store.__synced) return;
  const orig = L.Store.save.bind(L.Store);
  L.Store.save = function (key, value) {
    const ok = orig(key, value);
    if (ok && !applying) {
      const entry = KEYS.find(k => k.key === key);
      if (entry && state.user) {
        state.pending = true; emit();
        clearTimeout(timers[entry.doc]);
        timers[entry.doc] = setTimeout(() => push(entry, 'local'), 1500);
      }
    }
    return ok;
  };
  L.Store.__synced = true;
}

/* ---------- 바깥에 내보내는 것 ---------- */
window.LMSync = {
  state: publicState,
  subscribe(fn) { listeners.add(fn); fn(publicState()); return () => listeners.delete(fn); },
  async signIn() {
    if (!fb) { L && L.toast && L.toast(state.message || '동기화를 쓸 수 없는 환경입니다.'); return; }
    try {
      const provider = new fb.A.GoogleAuthProvider();
      await fb.A.signInWithPopup(fb.auth, provider);
    } catch (e) {
      console.warn('로그인 실패:', e);
      const code = (e && e.code) || '';
      L && L.toast && L.toast(
        code.includes('popup-blocked') ? '팝업이 차단되었습니다. 주소창의 팝업 허용을 켜 주세요.'
        : code.includes('popup-closed') ? '로그인 창이 닫혔습니다.'
        : code.includes('unauthorized-domain') ? '이 주소가 파이어베이스 승인 도메인에 없습니다.'
        : '로그인하지 못했습니다.');
    }
  },
  async signOut() {
    if (!fb) return;
    stopWatch();
    try { await fb.A.signOut(fb.auth); } catch (e) { /* 무시 */ }
    L && L.toast && L.toast('로그아웃했습니다. 기록은 이 브라우저에 그대로 있습니다.');
  },
  /** 지금 바로 올리기 */
  async syncNow() {
    if (!state.user) return;
    const 있는것 = KEYS.filter(e => localJson(e.key));
    if (!있는것.length) {
      L && L.toast && L.toast('올릴 기록이 아직 없습니다. 일정이나 메모를 하나 저장해 보세요.');
      return;
    }
    for (const entry of 있는것) await push(entry, 'manual');
    L && L.toast && L.toast('클라우드에 저장했습니다.');
  },
};

hookStore();
load();
window.addEventListener('online', () => { if (state.user) { state.status = 'idle'; emit(); } });
window.addEventListener('offline', () => { if (state.user) { state.status = 'offline'; emit(); } });
</script>
</body>
</html>
