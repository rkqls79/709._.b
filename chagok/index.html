  $('#dashStats').innerHTML = `
    ${statCard('다음 시험', nextExam ? L.ddayLabel(nextExam.examDate) : '없음',
      nextExam ? `${L.esc(nextExam.name)}<br>${L.fmtKo(nextExam.examDate)}` : '자격증을 등록하세요',
      nextExam ? (L.dday(nextExam.examDate) <= 14 ? 'danger' : 'accent') : '')}
    ${statCard('다음 신고기한', nextWork ? L.ddayLabel(nextWork.date) : '없음',
      nextWork ? `${L.esc(nextWork.title)}<br>${L.fmtKo(nextWork.date)}` : '',
      nextWork ? (L.dday(nextWork.date) <= 3 ? 'danger' : L.dday(nextWork.date) <= 7 ? 'warn' : 'ok') : '')}
    <div class="stat ${wk.count >= wk.goal ? 'ok' : 'warn'}">
      <div class="label">이번 주 운동</div>
      <div class="value">${wk.count}<small>/ ${wk.goal}회</small></div>
      <div class="foot">${wk.minutes}분 · 연속 ${streak()}일</div>
      <div class="bar ${wk.count >= wk.goal ? 'ok' : 'warn'}"><i style="width:${L.pct(wk.count, wk.goal)}%"></i></div>
    </div>
    ${statCard('취득 자격증', passed, `배우는 중 ${learning}건`, 'purple')}`;

  /* 다가오는 시험·접수 */
  const ev = [];
  for (const c of DB.certs) {
    if (['passed'].includes(c.status)) continue;
    if (c.applyStart && L.dday(c.applyStart) >= -3) ev.push({ d: c.applyStart, t: `${c.name} 원서접수 시작`, tone: 'warn' });
    if (c.applyEnd && L.dday(c.applyEnd) >= 0) ev.push({ d: c.applyEnd, t: `${c.name} 원서접수 마감`, tone: 'danger' });
    if (c.examDate && L.dday(c.examDate) >= 0) ev.push({ d: c.examDate, t: `${c.name} 시험`, tone: 'accent' });
    if (c.resultDate && L.dday(c.resultDate) >= 0) ev.push({ d: c.resultDate, t: `${c.name} 합격 발표`, tone: 'ok' });
  }
  ev.sort((a, b) => a.d.localeCompare(b.d));
  $('#certUpcoming').innerHTML = ev.length ? ev.slice(0, 6).map(e => `<li>
    <div class="grow"><div class="ttl">${L.esc(e.t)}</div><div class="meta">${L.fmtLong(e.d)}</div></div>
    <span class="badge ${e.tone} mono">${L.ddayLabel(e.d)}</span></li>`).join('')
    : `<li><div class="grow dim">예정된 시험·접수 일정이 없습니다.</div></li>`;

  /* 이번 달 신고기한 */
  const now = new Date();
  const mPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const mine = items.filter(i => i.date.startsWith(mPrefix));
  $('#workUpcoming').innerHTML = mine.length ? mine.map(i => workLi(i, true)).join('')
    : `<li><div class="grow dim">이번 달 신고기한이 없습니다.</div></li>`;

  /* 운동 요약 */
  $('#fitSummary').innerHTML = weekStrip();

  /* 지금 배우는 것 */
  const now2 = DB.wishes.filter(w => w.status === 'now');
  $('#wishNow').innerHTML = now2.length ? now2.map(w => `<li>
    <div class="grow"><div class="ttl">${L.esc(w.title)}</div>
      <div class="meta">${w.cat ? L.esc(w.cat) + ' · ' : ''}${w.target ? L.fmtKo(w.target) + ' 목표' : '기한 없음'}</div>
      <div class="bar sm" style="max-width:220px"><i style="width:${Number(w.progress) || 0}%"></i></div></div>
    <span class="badge accent mono">${Number(w.progress) || 0}%</span>
    <button class="btn sm ghost" data-edit-wish="${w.id}">수정</button></li>`).join('')
    : `<li><div class="grow dim">'지금 하는 중'으로 옮긴 항목이 여기 보입니다.</div></li>`;
}
function statCard(label, value, foot, tone) {
  return `<div class="stat ${tone || ''}"><div class="label">${label}</div>
    <div class="value">${value}</div><div class="foot">${foot || '&nbsp;'}</div></div>`;
}

/* =========================================================
   자격증 온라인 강의 — cert.course = { enabled, provider, courseName,
   startDate, targetEndDate, lectures:[{id,title,section,dueDate,watched,watchedAt,memo}] }
   기존 자격증 데이터에 course가 없어도 안전하게 동작한다.
   ========================================================= */
/** 한 자격증의 강의를 모두 완료 / 해제 처리 */
function setAllCertWatched(certId, done) {
  const c = DB.certs.find(v => v.id === certId);
  const items = certLectures(c);
  if (!items.length) { L.toast('등록된 강의가 없습니다.'); return false; }
  const n = items.filter(i => !!i.watched !== done).length;
  if (!n) { L.toast(done ? '이미 모두 완료했습니다.' : '완료 표시된 강의가 없습니다.'); return false; }
  if (!confirm(done ? `미완료 ${n}강을 모두 완료 처리할까요?`
    : `완료 표시된 ${n}강을 모두 해제할까요?\n수강 날짜 기록도 함께 지워집니다.`)) return false;
  const today = L.todayStr();
  items.forEach(i => {
    i.watched = done;
    i.watchedAt = done ? (i.watchedAt || today) : '';
    if (done) i.progress = 100;
  });
  setCertLectures(c, items);
  L.toast(done ? '전체 완료로 표시했습니다.' : '완료 표시를 해제했습니다.');
  return true;
}
function certCourse(c) { return (c && c.course && typeof c.course === 'object') ? c.course : null; }
function certLectures(c) { const cc = certCourse(c); return cc && Array.isArray(cc.lectures) ? cc.lectures : []; }
function ensureCertCourse(c) {
  if (!c.course || typeof c.course !== 'object') {
    c.course = { enabled: false, provider: '', courseName: '', startDate: '', targetEndDate: '', lectures: [] };
  }
  if (!Array.isArray(c.course.lectures)) c.course.lectures = [];
  return c.course;
}
function setCertLectures(c, items) { ensureCertCourse(c).lectures = items; }

/** 자격증 카드에 넣는 강의 진도 요약 — 실제 관리는 "자격증 강의" 화면에서 한다 (중복 UI 제거) */
function certLecSummary(c) {
  const cc = certCourse(c);
  if (!cc || !cc.enabled) {
    return `<div class="inline" style="margin-top:12px">
      <span class="dim" style="font-size:12.5px">온라인 강의를 등록하지 않았습니다.</span>
      <div style="flex:1"></div>
      <button class="btn sm ghost" data-clec-enable-btn="${c.id}">온라인 강의 켜기</button></div>`;
  }
  const st = L.lectureStats(cc.lectures);
  return `<div class="sec-title" style="margin-top:12px">온라인 강의 ${st.watched} / ${st.total}강</div>
    <div class="bar ${st.pct >= 100 ? 'ok' : 'accent'}"><i style="width:${st.pct}%"></i></div>
    <div class="inline" style="margin-top:7px;font-size:12px">
      <span class="dim">${L.esc(cc.courseName || cc.provider || '과정명 미입력')} · ${st.pct}%</span>
      ${st.overdue ? `<span class="badge danger">기한 지남 ${st.overdue}강</span>` : ''}
      <div style="flex:1"></div>
      <button class="btn sm ghost" data-cl-open="${c.id}">강의 관리 →</button></div>`;
}

/* =========================================================
   자격증 — 단계(관심 → 준비 → 접수 → 응시 → 결과 → 취득) 관리
   목록(표) 에서 고른 항목을 아래 상세에서 자세히 다룬다.
   새 필드는 store.js 의 normCert 가 옛 데이터에서 만들어 준다.
   ========================================================= */
let certFilter = 'active';
let certSel = '';

const certAll = () => (DB.certs || []).map(L.normCert);
function certById(id) { return certAll().find(c => c.id === id) || null; }

function certFilteredList() {
  let list = certAll();
  if (certFilter === 'active') list = list.filter(c => !['passed', 'failed'].includes(c.status));
  if (certFilter === 'passed') list = list.filter(c => c.status === 'passed');
  return list.sort((a, b) => (a.examDate || '9999').localeCompare(b.examDate || '9999') || a.name.localeCompare(b.name));
}
/** 자격증 준비 진행률 — 체크리스트·서류·과목·강의를 함께 본다 */
function certProgressPct(c) {
  if (!c) return 0;
  if (c.stage === 'acquire') return 100;
  const parts = [];
  const ck = c.checklist || [];
  if (ck.length) parts.push(L.pct(ck.filter(i => i.done).length, ck.length));
  const dc = c.docs || [];
  if (dc.length) parts.push(L.pct(dc.filter(i => i.done).length, dc.length));
  const sb = c.subjects || [];
  if (sb.length) parts.push(L.pct(sb.filter(i => i.done).length, sb.length));
  const lec = certLectures(c);
  if (lec.length) parts.push(L.lectureStats(lec).pct);
  if (Number(c.targetH)) parts.push(L.pct(Number(c.loggedH) || 0, Number(c.targetH)));
  if (!parts.length) return Math.round((L.certStageIndex(c) / 5) * 100);
  return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length);
}
/** 단계별 날짜 — 직접 기록한 값이 없으면 입력한 일정에서 가져온다 */
function certStageDate(c, key) {
  const st = (c.stages || {})[key] || {};
  if (st.date) return st.date;
  if (key === 'apply') return c.applyEnd || c.applyStart || '';
  if (key === 'exam') return c.examDate || '';
  if (key === 'result') return c.resultDate || '';
  if (key === 'acquire') return c.acquiredAt || '';
  return '';
}
/** 자격증에서 지금 챙겨야 하는 날짜 하나 (가장 가까운 것) */
function certNextDate(c) {
  const cand = [
    ['원서 접수 마감', c.applyEnd], ['원서 접수 시작', c.applyStart],
    ['시험', c.examDate], ['결과 발표', c.resultDate],
  ].filter(([, d]) => d && L.dday(d) >= 0).sort((a, b) => a[1].localeCompare(b[1]));
  return cand[0] || null;
}

function renderCert() {
  $$('#certFilter .chip').forEach(c => c.classList.toggle('on', c.dataset.cf === certFilter));
  const all = certAll();
  const list = certFilteredList();
  if (!list.some(c => c.id === certSel)) certSel = list.length ? list[0].id : '';

  /* --- 요약 5칸 --- */
  const t = L.todayStr();
  const inApply = all.filter(c => c.applyStart && c.applyEnd && c.applyStart <= t && t <= c.applyEnd && c.status !== 'passed');
  const examSoon = all.filter(c => c.examDate && L.dday(c.examDate) >= 0 && c.status !== 'passed');
  const resultSoon = all.filter(c => c.resultDate && L.dday(c.resultDate) >= 0 && c.status !== 'passed');
  const ready = all.filter(c => ['interest', 'prep'].includes(c.stage));
  const got = all.filter(c => c.stage === 'acquire' || c.status === 'passed');
  const cell = (ico, k, v, tone) => `<div class="${tone || ''}"><span class="ico">${L.icon(ico, 18)}</span>
    <div><div class="k">${k}</div><div class="v">${v}<small>개</small></div></div></div>`;
  $('#certStrip').innerHTML =
    cell('heart', '관심 · 준비 중', ready.length) +
    cell('note', '접수 진행 중', inApply.length, inApply.length ? 'warn' : '') +
    cell('cal', '시험 예정', examSoon.length, examSoon.length ? 'accent' : '') +
    cell('bell', '결과 발표 예정', resultSoon.length) +
    cell('award', '취득 완료', got.length, got.length ? 'ok' : '');

  /* --- 지금 해야 할 일 --- */
  const todo = [];
  for (const c of all) {
    if (c.status === 'passed') continue;
    if (c.applyStart && L.dday(c.applyStart) >= 0) todo.push({ c, ico: 'note', t: '원서 접수 시작', d: c.applyStart });
    else if (c.applyEnd && L.dday(c.applyEnd) >= 0) todo.push({ c, ico: 'note', t: '원서 접수 마감', d: c.applyEnd });
    if (c.examDate && L.dday(c.examDate) >= 0) todo.push({ c, ico: 'cal', t: '시험일', d: c.examDate });
    if (c.resultDate && L.dday(c.resultDate) >= 0) todo.push({ c, ico: 'bell', t: '결과 발표', d: c.resultDate });
  }
  todo.sort((a, b) => a.d.localeCompare(b.d));
  $('#certTodo').innerHTML = todo.length ? todo.slice(0, 6).map(x => {
    const n = L.dday(x.d);
    return `<li>
      <span class="dot ${n <= 3 ? 'danger' : n <= 10 ? 'warn' : 'accent'}">${L.icon(x.ico, 14)}</span>

  /* --- 진행 현황 --- */
  const prog = list.length ? list : all;

/** 단계 이동 — 앞 단계는 완료로 표시하고, 상태·날짜를 함께 정리한다 */
function certGoStage(id, key) {
  const c = certById(id);
  if (!c) return;
  const idx = L.CERT_STAGE_KEYS.indexOf(key);
  if (idx < 0) return;
  const today = L.todayStr();
  // 같은 단계를 다시 누르면 한 단계 뒤로 (실수로 넘긴 경우를 되돌린다)
  if (c.stage === key && idx > 0) {
    c.stages[key] = { done: false, date: '' };
    c.stage = L.CERT_STAGE_KEYS[idx - 1];
  } else {
    c.stage = key;
    L.CERT_STAGE_KEYS.forEach((k, i) => {
      if (i < idx) { c.stages[k].done = true; if (!c.stages[k].date) c.stages[k].date = today; }
      else if (i > idx) { c.stages[k] = { done: false, date: '' }; }
    });
    c.stages[key].done = key === 'acquire';
    if (key === 'acquire') {
      c.stages[key].date = c.stages[key].date || today;
      c.acquiredAt = c.acquiredAt || c.resultDate || today;
      c.result = 'pass';
    }
  }
  if (c.stage !== 'acquire' && c.result === 'pass') c.result = '';
  L.certSyncStatus(c);
  save(); renderAll();
}

/* =========================================================
   배우고 싶은 것 · 실무 공부 — 단계형 로드맵
   같은 저장소(DB.wishes)를 scope 로만 나눈다. 기존 데이터에는 scope 가 없으므로
   scope 가 'work' 가 아닌 것은 모두 개인(배우고 싶은 것)으로 본다.
   단계(stage)는 store.js 의 normWish 가 옛 status 에서 만들어 준다.
   ========================================================= */
const wishScopeOf = w => (w && w.scope === 'work') ? 'work' : 'personal';
const wishSel = { personal: '', work: '' };

function wishAll(scope) {
  return (DB.wishes || []).map(L.normWish).filter(w => wishScopeOf(w) === scope);
}
function wishById(id) { return (DB.wishes || []).map(L.normWish).find(w => w.id === id) || null; }

/** 요약 칸 + 로드맵 + 상세를 함께 그린다 */
function renderWishBoard(scope, boxId, stripId, detailId) {
  const box = $(boxId);
  if (!box) return;
  const mine = wishAll(scope);
  if (!mine.some(w => w.id === wishSel[scope])) wishSel[scope] = '';

  /* --- 요약 --- */
  const strip = $(stripId);
  if (strip) {
    const total = mine.length;
    const avg = total ? Math.round(mine.reduce((a, w) => a + L.wishProgress(w), 0) / total) : 0;
    const dot = tone => `<i style="width:8px;height:8px;border-radius:50%;display:inline-block;background:var(${tone})"></i>`;
    strip.innerHTML =
      `<div><span class="ico">${ringSvg(avg, 42)}</span>
         <div><div class="k">전체 항목</div><div class="v">${total}<small>개</small></div></div></div>` +
      L.WISH_STAGES.map((st, i) => {
        const n = mine.filter(w => w.stage === st.key).length;
        const tone = ['--text-3', '--warn', '--ok', '--accent', '--purple'][i];
        return `<div><div style="display:flex;flex-direction:column;gap:3px">

function renderWorkLearn() { renderWishBoard('work', '#workLearnBoard', '#workLearnStrip', '#workLearnDetail'); }

let wishDrag = null;
function wireWishDnd(scope, boxId) {
  $$(`${boxId} .rm-item`).forEach(el => {
    el.addEventListener('dragstart', () => { wishDrag = el.dataset.wishPick; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { wishDrag = null; el.classList.remove('dragging'); });
  });
  $$(`${boxId} .col`).forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('dragover');
      if (!wishDrag) return;
      wishGoStage(wishDrag, col.dataset.wishCol);
    });
  });
}

/** 단계 이동 — 완료로 옮기면 완료일을 남긴다 */
function wishGoStage(id, stage) {
  const w = wishById(id);
  if (!w || !L.WISH_STAGE_KEYS.includes(stage) || w.stage === stage) return;
  w.stage = stage;
  if (stage === 'done') { w.progress = 100; w.doneAt = w.doneAt || L.todayStr(); }
  else w.doneAt = '';
  L.wishSyncStatus(w);
  wishSel[wishScopeOf(w)] = w.id;
  save(); renderAll();
}

/* =========================================================
   자격증 강의 — 왼쪽 강의 목록 + 오른쪽 상세
   강의 항목의 progress(진도율) / review(복습 필요)는 새로 추가된 선택 필드로,
   없으면 watched 값에서 기본값을 만들어 옛 데이터도 그대로 동작한다.
   ========================================================= */
let clSel = '';                       // 선택한 자격증 id
let clSort = 'recent';
let clTab = 'list';                   // 'list' | 'stats'

const lecPct = it => (it.progress === undefined || it.progress === null || it.progress === '')
  ? (it.watched ? 100 : 0) : L.clamp(Math.round(Number(it.progress) || 0), 0, 100);
const lecReview = it => !!it.review;
/** 마지막으로 수강한 날 (정렬용) */
const lastStudied = c => certLectures(c).filter(i => i.watchedAt).map(i => i.watchedAt).sort().pop() || '';
/** 강의를 쓰는 자격증 (취득·불합격 제외) */
function clCourses() {
  return DB.certs.filter(c => !['passed', 'failed'].includes(c.status) && certCourse(c) && certCourse(c).enabled);
}
/** 섹션(구분)별로 묶는다. 섹션이 비어 있으면 하나의 묶음으로 본다. */
function lecSections(items) {
  const out = [], idx = {};
  for (const it of items) {
    const key = (it.section || '').trim();
    if (idx[key] === undefined) { idx[key] = out.length; out.push({ key, items: [] }); }
    out[idx[key]].items.push(it);
  }
  return out;
}
/** 목표 완료일까지의 학습 속도 계산 */
function clPace(c) {
  const cc = ensureCertCourse(c);
  const items = cc.lectures;
  const st = L.lectureStats(items);
  const pace = L.lecturePace(items, cc.targetEndDate);
  const doneWeek = L.lecturesDoneThisWeek(items);
  const goal = Number(cc.weeklyGoal) > 0 ? Math.round(Number(cc.weeklyGoal))
    : (pace.perWeekNeeded ? Math.ceil(pace.perWeekNeeded) : 0);
  // 현재 학습 속도 = 시작일부터 지금까지 주당 평균 (시작일이 없으면 첫 수강일 기준)
  const s0 = cc.startDate || items.filter(i => i.watchedAt).map(i => i.watchedAt).sort()[0] || '';
  let cur = null;
  if (s0) {
    const days = Math.max(1, Math.round((L.parse(L.todayStr()) - L.parse(s0)) / L.DAY) + 1);
    cur = Math.round((st.watched / (days / 7)) * 10) / 10;
  }
  return { st, pace, doneWeek, goal, cur, short: Math.max(0, goal - doneWeek) };
}

  const list = clCourses();

      stroke-dasharray="${CC.toFixed(1)}" stroke-dashoffset="${(CC * (1 - st.pct / 100)).toFixed(1)}" transform="rotate(-90 20 20)"/></svg>`;
  const cell = (tone, inner, k, v, unit) => `<div class="${tone}">
      <span class="ico${inner.startsWith('<svg') ? ' plain' : ''}">${inner}</span>

  $('#clStrip').innerHTML =

    cell('accent', L.icon('cal', 20), '이번 주 완료', L.lecturesDoneThisWeek(all), '강') +
    cell(st.overdue ? 'danger' : 'ok', L.icon('clock', 20), '지연', st.overdue, '강');

  /* ---- 왼쪽 강의 목록 ---- */
  $('#clCount').textContent = list.length;

      <span class="t2">${L.esc(cc.courseName || '과정명 없음')}</span>

      <span class="t3"><span class="p">진도 ${s.pct}%</span>
        <span class="c">(${s.watched}/${s.total}강)</span></span>
    </button>`;
  }).join('') : `<div class="card"><div class="card-body">
      <p class="dim" style="font-size:12.5px">온라인 강의를 사용 중인 자격증이 없습니다.</p></div></div>`;

  /* 강의를 아직 쓰지 않는 자격증 — 여기서 바로 켤 수 있게 (시안에는 없지만 없으면 진입 경로가 막힌다) */

  $('#clDetail').innerHTML = c ? clDetailHtml(c) : `<div class="card"><div class="empty-state">

        <div><div class="k">현재 학습 속도</div><div class="v">${P.cur === null ? '—' : `${P.cur}<small>강/주</small>`}</div>
          ${P.short ? `<span class="warn">이번 주 ${P.short}강 더 필요</span>` : ''}</div>
        <div class="act" style="padding:11px 13px"><button class="btn sm" data-cl-edit="${c.id}">학습 계획 조정</button></div>
      </div>

      <div class="subtabs" role="tablist" aria-label="강의 상세">
        <button type="button" role="tab" data-cl-tab="list" aria-selected="${clTab === 'list'}">강의 목록</button>
        <button type="button" role="tab" data-cl-tab="stats" aria-selected="${clTab === 'stats'}">학습 통계</button>
      </div>
      ${clTab === 'list' ? clTableHtml(c, items) : clStatsHtml(c, items)}
    </div>
  </section>`;
}

function clTableHtml(c, items) {
  const today = L.todayStr();
  const st = L.lectureStats(items);
  const allDone = items.length > 0 && items.every(i => i.watched);
  const body = lecSections(items).map((g, gi) => {
    const rows = g.items.map((it, i) => {
      const k = `${c.id}|${it.id}`;
      const pc = lecPct(it);
      const overdue = !it.watched && it.dueDate && it.dueDate < today;
      const isNext = st.next && st.next.id === it.id;
      return `<tr id="clrow-${it.id}" class="${overdue ? 'lag' : ''} ${isNext ? 'nextrow' : ''}">
        <td class="mid"><input type="checkbox" class="lec-check" data-clec-watch="${k}" ${it.watched ? 'checked' : ''}
          aria-label="${L.esc(it.title)} 완료"></td>
        <td class="mid nowrap dim" style="font-size:12px">${gi + 1}-${i + 1}</td>
        <td><input type="text" data-clec-field="${k}|title" value="${L.esc(it.title)}" aria-label="강의명"></td>
        <td><div class="trow">
          <div class="bar ${pc >= 100 ? 'ok' : 'accent'}" style="min-width:56px"><i style="width:${pc}%"></i></div>
          <input type="number" data-clec-prog="${k}" value="${pc}" min="0" max="100" step="5"
            style="width:56px;text-align:right" aria-label="${L.esc(it.title)} 진도율 (%)"><span class="n">%</span>
        </div></td>
        <td class="mid nowrap dim" style="font-size:12px">${it.watchedAt ? L.fmtKo(it.watchedAt) : '-'}</td>
        <td class="mid nowrap">
          <button class="revbtn ${lecReview(it) ? 'on' : ''}" data-clec-rev="${k}" aria-pressed="${lecReview(it)}"
            aria-label="${L.esc(it.title)} 복습 필요 ${lecReview(it) ? '해제' : '표시'}">${lecReview(it) ? '복습 필요' : '-'}</button>
          <button class="iconmini" data-clec-del="${k}" aria-label="${L.esc(it.title)} 삭제">${L.icon('trash', 14)}</button>
        </td>
      </tr>`;
    }).join('');
    const gst = L.lectureStats(g.items);
    return `<tr class="grp"><td colspan="6">${gi + 1}. ${L.esc(g.key || '구분 없음')}
      <span class="dim" style="font-weight:400">· ${gst.watched}/${gst.total}강</span></td></tr>${rows}`;
  }).join('');

  return items.length ? `<div class="table-wrap"><table class="tbl leclist">
      <thead><tr>
        <th class="mid" style="width:34px"><input type="checkbox" class="lec-check" data-clec-allcheck="${c.id}"
          ${allDone ? 'checked' : ''} aria-label="전체 완료 처리"></th>
        <th class="mid" style="width:52px">구분</th><th style="min-width:170px">강의명</th>
        <th style="width:168px">진도율</th><th class="mid" style="width:92px">수강 날짜</th>
        <th class="mid" style="width:112px">복습</th>
      </tr></thead><tbody>${body}</tbody></table></div>
    <div class="inline" style="margin-top:10px;flex-wrap:wrap">
      <input type="number" min="0" max="300" value="${items.length}" data-clec-count="${c.id}"
        style="width:74px" aria-label="전체 강의 수">
      <button class="btn sm" data-clec-resize="${c.id}">강의 수 맞추기</button>
      <button class="btn sm ghost" data-clec-add="${c.id}">+ 1강 추가</button>
      <button class="btn sm ghost" data-cl-paste="${c.id}">엑셀 붙여넣기</button>
      <div style="flex:1;min-width:10px"></div>
      <span class="dim" style="font-size:11.5px">구분(섹션)은 강의명 왼쪽 번호로 자동 매겨집니다. 강의 정보 수정에서 섹션을 나눌 수 있습니다.</span>
    </div>`
    : `<div class="empty-state" style="padding:22px 12px"><p>등록된 강의가 없습니다.</p>
      <div class="inline" style="justify-content:center;margin-top:12px">
        <input type="number" min="0" max="300" value="20" data-clec-count="${c.id}" style="width:74px" aria-label="전체 강의 수">
        <button class="btn sm primary" data-clec-resize="${c.id}">강의 수 맞추기</button>
        <button class="btn sm" data-cl-paste="${c.id}">엑셀 붙여넣기</button>
      </div></div>`;
}

function clStatsHtml(c, items) {
  const cc = ensureCertCourse(c);
  const st = L.lectureStats(items);
  if (!items.length) return `<p class="dim" style="font-size:12.5px;padding:8px 0">강의를 등록하면 학습 통계가 표시됩니다.</p>`;
  /* 최근 8주 완료 추이 */
  const wr = L.weekRange();
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const s = L.addDays(wr.start, -7 * i), e = L.addDays(s, 6);
    const d = L.parse(s);
    weeks.push({ label: `${d.getMonth() + 1}/${d.getDate()}`, n: items.filter(x => x.watchedAt && x.watchedAt >= s && x.watchedAt <= e).length });
  }
  const peak = weeks.reduce((a, b) => Math.max(a, b.n), 0), max = peak || 1;
  const review = items.filter(lecReview);
  const partial = items.filter(i => lecPct(i) > 0 && lecPct(i) < 100);
  const avg = items.length ? Math.round(items.reduce((a, i) => a + lecPct(i), 0) / items.length) : 0;
  return `<div class="grid g2">
    <div>
      <div class="sec-title">주간 완료 추이 (최근 8주)</div>
      <div class="barchart" style="height:110px">
        ${weeks.map(w => `<div title="${w.label} 주: ${w.n}강"><div class="n">${w.n || ''}</div>
          <div class="b ${w.n ? '' : 'zero'}" style="height:${(w.n / max) * 100}%;min-height:${w.n ? 3 : 2}px"></div></div>`).join('')}
      </div>
      <div class="barlabels">${weeks.map(w => `<div>${w.label}</div>`).join('')}</div>
      <div class="sumrow">
        <div><div class="k">평균 진도율</div><div class="v">${avg}%</div></div>
        <div><div class="k">가장 많은 주</div><div class="v">${peak}강</div></div>
        <div><div class="k">기한 지남</div><div class="v" style="color:${st.overdue ? 'var(--danger)' : 'inherit'}">${st.overdue}강</div></div>
      </div>
    </div>
    <div>
      <div class="sec-title">구분별 진도</div>
      ${lecSections(items).map((g, gi) => {
        const s = L.lectureStats(g.items);
        return `<div style="margin-bottom:10px">
          <div class="inline" style="font-size:12.5px"><b>${gi + 1}. ${L.esc(g.key || '구분 없음')}</b>
            <div style="flex:1"></div><span class="dim">${s.watched}/${s.total}강 · ${s.pct}%</span></div>
          <div class="bar ${s.pct >= 100 ? 'ok' : 'accent'}" style="margin-top:4px"><i style="width:${s.pct}%"></i></div></div>`;
      }).join('')}
      <div class="sec-title" style="margin-top:14px">복습이 필요한 강의</div>
      ${review.length ? review.slice(0, 8).map(i => `<div class="mrow">
          <span class="lb">${L.esc(i.title)}</span><span class="tail">${lecPct(i)}%</span>
          <button class="btn sm ghost" data-cl-jump="${c.id}|${i.id}">보기</button></div>`).join('')
        + (review.length > 8 ? `<p class="dim" style="font-size:11.5px;margin-top:6px">외 ${review.length - 8}강</p>` : '')
        : `<p class="dim" style="font-size:12.5px">복습 표시한 강의가 없습니다.${partial.length ? ` 진도율이 100%가 아닌 강의가 ${partial.length}강 있습니다.` : ''}</p>`}
    </div>
  </div>`;
}

/* =========================================================
   엑셀 붙여넣기로 자격증 강의 가져오기
   ========================================================= */
function openClPaste(certId) {
  const list = clCourses();
  const pick = certId || '';
  $('#pTarget').innerHTML =
    `<option value="">붙여넣은 "자격증" 열로 나누기 (없으면 새로 만들기)</option>` +
    DB.certs.filter(c => !['passed', 'failed'].includes(c.status))
      .map(c => `<option value="${c.id}">${L.esc(c.name)}${certCourse(c) && certCourse(c).enabled ? '' : ' (강의 꺼짐 → 자동 켜짐)'}</option>`).join('');
  $('#pTarget').value = pick;
  $('#pMode').value = 'append';
  $('#pText').value = '';
  $('#pStrip').checked = true;
  pSheets = [];
  $('#pSheetWrap').style.display = 'none';
  $('#pFileMsg').innerHTML = '';
  renderClPastePreview();
  $('#pasteModal').classList.add('open');
  setTimeout(() => $('#pText').focus(), 30);
}

function clPastePlan() {
  const target = $('#pTarget').value;
  const res = L.parseLecturePaste($('#pText').value, { stripNo: $('#pStrip').checked });
  const buckets = new Map();
  for (const r of res.rows) {
    let key, label, certId = '', newName = '';
    if (target) {
      const c = DB.certs.find(v => v.id === target);
      key = target; certId = target; label = c ? c.name : '자격증';
    } else {
      const name = (r.group || '').trim();
      if (!name) { key = '__none__'; label = '(자격증 미지정)'; }
      else {
        const hit = DB.certs.find(c => c.name.trim() === name);
        if (hit) { key = hit.id; certId = hit.id; label = hit.name; }
        else { key = 'new:' + name; newName = name; label = name; }
      }
    }
    if (!buckets.has(key)) buckets.set(key, { key, label, certId, newName, rows: [] });
    buckets.get(key).rows.push(r);
  }
  return { res, buckets: Array.from(buckets.values()) };
}

function renderClPastePreview() {
  const { res, buckets } = clPastePlan();
  const total = res.rows.length;
  const bad = buckets.find(b => b.key === '__none__');
  const mode = $('#pMode').value;
  $('#pApply').disabled = !total || !!bad;
  $('#pApply').textContent = total ? `${total}강 가져오기` : '가져오기';

  if (!$('#pText').value.trim()) {
    $('#pPreview').innerHTML = `<p class="dim" style="font-size:12.5px">붙여넣으면 여기에서 미리 확인할 수 있습니다.</p>`;
    return;
  }
  const rowsHtml = buckets.map(b => {
    const cur = b.certId ? certLectures(DB.certs.find(v => v.id === b.certId)).length : 0;
    const head = `<tr class="grp"><td colspan="5">${L.esc(b.label)}
      <span class="dim" style="font-weight:400">· ${b.rows.length}강
      ${b.newName ? '· 새 자격증으로 만듭니다' : b.certId ? `· 기존 ${cur}강 ${mode === 'replace' ? '전체 교체' : '뒤에 추가'}` : ''}</span></td></tr>`;
    const body = b.rows.slice(0, 60).map((r, i) => `<tr>
      <td class="dim" style="width:38px">${i + 1}</td>
      <td><b>${L.esc(r.title)}</b></td>
      <td style="width:118px">${r.section ? L.esc(r.section) : '<span class="dim">-</span>'}</td>
      <td style="width:104px">${r.dueDate ? L.fmtKo(r.dueDate) : '<span class="dim">-</span>'}</td>
      <td class="dim">${L.esc(r.memo || '')}</td></tr>`).join('');
    const more = b.rows.length > 60 ? `<tr><td colspan="5" class="dim">외 ${b.rows.length - 60}강</td></tr>` : '';
    return head + body + more;
  }).join('');

  $('#pPreview').innerHTML = `
    <div class="inline" style="margin-bottom:7px;flex-wrap:wrap">
      <b style="font-size:13px">미리 보기</b>
      <span class="badge ${total ? 'ok' : 'danger'}">${total}강</span>
      ${res.headerUsed ? '<span class="badge accent">머리글 인식</span>' : '<span class="badge">머리글 없음</span>'}
      ${buckets.length > 1 ? `<span class="badge purple">자격증 ${buckets.length}개</span>` : ''}
    </div>
    <div class="prevwrap"><table class="tbl leclist">
      <thead><tr><th style="width:38px">#</th><th>강의명</th><th>구분</th><th>마감일</th><th>메모</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div>
    ${bad ? `<div class="notice danger" style="margin-top:10px"><div>자격증을 알 수 없는 줄이 ${bad.rows.length}개 있습니다.
      위에서 넣을 자격증을 고르거나, 붙여넣는 표에 "자격증" 열을 넣어주세요.</div></div>` : ''}
    ${res.warnings.length ? `<div class="notice warn" style="margin-top:10px"><div>
      ${res.warnings.slice(0, 4).map(w => L.esc(w)).join('<br>')}
      ${res.warnings.length > 4 ? `<br>외 ${res.warnings.length - 4}건` : ''}</div></div>` : ''}`;
}

function applyClPaste() {
  const { buckets } = clPastePlan();
  if (!buckets.length) { L.toast('가져올 강의가 없습니다.'); return; }
  if (buckets.some(b => b.key === '__none__')) { L.toast('넣을 자격증을 정해주세요.'); return; }
  const mode = $('#pMode').value;
  const newN = buckets.filter(b => b.newName).length;
  let msg = `${buckets.reduce((a, b) => a + b.rows.length, 0)}강을 가져옵니다.`;
  if (newN) msg += `\n새 자격증 ${newN}개를 만듭니다.`;
  if (mode === 'replace') {
    const lost = buckets.filter(b => b.certId)
      .reduce((a, b) => a + certLectures(DB.certs.find(v => v.id === b.certId)).filter(i => i.watched).length, 0);
    msg += `\n기존 강의 목록을 전체 교체합니다.${lost ? ` 완료 표시된 ${lost}강도 함께 지워집니다.` : ''}`;
  }
  if (!confirm(msg + '\n계속할까요?')) return;

  let made = 0, added = 0, lastId = '';
  for (const b of buckets) {
    let c;
    if (b.newName) {
      c = { id: L.uid(), name: b.newName.slice(0, 60), org: '', status: 'studying',
        applyStart: '', applyEnd: '', examDate: '', resultDate: '',
        subjects: [], targetH: 0, loggedH: 0, memo: '' };
      DB.certs.push(c);
      made++;
    } else {
      c = DB.certs.find(v => v.id === b.certId);
    }
    if (!c) continue;
    const cc = ensureCertCourse(c);
    cc.enabled = true;                     // 강의를 넣으면 자동으로 켠다
    const cur = mode === 'replace' ? [] : cc.lectures.slice();
    cc.lectures = cur.concat(b.rows.map((r, i) => L.lectureFromRow(r, cur.length + i)));
    added += b.rows.length;
    lastId = c.id;
  }
  if (lastId) { clSel = lastId; clTab = 'list'; }
  save(); closeModals(); goto('certlec'); renderAll();
  L.toast(`${added}강을 가져왔습니다.${made ? ` 새 자격증 ${made}개를 만들었습니다.` : ''}`);
}

/* ---- 강의 정보 모달 ---- */
let editCl = null;
function openClInfo(id) {
  editCl = id;
  const c = DB.certs.find(v => v.id === id);
  if (!c) return;
  const cc = ensureCertCourse(c);
  const items = cc.lectures;
  $('#clModalTitle').textContent = `${c.name} 강의 정보`;
  $('#clProvider').value = cc.provider || '';
  $('#clCourseName').value = cc.courseName || '';
  $('#clStart').value = cc.startDate || '';
  $('#clTarget').value = cc.targetEndDate || '';
  $('#clWeekly').value = cc.weeklyGoal || '';
  $('#clTotal').value = items.length;
  // 지금 쓰이는 구분(섹션)을 순서대로 보여준다
  $('#clSections').value = lecSections(items).map(g => g.key).filter(Boolean).join('\n');
  $('#clSecHint').textContent = items.length
    ? `강의 ${items.length}강을 입력한 구분 수로 나눠 앞에서부터 순서대로 배분합니다. 비워두면 구분을 쓰지 않습니다.`
    : '먼저 전체 강의 수를 입력해 목록을 만들면 구분을 나눌 수 있습니다.';
  $('#clModal').classList.add('open');
  setTimeout(() => $('#clProvider').focus(), 30);
}
function saveClInfo() {
  const c = DB.certs.find(v => v.id === editCl);
  if (!c) return;
  const cc = ensureCertCourse(c);
  const start = $('#clStart').value, target = $('#clTarget').value;
  if (start && target && target < start) { L.toast('목표 완료일이 시작일보다 앞설 수 없습니다.'); return; }
  cc.provider = $('#clProvider').value.trim();
  cc.courseName = $('#clCourseName').value.trim();
  cc.startDate = start;
  cc.targetEndDate = target;
  const wk = Number($('#clWeekly').value);
  cc.weeklyGoal = wk > 0 ? L.clamp(Math.round(wk), 1, 60) : 0;

  /* 전체 강의 수 조정 */
  const n = L.clamp(Math.round(Number($('#clTotal').value) || 0), 0, 300);
  const cur = cc.lectures;
  if (n < cur.length) {
    const dropped = cur.slice(n);
    if (!confirm(`강의 수를 ${cur.length}개에서 ${n}개로 줄입니다. 뒤쪽 ${dropped.length}개가 삭제됩니다.${dropped.some(i => i.watched) ? '\n완료 표시된 강의도 포함되어 있습니다.' : ''}\n계속할까요?`)) return;
  }
  let items = L.resizeLectures(cur, n);

  /* 구분(섹션) 재배분 — 입력한 구분 수로 강의를 앞에서부터 균등하게 나눈다 */
  const secs = $('#clSections').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (secs.length && items.length) {
    const per = Math.ceil(items.length / secs.length);
    items.forEach((it, i) => { it.section = secs[Math.min(secs.length - 1, Math.floor(i / per))]; });
  } else if (!secs.length) {
    items.forEach(it => { it.section = ''; });
  }
  cc.lectures = items;
  save(); closeModals(); renderAll(); L.toast('강의 정보를 저장했습니다.');
}

/* ================= 반복 업무 ================= */
let editRecur = null;
function recurRules() { return Array.isArray(DB.recurring) ? DB.recurring : (DB.recurring = []); }

function renderRecur() {
  const rules = recurRules();
  $('#recurCount').textContent = `${rules.filter(r => r.active !== false).length} / ${rules.length}개 사용`;
  $('#recurTbody').innerHTML = rules.length ? rules.map(r => `<tr data-id="${r.id}">
      <td><b>${L.esc(r.title)}</b>${r.memo ? `<div class="dim" style="font-size:11.5px">${L.esc(r.memo)}</div>` : ''}</td>
      <td>${L.esc(L.recurLabel(r))}</td>
      <td><span class="badge ${(T.CATS[r.cat] || {}).tone || ''}">${L.esc((T.CATS[r.cat] || {}).label || '기타')}</span></td>
      <td>${r.adjust ? '<span class="badge ok">보정</span>' : '<span class="dim" style="font-size:11.5px">그대로</span>'}</td>
      <td>${r.active === false ? '<span class="badge">꺼짐</span>' : '<span class="badge accent">사용 중</span>'}</td>
      <td class="act"><button class="btn sm ghost" data-edit-recur="${r.id}">수정</button>
        <button type="button" class="cardx" data-del-recur="${r.id}" title="삭제"
          aria-label="${L.esc(r.title)} 반복 업무 삭제">${L.icon('x', 14)}</button></td>
    </tr>`).join('')
    : `<tr><td colspan="6"><div class="empty-state" style="padding:22px 0"><div class="big">🔁</div>
        등록한 반복 업무가 없습니다.
        <div style="margin-top:12px"><button class="btn primary sm" data-add-recur>+ 반복 업무 추가</button></div></div></td></tr>`;

  /* 앞으로 60일 안에 오는 반복 업무 */
  const today = L.todayStr(), end = L.addDays(today, 60);
  const y = Number(today.slice(0, 4));
  const soon = [...L.recurOccurrences(rules, y), ...L.recurOccurrences(rules, y + 1)]

/* ================= 운동·건강 ================= */
function weekStats(baseDate) {
  const wr = L.weekRange(baseDate);
  const logs = DB.fitness.logs.filter(l => l.date >= wr.start && l.date <= wr.end);
  return {
    count: logs.length,
    minutes: logs.reduce((a, l) => a + (Number(l.minutes) || 0), 0),
    goal: Number(DB.meta.weeklyGoal) || 3,
    minGoal: Math.max(0, Number(DB.meta.weeklyMinGoal) || 0),
    range: wr,
  };
}
/* 자주 하는 운동 — 최근 기록에서 뽑고, 없으면 기본 목록을 쓴다 */
const FIT_DEFAULT_KINDS = ['헬스', '걷기', '러닝'];
function fitFavKinds() {
  const cnt = {};
  for (const l of DB.fitness.logs) {
    const k = (l.type || '').trim();
    if (k) cnt[k] = (cnt[k] || 0) + 1;
  }
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 4);
  for (const k of FIT_DEFAULT_KINDS) { if (top.length >= 4) break; if (!top.includes(k)) top.push(k); }
  return top.slice(0, 4);
}
/** 그 종류로 마지막에 몇 분 했는지 (없으면 30분) */
function fitLastMinutes(kind) {
  const hit = DB.fitness.logs.filter(l => (l.type || '') === kind && Number(l.minutes) > 0)
    .sort((a, b) => b.date.localeCompare(a.date))[0];
  return hit ? Number(hit.minutes) : 30;
}
/** 최근 90일 종류별 집계 */
function fitKindStats() {
  const from = L.addDays(L.todayStr(), -89);
  const agg = {};
  for (const l of DB.fitness.logs) {
    if (!l.date || l.date < from) continue;
    const k = (l.type || '').trim() || '기타';
    (agg[k] = agg[k] || { n: 0, min: 0, last: '' });
    agg[k].n++; agg[k].min += Number(l.minutes) || 0;
    if (l.date > agg[k].last) agg[k].last = l.date;
  }
  return Object.keys(agg).map(k => Object.assign({ kind: k }, agg[k]))
    .sort((a, b) => b.n - a.n || b.min - a.min);
}
function streak() {
  const set = new Set(DB.fitness.logs.map(l => l.date));
  let n = 0, cur = L.todayStr();
  if (!set.has(cur)) cur = L.addDays(cur, -1);   // 오늘 아직 안 했으면 어제부터 셈
  while (set.has(cur)) { n++; cur = L.addDays(cur, -1); }
  return n;
}
function weekStrip() {
  const wr = L.weekRange();
  const byDate = {};
  for (const l of DB.fitness.logs) (byDate[l.date] = byDate[l.date] || []).push(l);
  const st = weekStats();
  let cells = '';
  for (let i = 0; i < 7; i++) {
    const d = L.addDays(wr.start, i);
    const logs = byDate[d] || [];
    const on = logs.length > 0;
    const isToday = d === L.todayStr();
    cells += `<div style="flex:1;text-align:center">
      <div style="font-size:11px;color:var(--text-3);font-weight:600">${L.WD[(i + 1) % 7]}</div>
      <div title="${logs.map(l => L.esc(l.type || '운동')).join(', ')}" style="
        margin:5px auto 0;width:100%;height:38px;border-radius:8px;
        display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
        background:${on ? 'var(--ok)' : 'var(--surface-2)'};
        color:${on ? '#fff' : 'var(--text-3)'};
        ${isToday ? 'box-shadow:inset 0 0 0 2px var(--accent)' : 'border:1px solid var(--border)'}">
        ${on ? logs.reduce((a, l) => a + (Number(l.minutes) || 0), 0) + '분' : '—'}</div>
      <div style="font-size:10.5px;color:var(--text-3);margin-top:3px">${L.parse(d).getDate()}</div>
    </div>`;
  }
  return `<div style="display:flex;gap:5px">${cells}</div>
    <div class="inline" style="margin-top:12px;font-size:12.5px">
      <span class="badge ${st.count >= st.goal ? 'ok' : 'warn'}">${st.count} / ${st.goal}회</span>
      <span class="badge">${st.minutes}분</span>
      <span class="badge purple">연속 ${streak()}일</span>
      <div style="flex:1"></div>
      <span class="dim">${L.fmtKo(st.range.start)} ~ ${L.fmtKo(st.range.end)}</span>
    </div>`;
}
/** 최근 체중 스탯 카드 — 직전 기록 대비 증감, 목표 대비 격차 */
function weightCard(latest, prev, target) {
  const r1 = n => Math.round(n * 10) / 10;
  if (!latest || latest.weight == null) return statCard('최근 체중', '—', '체중을 기록해보세요', '');
  const w = Number(latest.weight);
  const parts = [];
  if (prev && prev.weight != null) {
    const dw = r1(w - Number(prev.weight));
    parts.push(`${dw >= 0 ? '▲' : '▼'} ${Math.abs(dw)}kg`);
  }
  if (target) {
    const gap = r1(w - target);
    parts.push(`목표 ${target}kg (${gap >= 0 ? '+' : ''}${gap})`);
  } else {
    parts.push(L.fmtKo(latest.date));
  }
  // 최근 추세로 목표 도달 시점 어림하기
  const fc = L.weightForecast(DB.fitness.body || [], target);
  if (target && Math.abs(w - target) > 0.05) {
    if (fc.ok) parts.push(`${L.fmtKo(fc.date)} 도달 예상 (주 ${fc.perWeek > 0 ? '+' : ''}${fc.perWeek}kg)`);
    else if (fc.reason === 'few') parts.push('3회 이상 기록하면 도달 시점을 알려드려요');
    else if (fc.reason === 'away') parts.push(`지금 추세는 목표와 반대로 가고 있어요 (주 ${fc.perWeek > 0 ? '+' : ''}${fc.perWeek}kg)`);
    else if (fc.reason === 'flat') parts.push('최근 변화가 거의 없어요');
  }
  return statCard('최근 체중', `${w}<small>kg</small>`, parts.join(' · '), target && w <= target ? 'ok' : '');
}

function renderFit() {
  const st = weekStats();
  const logs = DB.fitness.logs.slice().sort((a, b) => b.date.localeCompare(a.date));
  const body = DB.fitness.body.slice().sort((a, b) => b.date.localeCompare(a.date));
  const mTotal = logs.filter(l => l.date.startsWith(L.todayStr().slice(0, 7)))
    .reduce((a, l) => a + (Number(l.minutes) || 0), 0);
  const latest = body[0], prev = body[1];
  const target = Number(DB.meta.weightTarget) || 0;

  const minOk = st.minGoal && st.minutes >= st.minGoal;
  $('#fitStats').innerHTML = `
    <div class="stat ${st.count >= st.goal ? 'ok' : 'warn'}">
      <div class="label">이번 주</div><div class="value">${st.count}<small>/ ${st.goal}회</small></div>
      <div class="foot">${st.minGoal
        ? `${st.minutes} / ${st.minGoal}분 ${minOk ? '· 시간 목표 달성' : `· ${st.minGoal - st.minutes}분 남음`}`
        : `${st.minutes}분 운동`}</div>
      <div class="bar ${st.count >= st.goal ? 'ok' : 'warn'}"><i style="width:${L.pct(st.count, st.goal)}%"></i></div>
      ${st.minGoal ? `<div class="bar ${minOk ? 'ok' : 'purple'}" style="margin-top:4px"><i style="width:${L.pct(st.minutes, st.minGoal)}%"></i></div>` : ''}
    </div>
    ${statCard('연속 기록', streak() + '<small>일</small>', logs.length ? `최근 ${L.fmtKo(logs[0].date)}` : '기록 없음', 'purple')}
    ${statCard('이번 달 총 운동', mTotal + '<small>분</small>',
      `${logs.filter(l => l.date.startsWith(L.todayStr().slice(0, 7))).length}회 · 약 ${Math.round(mTotal / 60 * 10) / 10}시간`, 'accent')}
    ${weightCard(latest, prev, target)}`;

  /* 최근 12주 막대 */
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const base = L.addDays(L.todayStr(), -7 * i);
    const w = weekStats(base);
    weeks.push({ label: `${L.parse(w.range.start).getMonth() + 1}/${L.parse(w.range.start).getDate()}`, n: w.count });
  }
  const maxN = Math.max(st.goal, ...weeks.map(w => w.n), 1);
  $('#fitChart').innerHTML = `
    <div style="display:flex;align-items:flex-end;gap:4px;height:130px;position:relative">
      <div style="position:absolute;left:0;right:0;bottom:${(st.goal / maxN) * 100}%;border-top:1px dashed var(--warn);opacity:.8"></div>
      ${weeks.map(w => `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="${w.label} 주: ${w.n}회">
        <div style="font-size:10px;text-align:center;color:var(--text-3);font-weight:600">${w.n || ''}</div>
        <div style="height:${(w.n / maxN) * 100}%;min-height:${w.n ? 3 : 0}px;border-radius:4px 4px 0 0;
          background:${w.n >= st.goal ? 'var(--ok)' : w.n ? 'var(--warn)' : 'transparent'}"></div>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:4px;margin-top:5px">
      ${weeks.map((w, i) => `<div style="flex:1;text-align:center;font-size:9.5px;color:var(--text-3)">${i % 2 === 0 ? w.label : ''}</div>`).join('')}
    </div>
    <p class="dim" style="font-size:11.5px;margin-top:8px">점선 = 주간 목표 ${st.goal}회</p>`;

  /* 체중 선그래프 */
  const pts = DB.fitness.body.filter(b => b.weight != null && b.weight !== '')
    .sort((a, b) => a.date.localeCompare(b.date)).slice(-30);
  if (pts.length >= 2) {
    const ws = pts.map(p => Number(p.weight));
    const lo = Math.min(...ws, target || Infinity) - 1, hi = Math.max(...ws, target || -Infinity) + 1;
    const W = 100, H = 100;
    const x = i => (i / (pts.length - 1)) * W;
    const y = v => H - ((v - lo) / (hi - lo)) * H;
    const path = ws.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
    const area = `${path} L${W},${H} L0,${H} Z`;
    $('#weightBadge').textContent = `${ws[0]}kg → ${ws[ws.length - 1]}kg (${(ws[ws.length - 1] - ws[0] >= 0 ? '+' : '')}${Math.round((ws[ws.length - 1] - ws[0]) * 10) / 10}kg)`;
    $('#weightChart').innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:150px;overflow:visible">
        ${target ? `<line x1="0" y1="${y(target).toFixed(2)}" x2="${W}" y2="${y(target).toFixed(2)}"
          stroke="var(--ok)" stroke-width=".6" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>` : ''}
        <path d="${area}" fill="var(--purple)" opacity=".13"/>
        <path d="${path}" fill="none" stroke="var(--purple)" stroke-width="2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        ${ws.map((v, i) => `<circle cx="${x(i).toFixed(2)}" cy="${y(v).toFixed(2)}" r="1.6" fill="var(--purple)"

      </svg>
      <div class="inline" style="font-size:11.5px;margin-top:6px">
        <span class="dim">${L.fmtKo(pts[0].date)}</span><div style="flex:1"></div>
        ${target ? `<span class="badge ok">목표 ${target}kg</span>` : ''}

      </div>`;
  } else {
    $('#weightBadge').textContent = '';
    $('#weightChart').innerHTML = `<div class="empty-state" style="padding:30px 10px">
      체중을 2회 이상 기록하면 추이 그래프가 나타납니다.
      <div style="margin-top:10px"><button class="btn sm primary" data-add-body>+ 체중 기록</button></div></div>`;
  }

  /* 표 */
  $('#logCount').textContent = `총 ${logs.length}건`;
  $('#logTbody').innerHTML = logs.length ? logs.slice(0, 150).map(l => `<tr>
    <td class="nowrap">${L.fmtKo(l.date)}</td><td>${L.esc(l.type || '—')}</td>

    <td class="act"><button class="btn sm ghost" data-edit-wo="${l.id}">수정</button>

    : `<tr><td colspan="5"><div class="empty-state">운동 기록이 없습니다.</div></td></tr>`;

  $('#bodyTbody').innerHTML = body.length ? body.map(b => `<tr>
    <td class="nowrap">${L.fmtKo(b.date)}</td><td class="num">${b.weight ?? '—'}</td>

    <td class="act"><button class="btn sm ghost" data-edit-body="${b.id}">수정</button>
      <button type="button" class="cardx" data-del-body="${b.id}" title="삭제"
        aria-label="${L.fmtKo(b.date)} 체성분 기록 삭제">${L.icon('x', 14)}</button></td></tr>`).join('')
    : `<tr><td colspan="5"><div class="empty-state">체성분 기록이 없습니다.</div></td></tr>`;

  /* 오늘 바로 기록 */
  const todayLogs = DB.fitness.logs.filter(l => l.date === L.todayStr());
  $('#quickHint').textContent = todayLogs.length
    ? `오늘 ${todayLogs.length}회 · ${todayLogs.reduce((a, l) => a + (Number(l.minutes) || 0), 0)}분 기록됨`
    : '한 번 누르면 오늘 날짜로 기록됩니다';
  $('#fitQuick').innerHTML = fitFavKinds().map(k =>

    : `<p class="dim" style="font-size:12.5px">최근 90일 안에 기록이 없습니다. 위에서 한 번 눌러 기록해보세요.</p>`;
}

  const active = DB.work.cats && DB.work.cats.length ? DB.work.cats : cats.map(([k]) => k);
  $('#catChips').innerHTML = cats.map(([k, v]) =>
    `<button class="chip ${active.includes(k) ? 'on' : ''}" data-cat="${k}">${v.label}</button>`).join('')
    + `<button class="chip" data-cat="__all">전체</button>`;
  $('#hidePast').checked = !!DB.work.hidePast;
  $('#hideDone').checked = !!DB.work.hideDone;

  let items = workItems(year).filter(i => active.includes(i.cat));
  if (DB.work.hidePast) items = items.filter(i => L.dday(i.date) >= 0);
  if (DB.work.hideDone) items = items.filter(i => !isWorkDone(i.id));

  const all = workItems(year).filter(i => active.includes(i.cat));
  const doneN = all.filter(i => isWorkDone(i.id)).length;
  const thisMonth = all.filter(i => i.date.startsWith(`${year}-${String(new Date().getMonth() + 1).padStart(2, '0')}`));
  const next = all.filter(i => !isWorkDone(i.id) && L.dday(i.date) >= 0)[0];
  // 최근 45일 안에 지난 미완료 항목만 집계 — 연초 항목까지 세면 숫자만 커지고 조치할 게 없다
  const overdue = all.filter(i => {
    const n = L.dday(i.date);
    return !isWorkDone(i.id) && n < 0 && n >= -45;
  }).length;

  $('#workStats').innerHTML = `
    ${statCard('다음 기한', next ? L.ddayLabel(next.date) : '없음',
      next ? `${L.esc(next.title)}<br>${L.fmtKo(next.date)}` : '',
      next ? (L.dday(next.date) <= 3 ? 'danger' : L.dday(next.date) <= 7 ? 'warn' : 'ok') : '')}
    <div class="stat accent"><div class="label">${year}년 전체</div>
      <div class="value">${doneN}<small>/ ${all.length}건</small></div>
      <div class="foot">완료율 ${L.pct(doneN, all.length)}%</div>
      <div class="bar"><i style="width:${L.pct(doneN, all.length)}%"></i></div></div>
    ${statCard('이번 달', thisMonth.length + '<small>건</small>',
      `완료 ${thisMonth.filter(i => isWorkDone(i.id)).length}건`, 'purple')}
    ${statCard('최근 45일 내 미처리', overdue + '<small>건</small>',
      overdue ? '기한이 지났는데 완료 표시가 없습니다' : '지연 없음', overdue ? 'danger' : 'ok')}`;

  $('#work-list').style.display = workView === 'list' ? '' : 'none';
  $('#work-cal').style.display = workView === 'cal' ? '' : 'none';
  $$('#workViewChips .chip').forEach(c => c.classList.toggle('on', c.dataset.wv === workView));

  if (workView === 'list') {
    // 월별 그룹
    const groups = {};
    for (const i of items) {
      const m = i.date.slice(0, 7);
      (groups[m] = groups[m] || []).push(i);
    }
    const keys = Object.keys(groups).sort();
    $('#workListBody').innerHTML = keys.length ? keys.map(m => {
      const mn = Number(m.slice(5, 7));
      const g = groups[m];
      const gd = g.filter(i => isWorkDone(i.id)).length;
      return `<div style="padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);
        display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:2">
        <b style="font-size:13.5px">${mn}월</b>
        <span class="badge">${g.length}건</span>
        ${gd ? `<span class="badge ok">완료 ${gd}</span>` : ''}
      </div><ul class="list">${g.map(i => workLi(i)).join('')}</ul>`;
    }).join('') : `<div class="empty-state"><div class="big">📋</div>조건에 맞는 항목이 없습니다.</div>`;
  } else {
    renderWorkCal(items);
  }
}

function workLi(i, compact) {
  const cat = T.CATS[i.cat] || T.CATS.etc;
  const done = isWorkDone(i.id);
  const n = L.dday(i.date);
  const tone = done ? '' : n < 0 ? 'danger' : n <= 3 ? 'warn' : n <= 7 ? 'accent' : '';
  const moved = i.legal !== i.date;
  return `<li class="${done ? 'done' : ''}">
    <input type="checkbox" data-work="${i.id}" ${done ? 'checked' : ''}>
    <div class="grow">
      <div class="ttl">${L.esc(i.title)}</div>
      <div class="meta">
        <span class="badge ${cat.tone}">${cat.label}</span>
        ${L.fmtKo(i.date)}
        ${moved ? `<span class="badge warn" title="법정기한 ${L.fmtKo(i.legal)}이 휴일이라 연장">연장 (법정 ${L.fmtKo(i.legal)})</span>` : ''}
        ${i.custom ? '<span class="badge purple">직접 추가</span>' : ''}
        ${i.recur ? '<span class="badge warn">반복 업무</span>' : ''}
      </div>
      ${!compact && i.note ? `<div class="meta dim">${L.esc(i.note)}</div>` : ''}
    </div>
    <span class="badge ${tone} mono">${L.ddayLabel(i.date)}</span>
    ${i.custom ? `<button class="btn sm ghost" data-edit-work="${i.id}">수정</button>
      <button type="button" class="cardx" data-del-work="${i.id}" title="삭제"
        aria-label="${L.esc(i.title)} 삭제">${L.icon('x', 14)}</button>` : ''}
    ${i.recur ? `<button class="btn sm ghost" data-edit-recur="${i.ruleId}">규칙 수정</button>` : ''}
  </li>`;
}

function renderWorkCal(items) {
  const { y, m } = wcal;
  $('#wcalMonth').textContent = `${y}년 ${m + 1}월`;
  const first = new Date(y, m, 1);
  const off = (first.getDay() + 6) % 7;
  const gs = new Date(y, m, 1 - off);
  const today = L.todayStr();
  const byDate = {};
  for (const i of items) (byDate[i.date] = byDate[i.date] || []).push(i);

  let html = ['월', '화', '수', '목', '금', '토', '일']
    .map((d, i) => `<div class="dow ${i === 6 ? 'sun' : i === 5 ? 'sat' : ''}">${d}</div>`).join('');
  for (let k = 0; k < 42; k++) {
    const d = new Date(gs); d.setDate(gs.getDate() + k);
    const s = L.ymd(d);
    const out = d.getMonth() !== m;
    const hol = L.holidayName(s);
    const dow = d.getDay();
    const evs = (byDate[s] || []).map(i => {
      const cat = T.CATS[i.cat] || T.CATS.etc;
      return `<div class="ev ${cat.tone} ${isWorkDone(i.id) ? 'dim' : ''}" data-work-click="${i.id}"
        title="${L.esc(i.title)}${i.note ? '\n' + L.esc(i.note) : ''}">${L.esc(i.title)}</div>`;
    }).join('');
    html += `<div class="cell ${out ? 'out' : ''} ${s === today ? 'today' : ''}"
      ${hol ? 'style="background:var(--surface-2)"' : ''}>
      <div class="d ${dow === 0 || hol ? 'sun' : dow === 6 ? 'sat' : ''}">${d.getDate()}</div>
      ${hol ? `<div class="hol">${L.esc(hol)}</div>` : ''}${evs}</div>`;
  }
  $('#wcalGrid').innerHTML = html;
}

let goalMonth = L.monthKey();
let editGoal = null;

function goalMonths() {
  const set = new Set((DB.goals || []).map(g => g.month));
  set.add(L.monthKey());
  set.add(goalMonth);
  return Array.from(set).filter(Boolean).sort().reverse();
}
function monthLabel(m) {
  return `${m.slice(0, 4)}년 ${+m.slice(5, 7)}월`;
}
function goalStat(m) {
  const list = (DB.goals || []).filter(g => g.month === m);
  const done = list.filter(g => g.done).length;
  return { n: list.length, done, pct: L.pct(done, list.length) };
}
function ringSvg(p, size) {
  const s = size || 92, r = (s - 18) / 2, C = 2 * Math.PI * r, c = s / 2;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="9"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - p / 100)).toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c + 6}" text-anchor="middle" fill="var(--text)" font-size="17" font-weight="600">${p}%</text>
  </svg>`;
}
function renderGoals() {
  if (!Array.isArray(DB.goals)) DB.goals = [];
  const sel = $('#goalMonthSel');
  sel.innerHTML = goalMonths().map(m =>
    `<option value="${m}"${m === goalMonth ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');

  const st = goalStat(goalMonth);
  $('#goalRing').innerHTML = `<div class="ring">${ringSvg(st.pct)}
    <div class="kv"><div><b>${st.done}</b> <span>/ ${st.n} 달성</span></div>
      <p>${!st.n ? '목표를 등록해보세요' : st.pct >= 100 ? '이 달 목표를 모두 달성했어요' : st.pct >= 50 ? '잘 가고 있어요' : '조금씩 채워가는 중이에요'}</p></div></div>`;

  const months = [];
  let cur = goalMonth + '-01';
  for (let i = 5; i >= 0; i--) months.push(L.monthKey(L.addDays(cur, -i * 30)));
  const uniq = Array.from(new Set(months));
  $('#goalHistory').innerHTML = `<div class="vbars">${uniq.map(m => {
    const s2 = goalStat(m);
    return `<div class="vb" title="${monthLabel(m)} ${s2.done}/${s2.n}">
      <i class="${s2.pct >= 100 && s2.n ? 'on' : ''}" style="height:${s2.n ? Math.max(6, s2.pct) : 3}%"></i>
      <span>${+m.slice(5, 7)}월</span></div>`;
  }).join('')}</div>
  <p class="dim" style="font-size:12px;margin-top:8px">막대는 그 달의 목표 달성률입니다.</p>`;

  const list = (DB.goals || []).filter(g => g.month === goalMonth);
  $('#goalCount').textContent = `${st.done} / ${st.n} 달성`;
  $('#goalList').innerHTML = list.length ? list.map(g => `
    <li class="${g.done ? 'done' : ''}">
      <input type="checkbox" data-goal-done="${g.id}" ${g.done ? 'checked' : ''} aria-label="달성 표시" style="margin-top:3px">
      <div class="grow">
        <div class="ttl">${L.esc(g.title)}</div>
        ${g.memo ? `<div class="meta">${L.esc(g.memo)}</div>` : ''}
      </div>
      <button class="btn sm ghost" data-edit-goal="${g.id}">수정</button>
      <button type="button" class="cardx" data-del-goal="${g.id}" title="삭제"
        aria-label="${L.esc(g.title)} 목표 삭제">${L.icon('x', 14)}</button>
    </li>`).join('')
    : `<li><div class="grow"><div class="empty-state"><div class="big">${L.icon('target', 28)}</div>
        <p>${monthLabel(goalMonth)} 목표가 없습니다.</p>
        <button class="btn sm" data-add-goal style="margin-top:10px">+ 목표 추가</button></div></div></li>`;
}
function openGoal(id) {

  $('#goalModalTitle').textContent = g ? '목표 수정' : '목표 추가';

function saveGoal() {
  const title = $('#gTitle').value.trim();
  if (!title) { L.toast('목표를 입력하세요.'); $('#gTitle').focus(); return; }
  const data = {
    title, month: $('#gMonth').value || L.monthKey(),
    done: $('#gDone').value === '1', memo: $('#gMemo').value.trim(),
  };
  if (editGoal) Object.assign(DB.goals.find(x => x.id === editGoal), data);
  else DB.goals.push(Object.assign({ id: L.uid() }, data));
  goalMonth = data.month;
  save(); closeModals(); renderAll(); L.toast('저장했습니다.');
}

let memoQ = '';
let editMemo = null;

function renderMemo() {
  if (!Array.isArray(DB.memos)) DB.memos = [];
  const q = memoQ.trim().toLowerCase();
  const list = DB.memos
    .filter(m => !q || `${m.title} ${m.body} ${m.tag || ''}`.toLowerCase().includes(q))

let editHabit = null;
let habitIcon = 'check';
let habitMode = 'daily';
let habitDays = [1, 3, 5];
function renderHabitTarget() {
  $$('#qModes .chip').forEach(c => c.classList.toggle('on', c.dataset.habitMode === habitMode));
  $('#qDays').hidden = habitMode !== 'days';
  $('#qTimesWrap').hidden = habitMode !== 'weekly';
  $('#qDays').innerHTML = L.WD.map((w, i) =>
    `<button type="button" class="chip ${habitDays.includes(i) ? 'on' : ''}" data-habit-day="${i}">${w}</button>`).join('');
}

function habitLogOf(date) {
  if (!DB.habitLog || typeof DB.habitLog !== 'object') DB.habitLog = {};
  if (!Array.isArray(DB.habitLog[date])) DB.habitLog[date] = [];
  return DB.habitLog[date];
}
function habitHas(date, id) { return habitLogOf(date).includes(id); }
function habitToggle(date, id) {
  const arr = habitLogOf(date);
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1); else arr.push(id);
  if (!arr.length) delete DB.habitLog[date];
  save();
}
function habitOf(id) { return (DB.habits || []).find(h => h.id === id) || { id }; }
function habitStreak(id) { return L.habitStreak(habitOf(id), DB.habitLog || {}); }
function habitRate(id, days) { return L.habitStats(habitOf(id), DB.habitLog || {}, days).pct; }
let habitRange = '14';
function habitGridDays() {
  const today = L.todayStr();
  const out = [];
  if (habitRange === 'month') {
    const d = L.parse(today);
    const first = L.ymd(new Date(d.getFullYear(), d.getMonth(), 1));
    for (let x = first; x <= today; x = L.addDays(x, 1)) out.push(x);
    return out;
  }
  const n = habitRange === '30' ? 30 : 14;
  for (let i = n - 1; i >= 0; i--) out.push(L.addDays(today, -i));
  return out;
}
function renderHabit() {
  if (!Array.isArray(DB.habits)) DB.habits = [];
  const today = L.todayStr();
  const all = DB.habits;
  const list = L.activeHabits(all);

  const dueToday = list.filter(h => L.habitDue(h, today));
  const doneToday = dueToday.filter(h => habitHas(today, h.id)).length;

  const allRate = list.length
    ? Math.round(list.reduce((a, h) => a + L.habitStats(h, DB.habitLog || {}, 30).pct, 0) / list.length) : 0;

  const bestEver = all.slice().sort((a, b) => L.habitBestStreak(b, DB.habitLog || {}) - L.habitBestStreak(a, DB.habitLog || {}))[0];
  const stat = (label, value, foot, tone, ic) => `<div class="stat ${tone || ''}">

  $('#habitStats').innerHTML =

      dueToday.length && doneToday === dueToday.length ? 'ok' : '', 'check') +
    stat('30일 평균 달성률', `${allRate}<small>%</small>`, '등록된 습관 전체 평균', 'accent', 'chart') +
    stat('현재 최고 연속', best ? `${habitStreak(best.id)}<small>일</small>` : '—',

      ${days.map(d => {
        const due = L.habitDue(h, d);
        return `<td style="text-align:center;padding:6px">
        <button type="button" class="hcell ${habitHas(d, h.id) ? 'on' : ''} ${due ? '' : 'off'}"
          ${due ? `data-habit-cell="${d}|${h.id}"` : 'disabled aria-disabled="true"'}
          aria-label="${d} ${L.esc(h.name)}${due ? '' : ' · 목표일 아님'}"
          aria-pressed="${habitHas(d, h.id)}">${habitHas(d, h.id) ? L.icon('tick', 11) : ''}</button></td>`;
      }).join('')}
      ${(() => {
        const wk = L.habitWeek(h, DB.habitLog || {}, today);
        return `<td class="nowrap"><span class="badge ${wk.done >= wk.goal && wk.goal ? 'ok' : ''}">${wk.done}/${wk.goal || '—'}</span></td>`;
      })()}
      <td class="nowrap"><span class="badge ${habitStreak(h.id) >= 3 ? 'ok' : ''}">${habitStreak(h.id)}일</span></td>
      <td class="nowrap"><span class="dim">${L.habitBestStreak(h, DB.habitLog || {})}일</span></td>
      <td class="act"><button class="btn sm ghost" data-edit-habit="${h.id}">수정</button></td>
    </tr>`).join('')}</tbody>`
    : `<tbody><tr><td><div class="empty-state"><div class="big">${L.icon('check', 28)}</div>
        <p>${archived.length ? '쓰고 있는 습관이 없습니다. 아래 보관함에서 되돌릴 수 있어요.' : '등록된 습관이 없습니다.'}</p>
        <button class="btn sm" data-add-habit style="margin-top:10px">+ 습관 추가</button></div></td></tr></tbody>`;

  /* 보관함 */
  $('#habitArchive').innerHTML = archived.length ? `<section class="card">
    <div class="card-head"><h3>보관한 습관</h3><div class="spacer"></div>
      <span class="badge">${archived.length}개</span></div>
    <div class="card-body tight"><ul class="list">

        <button class="btn sm" data-habit-restore="${h.id}">다시 사용</button>
        <button class="btn sm ghost" data-edit-habit="${h.id}">수정</button>
      </li>`).join('')}

}
function openHabit(id) {

function saveHabit() {

    { name, icon: habitIcon, target, archived: $('#qArchive').checked });

}

   통계 · 리포트
   ========================================================= */
function renderStats() {
  const today = L.todayStr();
  const mk = L.monthKey();
  const list = DB.habits || [];
  const habitAvg = list.length
    ? Math.round(list.reduce((a, h) => a + L.habitStats(h, DB.habitLog || {}, 30).pct, 0) / list.length) : 0;

  const monthLogs = DB.fitness.logs.filter(l => (l.date || '').startsWith(mk));
  const monthMin = monthLogs.reduce((a, l) => a + (Number(l.minutes) || 0), 0);

  const items = workItems(DB.work.year);
  const past = items.filter(i => L.dday(i.date) < 0);
  const pastDone = past.filter(i => isWorkDone(i.id)).length;

  const certs = DB.certs;
  const passed = certs.filter(c => c.status === 'passed').length;

  const gs = goalStat(mk);
  const stat = (label, value, foot, tone, ic, bar) => `<div class="stat ${tone || ''}">
    <div class="txt"><div class="label">${label}</div><div class="value">${value}</div>
      <div class="foot">${foot || '&nbsp;'}</div>
      ${bar !== undefined ? `<div class="bar ${tone || ''}"><i style="width:${bar}%"></i></div>` : ''}</div>
    <span class="ico">${L.icon(ic, 20)}</span></div>`;

  $('#statCards').innerHTML =
    stat('이번 달 목표', `${gs.done}<small>/ ${gs.n}</small>`, `달성률 ${gs.pct}%`, 'accent', 'target', gs.pct) +
    stat('이번 달 운동', `${monthLogs.length}<small>회</small>`, `${monthMin}분`, 'ok', 'dumb') +
    stat('습관 30일 평균', `${habitAvg}<small>%</small>`, `${list.length}개 습관`, 'purple', 'check', habitAvg) +
    stat('신고 완료율', past.length ? `${L.pct(pastDone, past.length)}<small>%</small>` : '—',
      past.length ? `지난 기한 ${pastDone}/${past.length}건 완료` : '지난 기한이 없습니다', 'warn', 'tax',
      past.length ? L.pct(pastDone, past.length) : 0);

  /* 최근 12주 운동 */
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const wr = L.weekRange(L.addDays(today, -i * 7));
    weeks.push({ wr, n: DB.fitness.logs.filter(l => l.date >= wr.start && l.date <= wr.end).length });
  }
  const maxW = Math.max(1, ...weeks.map(w => w.n));
  const goal = Number(DB.meta.weeklyGoal) || 3;
  $('#statFit').innerHTML = `<div class="vbars">${weeks.map(w => `
    <div class="vb" title="${L.fmtKo(w.wr.start)} ~ ${L.fmtKo(w.wr.end)} · ${w.n}회">
      <i class="${w.n >= goal ? 'on' : ''}" style="height:${Math.max(4, Math.round(w.n / maxW * 100))}%"></i>
      <span>${L.parse(w.wr.start).getMonth() + 1}/${L.parse(w.wr.start).getDate()}</span>
    </div>`).join('')}</div>
    <p class="dim" style="font-size:12px;margin-top:8px">진한 막대는 주간 목표(${goal}회) 달성 주입니다.</p>`;

  /* 최근 6개월 목표 달성률 */
  const ms = [];
  for (let i = 5; i >= 0; i--) {
    const d = L.parse(today);
    d.setDate(1); d.setMonth(d.getMonth() - i);
    ms.push(L.ymd(d).slice(0, 7));
  }
  $('#statGoal').innerHTML = `<div class="vbars">${ms.map(m => {
    const g = goalStat(m);
    return `<div class="vb" title="${monthLabel(m)} ${g.done}/${g.n}">
      <i class="${g.pct >= 100 && g.n ? 'on' : ''}" style="height:${g.n ? Math.max(5, g.pct) : 3}%"></i>
      <span>${+m.slice(5, 7)}월</span></div>`;
  }).join('')}</div>
  <p class="dim" style="font-size:12px;margin-top:8px">목표가 없는 달은 빈 막대로 표시됩니다.</p>`;

  /* 습관별 30일 */
  $('#statHabit').innerHTML = list.length ? list.map(h => {
    const st = L.habitStats(h, DB.habitLog || {}, 30);
    const r = st.pct;
    return `<div style="margin-bottom:11px">
      <div class="inline" style="margin-bottom:5px">${L.icon(h.icon || 'check', 15)}
        <b style="font-size:13px">${L.esc(h.name)}</b>
        <span class="badge">${L.esc(L.habitTargetLabel(h))}</span>
        <div class="spacer"></div>
        <span class="dim" style="font-size:11.5px">${st.hit} / ${st.expected}회</span>
        <span class="badge ${r >= 70 ? 'ok' : r >= 40 ? 'warn' : ''}">${r}%</span></div>
      <div class="bar ${r >= 70 ? 'ok' : r >= 40 ? 'warn' : 'danger'}"><i style="width:${r}%"></i></div>
    </div>`;
  }).join('') : '<p class="dim" style="font-size:13px">습관을 등록하면 달성률이 표시됩니다.</p>';

  /* 세무 완료율 (분류별) */
  const byCat = {};
  for (const i of items) {
    if (L.dday(i.date) >= 0) continue;
    const k = i.cat;
    byCat[k] = byCat[k] || { n: 0, done: 0 };
    byCat[k].n++;
    if (isWorkDone(i.id)) byCat[k].done++;
  }
  const keys = Object.keys(byCat);
  $('#statWorkBadge').textContent = `${DB.work.year}년 기준`;
  $('#statWork').innerHTML = keys.length ? keys.map(k => {
    const c = byCat[k], r = L.pct(c.done, c.n);
    return `<div style="margin-bottom:11px">
      <div class="inline" style="margin-bottom:5px">
        <span class="badge ${(T.CATS[k] || {}).tone || ''}">${(T.CATS[k] || {}).label || k}</span>
        <div class="spacer"></div><span class="dim" style="font-size:12px">${c.done} / ${c.n}건</span></div>
      <div class="bar ${r >= 90 ? 'ok' : r >= 60 ? 'warn' : 'danger'}"><i style="width:${r}%"></i></div>
    </div>`;
  }).join('') : '<p class="dim" style="font-size:13px">아직 지난 기한이 없습니다.</p>';
}

let editCert = null;
function openCert(id) {

  $('#xDelete').style.display = c ? '' : 'none';
  $('#xName').value = c ? c.name : '';
  $('#xOrg').value = c ? (c.org || '') : '';
  $('#xStage').value = c ? c.stage : 'interest';
  $('#xApplyStart').value = c ? (c.applyStart || '') : '';
  $('#xApplyEnd').value = c ? (c.applyEnd || '') : '';
  $('#xExam').value = c ? (c.examDate || '') : '';
  $('#xResult').value = c ? (c.resultDate || '') : '';
  $('#xTargetH').value = c ? (c.targetH || '') : '';
  $('#xLoggedH').value = c ? (c.loggedH || 0) : 0;
  $('#xSubjects').value = c ? (c.subjects || []).map(x => x.name).join(', ') : '';
  $('#xNext').value = c ? (c.nextAction || '') : '';
  $('#xResultState').value = c ? (c.result || '') : '';
  $('#xScore').value = c ? (c.score || '') : '';
  $('#xAcquired').value = c ? (c.acquiredAt || '') : '';
  $('#xCertNo').value = c ? (c.certNo || '') : '';
  $('#xPriority').value = c ? c.priority : 'normal';
  $('#xMemo').value = c ? (c.memo || '') : '';
  $('#certModal').classList.add('open');
  setTimeout(() => $('#xName').focus(), 30);
}
function saveCert() {
  const name = $('#xName').value.trim();
  if (!name) { L.toast('자격증명을 입력하세요.'); $('#xName').focus(); return; }
  const applyStart = $('#xApplyStart').value, applyEnd = $('#xApplyEnd').value;
  if (applyStart && applyEnd && applyStart > applyEnd) {
    L.toast('원서접수 시작일이 마감일보다 늦습니다.'); $('#xApplyEnd').focus(); return;
  }
  const names = $('#xSubjects').value.split(',').map(x => x.trim()).filter(Boolean);
  const old = editCert ? certById(editCert) : null;
  const oldMap = {};
  if (old) (old.subjects || []).forEach(x => oldMap[x.name] = x.done);
  const data = {
    name, org: $('#xOrg').value.trim(), stage: $('#xStage').value,
    applyStart, applyEnd,
    examDate: $('#xExam').value, resultDate: $('#xResult').value,
    targetH: Math.max(0, Number($('#xTargetH').value) || 0),
    loggedH: Math.max(0, Number($('#xLoggedH').value) || 0),
    subjects: names.map(n => ({ name: n, done: !!oldMap[n] })),
    nextAction: $('#xNext').value.trim(),
    result: $('#xResultState').value,
    score: $('#xScore').value.trim(),
    acquiredAt: $('#xAcquired').value,
    certNo: $('#xCertNo').value.trim(),
    priority: L.priorityOf($('#xPriority').value),
    memo: $('#xMemo').value.trim(),
  };
  let target;
  if (old) { Object.assign(old, data); target = old; }
  else {
    target = Object.assign({ id: L.uid(), status: 'plan', checklist: [], docs: [], stages: {} }, data);
    DB.certs.push(target);
  }
  // 단계에 맞춰 앞 단계 완료 표시와 옛 status 를 정리한다
  L.normCert(target);
  const idx = L.CERT_STAGE_KEYS.indexOf(target.stage);
  L.CERT_STAGE_KEYS.forEach((k, i) => { if (i < idx) target.stages[k].done = true; });
  if (target.stage === 'acquire' && !target.acquiredAt) target.acquiredAt = target.resultDate || L.todayStr();
  L.certSyncStatus(target);
  certSel = target.id;
  if (target.status === 'passed' && certFilter === 'active') certFilter = 'all';
  save(); closeModals(); renderAll(); L.toast('저장했습니다.');
}

/* ================= 이벤트 ================= */
function goto(page) {
  L.navActive(page);
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  window.scrollTo({ top: 0 });
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (b) goto(b.dataset.page);
});

document.addEventListener('click', e => {
  const el = e.target, C = s => el.closest(s);

  if (C('[data-close]')) return closeModals();
  if (C('[data-add-cert]')) return openCert(null);
  if (C('[data-add-wish]')) return openWish(null, 'personal');
  if (C('[data-add-worklearn]')) return openWish(null, 'work');
  if (C('[data-add-recur]')) return openRecur(null);
  if (C('[data-add-workout]') || C('[data-quick-workout]')) return openWo(null);
  if (C('[data-add-body]')) return openBody(null);
  if (C('[data-add-work]')) return openWork(null);
  if (C('[data-add-goal]')) return openGoal(null);
  if (C('[data-add-memo]')) return openMemo(null);
  if (C('[data-add-habit]')) return openHabit(null);
  if (C('[data-add-hol]')) {
    $('#hDate').value = ''; $('#hName').value = '';
    $('#holModal').classList.add('open');
    setTimeout(() => $('#hDate').focus(), 30);
    return;
  }

  let x;
  // ---- 자격증: 선택 / 단계 이동 / 체크리스트 / 결과 ----
  if ((x = C('[data-cert-pick]'))) { certSel = x.dataset.certPick; renderCert(); L.flashById('cert-' + certSel); return; }
  if ((x = C('[data-cert-stage]'))) {
    const [id, key] = x.dataset.certStage.split('|');
    certSel = id; certGoStage(id, key); return;
  }
  if ((x = C('[data-cert-ck-add]'))) {
    const [id, kind] = x.dataset.certCkAdd.split('|');
    const c = certById(id);
    const box = x.closest('.focus-group');
    const inp = box && box.querySelector('[data-ck-input]');
    const text = (inp && inp.value || '').trim();
    if (!c) return;
    if (!text) { L.toast('추가할 내용을 입력하세요.'); if (inp) inp.focus(); return; }
    (kind === 'docs' ? c.docs : c.checklist).push({ id: L.uid(), text, done: false, doneAt: '' });
    save(); renderCert();
    const btn2 = document.querySelector(`[data-cert-ck-add="${id}|${kind}"]`);
    const inp2 = btn2 && btn2.closest('.focus-group').querySelector('[data-ck-input]');
    if (inp2) inp2.focus();
    return;
  }
  if ((x = C('[data-cert-ck-del]'))) {
    const [id, kind, cid] = x.dataset.certCkDel.split('|');
    const c = certById(id);
    if (c) {
      if (kind === 'docs') c.docs = c.docs.filter(i => i.id !== cid);
      else c.checklist = c.checklist.filter(i => i.id !== cid);
      save(); renderCert();
    }
    return;
  }
  if ((x = C('[data-cert-result]'))) {
    const [id, res] = x.dataset.certResult.split('|');
    const c = certById(id);
    if (!c) return;
    if (res === 'pass') {
      c.result = 'pass';
      c.stage = 'acquire';
      L.CERT_STAGE_KEYS.forEach(k => { c.stages[k].done = true; if (!c.stages[k].date) c.stages[k].date = L.todayStr(); });
      c.acquiredAt = c.acquiredAt || c.resultDate || L.todayStr();
    } else {
      c.result = 'fail';
      c.stage = 'result';
      c.stages.acquire = { done: false, date: '' };
    }
    L.certSyncStatus(c);
    save(); renderAll(); L.toast(res === 'pass' ? '취득으로 기록했습니다.' : '불합격으로 기록했습니다.');
    return;
  }

  // ---- 배우고 싶은 것 · 실무 공부 ----
  if ((x = C('[data-wish-pick]'))) {
    const w = wishById(x.dataset.wishPick);
    if (w) { wishSel[wishScopeOf(w)] = w.id; renderWish(); renderWorkLearn(); }
    return;
  }
  if ((x = C('[data-wish-add]'))) {
    const [scope, stage] = x.dataset.wishAdd.split('|');
    wishPresetStage = stage;
    return openWish(null, scope);
  }
  if ((x = C('[data-wish-stage]'))) {
    const [id, stage] = x.dataset.wishStage.split('|');
    wishGoStage(id, stage); return;
  }
  if ((x = C('[data-wish-del]'))) {
    const w = wishById(x.dataset.wishDel);
    if (!w || !confirm(`"${w.title}" 항목을 삭제할까요?\n학습 기록도 함께 지워집니다.`)) return;
    DB.wishes = DB.wishes.filter(v => v.id !== w.id);
    wishSel[wishScopeOf(w)] = '';
    save(); renderAll(); L.toast('삭제했습니다.'); return;
  }
  if ((x = C('[data-wish-ms-add]'))) {
    const w = wishById(x.dataset.wishMsAdd);
    const box = x.closest('.focus-group');
    const inp = box && box.querySelector('[data-ms-title]');
    const due = box && box.querySelector('[data-ms-due]');
    const title = (inp && inp.value || '').trim();
    if (!w) return;
    if (!title) { L.toast('작은 목표를 입력하세요.'); if (inp) inp.focus(); return; }
    w.milestones.push({ id: L.uid(), title, due: (due && due.value) || '', done: false, doneAt: '' });
    save(); renderWish(); renderWorkLearn();
    const btn2 = document.querySelector(`[data-wish-ms-add="${w.id}"]`);
    const inp2 = btn2 && btn2.closest('.focus-group').querySelector('[data-ms-title]');
    if (inp2) inp2.focus();
    return;
  }
  if ((x = C('[data-wish-ms-del]'))) {
    const [id, mid] = x.dataset.wishMsDel.split('|');
    const w = wishById(id);
    if (w) { w.milestones = w.milestones.filter(m => m.id !== mid); save(); renderWish(); renderWorkLearn(); }
    return;
  }
  if ((x = C('[data-wish-log-add]'))) return openLog(x.dataset.wishLogAdd, '');
  if ((x = C('[data-wish-log-edit]'))) {
    const [id, lid] = x.dataset.wishLogEdit.split('|');
    return openLog(id, lid);
  }

  if ((x = C('[data-edit-cert]'))) return openCert(x.dataset.editCert);
  if ((x = C('[data-edit-wish]'))) return openWish(x.dataset.editWish);
  if ((x = C('[data-edit-recur]'))) return openRecur(x.dataset.editRecur);
  if ((x = C('[data-goto-cert]'))) {
    const id = x.dataset.gotoCert;
    certFilter = 'all'; certSel = id; goto('cert'); renderCert(); L.flashById('cert-' + id); return;
  }
  if ((x = C('[data-edit-wo]'))) return openWo(x.dataset.editWo);
  if ((x = C('[data-edit-body]'))) return openBody(x.dataset.editBody);
  if ((x = C('[data-edit-work]'))) return openWork(x.dataset.editWork);
  if ((x = C('[data-edit-goal]'))) return openGoal(x.dataset.editGoal);
  /* 목록에서 바로 지우기 — 무엇을 지우는지 이름을 보여 주고 확인받는다 */
  if ((x = C('[data-del-goal]'))) {
    const g = (DB.goals || []).find(v => v.id === x.dataset.delGoal);
    if (!g || !confirm(`"${g.title}" 목표를 삭제할까요?`)) return;
    DB.goals = DB.goals.filter(v => v.id !== g.id);
    save(); renderAll(); L.toast('목표를 삭제했습니다.');
    return;
  }
  if ((x = C('[data-del-recur]'))) {
    const r = recurRules().find(v => v.id === x.dataset.delRecur);
    if (!r) return;
    if (!confirm(`"${r.title}" 반복 업무 규칙을 삭제할까요?\n이 규칙으로 만들어진 일정과 완료 표시도 함께 사라집니다.`)) return;
    DB.recurring = recurRules().filter(v => v.id !== r.id);
    for (const k of Object.keys(DB.work.done || {})) if (k.startsWith(`rc-${r.id}-`)) delete DB.work.done[k];
    save(); renderAll(); L.toast('반복 업무를 삭제했습니다.');
    return;
  }
  if ((x = C('[data-del-wo]'))) {
    const l2 = (DB.fitness.logs || []).find(v => v.id === x.dataset.delWo);
    if (!l2 || !confirm(`${L.fmtKo(l2.date)} ${l2.type || '운동'} 기록을 삭제할까요?`)) return;
    DB.fitness.logs = DB.fitness.logs.filter(v => v.id !== l2.id);
    save(); renderAll(); L.toast('운동 기록을 삭제했습니다.');
    return;
  }
  if ((x = C('[data-del-body]'))) {
    const b = (DB.fitness.body || []).find(v => v.id === x.dataset.delBody);
    if (!b || !confirm(`${L.fmtKo(b.date)} 체성분 기록을 삭제할까요?`)) return;
    DB.fitness.body = DB.fitness.body.filter(v => v.id !== b.id);
    save(); renderAll(); L.toast('체성분 기록을 삭제했습니다.');
    return;
  }
  if ((x = C('[data-del-work]'))) {
    const w = (DB.work.custom || []).find(v => v.id === x.dataset.delWork);
    if (!w || !confirm(`"${w.title}" 업무를 삭제할까요?`)) return;
    DB.work.custom = DB.work.custom.filter(v => v.id !== w.id);
    delete DB.work.done[w.id];
    save(); renderAll(); L.toast('업무를 삭제했습니다.');
    return;
  }
  if ((x = C('[data-del-cert]'))) {
    const c = certById(x.dataset.delCert);
    if (!c) return;
    const lec = certLectures(c).length;
    if (!confirm(`"${c.name}"을 삭제할까요?${lec ? `\n등록한 강의 ${lec}개도 함께 사라집니다.` : ''}`)) return;
    DB.certs = DB.certs.filter(v => v.id !== c.id);
    if (certSel === c.id) certSel = '';
    if (clSel === c.id) clSel = '';
    save(); renderAll(); L.toast('자격증을 삭제했습니다.');
    return;
  }
  if ((x = C('[data-del-memo]'))) {
    const m = (DB.memos || []).find(v => v.id === x.dataset.delMemo);
    if (!m) return;
    if (!confirm(`"${m.title || '제목 없음'}" 메모를 삭제할까요?`)) return;
    DB.memos = DB.memos.filter(v => v.id !== m.id);
    save(); renderMemo(); renderAll(); L.toast('메모를 삭제했습니다.');
    return;
  }
  if ((x = C('[data-edit-memo]'))) return openMemo(x.dataset.editMemo);
  if ((x = C('[data-edit-habit]'))) return openHabit(x.dataset.editHabit);
  if ((x = C('[data-habit-cell]'))) {
    const [d, hid] = x.dataset.habitCell.split('|');
    habitToggle(d, hid); renderHabit(); renderStats(); renderDash(); return;
  }

    clSel = id; save(); goto('certlec'); renderAll();

  }
  if ((x = C('[data-cl-off]'))) {
    const c = DB.certs.find(v => v.id === x.dataset.clOff);
    const n = certLectures(c).length;
    if (!confirm(`"${c.name}"의 온라인 강의 관리를 끕니다.
등록한 ${n}강의 기록은 지워지지 않고 그대로 보관되며, 다시 켜면 이어서 쓸 수 있습니다.
계속할까요?`)) return;
    ensureCertCourse(c).enabled = false;
    save(); renderAll(); L.toast('강의 관리를 껐습니다.'); return;
  }
  if ((x = C('[data-cl-edit]'))) return openClInfo(x.dataset.clEdit);
  if ((x = C('[data-cl-jump]'))) {

    if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); L.flash(row); }

  }
  if ((x = C('[data-cl-all]'))) {
    const [id, flag] = x.dataset.clAll.split('|');

  }
  if ((x = C('[data-cl-review]'))) {

    if (!targets.length) { L.toast('진도율이 100%가 아닌 강의가 없습니다.'); return; }
    if (!confirm(`진도율이 100%가 아닌 ${targets.length}강을 복습 필요로 표시할까요?`)) return;
    targets.forEach(i => { i.review = true; });

  }
  if ((x = C('[data-clec-rev]'))) {

    const it = items.find(i => i.id === lid);

  if ((x = C('[data-clec-resize]'))) {

    const n = L.clamp(Math.round(Number(input.value) || 0), 0, 300);
    const cur = certLectures(c);
    if (n < cur.length) {
      const dropped = cur.slice(n);
      const willLoseWatched = dropped.some(i => i.watched);
      const warn = willLoseWatched ? '\n완료 표시된 강의도 포함되어 있습니다.' : '';
      if (!confirm(`강의 수를 ${cur.length}개에서 ${n}개로 줄입니다. 뒤쪽 ${dropped.length}개가 삭제됩니다.${warn}\n계속할까요?`)) return;

  if ((x = C('[data-clec-add]'))) {

  if (C('#syncIn')) { if (window.LMSync) window.LMSync.signIn(); return; }
  if (C('#syncOut')) {

  if ((x = C('[data-scale-set]'))) { L.setScale(Number(x.dataset.scaleSet)); renderScaleSettings(); return; }
  if ((x = C('[data-goto]'))) return goto(x.dataset.goto);

    return;
  }
  if ((x = C('[data-hours]'))) {
    const c = DB.certs.find(v => v.id === x.dataset.hours);
    c.loggedH = Math.max(0, Math.round(((Number(c.loggedH) || 0) + Number(x.dataset.n)) * 10) / 10);
